<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Bốc thăm tự động - Pickleball Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171;--pk:#e94560}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
.topnav{background:rgba(10,16,29,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{color:var(--li);font-weight:800;font-size:18px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.btn{border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--li);color:#0b1220}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
.btn-w{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
.btn-d{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}
.hidden{display:none !important}

main{flex:1;max-width:1000px;margin:0 auto;padding:20px;width:100%;display:flex;flex-direction:column;gap:20px}
.event-info{text-align:center;padding:16px;background:var(--sf);border:1px solid var(--ln);border-radius:12px}
.event-info h2{margin:0 0 4px;color:var(--cy);font-size:20px}
.event-info p{margin:0;color:var(--mu);font-size:13px}

.draw-container{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:768px){ .draw-container{grid-template-columns:1fr;} }

.draw-stage{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:24px;text-align:center;position:relative;overflow:hidden}
.draw-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center, rgba(163,230,53,0.05) 0%, transparent 70%);pointer-events:none}

.group-selector{margin-bottom:20px;text-align:left}
.group-selector label{font-size:12px;color:var(--mu);font-weight:700;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.group-select{width:100%;background:#0d1626;border:2px solid var(--ln);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.group-select:focus{outline:none;border-color:var(--cy)}
.group-select option{background:var(--sf);color:var(--tx)}
.group-status{font-size:12px;color:var(--cy);margin-top:8px;text-align:right;font-weight:600}

/* Giao diện quay số nhỏ gọn */
.draw-box{font-size:1.8rem;font-weight:900;text-align:center;min-height:70px;display:flex;align-items:center;justify-content:center;transition:all .3s;border-radius:12px;padding:15px;background:rgba(13,22,38,.5);border:1px dashed var(--ln);margin-bottom:20px;word-break:break-word}
.draw-box.spinning{animation:blurText 0.1s infinite;color:var(--cy);border-color:var(--cy);text-shadow:0 0 15px rgba(34,211,238,0.5)}
.draw-box.winner{animation:popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);color:var(--li);border-color:var(--li);background:rgba(163,230,53,0.08);text-shadow:0 0 25px rgba(163,230,53,0.6);font-size:2.2rem}

@keyframes blurText{0%{filter:blur(0px);transform:scale(1)}50%{filter:blur(3px);transform:scale(1.02)}100%{filter:blur(0px);transform:scale(1)}}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

.draw-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.draw-controls .btn{min-width:130px;justify-content:center;padding:10px 16px;font-size:14px}

/* ================= SIDE PANEL & 3 TABS ================= */
.side-panel{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;position:sticky;top:16px}
@media(max-width:768px){ .side-panel{position:static;} }

.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:12px;gap:2px}
.tab-btn{
  flex:1;background:none;border:none;color:var(--mu);
  padding:9px 4px;font-size:11px;font-weight:700;cursor:pointer;
  border-bottom:2px solid transparent;transition:.2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--tx);background:rgba(148,163,184,.05)}
.tab-btn.active{color:var(--cy);border-bottom-color:var(--cy)}
.tab-btn[data-tab="active"].active{color:var(--li);border-bottom-color:var(--li)}
.tab-count{
  background:rgba(148,163,184,.15);border:1px solid var(--ln);
  border-radius:99px;padding:1px 7px;font-size:10px;font-weight:800;min-width:22px;text-align:center;color:var(--mu);
}
.tab-btn.active .tab-count{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.4);color:var(--cy)}
.tab-btn[data-tab="active"].active .tab-count{background:rgba(163,230,53,.15);border-color:rgba(163,230,53,.4);color:var(--li)}

.tab-content{display:none;max-height:400px;overflow-y:auto;padding-right:4px;scroll-behavior:smooth}
.tab-content.active{display:block}
.tab-content::-webkit-scrollbar{width:5px}
.tab-content::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:99px}

/* Thông tin bảng đang bốc */
.active-info{
  font-size:11px;color:var(--mu);background:var(--sf2);
  border:1px solid var(--ln);border-radius:8px;padding:9px 10px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
}
.active-info strong{color:var(--cy);font-weight:800}
.active-info .new-num{color:var(--li);font-weight:800}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--li);display:inline-block;margin-right:5px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(163,230,53,.4)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(163,230,53,0)}}

.group-head{font-size:11px;color:var(--mu);font-weight:700;margin:12px 0 6px;text-transform:uppercase;border-bottom:1px solid var(--ln);padding-bottom:4px}

.pool-list, .result-list{list-style:none;padding:0;margin:0}
.pool-item, .result-item{padding:8px 10px;background:var(--sf2);border-radius:6px;margin-bottom:6px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--ln);gap:6px}
.pool-item{color:var(--mu)}
.result-item{background:rgba(163,230,53,0.08);border-color:rgba(163,230,53,0.3);color:var(--tx)}
.result-item .team-name{overflow-wrap:anywhere;min-width:0}
.result-item .group-badge{background:var(--li);color:#0b1220;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;margin-right:6px;flex-shrink:0}

/* Đội vừa bốc nổi bật */
.result-item.newest{border-color:var(--li);background:rgba(163,230,53,.14);animation:newRow .7s ease}
@keyframes newRow{0%{transform:translateY(-8px);opacity:.3;background:rgba(163,230,53,.35)}100%{transform:translateY(0);opacity:1}}
.new-tag{font-size:9px;font-weight:900;color:#0b1220;background:var(--li);border-radius:4px;padding:2px 5px;margin-right:6px;flex-shrink:0;letter-spacing:.5px}

.btn-remove{background:rgba(248,113,113,0.15);color:var(--rd);border:1px solid rgba(248,113,113,0.3);border-radius:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:.15s;flex-shrink:0;padding:0}
.btn-remove:hover{background:rgba(248,113,113,0.3);transform:scale(1.08)}

.empty-msg{text-align:center;color:var(--mu);font-size:12px;padding:20px;font-style:italic}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:12px 20px;border-radius:99px;font-weight:800;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<nav class="topnav">
  <div class="logo">🎲 BỐC THĂM TỰ ĐỘNG</div>
  <a href="admin.html" class="btn btn-l">← Quay lại Quản trị</a>
</nav>

<main>
  <div class="event-info">
    <h2 id="event-name">Đang tải...</h2>
    <p id="event-desc">Vui lòng chờ trong giây lát</p>
  </div>

  <div class="draw-container">
    <!-- KHU VỰC QUAY SỐ -->
    <div class="draw-stage">
      <div class="group-selector">
        <label>🎯 Chọn bảng cần bốc thăm:</label>
        <select id="group-select" class="group-select" onchange="onGroupChange()">
          <option value="">-- Đang tải danh sách bảng --</option>
        </select>
        <div class="group-status" id="group-status"></div>
      </div>

      <div class="draw-box" id="draw-box">SẴN SÀNG</div>

      <div class="draw-controls">
        <button class="btn btn-p" id="btn-spin" onclick="startSpin()">🎲 Bắt đầu quay</button>
        <button class="btn btn-w hidden" id="btn-next" onclick="nextDraw()">🔄 Rút tiếp đội khác</button>
        <button class="btn btn-l hidden" id="btn-finish" onclick="finishAndSave()">💾 Lưu vào hệ thống</button>
      </div>
    </div>

    <!-- KHU VỰC DANH SÁCH: 3 TAB -->
    <div class="side-panel" id="side-panel">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="active" role="tab" aria-selected="true" aria-controls="tab-active" onclick="switchTab('active')">
          <span>🎯 Bảng đang bốc</span>
          <span class="tab-count" id="active-count">0</span>
        </button>
        <button class="tab-btn" data-tab="others" role="tab" aria-selected="false" aria-controls="tab-others" onclick="switchTab('others')">
          <span>📋 Bảng đã bốc</span>
          <span class="tab-count" id="others-count">0</span>
        </button>
        <button class="tab-btn" data-tab="remaining" role="tab" aria-selected="false" aria-controls="tab-remaining" onclick="switchTab('remaining')">
          <span>📦 Còn lại</span>
          <span class="tab-count" id="pool-count">0</span>
        </button>
      </div>

      <!-- TAB 1: BẢNG ĐANG BỐC (MẶC ĐỊNH) -->
      <div id="tab-active" class="tab-content active" role="tabpanel">
        <div class="active-info" id="active-info">Đang tải bảng đấu...</div>
        <ul class="result-list" id="active-list"></ul>
        <div class="empty-msg" id="active-empty">Chưa có kết quả</div>
      </div>

      <!-- TAB 2: CÁC BẢNG ĐÃ BỐC -->
      <div id="tab-others" class="tab-content" role="tabpanel">
        <ul class="result-list" id="other-list"></ul>
        <div class="empty-msg" id="other-empty">Chưa có bảng nào khác được bốc</div>
      </div>

      <!-- TAB 3: DANH SÁCH CÒN LẠI -->
      <div id="tab-remaining" class="tab-content" role="tabpanel">
        <ul class="pool-list" id="pool-list"></ul>
        <div class="empty-msg hidden" id="pool-empty">🎉 Không còn đội nào chưa bốc</div>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var DATA = {
  eid: null,
  eventName: '',
  teams: [],
  groups: [],
  stageId: null,
  existingGroupCounts: {},
  drawnResults: [],      // { teamId, teamName, groupId, groupName }
  lastDrawnTeamId: null  // Đội vừa quay xong -> tô sáng badge MỚI
};

var isSpinning = false;
var spinInterval = null;
var currentTab = 'active';

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2500);
}

/* ==================== TAB ENGINE ==================== */
function switchTab(tabName) {
  if (['active','others','remaining'].indexOf(tabName) === -1) tabName = 'active';
  currentTab = tabName;

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    var isActive = btn.getAttribute('data-tab') === tabName;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  ['active','others','remaining'].forEach(function(key){
    el('tab-' + key).classList.toggle('active', key === tabName);
  });

  // Luôn đưa danh sách kết quả về đầu khi mở tab
  if (tabName === 'active') scrollToTop('tab-active');
  if (tabName === 'others') scrollToTop('tab-others');
}

function scrollToTop(id) {
  var box = el(id);
  if (!box) return;
  box.scrollTop = 0;
  requestAnimationFrame(function(){ box.scrollTop = 0; });
}

function currentGroupId() { return el('group-select').value; }

function currentGroup() {
  var gid = currentGroupId();
  return DATA.groups.find(function(g){ return g.id === gid; }) || null;
}

/* Đổi bảng => hiển thị ngay tab danh sách của bảng đó */
function onGroupChange() {
  DATA.lastDrawnTeamId = null;
  updateGroupStatus();
  renderResults();
  switchTab('active');
}

/* ==================== INIT ==================== */
async function init() {
  var params = new URLSearchParams(window.location.search);
  DATA.eid = params.get('eid');

  if (!DATA.eid) {
    el("event-name").textContent = "Lỗi";
    el("event-desc").textContent = "Không tìm thấy mã nội dung thi đấu (eid) trong URL.";
    el("active-info").textContent = "Thiếu mã nội dung thi đấu";
    return;
  }

  var adminData = localStorage.getItem('pb_admin');
  if (!adminData) {
    if(!confirm("⚠️ Bạn chưa đăng nhập Quản trị. Trang này vẫn hoạt động nhưng khuyến nghị nên đăng nhập trước.\n\nBạn có muốn tiếp tục không?")) {
      window.location.href = 'admin.html';
      return;
    }
  }

  try {
    var { data: eventData } = await sb.from("events").select("name, tournament_id").eq("id", DATA.eid).single();
    if (!eventData) throw new Error("Không tìm thấy nội dung thi đấu");
    DATA.eventName = eventData.name;

    var { data: tourData } = await sb.from("tournaments").select("name").eq("id", eventData.tournament_id).single();
    var tourName = tourData ? tourData.name : "Giải đấu";

    el("event-name").textContent = tourName + " - " + DATA.eventName;
    el("event-desc").textContent = "Đang tải danh sách đội và bảng đấu...";

    var { data: stages } = await sb.from("stages").select("id").eq("event_id", DATA.eid).eq("stage_type", "group_stage").maybeSingle();
    if (!stages) throw new Error("Chưa tạo vòng bảng cho nội dung này. Vui lòng tạo ở trang Quản trị.");
    DATA.stageId = stages.id;

    var { data: groups } = await sb.from("groups").select("id, code, name").eq("stage_id", DATA.stageId).order("code");
    DATA.groups = groups || [];
    if (DATA.groups.length === 0) throw new Error("Chưa có bảng đấu nào được tạo.");

    // Số đội đã có sẵn trong DB cho mỗi bảng
    var { data: assignedTeams } = await sb.from("group_teams").select("team_id, group_id").eq("stage_id", DATA.stageId);
    var assignedIds = new Set();
    DATA.existingGroupCounts = {};
    DATA.groups.forEach(function(g){ DATA.existingGroupCounts[g.id] = 0; });

    (assignedTeams || []).forEach(function(x){
      assignedIds.add(x.team_id);
      if (DATA.existingGroupCounts[x.group_id] !== undefined) {
        DATA.existingGroupCounts[x.group_id]++;
      }
    });

    var { data: allTeams } = await sb.from("teams").select("id, name").eq("event_id", DATA.eid);
    DATA.teams = (allTeams || []).filter(function(t){ return !assignedIds.has(t.id); });

    if (DATA.teams.length === 0) {
      el("event-desc").textContent = "Tất cả các đội đã được phân vào bảng. Không cần bốc thăm thêm.";
      el("btn-spin").disabled = true;
      el("btn-spin").textContent = "Đã hoàn tất";
      el("group-select").disabled = true;
    } else {
      el("event-desc").textContent = "Sẵn sàng bốc thăm cho " + DATA.teams.length + " đội còn lại.";
    }

    renderGroupSelect();
    renderPool();
    renderResults();
    switchTab('active'); // Mặc định hiển thị bảng đang bốc

  } catch(e) {
    el("event-name").textContent = "Lỗi tải dữ liệu";
    el("event-desc").textContent = e.message;
    el("active-info").textContent = "Không tải được danh sách bảng";
    el("active-empty").textContent = e.message;
    console.error(e);
  }
}

/* ==================== DROPDOWN (CHỈ TÊN BẢNG, KHÔNG RESET) ==================== */
function renderGroupSelect() {
  var select = el("group-select");
  var currentVal = select.value; // Giữ nguyên bảng đang quay

  select.innerHTML = "";
  DATA.groups.forEach(function(g){
    var opt = document.createElement("option");
    opt.value = g.id;
    opt.textContent = "Bảng " + g.code;
    opt.dataset.code = g.code;
    select.appendChild(opt);
  });

  if (currentVal && Array.from(select.options).some(function(o){ return o.value === currentVal; })) {
    select.value = currentVal;
  } else if (select.options.length > 0) {
    select.selectedIndex = 0;
  }

  updateGroupStatus();
}

function updateGroupStatus() {
  var select = el("group-select");
  var selectedOpt = select.options[select.selectedIndex];
  if (!selectedOpt) return;

  var code = selectedOpt.dataset.code;
  var sessionCount = DATA.drawnResults.filter(function(r){ return r.groupId === select.value; }).length;
  var dbCount = DATA.existingGroupCounts[select.value] || 0;
  var total = dbCount + sessionCount;

  el("group-status").textContent = "🎯 Đang bốc thăm cho: Bảng " + code + " | Tổng cộng: " + total + " đội";
}

/* ==================== TAB 3: CÒN LẠI ==================== */
function renderPool() {
  var list = el("pool-list");
  var emptyMsg = el("pool-empty");
  el("pool-count").textContent = DATA.teams.length;
  list.innerHTML = "";

  if (DATA.teams.length === 0) {
    emptyMsg.classList.remove("hidden");
    return;
  }
  emptyMsg.classList.add("hidden");

  var shuffled = DATA.teams.slice().sort(function(){ return Math.random() - 0.5; });
  shuffled.forEach(function(t){
    var li = document.createElement("li");
    li.className = "pool-item";
    li.textContent = t.name;
    list.appendChild(li);
  });
}

/* ==================== TAB 1: BẢNG ĐANG BỐC ==================== */
function renderActiveResults() {
  var list = el("active-list");
  var emptyMsg = el("active-empty");
  var info = el("active-info");
  list.innerHTML = "";

  var g = currentGroup();
  if (!g) {
    info.textContent = "Vui lòng chọn bảng cần bốc thăm";
    emptyMsg.style.display = "block";
    emptyMsg.textContent = "Chưa có bảng nào được chọn";
    return;
  }

  var items = DATA.drawnResults
    .filter(function(r){ return r.groupId === g.id; })
    .slice()
    .reverse(); // Đội mới nhất lên đầu

  var dbCount = DATA.existingGroupCounts[g.id] || 0;

  info.innerHTML =
    '<span><span class="live-dot"></span>Bảng <strong>' + esc(g.code) + '</strong></span>' +
    '<span>Đã lưu: ' + dbCount + ' · Mới bốc: <span class="new-num">' + items.length + '</span></span>';

  if (items.length === 0) {
    emptyMsg.style.display = "block";
    emptyMsg.textContent = "Bảng " + g.code + " chưa có đội nào được bốc trong phiên này.";
    scrollToTop('tab-active');
    return;
  }
  emptyMsg.style.display = "none";

  items.forEach(function(r){
    var isNew = r.teamId === DATA.lastDrawnTeamId;
    var li = document.createElement("li");
    li.className = "result-item" + (isNew ? " newest" : "");
    li.innerHTML =
      '<span class="team-name">' + esc(r.teamName) + '</span>' +
      '<div style="display:flex;align-items:center;flex-shrink:0">' +
        (isNew ? '<span class="new-tag">MỚI</span>' : '') +
        '<span class="group-badge">' + esc(g.code) + '</span>' +
        '<button class="btn-remove" onclick="removeDrawnTeam(\'' + r.teamId + '\')" title="Đưa đội này về danh sách còn lại">✕</button>' +
      '</div>';
    list.appendChild(li);
  });

  // Luôn cuộn lên để thấy đội mới thêm (kể cả khi tràn danh sách)
  scrollToTop('tab-active');
}

/* ==================== TAB 2: CÁC BẢNG ĐÃ BỐC ==================== */
function renderOtherResults() {
  var list = el("other-list");
  var emptyMsg = el("other-empty");
  list.innerHTML = "";

  var activeId = currentGroupId();
  var others = DATA.groups.filter(function(g){
    return g.id !== activeId && DATA.drawnResults.some(function(r){ return r.groupId === g.id; });
  });

  if (others.length === 0) {
    emptyMsg.style.display = "block";
    emptyMsg.textContent = "Chưa có bảng nào khác được bốc. Kết quả của bảng đang bốc nằm ở tab 🎯.";
    return;
  }
  emptyMsg.style.display = "none";

  others.forEach(function(g){
    var groupResults = DATA.drawnResults
      .filter(function(r){ return r.groupId === g.id; })
      .slice()
      .reverse();

    var header = document.createElement("div");
    header.className = "group-head";
    header.textContent = "Bảng " + g.code + " (+" + groupResults.length + " đội mới)";
    list.appendChild(header);

    groupResults.forEach(function(r){
      var li = document.createElement("li");
      li.className = "result-item";
      li.innerHTML =
        '<span class="team-name">' + esc(r.teamName) + '</span>' +
        '<div style="display:flex;align-items:center;flex-shrink:0">' +
          '<span class="group-badge">' + esc(g.code) + '</span>' +
          '<button class="btn-remove" onclick="removeDrawnTeam(\'' + r.teamId + '\')" title="Đưa đội này về danh sách còn lại">✕</button>' +
        '</div>';
      list.appendChild(li);
    });
  });
}

/* ==================== RENDER TỔNG + COUNTS ==================== */
function renderResults() {
  renderActiveResults();
  renderOtherResults();
  updateTabCounts();
}

function updateTabCounts() {
  var activeId = currentGroupId();
  var activeCount = DATA.drawnResults.filter(function(r){ return r.groupId === activeId; }).length;
  var othersCount = DATA.drawnResults.filter(function(r){ return r.groupId !== activeId; }).length;

  el("active-count").textContent = activeCount;
  el("others-count").textContent = othersCount;
  el("pool-count").textContent = DATA.teams.length;

  el("active-count").title = "Số đội vừa bốc ở bảng đang chọn";
  el("others-count").title = "Số đội đã bốc ở các bảng khác";
  el("pool-count").title = "Số đội chưa bốc";
}

/* ==================== QUAY SỐ ==================== */
function startSpin() {
  var select = el("group-select");
  if (!select.value) {
    toast("⚠️ Vui lòng chọn bảng cần bốc thăm!");
    return;
  }
  if (isSpinning || DATA.teams.length === 0) return;

  // Luôn chuyển về tab bảng đang bốc trước khi quay
  switchTab('active');

  isSpinning = true;
  el("btn-spin").disabled = true;
  el("group-select").disabled = true; // Khóa bảng trong suốt quá trình quay
  el("draw-box").className = "draw-box spinning";
  el("draw-box").textContent = "...";

  spinInterval = setInterval(function(){
    var randomIdx = Math.floor(Math.random() * DATA.teams.length);
    el("draw-box").textContent = DATA.teams[randomIdx].name;
  }, 80);

  setTimeout(function(){
    clearInterval(spinInterval);
    finalizeDraw();
  }, 2000);
}

function finalizeDraw() {
  isSpinning = false;
  el("group-select").disabled = false;

  var winnerIndex = Math.floor(Math.random() * DATA.teams.length);
  var winner = DATA.teams[winnerIndex];
  var select = el("group-select");
  var targetGroup = DATA.groups.find(function(g){ return g.id === select.value; });

  if (!targetGroup) {
    toast("⚠️ Bảng bốc thăm không hợp lệ!");
    nextDraw();
    return;
  }

  el("draw-box").textContent = winner.name;
  el("draw-box").className = "draw-box winner";

  DATA.drawnResults.push({
    teamId: winner.id,
    teamName: winner.name,
    groupId: targetGroup.id,
    groupName: targetGroup.code
  });
  DATA.lastDrawnTeamId = winner.id;

  DATA.teams.splice(winnerIndex, 1);

  renderPool();
  renderGroupSelect(); // Giữ nguyên bảng đang chọn
  renderResults();

  // BẮT BUỘC hiển thị tab bảng đang bốc sau mỗi lần quay
  switchTab('active');
  scrollToTop('tab-active');

  el("btn-spin").classList.add("hidden");

  if (DATA.teams.length > 0) {
    el("btn-next").classList.remove("hidden");
    el("btn-finish").classList.remove("hidden");
  } else {
    el("btn-next").classList.add("hidden");
    el("btn-finish").classList.remove("hidden");
    el("draw-box").textContent = "HOÀN TẤT!";
  }

  updateGroupStatus();
  toast("🎉 " + winner.name + " đã vào Bảng " + targetGroup.code);

  // Mobile: đảm bảo khung kết quả nằm trong vùng nhìn thấy
  setTimeout(ensureResultVisible, 100);
}

function ensureResultVisible() {
  var panel = el("side-panel");
  if (!panel) return;
  var rect = panel.getBoundingClientRect();
  if (rect.top < 0 || rect.bottom > window.innerHeight) {
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function nextDraw() {
  el("draw-box").textContent = "SẴN SÀNG";
  el("draw-box").className = "draw-box";
  el("btn-spin").classList.remove("hidden");
  el("btn-next").classList.add("hidden");
  el("btn-spin").disabled = false;
  DATA.lastDrawnTeamId = null;
  switchTab('active');
  renderResults();
}

/* ==================== XÓA ĐỘI KHỎI KẾT QUẢ TẠM ==================== */
function removeDrawnTeam(teamId) {
  if (isSpinning) return;

  var idx = DATA.drawnResults.findIndex(function(r){ return r.teamId === teamId; });
  if (idx === -1) return;

  var removed = DATA.drawnResults.splice(idx, 1)[0];
  if (DATA.lastDrawnTeamId === teamId) DATA.lastDrawnTeamId = null;

  // Đưa đội trở lại danh sách chưa bốc
  DATA.teams.push({ id: removed.teamId, name: removed.teamName });

  renderPool();
  renderResults();
  renderGroupSelect();
  updateGroupStatus();

  // Nếu còn đội chưa bốc thì cho phép quay lại
  if (DATA.teams.length > 0) {
    el("btn-spin").classList.remove("hidden");
    el("btn-spin").disabled = false;
    el("btn-next").classList.add("hidden");
    if (DATA.drawnResults.length === 0) {
      el("btn-finish").classList.add("hidden");
      el("draw-box").textContent = "SẴN SÀNG";
      el("draw-box").className = "draw-box";
    } else {
      el("btn-finish").classList.remove("hidden");
    }
  } else if (DATA.drawnResults.length === 0) {
    el("draw-box").textContent = "SẴN SÀNG";
    el("draw-box").className = "draw-box";
    el("btn-spin").classList.remove("hidden");
    el("btn-next").classList.add("hidden");
    el("btn-finish").classList.add("hidden");
    el("btn-spin").disabled = false;
  }

  toast("↩️ Đã đưa " + removed.teamName + " về danh sách còn lại");
}

/* ==================== LƯU VÀO HỆ THỐNG ==================== */
async function finishAndSave() {
  if (isSpinning) {
    toast("⏳ Vui lòng chờ hết lượt quay!");
    return;
  }
  if (DATA.drawnResults.length === 0) {
    toast("⚠️ Chưa có đội nào được bốc để lưu!");
    return;
  }
  if (!confirm("💾 Bạn có chắc chắn muốn lưu " + DATA.drawnResults.length + " kết quả bốc thăm này vào hệ thống?")) return;

  el("btn-finish").disabled = true;
  el("btn-finish").textContent = "⏳ Đang lưu...";

  try {
    var payload = DATA.drawnResults.map(function(r){
      return {
        group_id: r.groupId,
        stage_id: DATA.stageId,
        team_id: r.teamId,
        event_id: DATA.eid
      };
    });

    var { error } = await sb.from("group_teams").insert(payload);
    if (error) throw error;

    toast("✅ Đã lưu thành công vào hệ thống!");
    setTimeout(function(){
      window.location.href = "admin.html?eid=" + DATA.eid;
    }, 1500);

  } catch(e) {
    alert("❌ Lỗi khi lưu: " + e.message);
    el("btn-finish").disabled = false;
    el("btn-finish").textContent = "💾 Lưu vào hệ thống";
  }
}

/* Khởi chạy: mặc định tab "Bảng đang bốc" */
switchTab('active');
init();
</script>
