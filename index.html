<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Pickleball Pro v4.2</title>

<style>
:root{--bg:#0b1220;--surface:#111c31;--surface2:#0e1728;--line:rgba(148,163,184,.16);--text:#e6edf7;--muted:#8fa3bd;--lime:#a3e635;--cyan:#22d3ee;--orange:#fb923c;--red:#f87171;--radius:16px}
*{box-sizing:border-box}body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}
h1,h3,h4,.logo,.nav-link,.stat-value{font-family:'Oswald',sans-serif;letter-spacing:.03em}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.94);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{color:var(--lime);font-weight:700;font-size:18px;text-transform:uppercase;font-style:italic}.logo span{color:var(--text)}
.version-tag{font-size:10px;background:var(--cyan);color:#0b1220;padding:2px 8px;border-radius:4px;font-weight:800}
.nav-links{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.nav-link{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase}
.nav-link.active{background:var(--lime);color:#0b1220}
.nav-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctx-bar{background:var(--surface2);border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx-bar select{background:#0d1626;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.ctx-bar .muted{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
main{max-width:1200px;margin:0 auto;padding:12px}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.card{padding:6px 2px;margin-bottom:10px}
.card h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:15px;flex-wrap:wrap;color:var(--lime)}
.card.disabled{opacity:.45;pointer-events:none}
.step-num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:var(--lime);color:#0b1220;font-size:13px;font-weight:700}
.stat-label{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase}
.stat-value{font-size:24px;font-weight:700;color:var(--lime)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.b-green{background:rgba(163,230,53,.15);color:var(--lime)}.b-blue{background:rgba(34,211,238,.15);color:var(--cyan)}.b-red{background:rgba(248,113,113,.15);color:var(--red)}.b-gray{background:rgba(148,163,184,.15);color:var(--muted)}.b-warn{background:rgba(251,146,60,.15);color:var(--orange)}
.table-wrap{overflow-x:auto;border-radius:0;background:transparent}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--muted);font-size:10px;text-transform:uppercase;font-family:'Oswald'}
.ko-code{font-family:'Oswald';font-size:16px;font-weight:700;color:var(--cyan)}
.edit-row{background:rgba(251,146,60,.12)!important}.new-row{background:rgba(163,230,53,.12)!important}
.score-cell{font-family:'Oswald';font-size:18px;font-weight:700;white-space:nowrap}.score-cell .winner{color:var(--lime)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
input,select{background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--text);width:100%}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn{border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:800;text-transform:uppercase}
.btn-primary{background:var(--lime);color:#0b1220}.btn-blue{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.btn-dark{background:#1e293b;color:var(--text);border:1px solid var(--line)}.btn-light{background:rgba(148,163,184,.15);color:var(--muted)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.4)}.btn-warn{background:rgba(251,146,60,.15);color:var(--orange)}
.btn-sm{padding:4px 9px;font-size:11px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.time-cell{display:flex;gap:6px;align-items:center}.time-cell select{width:96px}
td input[type=time]{width:96px;padding:6px;color:var(--cyan);font-family:'Oswald'}
.serve-dots{color:var(--red);font-size:10px;margin-left:5px;letter-spacing:2px}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.group-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.group-card h4{margin:0 0 8px;color:var(--lime);text-transform:uppercase;font-size:13px}
.group-team{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.group-team:last-child{border-bottom:none}
.group-team select{min-width:96px}
.muted{color:var(--muted);font-size:13px}
.preview{margin:6px 0 10px;font-size:13px;color:var(--muted)}.preview b{color:var(--lime)}
.time-chip{color:var(--cyan);font-weight:600;font-family:'Oswald'}
.winner{color:var(--lime);font-weight:800}
.ref-box{max-width:640px}
.ref-header{display:flex;justify-content:space-between;color:var(--cyan);font-family:'Oswald';margin-bottom:14px;text-transform:uppercase}
.ref-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:16px}
.ref-team{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.ref-team .name{font-weight:700;margin-bottom:8px}
.ref-score{font-family:'Oswald';font-size:54px;color:var(--lime);line-height:1}
.ref-controls{display:flex;gap:8px;justify-content:center;margin:10px 0}
.ref-controls button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#0d1626;color:var(--text);font-size:22px}
.ref-serve-inline{display:flex;gap:6px;justify-content:center;margin-top:6px}
.serve-btn{border:1px solid var(--line);background:#0d1626;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700}
.serve-btn.active{background:var(--red);color:#fff}
.ref-vs{color:var(--muted);font-size:20px;align-self:center}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-backdrop.show{display:flex}
.modal{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal h3{margin:0 0 4px;text-transform:uppercase;color:var(--lime)}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.field input{width:100%}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px;display:none;white-space:pre-wrap}
.msg.show{display:block}.msg-error{background:rgba(248,113,113,.15);color:var(--red)}.msg-success{background:rgba(163,230,53,.15);color:var(--lime)}.msg-info{background:rgba(34,211,238,.15);color:var(--cyan)}
.hero{border-radius:var(--radius);padding:22px;margin-bottom:14px;background:linear-gradient(120deg,#14532d,#3f6212 60%,#166534);border:1px solid rgba(163,230,53,.35)}
.hero h1{margin:0 0 6px;font-size:24px;text-transform:uppercase}
.hero p{margin:0;opacity:.9}
.alert-box{padding:12px 14px;border-radius:12px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.35);color:var(--orange);font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--lime);color:#0b1220;padding:10px 18px;border-radius:999px;font-weight:800;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.col-court{}
@media(max-width:760px){main{padding:8px}.col-court{display:none}table{min-width:420px}th,td{padding:8px 6px;font-size:12px}.sel-row{grid-template-columns:1fr}.ref-teams{grid-template-columns:1fr}.hero h1{font-size:20px}}
</style>
</head>
<body>

<script>
"use strict";
var SUPABASE_URL="https://mvefkcaqvjflrgmaybev.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc";
var SERVICE_KEY="";
var DEFAULT_PASS="123@321";
var EMAIL_DOMAIN="@pb-local.app";
var GROUP_CODES=["A","B","C","D"];
var TEAM_SELECT="id,name,seed,status,event_id,team_members(player_id,position,players(id,full_name,skill_rating))";
var VN_OFFSET=7;
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var state={session:null,user:null,role:null,username:null,tournaments:[],tournament:null,events:[],currentEventId:null,courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],standings:[],groupStage:null,knockoutStage:null,users:[],refAssign:{},myMatchIds:new Set(),refMatches:[],refTournaments:[],refGroups:[],refModalMatchId:null,pending:{},editingEventId:null,editingPlayerId:null,editingTeamId:null,editingTeamOriginal:null,lastCreatedEventId:null,openTournaments:[],t5:{tid:null,eid:null,events:[],teams:[]},t6:{tid:null,eid:null,events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null},schedule:{startTime:"08:30",gapMinutes:20,groupCourt:{}}};

function el(id){return document.getElementById(id);}
function isLocked(){return state.tournament&&state.tournament.status==="completed";}
function isAdmin(){return state.role==="admin"||state.role==="organizer";}
function toEmail(u){u=(u||"").trim();return u.indexOf("@")>=0?u:u+EMAIL_DOMAIN;}
function shortName(n){return (n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function teamName(id){if(!id)return '<span class="muted">TBD</span>';var t=state.teams.find(function(x){return x.id===id;})||state.t6.teams.find(function(x){return x.id===id;})||state.t5.teams.find(function(x){return x.id===id;});return t?shortName(t.name):"TBD";}
function teamNameWithRating(id){var t=state.teams.find(function(x){return x.id===id;});if(!t)return "TBD";return "<b>"+shortName(t.name)+"</b> <span class='muted'>("+(t.total_rating!=null?t.total_rating.toFixed(2):"0.00")+")</span>";}
function statusBadge(s){return s==="completed"?'<span class="badge b-green">Xong</span>':s==="live"?'<span class="badge b-red">Đang đấu</span>':s==="scheduled"?'<span class="badge b-blue">Lịch</span>':'<span class="badge b-gray">'+(s||"-")+"</span>";}
function mapTeams(a){return (a||[]).map(function(t){var m=t.team_members||[];return Object.assign({},t,{members:m,total_rating:Number(m.reduce(function(s,x){return s+(x.players&&x.players.skill_rating||0);},0).toFixed(2))});});}
function ratingCheck(total,ev){if(!ev||ev.rating_limit==null)return{ok:true,msg:""};var r=ev.rating_rule||"max_total";if(r==="open")return{ok:true,msg:""};if(r==="exact_total"){var ok=Math.abs(total-ev.rating_limit)<=0.005;return{ok:ok,msg:ok?"✅ Đúng "+ev.rating_limit:"❌ Phải đúng "+ev.rating_limit+" (hiện "+total.toFixed(2)+")"};}var ok2=total<=ev.rating_limit;return{ok:ok2,msg:ok2?"✅ Hợp lệ (≤ "+ev.rating_limit+")":"❌ Vượt "+ev.rating_limit+" (hiện "+total.toFixed(2)+")"};}
function autoTeamName(a,b){if(!a||!b)return "";return a.full_name+" – "+b.full_name;}
function playerLabel(p){return p.full_name+" ("+(p.skill_rating!=null?Number(p.skill_rating).toFixed(2):"")+")";}
function toMin(t){var p=String(t||"08:30").split(":");return (+p[0])*60+(+p[1]);}
function fromMin(total){var d=(state.tournament&&state.tournament.start_date)||"2026-01-01";var h=Math.floor(total/60),m=total%60;return d+"T"+("0"+h).slice(-2)+":"+("0"+m).slice(-2)+":00+07";}
function fmtTime(s){if(!s)return "";var d=new Date(s);if(isNaN(d.getTime()))return "";var h=(d.getUTCHours()+VN_OFFSET)%24;return ("0"+h).slice(-2)+":"+("0"+d.getUTCMinutes()).slice(-2);}
function sortByTime(a,b){var ta=a.scheduled_at?new Date(a.scheduled_at).getTime():Infinity;var tb=b.scheduled_at?new Date(b.scheduled_at).getTime():Infinity;return (ta-tb)||(a.match_seq-b.match_seq);}
function sortedTournaments(){return state.tournaments.slice().sort(function(a,b){return String(a.created_at||"").localeCompare(String(b.created_at||""));});}
function timeOptions(sel){var o='<option value="">— Giờ —</option>';for(var h=5;h<=23;h++){for(var m=0;m<60;m+=5){var v=("0"+h).slice(-2)+":"+("0"+m).slice(-2);o+='<option value="'+v+'"'+(sel===v?" selected":"")+">"+v+"</option>";}}return o;}
function pad(n,len){return String(n).padStart(len,"0");}
function tournamentSeq(){var s=sortedTournaments();var i=-1;for(var k=0;k<s.length;k++){if(s[k].id===state.tournament.id){i=k;break;}}return i<0?1:i+1;}
function eventSeq(){var s=state.events.slice().sort(function(a,b){return String(a.created_at||"").localeCompare(String(b.created_at||"");});var i=-1;for(var k=0;k<s.length;k++){if(s[k].id===state.currentEventId){i=k;break;}}return i<0?1:i+1;}
function nextTournamentCode(){var n=state.tournaments.length+1;var c=pad(n,3);while(state.tournaments.some(function(t){return t.code===c;})){n++;c=pad(n,3);}return c;}
function nextEventCode(){var n=state.events.length+1;var c=pad(n,2);while(state.events.some(function(e){return e.code===c;})){n++;c=pad(n,2);}return c;}
function buildMatchCode(cc){return pad(tournamentSeq(),3)+pad(eventSeq(),1)+pad(cc,2);}
function displayCode(m){return (m.match_code||"").slice(-2);}
function koLabel(m){if(m.round===1)return "TK"+m.bracket_slot;if(m.round===2)return "BK"+m.bracket_slot;return "CK";}
function serveDots(m,side){if(!m.serve||m.status==="completed")return "";var isHome=m.serve.charAt(0)==="h";if((side==="home")!==isHome)return "";var n=m.serve.slice(-1)==="2"?2:1;var s="";for(var i=0;i<n;i++)s+="●";return '<span class="serve-dots">'+s+"</span>";}
function scoreCell(m,canEdit){
  var hasScore=(m.home_score!=null&&m.away_score!=null&&(m.home_score>0||m.away_score>0||m.status==="completed"));
  if(canEdit&&m.status!=="completed"){return '<button class="btn btn-primary" onclick="openRefModal(\''+m.id+'\')">Điểm</button>';}
  if(!hasScore){return '<span class="muted">-</span>';}
  var done=m.status==="completed";
  var hw=done&&m.home_score>m.away_score,aw=done&&m.away_score>m.home_score;
  return '<span class="score-cell">'+(hw?'<span class="winner">'+m.home_score+"</span>":m.home_score)+" - "+(aw?'<span class="winner">'+m.away_score+"</span>":m.away_score)+"</span>";
}
function activeGroups(){return state.groups.filter(function(g){return state.groupTeams.some(function(gt){return gt.group_id===g.id;});}).sort(function(a,b){return a.code.localeCompare(b.code);});}
function activeGroupCodes(){return activeGroups().map(function(g){return g.code;});}
function buildQFMap(){var c=activeGroupCodes();if(c.length<4)return null;return{1:{home:{g:c[0],r:1},away:{g:c[1],r:2}},2:{home:{g:c[2],r:1},away:{g:c[3],r:2}},3:{home:{g:c[1],r:1},away:{g:c[0],r:2}},4:{home:{g:c[3],r:1},away:{g:c[2],r:2}}};}
function groupRanking(gid){
  var gm=state.matches.filter(function(m){return m.group_id===gid&&m.status==="completed";});
  var map={};
  state.groupTeams.filter(function(gt){return gt.group_id===gid;}).forEach(function(gt){map[gt.team_id]={team_id:gt.team_id,wins:0,pf:0,pa:0};});
  gm.forEach(function(m){var h=map[m.home_team_id],a=map[m.away_team_id];if(!h||!a)return;h.pf+=m.home_score;h.pa+=m.away_score;a.pf+=m.away_score;a.pa+=m.home_score;if(m.home_score>m.away_score)h.wins++;else a.wins++;});
  return Object.values(map).sort(function(x,y){return (y.wins-x.wins)||((y.pf-y.pa)-(x.pf-x.pa))||(y.pf-x.pf);});
}
function groupComplete(gid){var gm=state.matches.filter(function(m){return m.group_id===gid;});return gm.length>0&&gm.every(function(m){return m.status==="completed";});}
function resolveRef(ref){var g=state.groups.find(function(x){return x.code===ref.g&&x.stage_id===state.groupStage.id;});if(!g||!groupComplete(g.id))return null;var top=groupRanking(g.id);return ref.r===1?(top[0]?top[0].team_id:null):(top[1]?top[1].team_id:null);}
function roundRobinPairs(){return[{round:1,slot:1,a:0,b:3},{round:1,slot:2,a:1,b:2},{round:2,slot:1,a:0,b:2},{round:2,slot:2,a:3,b:1},{round:3,slot:1,a:0,b:1},{round:3,slot:2,a:2,b:3}];}

async function ensureEventMatches(){
  if(!state.currentEventId||!state.tournament)return false;
  if(!state.groupStage){try{var r1=await sb.from("stages").insert({event_id:state.currentEventId,code:"GRP",name:"Vòng bảng",stage_type:"group_stage",stage_order:1}).select().single();if(r1.data)state.groupStage=r1.data;}catch(e){}}
  if(!state.knockoutStage){try{var r2=await sb.from("stages").insert({event_id:state.currentEventId,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2}).select().single();if(r2.data)state.knockoutStage=r2.data;}catch(e){}}
  if(!state.groupStage||!state.knockoutStage)return false;
  for(var gi=0;gi<4;gi++){var code=GROUP_CODES[gi];
    if(!state.groups.find(function(g){return g.stage_id===state.groupStage.id&&g.code===code;})){
      try{var rg=await sb.from("groups").insert({stage_id:state.groupStage.id,code:code,name:"Bảng "+code,max_teams:4}).select().single();if(rg.data)state.groups.push(rg.data);}catch(e){}
    }}
  var existing=state.matches.filter(function(m){return m.event_id===state.currentEventId;});
  function hasCode(cc){return existing.some(function(m){return m.match_code===buildMatchCode(cc);});}
  var inserts=[];
  for(var g2=0;g2<4;g2++){
    var grp=state.groups.find(function(g){return g.stage_id===state.groupStage.id&&g.code===GROUP_CODES[g2];});
    if(!grp)continue;
    roundRobinPairs().forEach(function(pr,mi){
      var cc=g2*6+mi+1;
      if(!hasCode(cc))inserts.push({event_id:state.currentEventId,tournament_id:state.tournament.id,stage_id:state.groupStage.id,group_id:grp.id,round:pr.round,bracket_slot:pr.slot,match_code:buildMatchCode(cc),match_seq:cc,status:"scheduled"});
    });
  }
  for(var s=1;s<=4;s++){var cc1=24+s;if(!hasCode(cc1))inserts.push({event_id:state.currentEventId,tournament_id:state.tournament.id,stage_id:state.knockoutStage.id,round:1,bracket_slot:s,match_code:buildMatchCode(cc1),match_seq:cc1,status:"scheduled"});}
  for(var s2=1;s2<=2;s2++){var cc2=28+s2;if(!hasCode(cc2))inserts.push({event_id:state.currentEventId,tournament_id:state.tournament.id,stage_id:state.knockoutStage.id,round:2,bracket_slot:s2,match_code:buildMatchCode(cc2),match_seq:cc2,status:"scheduled"});}
  var cc3=31;if(!hasCode(cc3))inserts.push({event_id:state.currentEventId,tournament_id:state.tournament.id,stage_id:state.knockoutStage.id,round:3,bracket_slot:1,match_code:buildMatchCode(cc3),match_seq:cc3,status:"scheduled"});
  if(inserts.length){try{await sb.from("matches").insert(inserts);}catch(e){}}
  return inserts.length>0;
}
async function syncGroupTeams(){
  if(!state.groupStage)return;
  for(var gi=0;gi<4;gi++){
    var g=state.groups.find(function(x){return x.stage_id===state.groupStage.id&&x.code===GROUP_CODES[gi];});
    if(!g)continue;
    var teams=state.teams.filter(function(t){return state.groupTeams.some(function(gt){return gt.team_id===t.id&&gt.group_id===g.id;});}).sort(function(a,b){return (a.seed||0)-(b.seed||0);});
    if(teams.length<4)continue;
    roundRobinPairs().forEach(function(pr,mi){
      var cc=gi*6+mi+1;
      var m=state.matches.find(function(mm){return mm.event_id===state.currentEventId&&mm.match_code===buildMatchCode(cc);});
      if(!m)return;
      var home=teams[pr.a]?teams[pr.a].id:null,away=teams[pr.b]?teams[pr.b].id:null;
      if(m.home_team_id!==home||m.away_team_id!==away){sb.from("matches").update({home_team_id:home,away_team_id:away}).eq("id",m.id).then(function(){});}
    });
  }
}
async function syncKnockoutTeams(){
  if(!state.knockoutStage)return;
  var qf=buildQFMap();
  var ko=state.matches.filter(function(m){return m.stage_id===state.knockoutStage.id;});
  function byCode(cc){return ko.find(function(m){return m.match_code===buildMatchCode(cc);});}
  function upd(m,h,a){if(m&&(m.home_team_id!==h||m.away_team_id!==a))sb.from("matches").update({home_team_id:h,away_team_id:a}).eq("id",m.id).then(function(){});}
  if(qf){for(var s=1;s<=4;s++){upd(byCode(24+s),resolveRef(qf[s].home),resolveRef(qf[s].away));}}
  function w(cc){var m=byCode(cc);return m&&m.status==="completed"?m.winner_team_id:null;}
  upd(byCode(29),w(25),w(26));
  upd(byCode(30),w(27),w(28));
  upd(byCode(31),w(29),w(30));
}
async function refreshKnockout(){
  try{
    if(!state.currentEventId)return;
    var added=await ensureEventMatches();
    if(added)await reloadEventMatches();
    await syncGroupTeams();
    await syncKnockoutTeams();
    await reloadEventMatches();
  }catch(e){}
}

function setupRealtime(){
  sb.channel("pb-matches").on("postgres_changes",{event:"*",schema:"public",table:"matches"},function(payload){
    var row=payload.new||payload.old;
    if(!row)return;
    if(payload.eventType==="DELETE"){
      state.matches=state.matches.filter(function(m){return m.id!==row.id;});
      state.refMatches=state.refMatches.filter(function(m){return m.id!==row.id;});
    }else{
      var i=state.matches.findIndex(function(m){return m.id===row.id;});
      if(i>=0)state.matches[i]=Object.assign({},state.matches[i],row);else state.matches.push(row);
      var j=state.refMatches.findIndex(function(m){return m.id===row.id;});
      if(j>=0)state.refMatches[j]=Object.assign({},state.refMatches[j],row);
    }
    renderMatches();renderStandings();renderHome();renderKnockout();
    if(state.role==="referee")renderReferee();
    if(state.knockoutStage){syncGroupTeams();syncKnockoutTeams();setTimeout(function(){renderMatches();renderKnockout();},300);}
  }).subscribe();
}

function ensureScheduleDefaults(){

async function ensureEightCourts(){
  if(!state.tournament||!isAdmin())return;
  for(var i=1;i<=8;i++){var name="Sân "+i;if(!state.courts.find(function(c){return c.name===name;})){try{await sb.from("courts").insert({tournament_id:state.tournament.id,name:name,display_order:i});}catch(e){}}}
  var d=await sb.from("courts").select("*").eq("tournament_id",state.tournament.id).order("display_order");
  state.courts=d.data||[];
}
function setSchStart(v){state.schedule.startTime=v||"08:30";renderMatches();}
function setSchGap(v){state.schedule.gapMinutes=parseInt(v)||20;renderMatches();}
function setGroupCourt(code,courtId){state.schedule.groupCourt[code]=courtId||null;renderMatches();}
function computeScheduleInMemory(){
  var start=toMin(state.schedule.startTime);
  var gap=state.schedule.gapMinutes||20;
  state.groups.filter(function(g){return g.stage_id===state.groupStage.id;}).forEach(function(g){
    var ms=state.matches.filter(function(m){return m.group_id===g.id;}).sort(function(a,b){return a.match_seq-b.match_seq;});
    ms.forEach(function(m,i){
      if(!m.scheduled_at)m.scheduled_at=fromMin(start+i*gap);
      if(!m.court_id)m.court_id=state.schedule.groupCourt[g.code]||null;
    });
  });
}
async function applyAutoSchedule(){
  if(!isAdmin()){alert("Chỉ admin/organizer mới áp lịch.");return;}
  await ensureEightCourts();
  var start=toMin(state.schedule.startTime);
  var gap=state.schedule.gapMinutes||20;
  var count=0;
  for(var gi=0;gi<state.groups.length;gi++){
    var g=state.groups[gi];if(g.stage_id!==state.groupStage.id)continue;
    var ms=state.matches.filter(function(m){return m.group_id===g.id;}).sort(function(a,b){return a.match_seq-b.match_seq;});
    for(var i=0;i<ms.length;i++){
      var r=await sb.from("matches").update({scheduled_at:fromMin(start+i*gap),court_id:state.schedule.groupCourt[g.code]||null}).eq("id",ms[i].id);
      if(!r.error)count++;
    }
  }
  state.pending={};
  alert("✅ Đã áp lịch cho "+count+" trận\nMỗi bảng: trận đầu "+state.schedule.startTime+", các trận sau cộng dồn "+gap+" phút.");
  await selectEvent(state.currentEventId);
}

async function showPage(p){
  document.querySelectorAll(".nav-link[data-page]").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-page")===p);});
  document.querySelectorAll(".page").forEach(function(x){x.classList.toggle("active",x.id==="page-"+p);});
  if(p==="admin"&&isAdmin()){await refreshOpenTournaments();await loadUsers();renderAdmin();}
  if(p==="referee")loadRefereeData();
  if(p==="matches"){
    if(isAdmin()){await ensureEightCourts();if(state.users.length===0)await loadUsers();await refreshKnockout();}
    ensureScheduleDefaults();computeScheduleInMemory();
    renderMatches();
  }
  if(p==="knockout"){
    if(isAdmin()){if(state.courts.length===0&&state.tournament)await ensureEightCourts();if(state.users.length===0)await loadUsers();await refreshKnockout();}
    renderKnockout();

  '<div id="team-edit-actions" class="hidden" style="display:flex;gap:8px"><button class="btn btn-primary" onclick="saveTeam()">💾 Cập nhật</button><button class="btn btn-light" onclick="cancelEditTeam()">✕ Hủy</button></div></div>'+
  '<div id="team-preview" class="preview"></div>'+
  '<div class="table-wrap"><table><thead><tr><th>Đội (tự động)</th><th>Tổng</th><th></th></tr></thead><tbody>'+
  (state.t5.teams.map(function(x){return '<tr class="'+(state.editingTeamId===x.id?"edit-row":"")+'"><td>'+shortName(x.name)+"</td><td>"+x.total_rating.toFixed(2)+'</td><td><button class="btn btn-sm btn-warn" onclick="editTeam(\''+x.id+'\')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteTeam(\''+x.id+'\')">🗑️</button></td></tr>';}).join("")||'<tr><td colspan="3" class="muted">Chưa có đội</td></tr>')+"</tbody></table></div>"
  :'<div class="alert-box">🔒 Chọn giải đang mở + nội dung để tạo đội.</div>')+"</div>"+
  '<div class="card"><h3><span class="step-num">6</span> Xếp 4 bảng + Knockout (tự sinh trận)</h3>'+
  '<div class="sel-row"><select onchange="setT6Tournament(this.value)">'+openTournamentOptions(state.t6.tid)+"</select>"+
  '<select onchange="setT6Event(this.value)" '+(state.t6.tid?"":"disabled")+'><option value="">— Chọn nội dung —</option>'+state.t6.events.map(function(e){return '<option value="'+e.id+'"'+(state.t6.eid===e.id?" selected":"")+">"+e.name+" ("+(e.rating_limit!=null?e.rating_limit:"mở")+")</option>";}).join("")+"</select></div>"+
  (state.t6.eid&&ev6?
  '<div class="actions"><button class="btn btn-dark" onclick="setupGroupStage6()">🏆 Thiết lập 4 bảng (tự sinh 31 trận)</button></div>'+
  (state.t6.groupStage?'<div class="group-grid">'+groupCards6+"</div>":'<div class="alert-box">Bấm "Thiết lập 4 bảng".</div>')
  :'<div class="alert-box">🔒 Chọn giải + nội dung để xếp bảng.</div>')+"</div>"+
  '<div class="card"><h3><span class="step-num">7</span> Người dùng '+(state.role==="admin"?'<span class="badge b-blue">admin</span>':"")+"</h3>"+
  '<div class="form-grid"><input id="nu-email" placeholder="Email"/><input id="nu-pass" type="text" value="'+DEFAULT_PASS+'"/><select id="nu-role"><option value="referee">referee</option><option value="organizer">organizer</option><option value="admin">admin</option></select><button class="btn btn-primary" onclick="adminCreateUser()">➕ Tạo user</button></div>'+
  '<div class="table-wrap"><table><thead><tr><th>Email</th><th>Quyền</th><th>Đổi quyền</th>'+(state.role==="admin"?"<th>Reset pass</th>":"")+"</tr></thead><tbody>"+
  (state.users.map(function(u){return "<tr><td>"+u.username+'</td><td><span class="badge b-blue">'+(u.role||"-")+'</span></td><td><select onchange="changeRole(\''+u.user_id+'\',this.value)"><option value="referee"'+(u.role==="referee"?" selected":"")+'>referee</option><option value="organizer"'+(u.role==="organizer"?" selected":"")+'>organizer</option><option value="admin"'+(u.role==="admin"?" selected":"")+">admin</option></select></td>"+(state.role==="admin"?'<td><button class="btn btn-sm btn-light" onclick="resetUserPassDefault(\''+u.user_id+'\',\''+u.username+'\')">↺ '+DEFAULT_PASS+"</button></td>":"")+"</tr>";}).join("")||'<tr><td colspan="4" class="muted">Chưa có</td></tr>')+"</tbody></table></div></div>";
  if(editingT&&editingT.members){
    var p1=editingT.members.find(function(m){return m.position===1;});
    var p2=editingT.members.find(function(m){return m.position===2;});
    if(p1)el("team-p1").value=p1.player_id;
    if(p2)el("team-p2").value=p2.player_id;
  }
  refreshTeamPlayerSelects();updateTeamEditButtons();
}

bindNav();
setupRealtime();
(async function(){
  try{
    var d=await sb.auth.getSession();
    if(d.data&&d.data.session){
      await loadMyProfile(d.data.session);
      if(isAdmin()){await loadUsers();}
      if(state.role==="referee")await loadRefereeData();
    }
    applyAuthUI();
    await refreshOpenTournaments();
    await loadTournaments();
  }catch(e){
    console.error("Init error:",e);
  }
})();
</script>
