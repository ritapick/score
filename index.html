<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Pickleball Pro - Quản lý giải đấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--nav:#0a101d;--surface:#111c31;--surface2:#0e1728;--line:rgba(148,163,184,.16);--text:#e6edf7;--muted:#8fa3bd;--lime:#a3e635;--cyan:#22d3ee;--orange:#fb923c;--red:#f87171;--radius:16px}
*{box-sizing:border-box}body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:radial-gradient(1100px 500px at 85% -10%,rgba(163,230,53,.10),transparent),radial-gradient(900px 500px at -10% 30%,rgba(34,211,238,.07),transparent),var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}
h1,h2,h3,h4,.logo,.nav-link,.stat-value{font-family:'Oswald',sans-serif;letter-spacing:.03em}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{color:var(--lime);font-weight:700;font-size:18px;text-transform:uppercase;font-style:italic}.logo span{color:var(--text)}
.nav-links{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.nav-link{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase;transition:.15s}
.nav-link:hover{color:var(--text);background:rgba(163,230,53,.1)}.nav-link.active{background:var(--lime);color:#0b1220}
.nav-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.user-chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--lime);padding:5px 10px;border-radius:999px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:5px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ctx-bar{background:var(--surface2);border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx-bar select{background:#0d1626;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.ctx-bar .muted{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
main{max-width:1200px;margin:0 auto;padding:12px}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.card{background:transparent;border:none;border-radius:0;padding:6px 2px;margin-bottom:10px;position:relative}
.card h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:15px;flex-wrap:wrap;color:var(--lime)}
.card.disabled{opacity:.45;pointer-events:none}
.step-num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:var(--lime);color:#0b1220;font-size:13px;font-weight:700;font-style:italic}
.stat-label{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:700;color:var(--lime);font-style:italic}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.b-green{background:rgba(163,230,53,.15);color:var(--lime)}.b-blue{background:rgba(34,211,238,.15);color:var(--cyan)}.b-red{background:rgba(248,113,113,.15);color:var(--red)}.b-gray{background:rgba(148,163,184,.15);color:var(--muted)}.b-warn{background:rgba(251,146,60,.15);color:var(--orange)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:none;border-radius:0;background:transparent;max-height:none}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{background:transparent;color:var(--muted);font-size:10px;text-transform:uppercase;position:sticky;top:0;font-family:'Oswald'}
tbody tr:hover{background:rgba(163,230,53,.05)}
.ko-code{font-family:'Oswald';font-size:16px;font-weight:700;color:var(--cyan)}
.edit-row{background:rgba(251,146,60,.12)!important}.new-row{background:rgba(163,230,53,.12)!important}
.score-cell{font-family:'Oswald';font-size:18px;font-weight:700;color:var(--text);white-space:nowrap}
.score-cell .winner{color:var(--lime)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.form-grid input,.form-grid select,td input,td select{width:100%;background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--text)}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sel-row select{width:100%;background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}
.btn{border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;transition:.15s}
.btn-primary{background:var(--lime);color:#0b1220}.btn-primary:hover{background:#bef264}
.btn-blue{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.btn-dark{background:#1e293b;color:var(--text);border:1px solid var(--line)}
.btn-light{background:rgba(148,163,184,.15);color:var(--muted)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.btn-warn{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.4)}
.btn-sm{padding:4px 9px;font-size:11px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.time-cell{display:flex;gap:6px;align-items:center}.time-cell select{width:96px}
td input[type=time]{width:96px;background:#0d1626;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--cyan);font-family:'Oswald'}
.serve-dots{color:var(--red);font-size:10px;margin-left:5px;letter-spacing:2px;vertical-align:middle}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.group-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.group-card h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;color:var(--lime);font-size:13px}
.group-team{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.group-team:last-child{border-bottom:none}
.group-team select{min-width:96px;background:#0d1626;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--text)}
.muted{color:var(--muted);font-size:13px}
.preview{margin:6px 0 10px;font-size:13px;color:var(--muted)}.preview b{color:var(--lime)}
.time-chip{font-family:'Oswald';color:var(--cyan);font-weight:600}
.winner{color:var(--lime);font-weight:800}
.ref-box{max-width:640px}
.ref-header{display:flex;justify-content:space-between;align-items:center;color:var(--cyan);font-family:'Oswald';margin-bottom:14px;text-transform:uppercase}
.ref-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:16px}
.ref-team{display:flex;flex-direction:column;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px}
.ref-team .name{font-weight:700;margin-bottom:8px;min-height:20px}
.ref-score{font-family:'Oswald';font-size:54px;color:var(--lime);font-style:italic;line-height:1}
.ref-controls{display:flex;gap:8px;justify-content:center;margin:10px 0}
.ref-controls button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#0d1626;color:var(--text);font-size:22px;cursor:pointer}
.ref-serve-inline{display:flex;gap:6px;justify-content:center;margin-top:6px}
.serve-btn{border:1px solid var(--line);background:#0d1626;color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11px;font-weight:700}
.serve-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.ref-vs{font-family:'Oswald';color:var(--muted);font-size:20px;display:flex;align-items:center}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,8,16,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-backdrop.show{display:flex}
.modal{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal h3{margin:0 0 4px;text-transform:uppercase;color:var(--lime)}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted);text-transform:uppercase}
.field input{width:100%;background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px;display:none;white-space:pre-wrap}
.msg.show{display:block}.msg-error{background:rgba(248,113,113,.15);color:var(--red)}.msg-success{background:rgba(163,230,53,.15);color:var(--lime)}.msg-info{background:rgba(34,211,238,.15);color:var(--cyan)}
.hero{border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden;background:linear-gradient(120deg,#14532d,#3f6212 60%,#166534);border:1px solid rgba(163,230,53,.35)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px)}
.hero h1{margin:0 0 6px;font-size:24px;text-transform:uppercase;font-style:italic;position:relative;z-index:1}
.hero p{margin:0;opacity:.9;position:relative;z-index:1}
.alert-box{padding:12px 14px;border-radius:12px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.35);color:var(--orange);font-size:13px;margin-bottom:12px}
.col-court{}
@media(max-width:760px){
  main{padding:8px}
  .col-court{display:none}
  table{min-width:420px}
  th,td{padding:8px 6px;font-size:12px}
  .score-cell{font-size:16px}
  .sel-row{grid-template-columns:1fr}
  .ref-teams{grid-template-columns:1fr}
  .ref-vs{justify-content:center}
  .hero h1{font-size:20px}
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="brand-row">
    <span class="logo">⚡ Pickle<span>ball Pro</span></span>
    <div class="nav-right">
      <span id="user-chip" class="user-chip hidden"></span>
      <button id="pass-btn" class="btn btn-light hidden" onclick="openPassModal()">🔑 Đổi MK</button>
      <button id="login-btn" class="btn btn-primary" onclick="openLogin()">Đăng nhập</button>
      <button id="logout-btn" class="btn btn-light hidden" onclick="logout()">Đăng xuất</button>
    </div>
  </div>
  <div class="nav-links">
    <button class="nav-link active" data-page="home">Giải đấu</button>
    <button class="nav-link" data-page="matches">Lịch đấu<span class="live-dot"></span></button>
    <button class="nav-link" data-page="standings">BXH</button>
    <button class="nav-link" data-page="knockout">Knockout</button>
    <button class="nav-link admin-only hidden" data-page="admin">⚙ Quản trị</button>
    <button class="nav-link ref-only hidden" data-page="referee">🏁 Trọng tài</button>
  </div>
</nav>

<div class="ctx-bar">
  <span class="muted">Giải</span><select id="ctx-tournament" onchange="selectTournament(this.value)"></select>
  <span class="muted">Nội dung</span><select id="ctx-event" onchange="selectEvent(this.value)"></select>
  <span id="lock-badge"></span>
</div>

<main>
  <section id="page-home" class="page active"><div id="home-content"></div></section>
  <section id="page-matches" class="page"><div id="matches-table"></div></section>
  <section id="page-standings" class="page"><div id="standings-content"></div></section>
  <section id="page-knockout" class="page"><div id="knockout-content"></div></section>
  <section id="page-admin" class="page"><div id="admin-content"></div></section>
  <section id="page-referee" class="page"><div id="referee-content"></div></section>
</main>

<div id="login-modal" class="modal-backdrop"><div class="modal">
  <h3>🔐 Đăng nhập</h3><div class="sub">Email + mật khẩu (mặc định <b>123@321</b>)</div>
  <div class="field"><label>Email</label><input id="login-username" placeholder="admin@gmail.com"/></div>
  <div class="field"><label>Mật khẩu</label><input id="login-password" type="password"/></div>
  <div class="actions" style="justify-content:flex-end"><button class="btn btn-light" onclick="closeLogin()">Đóng</button><button class="btn btn-primary" onclick="doLogin()">Đăng nhập</button></div>
  <div id="login-message" class="msg"></div>
</div></div>

<div id="pass-modal" class="modal-backdrop"><div class="modal">
  <h3>🔑 Đổi mật khẩu</h3><div class="sub">Cập nhật mật khẩu của bạn</div>
  <div class="field"><label>Mật khẩu mới</label><input id="np-pass" type="password"/></div>
  <div class="field"><label>Nhập lại</label><input id="np-pass2" type="password"/></div>
  <div class="actions" style="justify-content:flex-end"><button class="btn btn-light" onclick="closePassModal()">Hủy</button><button class="btn btn-primary" onclick="changePassword()">Lưu</button></div>
</div></div>

<div id="ref-modal" class="modal-backdrop"><div class="modal ref-box">
  <div class="ref-header"><span id="ref-match-code"></span><span id="ref-group-code" class="badge b-blue"></span></div>
  <div class="ref-teams">
    <div class="ref-team"><div class="name" id="ref-home-name"></div><div class="ref-score" id="ref-home-score">0</div>
      <div class="ref-controls"><button onclick="refAdj('home',-1)">−</button><button onclick="refAdj('home',1)">+</button></div>
      <div class="ref-serve-inline"><button class="serve-btn" id="sb-h1" onclick="setServe('h1')">● Giao 1</button><button class="serve-btn" id="sb-h2" onclick="setServe('h2')">●● Giao 2</button></div></div>
    <div class="ref-vs">VS</div>
    <div class="ref-team"><div class="name" id="ref-away-name"></div><div class="ref-score" id="ref-away-score">0</div>
      <div class="ref-controls"><button onclick="refAdj('away',-1)">−</button><button onclick="refAdj('away',1)">+</button></div>
      <div class="ref-serve-inline"><button class="serve-btn" id="sb-a1" onclick="setServe('a1')">● Giao 1</button><button class="serve-btn" id="sb-a2" onclick="setServe('a2')">●● Giao 2</button></div></div>
  </div>
  <div class="muted" style="text-align:center;margin-bottom:12px">Điểm & lượt giao banh tự lưu ngay khi thay đổi</div>
  <div class="actions" style="justify-content:space-between">
    <button class="btn btn-light" onclick="refCloseLive()">Đóng (đang thi đấu)</button>
    <button class="btn btn-primary" onclick="refFinish()">🏁 Kết thúc trận đấu</button>
  </div>
</div></div>

<script>
/* ================= CẤU HÌNH ================= */
const SUPABASE_URL="https://mvefkcaqvjflrgmaybev.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc";
const SERVICE_KEY="";
const DEFAULT_PASS="123@321";
/* CỐ ĐỊNH 4 BẢNG A-B-C-D */
const GROUP_CODES=["A","B","C","D"];
const TEAM_SELECT="id,name,seed,status,event_id,team_members(player_id,position,players(id,full_name,skill_rating))";
const VN_OFFSET=7;

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const state={session:null,user:null,role:null,username:null,
 tournaments:[],tournament:null,events:[],currentEventId:null,
 courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],
 matches:[],standings:[],groupStage:null,knockoutStage:null,
 users:[],refAssign:{},myMatchIds:new Set(),refMatches:[],refTournaments:[],refGroups:[],refModalMatchId:null,
 pending:{},
 editingEventId:null,editingPlayerId:null,editingTeamId:null,editingTeamOriginal:null,lastCreatedEventId:null,
 openTournaments:[],
 t5:{tid:null,eid:null,events:[],teams:[]},
 t6:{tid:null,eid:null,events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null},
 schedule:{startTime:"08:30",gapMinutes:20,groupCourt:{}}};

function el(id){return document.getElementById(id);}
function isLocked(){return state.tournament?.status==="completed";}
function isAdmin(){return state.role==="admin"||state.role==="organizer";}
/* Tên đội NGẮN GỌN: bỏ phần (trình) */
function shortName(n){return (n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
/* Lịch thi đấu: "Tên 1 – Tên 2" ngắn gọn */
function teamName(id){if(!id)return '<span class="muted">TBD</span>';const t=(state.teams.length?state.teams:state.t6.teams).find(x=>x.id===id)||state.t5.teams.find(x=>x.id===id);return t?shortName(t.name):"TBD";}
/* BXH: "Tên – Tên (tổng trình)" */
function teamNameWithRating(id){
  const t=state.teams.find(x=>x.id===id);
  if(!t)return "TBD";
  const name=shortName(t.name);
  const rating=t.total_rating!=null?t.total_rating.toFixed(2):"0.00";
  return `<b>${name}</b> <span class="muted">(${rating})</span>`;
}
function statusLabel(s){return{scheduled:"Lịch",completed:"Xong",live:"Đang đấu",cancelled:"Hủy",postponed:"Hoãn"}[s]||s;}
function statusBadge(s){return s==="completed"?'<span class="badge b-green">Xong</span>':s==="live"?'<span class="badge b-red">Đang đấu</span>':s==="scheduled"?'<span class="badge b-blue">Lịch</span>':'<span class="badge b-gray">'+statusLabel(s)+"</span>";}
function mapTeams(a){return (a||[]).map(t=>{const m=t.team_members||[];return{...t,members:m,total_rating:Number(m.reduce((s,x)=>s+(x.players?.skill_rating||0),0).toFixed(2))};});}
function ratingCheck(total,ev){if(!ev||ev.rating_limit==null)return{ok:true,msg:""};const r=ev.rating_rule||"max_total";if(r==="open")return{ok:true,msg:""};if(r==="exact_total"){const ok=Math.abs(total-ev.rating_limit)<=0.005;return{ok,msg:ok?`✅ Đúng ${ev.rating_limit}`:`❌ Phải đúng ${ev.rating_limit} (hiện ${total.toFixed(2)})`};}const ok=total<=ev.rating_limit;return{ok,msg:ok?`✅ Hợp lệ (≤ ${ev.rating_limit})`:`❌ Vượt ${ev.rating_limit} (hiện ${total.toFixed(2)})`};}
function autoTeamName(a,b){if(!a||!b)return "";return a.full_name+" – "+b.full_name;}
function playerLabel(p){return p.full_name+" ("+(p.skill_rating!=null?Number(p.skill_rating).toFixed(2):"")+")";}
function toMin(t){const [h,m]=String(t||"08:30").split(":").map(Number);return h*60+m;}
function fromMin(total){const d=state.tournament?.start_date||"2026-01-01";const h=Math.floor(total/60),m=total%60;return d+"T"+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":00+07";}
function fmtTime(s){if(!s)return "";const d=new Date(s);if(isNaN(d.getTime()))return "";const h=(d.getUTCHours()+VN_OFFSET)%24;return String(h).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");}
function sortByTime(a,b){const ta=a.scheduled_at?new Date(a.scheduled_at).getTime():Infinity;const tb=b.scheduled_at?new Date(b.scheduled_at).getTime():Infinity;return (ta-tb)||(a.match_seq-b.match_seq);}
function sortedTournaments(){return [...state.tournaments].sort((a,b)=>{const ao=a.status==="completed"?1:0,bo=b.status==="completed"?1:0;if(ao!==bo)return ao-bo;return String(b.start_date||"").localeCompare(String(a.start_date||""));});}
function timeOptions(sel){let o='<option value="">— Giờ —</option>';for(let h=5;h<=23;h++){for(let m=0;m<60;m+=5){const v=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");o+=`<option value="${v}" ${sel===v?"selected":""}>${v}</option>`;}}return o;}
function koLabel(m){if(m.round===1)return "TK"+m.bracket_slot;if(m.round===2)return "BK"+m.bracket_slot;return "CK";}
function serveDots(m,side){if(!m.serve||m.status==="completed")return "";const isHome=m.serve.startsWith("h");if((side==="home")!==isHome)return "";const n=m.serve.endsWith("2")?2:1;return `<span class="serve-dots">${"●".repeat(n)}</span>`;}
function scoreCell(m,canEdit){
  const hasScore=(m.home_score!=null&&m.away_score!=null&&(m.home_score>0||m.away_score>0||m.status==="completed"));
  if(canEdit&&m.status!=="completed"){return `<button class="btn btn-primary" onclick="openRefModal('${m.id}')">Điểm</button>`;}
  if(!hasScore){return `<span class="muted">-</span>`;}
  const done=m.status==="completed";
  const hw=done&&m.home_score>m.away_score, aw=done&&m.away_score>m.home_score;
  return `<span class="score-cell">${hw?'<span class="winner">':''}${m.home_score}${hw?'</span>':''} - ${aw?'<span class="winner">':''}${m.away_score}${aw?'</span>':''}</span>`;
}

function activeGroups(){return state.groups.filter(g=>state.groupTeams.some(gt=>gt.group_id===g.id)).sort((a,b)=>a.code.localeCompare(b.code));}
function activeGroupCodes(){return activeGroups().map(g=>g.code);}
function buildQFMap(){
  const c=activeGroupCodes();
  if(c.length<4)return null;
  const [B1,B2,B3,B4]=c;
  return {1:{home:{g:B1,r:1},away:{g:B2,r:2}},2:{home:{g:B3,r:1},away:{g:B4,r:2}},3:{home:{g:B2,r:1},away:{g:B1,r:2}},4:{home:{g:B4,r:1},away:{g:B3,r:2}}};
}
function groupRanking(gid){
  const gm=state.matches.filter(m=>m.group_id===gid&&m.status==="completed");
  const map={};
  state.groupTeams.filter(gt=>gt.group_id===gid).forEach(gt=>{map[gt.team_id]={team_id:gt.team_id,wins:0,pf:0,pa:0};});
  gm.forEach(m=>{const h=map[m.home_team_id],a=map[m.away_team_id];if(!h||!a)return;h.pf+=m.home_score;h.pa+=m.away_score;a.pf+=m.away_score;a.pa+=m.home_score;if(m.home_score>m.away_score)h.wins++;else a.wins++;});
  return Object.values(map).sort((x,y)=>(y.wins-x.wins)||((y.pf-y.pa)-(x.pf-x.pa))||(y.pf-x.pf));
}
function groupComplete(gid){const gm=state.matches.filter(m=>m.group_id===gid);return gm.length>0&&gm.every(m=>m.status==="completed");}
function resolveRef(ref){
  const g=state.groups.find(x=>x.code===ref.g&&x.stage_id===state.groupStage?.id);
  if(!g||!groupComplete(g.id))return null;
  const top=groupRanking(g.id);
  return ref.r===1?(top[0]?.team_id||null):(top[1]?.team_id||null);
}
async function ensureKnockoutMatches(){
  if(!state.groupStage)return false;
  if(activeGroups().length<4)return false;
  const groupMatches=state.matches.filter(m=>m.group_id);
  if(!groupMatches.length)return false;
  if(!state.knockoutStage){
    try{const {data}=await sb.from("stages").insert({event_id:state.currentEventId,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2}).select().single();if(data)state.knockoutStage=data;}catch(e){console.warn(e);}
  }
  if(!state.knockoutStage)return false;
  const existing=state.matches.filter(m=>m.stage_id===state.knockoutStage.id);
  const need=[];
  for(let s=1;s<=4;s++)if(!existing.find(m=>m.round===1&&m.bracket_slot===s))need.push({round:1,bracket_slot:s});
  for(let s=1;s<=2;s++)if(!existing.find(m=>m.round===2&&m.bracket_slot===s))need.push({round:2,bracket_slot:s});
  if(!existing.find(m=>m.round===3&&m.bracket_slot===1))need.push({round:3,bracket_slot:1});
  for(const n of need){
    try{await sb.from("matches").insert({event_id:state.currentEventId,tournament_id:state.tournament.id,stage_id:state.knockoutStage.id,round:n.round,bracket_slot:n.bracket_slot,status:"scheduled"});}catch(e){console.warn(e);}
  }
  return need.length>0;
}
async function syncKnockoutTeams(){
  if(!state.knockoutStage)return;
  const qf=buildQFMap();
  const ko=state.matches.filter(m=>m.stage_id===state.knockoutStage.id);
  const bySlot=(r,s)=>ko.find(m=>m.round===r&&m.bracket_slot===s);
  const updates=[];
  if(qf){
    for(const slot of [1,2,3,4]){
      const m=bySlot(1,slot);if(!m)continue;
      const def=qf[slot];
      const home=resolveRef(def.home), away=resolveRef(def.away);
      if(home!==m.home_team_id||away!==m.away_team_id)updates.push({id:m.id,home_team_id:home,away_team_id:away});
    }
  }
  const tk1=bySlot(1,1),tk2=bySlot(1,2),tk3=bySlot(1,3),tk4=bySlot(1,4);
  const sfDef={1:{home:tk1?.winner_team_id||null,away:tk2?.winner_team_id||null},2:{home:tk3?.winner_team_id||null,away:tk4?.winner_team_id||null}};
  for(const slot of [1,2]){const m=bySlot(2,slot);if(!m)continue;const d=sfDef[slot];if(d.home!==m.home_team_id||d.away!==m.away_team_id)updates.push({id:m.id,home_team_id:d.home,away_team_id:d.away});}
  const bk1=bySlot(2,1),bk2=bySlot(2,2),fm=bySlot(3,1);
  if(fm){const d={home:bk1?.winner_team_id||null,away:bk2?.winner_team_id||null};if(d.home!==fm.home_team_id||d.away!==fm.away_team_id)updates.push({id:fm.id,home_team_id:d.home,away_team_id:d.away});}
  for(const u of updates){try{await sb.from("matches").update({home_team_id:u.home_team_id,away_team_id:u.away_team_id}).eq("id",u.id);}catch(e){console.warn(e);}}
}
async function refreshKnockout(){
  try{
    if(!state.groupStage)return;
    const added=await ensureKnockoutMatches();
    if(added)await reloadEventMatches();
    await syncKnockoutTeams();
    await reloadEventMatches();
  }catch(e){console.warn("refreshKnockout:",e);}
}
async function buildKO(){await refreshKnockout();renderAll();alert("✅ Đã xây vòng KO từ kết quả vòng bảng.");}

function setupRealtime(){
  sb.channel("pb-matches")
    .on("postgres_changes",{event:"*",schema:"public",table:"matches"},(payload)=>{
      const row=payload.new||payload.old;
      if(!row)return;
      if(payload.eventType==="DELETE"){
        state.matches=state.matches.filter(m=>m.id!==row.id);
        state.refMatches=state.refMatches.filter(m=>m.id!==row.id);
      }else{
        const i=state.matches.findIndex(m=>m.id===row.id);
        if(i>=0)state.matches[i]={...state.matches[i],...row};else state.matches.push(row);
        const j=state.refMatches.findIndex(m=>m.id===row.id);
        if(j>=0)state.refMatches[j]={...state.refMatches[j],...row};
      }
      renderMatches();renderStandings();renderHome();renderKnockout();
      if(state.role==="referee")renderReferee();
      if(state.knockoutStage){syncKnockoutTeams().then(()=>{renderMatches();renderKnockout();renderStandings();renderHome();});}
    })
    .subscribe();
}

async function loadScope(tId,eId,withGroups){
  const out={events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null};
  if(!tId)return out;
  const {data:e}=await sb.from("events").select("*").eq("tournament_id",tId);out.events=e||[];
  if(eId){
    const {data:tm}=await sb.from("teams").select(TEAM_SELECT).eq("event_id",eId);out.teams=mapTeams(tm);
    if(withGroups){
      const {data:st}=await sb.from("stages").select("*").eq("event_id",eId).order("stage_order");
      out.groupStage=(st||[]).find(s=>s.stage_type==="group_stage")||null;
      out.knockoutStage=(st||[]).find(s=>s.stage_type==="knockout")||null;
      const sids=(st||[]).map(s=>s.id);
      if(sids.length){const {data:g}=await sb.from("groups").select("*").in("stage_id",sids).order("code");out.groups=g||[];const {data:gt}=await sb.from("group_teams").select("*").in("stage_id",sids);out.groupTeams=gt||[];}
    }
  }
  return out;
}

async function createTournament(){
  const code=el("t-code").value.trim(),name=el("t-name").value.trim();
  if(!code||!name){alert("Nhập mã và tên giải");return;}
  const {data:ex}=await sb.from("tournaments").select("id").eq("code",code).maybeSingle();
  if(ex){alert("Mã giải '"+code+"' đã tồn tại.");return;}
  const base=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  const slug=code.toLowerCase()+"-"+(base||"giai-dau")+"-"+Date.now().toString(36);
  const {data,error}=await sb.from("tournaments").insert({code,name,slug,start_date:el("t-start").value||null,end_date:el("t-end").value||null,location_name:el("t-location").value||null,status:"in_progress"}).select().single();
  if(error){alert(/row-level security/i.test(error.message)?"❌ Bị chặn RLS.":"❌ "+error.message);return;}
  for(let i=1;i<=8;i++){await sb.from("courts").insert({tournament_id:data.id,name:"Sân "+i,display_order:i}).then(()=>{}).catch(()=>{});}
  alert("✅ Đã tạo giải '"+name+"' kèm 8 sân.");
  await loadTournaments();await refreshOpenTournaments();
}

function ensureScheduleDefaults(){

}
async function ensureEightCourts(){
  if(!state.tournament||!isAdmin())return;
  for(let i=1;i<=8;i++){const name="Sân "+i;if(!state.courts.find(c=>c.name===name)){await sb.from("courts").insert({tournament_id:state.tournament.id,name,display_order:i}).then(()=>{}).catch(()=>{});}}
  const {data}=await sb.from("courts").select("*").eq("tournament_id",state.tournament.id).order("display_order");
  state.courts=data||[];
}
function setSchStart(v){state.schedule.startTime=v||"08:30";renderMatches();}
function setSchGap(v){state.schedule.gapMinutes=parseInt(v)||20;renderMatches();}
function setGroupCourt(code,courtId){state.schedule.groupCourt[code]=courtId||null;renderMatches();}
function computeScheduleInMemory(){
  const start=toMin(state.schedule.startTime);
  const gap=state.schedule.gapMinutes||20;
  state.groups.filter(g=>g.stage_id===state.groupStage?.id).forEach(g=>{
    const ms=state.matches.filter(m=>m.group_id===g.id).sort((a,b)=>(a.round-b.round)||(a.match_seq-b.match_seq));
    ms.forEach((m,i)=>{
      if(!m.scheduled_at)m.scheduled_at=fromMin(start+i*gap);
      if(!m.court_id)m.court_id=state.schedule.groupCourt[g.code]||null;
    });
  });
}
async function applyAutoSchedule(){
  if(!isAdmin()){alert("Chỉ admin/organizer mới áp lịch.");return;}
  await ensureEightCourts();
  const start=toMin(state.schedule.startTime);
  const gap=state.schedule.gapMinutes||20;
  let count=0;
  for(const g of state.groups.filter(x=>x.stage_id===state.groupStage?.id)){
    const ms=state.matches.filter(m=>m.group_id===g.id).sort((a,b)=>(a.round-b.round)||(a.match_seq-b.match_seq));
    for(let i=0;i<ms.length;i++){
      const payload={scheduled_at:fromMin(start+i*gap),court_id:state.schedule.groupCourt[g.code]||null};
      const {error}=await sb.from("matches").update(payload).eq("id",ms[i].id);
      if(!error)count++;
    }
  }
  state.pending={};
  alert("✅ Đã áp lịch cho "+count+" trận\nMỗi bảng: trận đầu "+state.schedule.startTime+", các trận sau cộng dồn "+gap+" phút.");
  await selectEvent(state.currentEventId);
}

    <div id="team-preview" class="preview"></div>
    <div class="table-wrap"><table><thead><tr><th>Đội (tự động)</th><th>Tổng</th><th></th></tr></thead><tbody>
    ${state.t5.teams.map(x=>`<tr class="${state.editingTeamId===x.id?"edit-row":""}"><td>${shortName(x.name)}</td><td>${x.total_rating.toFixed(2)}</td><td><button class="btn btn-sm btn-warn" onclick="editTeam('${x.id}')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteTeam('${x.id}')">🗑️</button></td></tr>`).join("")||'<tr><td colspan="3" class="muted">Chưa có đội</td></tr>'}</tbody></table></div>
    `:'<div class="alert-box">🔒 Chọn giải đang mở + nội dung để tạo đội.</div>'}
  </div>
  <div class="card"><h3><span class="step-num">6</span> Xếp 4 bảng + Knockout</h3>
    <div class="sel-row"><select onchange="setT6Tournament(this.value)">${openTournamentOptions(state.t6.tid)}</select>
    <select onchange="setT6Event(this.value)" ${state.t6.tid?"":"disabled"}><option value="">— Chọn nội dung —</option>${state.t6.events.map(e=>`<option value="${e.id}" ${state.t6.eid===e.id?"selected":""}>${e.name} (${e.rating_limit??"mở"})</option>`).join("")}</select></div>
    ${state.t6.eid&&ev6?`
    <div class="actions"><button class="btn btn-dark" onclick="setupGroupStage6()">🏆 Thiết lập 4 bảng</button><button class="btn btn-primary" onclick="runGenerateGroupFixtures6()">⚽ Sinh vòng bảng</button><button class="btn btn-blue" onclick="buildKO()">🔥 Xây vòng KO từ kết quả</button></div>
    ${state.t6.groupStage?`<div class="group-grid">${groupCards6}</div>`:'<div class="alert-box">Bấm "Thiết lập 4 bảng".</div>'}
    `:'<div class="alert-box">🔒 Chọn giải + nội dung để xếp bảng.</div>'}
  </div>
  <div class="card"><h3><span class="step-num">7</span> Người dùng ${state.role==="admin"?'<span class="badge b-blue">admin</span>':""}</h3>
    <div class="form-grid"><input id="nu-email" placeholder="Email"/><input id="nu-pass" type="text" value="${DEFAULT_PASS}"/><select id="nu-role"><option value="referee">referee</option><option value="organizer">organizer</option><option value="admin">admin</option></select><button class="btn btn-primary" onclick="adminCreateUser()">➕ Tạo user</button></div>
    <div class="table-wrap"><table><thead><tr><th>Email</th><th>Quyền</th><th>Đổi quyền</th>${state.role==="admin"?'<th>Reset pass</th>':""}</tr></thead><tbody>
    ${state.users.map(u=>`<tr><td>${u.username}</td><td><span class="badge b-blue">${u.role||"-"}</span></td><td><select onchange="changeRole('${u.user_id}',this.value)"><option value="referee" ${u.role==="referee"?"selected":""}>referee</option><option value="organizer" ${u.role==="organizer"?"selected":""}>organizer</option><option value="admin" ${u.role==="admin"?"selected":""}>admin</option></select></td>${state.role==="admin"?`<td><button class="btn btn-sm btn-light" onclick="resetUserPassDefault('${u.user_id}','${u.username}')">↺ ${DEFAULT_PASS}</button></td>`:""}</tr>`).join("")||'<tr><td colspan="4" class="muted">Chưa có</td></tr>'}</tbody></table></div>
  </div>`;
  if(editingT&&editingT.members){
    const p1=editingT.members.find(m=>m.position===1);
    const p2=editingT.members.find(m=>m.position===2);
    if(p1)el("team-p1").value=p1.player_id;
    if(p2)el("team-p2").value=p2.player_id;
  }
  refreshTeamPlayerSelects();updateTeamEditButtons();
}

bindNav();
setupRealtime();
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){await loadMyProfile(data.session);if(state.role==="referee")await loadRefereeData();}
  applyAuthUI();
  await refreshOpenTournaments();
  await loadTournaments();
})();
</script>
</body>
</html>
