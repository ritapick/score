<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f2f2f2;margin:0;padding:20px;}
.container{max-width:1200px;margin:auto;}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);margin-bottom:20px;}
h2{margin-top:0;color:#1976d2;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
input,select{padding:10px;font-size:15px;border:1px solid #ccc;border-radius:5px;width:100%;}
input:focus,select:focus{outline:none;border-color:#1976d2;}
button{padding:12px;border:none;background:#1976d2;color:white;cursor:pointer;font-size:15px;border-radius:5px;transition:.2s;}
button:hover{background:#0d47a1;}
button.danger{background:#e53935;}
button.danger:hover{background:#b71c1c;}
button.small{padding:6px 10px;font-size:13px;}
.toolbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.toolbar input{flex:1;min-width:200px;}
table{width:100%;border-collapse:collapse;}
th{background:#1976d2;color:white;padding:10px;text-align:center;}
td{padding:8px;border-bottom:1px solid #ddd;text-align:center;}
tr:nth-child(even){background:#fafafa;}
tr:hover{background:#e3f2fd;}
#msg{margin-top:10px;font-weight:bold;min-height:20px;}
.empty{text-align:center;color:#888;padding:20px;font-style:italic;}
.loader{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="container">

<div class="card">
  <h2>➕ Thêm người chơi</h2>
  <div class="form">
    <input id="ten" placeholder="Tên người chơi">
    <select id="gioitinh">
      <option value="1">Nam</option>
      <option value="0">Nữ</option>
    </select>
    <input id="baseline" type="number" step="0.01" placeholder="Baseline">
    <input id="pvna" type="number" step="0.01" placeholder="PVNA">
    <input id="mini" type="number" step="0.01" placeholder="Mini">
    <button id="btnSave" onclick="saveData()">Lưu</button>
  </div>
  <div id="msg"></div>
</div>

<div class="card">
  <h2>📋 Danh sách người chơi</h2>
  <div class="toolbar">
    <input id="search" placeholder="🔍 Tìm theo tên..." oninput="renderTable()">
    <button onclick="loadData()">🔄 Tải lại</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Giới tính</th>
        <th>Baseline</th>
        <th>PVNA</th>
        <th>Mini</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7" class="empty">Đang tải...</td></tr>
    </tbody>
  </table>
</div>

</div>

<script>
const SUPABASE_URL = "https://nmgofzqtebcnfhttaudy.supabase.co";
const SUPABASE_KEY = "sb_publishable_VhMamB1cXFl8T4JMI2bX9w_PI543awJ";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allData = [];

function showMsg(text, color="green"){
  const m = document.getElementById("msg");
  m.style.color = color;
  m.innerHTML = text;
  setTimeout(()=>{ m.innerHTML = ""; }, 3000);
}

async function loadData(){
  document.getElementById("tbody").innerHTML = `<tr><td colspan="7" class="empty"><span class="loader"></span> Đang tải dữ liệu...</td></tr>`;
  const {data, error} = await db.from("ds").select("*").order("id");
  if(error){
    showMsg("Lỗi: " + error.message, "red");
    document.getElementById("tbody").innerHTML = `<tr><td colspan="7" class="empty">Không thể tải dữ liệu</td></tr>`;
    return;
  }
  allData = data || [];
  renderTable();
}

function renderTable(){
  const keyword = document.getElementById("search").value.toLowerCase();
  const filtered = allData.filter(r => (r.ten||"").toLowerCase().includes(keyword));
  let html = "";
  if(filtered.length === 0){
    html = `<tr><td colspan="7" class="empty">Không có dữ liệu</td></tr>`;
  } else {
    filtered.forEach(r=>{
      html += `
        <tr>
          <td>${r.id}</td>
          <td>${r.ten ?? ""}</td>
          <td>${r.gioitinh == 1 ? "Nam" : "Nữ"}</td>
          <td>${r.scoreBaseline ?? ""}</td>
          <td>${r.scorePVNA ?? ""}</td>
          <td>${r.socreMini ?? ""}</td>
          <td>
            <button class="danger small" onclick="deleteRow(${r.id})">Xóa</button>
          </td>
        </tr>`;
    });
  }
  document.getElementById("tbody").innerHTML = html;
}

async function saveData(){
  const ten = document.getElementById("ten").value.trim();
  if(!ten){
    showMsg("Vui lòng nhập tên!", "red");
    return;
  }
  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Đang lưu...';

  const gioitinh = parseInt(document.getElementById("gioitinh").value);
  const baseline = parseFloat(document.getElementById("baseline").value) || 0;
  const pvna     = parseFloat(document.getElementById("pvna").value) || 0;
  const mini     = parseFloat(document.getElementById("mini").value) || 0;

  const {error} = await db.from("ds").insert([{
    ten: ten,
    gioitinh: gioitinh,
    scoreBaseline: baseline,
    scorePVNA: pvna,
    socreMini: mini   // ← giữ đúng tên cột trong DB của bạn
  }]);

  btn.disabled = false;
  btn.innerHTML = "Lưu";

  if(error){
    showMsg("Lỗi: " + error.message, "red");
    return;
  }

  showMsg("✅ Đã lưu thành công!", "green");
  ["ten","baseline","pvna","mini"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("ten").focus();
  loadData();
}

async function deleteRow(id){
  if(!confirm("Bạn có chắc muốn xóa dòng này?")) return;
  const {error} = await db.from("ds").delete().eq("id", id);
  if(error){
    showMsg("Lỗi khi xóa: " + error.message, "red");
    return;
  }
  showMsg("🗑️ Đã xóa thành công!", "green");
  loadData();
}

document.querySelectorAll("#ten,#baseline,#pvna,#mini").forEach(el=>{
  el.addEventListener("keypress", e=>{ if(e.key === "Enter") saveData(); });
});

loadData();
</script>
</body>
</html>
