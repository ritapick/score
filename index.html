<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Pickleball Pro - Giải đấu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171;--pk:#e94560}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px;min-height:100vh}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{color:var(--li);font-weight:800;font-size:16px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.logo-icon{font-size:22px}
.chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:4px 10px;border-radius:99px}
.btn{border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--li);color:#0b1220}
.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
.btn-w{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
main{max-width:1200px;margin:0 auto;padding:12px}
.hero{background:linear-gradient(135deg,rgba(163,230,53,.1),rgba(34,211,238,.1));border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px;text-align:center}
.hero h1{margin:0 0 6px;font-size:22px;color:var(--li);letter-spacing:.5px}
.hero p{margin:0;color:var(--mu);font-size:13px}
.section-title{font-size:14px;font-weight:800;color:var(--cy);margin:18px 0 10px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.section-title .count{background:rgba(34,211,238,.15);color:var(--cy);padding:2px 8px;border-radius:4px;font-size:11px}
.tournament-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.t-card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.t-card:active{transform:scale(.98)}
.t-card:hover{border-color:var(--cy)}
.t-card .t-name{font-size:15px;font-weight:800;color:var(--li);margin-bottom:6px;padding-right:70px}
.t-card .t-meta{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.t-card .t-meta span{display:flex;align-items:center;gap:4px}
.t-card .t-status{position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.t-status.not-started{background:rgba(148,163,184,.2);color:var(--mu)}
.t-status.in-progress{background:rgba(34,211,238,.2);color:var(--cy);animation:pulse 2s infinite}
.t-status.completed{background:rgba(163,230,53,.2);color:var(--li)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.manage-btn{position:absolute;bottom:10px;right:10px;background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4);padding:4px 10px;border-radius:6px;font-size:10px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:4px;z-index:2}
.manage-btn:hover{background:rgba(251,146,60,.25)}
.manage-btn:active{transform:scale(.95)}
.t-detail{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:14px}
.t-detail-header{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--ln)}
.t-detail-header h2{margin:0 0 6px;color:var(--li);font-size:18px;word-break:break-word}
.t-detail-header .meta{font-size:11px;color:var(--mu);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.t-detail-header .meta span{display:inline-flex;align-items:center;gap:3px}
.manage-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.back-btn{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
.back-btn:active{transform:scale(.97)}
.event-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.event-tab{background:rgba(148,163,184,.1);border:1px solid var(--ln);color:var(--mu);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;transition:.15s;white-space:nowrap;flex-shrink:0}
.event-tab:active{transform:scale(.97)}
.event-tab.active{background:rgba(34,211,238,.15);color:var(--cy);border-color:var(--cy)}
.bxh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.group-card{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;overflow:hidden}
.group-card h4{margin:0 0 8px;color:var(--li);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.group-card h4 .badge{background:var(--li);color:#0b1220;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:center}
th{color:var(--mu);font-size:9px;text-transform:uppercase;font-weight:800;background:rgba(26,37,64,.5);letter-spacing:.3px}
td.team-name{text-align:left;font-weight:700;color:var(--tx);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.rank{font-weight:800;font-size:12px;color:var(--mu);width:28px}
tr.qualify{background:rgba(163,230,53,.08)}
tr.qualify td.rank{color:var(--li)}
tr.qualify td.rank::before{content:"✓ ";color:var(--li);font-weight:900}
td.wins{color:var(--li);font-weight:800;font-family:monospace}
td.diff{font-family:monospace;font-weight:700}
td.diff.pos{color:var(--li)}
td.diff.neg{color:var(--rd)}
td.pf{font-family:monospace;color:var(--cy)}

/* Match item */
.match-list{display:flex;flex-direction:column;gap:6px}
.match-item{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;transition:.2s;cursor:pointer}
.match-item:active{transform:scale(.98)}
.match-item:hover{border-color:var(--cy)}
.match-item.live{border-left:3px solid var(--rd);background:rgba(248,113,113,.08);animation:pulseLive 2s infinite}
.match-item.finished{border-left:3px solid var(--li);opacity:.95}
.match-item.ko{border-left:3px solid var(--or)}
.match-item.ck{border-left:3px solid var(--li);background:rgba(163,230,53,.05)}
@keyframes pulseLive{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.3)}50%{box-shadow:0 0 0 4px rgba(248,113,113,0)}}

.match-main-row{display:grid;grid-template-columns:32px 1fr auto 1fr auto auto;gap:4px;align-items:center;width:100%;min-width:0}
.match-main-row .m-code{font-family:monospace;font-weight:800;color:var(--li);font-size:11px;text-align:center}
.match-item.ko .m-code{color:var(--or)}
.match-item.ck .m-code{color:var(--li);font-size:12px}

.match-main-row .m-team{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;transition:color .2s}
.match-main-row .m-team.home{color:var(--li);text-align:right}
.match-main-row .m-team.away{color:var(--cy);text-align:left}
.match-main-row .m-team.tbd{color:var(--or);font-style:italic;font-weight:500;font-size:10px}
/* 🌟 Logic màu sắc khi dẫn điểm */
.match-main-row .m-team.leading { color: var(--rd) !important; font-weight: 800; }

.match-main-row .m-score{
    font-family:monospace;font-weight:800;font-size:13px;
    min-width:50px; text-align:center;
    background:#0d1626; padding:3px 6px; border-radius:6px;
    border:1px solid var(--ln);
    white-space:nowrap;
}
/* 🌟 Màu sắc tỷ số chi tiết */
.score-leading { color: var(--rd) !important; font-weight: 900; }
.score-normal { color: var(--li); }
.score-sep-small { color: var(--mu); padding: 0 2px; }

.status-tag{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:800;white-space:nowrap}
.status-tag.live{background:var(--rd);color:#fff;animation:blink 1s infinite}
.status-tag.finished, .status-tag.completed{background:rgba(163,230,53,.2);color:var(--li)}
.status-tag.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

.match-serve-info{font-size:10px;color:var(--or);font-weight:700;padding-left:38px;display:flex;align-items:center;gap:4px;animation:blink 1.5s infinite}

.timeline-btn{background:var(--pk);color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}
.timeline-btn:active{transform:scale(.95)}

.ko-section{background:rgba(251,146,60,.05);border:2px solid var(--or);border-radius:12px;padding:12px;margin-top:14px}
.ko-section>h3{margin:0 0 10px;color:var(--or);font-size:15px}
.ko-group{margin-bottom:10px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.ko-group-header{padding:7px 10px;font-weight:800;font-size:11px;text-transform:uppercase}
.ko-group-header.tk{background:rgba(251,146,60,.15);color:var(--or)}
.ko-group-header.bk{background:rgba(34,211,238,.1);color:var(--cy)}
.ko-group-header.ck{background:rgba(163,230,53,.15);color:var(--li)}
.ko-group-header.r16{background:rgba(34,211,238,.1);color:var(--cy)}
.ko-group .match-list{padding:6px}

.sponsor-section{margin-top:14px;padding:12px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px}
.sponsor-section h4{margin:0 0 10px;color:var(--cy);font-size:13px}
.sponsor-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.sponsor-item{background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.15s}
.sponsor-item:active{transform:scale(.97)}
.sponsor-item img{height:32px;max-width:70px;object-fit:contain}
.sponsor-item span{color:#0b1220;font-weight:700;font-size:11px}
.empty-state{text-align:center;padding:30px 16px;color:var(--mu)}
.empty-state .icon{font-size:40px;margin-bottom:8px;opacity:.5}
.empty-state p{font-size:13px;margin:4px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* Modal chung */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bg.show{display:flex}
.modal{width:min(380px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.modal h3{margin:0 0 10px;color:var(--li);font-size:16px}
.modal input{background:#0d1626;border:1px solid var(--ln);border-radius:8px;padding:9px;color:var(--tx);width:100%;font-size:13px;margin-bottom:8px}
.modal .hint{font-size:10px;color:var(--mu);margin:-4px 0 8px;font-style:italic}
.modal .actions{display:flex;gap:8px;justify-content:flex-end}
.modal .msg{font-size:12px;margin-top:8px;color:var(--rd);min-height:16px}

/* 🌟 MODAL TIMELINE - DIỄN BIẾN ĐIỂM */
.timeline-modal{width:min(600px,100%);max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.timeline-header{background:var(--pk);color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:1px;position:relative}
.timeline-header .close-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.timeline-subheader{padding:12px 16px;background:var(--sf2);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px}
.timeline-subheader .icon{color:var(--pk);font-size:18px}
.timeline-subheader h4{margin:0;font-size:14px;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timeline-body{overflow-y:auto;padding:12px;flex:1;background:var(--bg)}
.timeline-empty{text-align:center;padding:40px 20px;color:var(--mu)}
.timeline-empty .icon{font-size:48px;margin-bottom:10px;opacity:.5}

/* Rally card */
.rally-card{background:#2a2a3e;border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:14px;margin-bottom:10px}
.rally-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rally-title{font-size:13px;font-weight:700;color:var(--tx)}
.rally-badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:99px;text-transform:uppercase}
.rally-badge.start{background:rgba(233,69,96,.2);color:var(--pk);border:1px solid var(--pk)}
.rally-badge.sideout{background:rgba(248,113,113,.2);color:var(--rd);border:1px solid var(--rd)}
.rally-badge.score{background:rgba(34,211,238,.2);color:var(--cy);border:1px solid var(--cy)}
.rally-badge.second{background:rgba(251,146,60,.2);color:var(--or);border:1px solid var(--or)}

/* 🌟 Layout tỷ số trong Timeline: Giao - Nhận - Lượt */
.rally-score{display:flex;justify-content:center;align-items:center;gap:8px;margin:12px 0}
.rally-score-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;font-family:monospace}
.rally-score-circle.server{background:var(--rd);color:#fff;border:2px solid var(--rd);box-shadow:0 0 10px rgba(248,113,113,.3)}
.rally-score-circle.receiver{background:#1a1a2e;color:var(--tx);border:1px solid var(--ln)}
.rally-score-circle.turn{background:var(--or);color:#0b1220;font-size:16px;width:38px;height:38px}
.rally-score-sep{font-size:18px;font-weight:800;color:var(--mu)}

.rally-desc{font-size:12px;color:var(--mu);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid rgba(148,163,184,.1);text-align:center}
.rally-desc .player-name{color:var(--tx);font-weight:700}
.rally-desc .team-name{color:var(--cy);font-weight:600}
.rally-desc .slot{color:var(--or);font-weight:700}

@media(max-width:480px){
  main{padding:8px}
  .hero{padding:14px}
  .hero h1{font-size:18px}
  .tournament-grid{grid-template-columns:1fr}
  .bxh-grid{grid-template-columns:1fr}
  .t-card .t-name{font-size:14px}
  table{font-size:10px}
  th,td{padding:4px 3px}
  td.team-name{max-width:110px;font-size:10px}
  .match-main-row{grid-template-columns:28px 1fr auto 1fr auto auto;gap:3px}
  .match-main-row .m-team{font-size:10px}
  .match-main-row .m-score{font-size:12px;min-width:44px;padding:2px 4px}
  .match-main-row .m-code{font-size:10px}
  .section-title{font-size:13px}
  .match-serve-info{font-size:9px;padding-left:32px}
  .timeline-btn{padding:3px 6px;font-size:9px}
  .rally-score-circle{width:38px;height:38px;font-size:18px}
  .rally-score-circle.turn{width:34px;height:34px;font-size:14px}
}
@media(min-width:481px) and (max-width:768px){
  .tournament-grid{grid-template-columns:repeat(2,1fr)}
  .bxh-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row">
  <span class="logo"><span class="logo-icon">🏓</span> Pickleball Pro</span>
</div>
<div>
  <span id="user-chip" class="chip hidden"></span>
  <button id="login-btn" class="btn btn-p" onclick="openLogin()">🔐 Đăng nhập</button>
  <a id="admin-link" class="btn btn-b hidden" href="admin.html">⚙ Quản trị</a>
  <button id="logout-btn" class="btn btn-l hidden" onclick="doLogout()">Thoát</button>
</div>
</nav>
<main id="app">
  <div class="hero">
    <h1>🏓 GIẢI ĐẤU PICKLEBALL</h1>
    <p>Theo dõi lịch thi đấu, bảng xếp hạng và kết quả trực tiếp</p>
  </div>
  <div id="content">Đang tải...</div>
</main>
<div id="toast" class="toast"></div>

<div id="login-modal" class="modal-bg">
<div class="modal">
<h3>🔐 Đăng nhập</h3>
<input id="lu" placeholder="Tên đăng nhập"/>
<div class="hint">Nhập tên đăng nhập trong hệ thống.</div>
<input id="lp" type="password" placeholder="Mật khẩu"/>
<div class="actions">
  <button class="btn btn-l" onclick="closeLogin()">Đóng</button>
  <button class="btn btn-p" onclick="doLogin()">Đăng nhập</button>
</div>
<div id="lmsg" class="msg"></div>
</div>
</div>

<!-- 🌟 MODAL TIMELINE - DIỄN BIẾN ĐIỂM -->
<div id="timeline-modal" class="modal-bg">
<div class="modal timeline-modal">
  <div class="timeline-header">
    <span>DIỄN BIẾN TRẬN ĐẤU</span>
    <button class="close-btn" onclick="closeTimelineModal()">×</button>
  </div>
  <div class="timeline-subheader">
    <span class="icon">📈</span>
    <h4 id="timeline-title">Đang tải...</h4>
  </div>
  <div class="timeline-body" id="timeline-body">
    <div class="timeline-empty">
      <div class="icon">⏳</div>
      <p>Đang tải diễn biến...</p>
    </div>
  </div>
</div>
</div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var CURRENT_USER = null;
var DATA = {
  tournaments: [], tournament: null, events: [], eid: null,
  teams: [], players: [], stages: [], groups: [], groupTeams: [], matches: [],
  gStage: null, kStage: null, sponsors: [], rallies: []
};
var realtimeInterval = null;
var currentTimelineMatchId = null;

/* === HELPERS === */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sn(n) { return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim(); }
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2000);
}
function findTeam(id) { for(var i=0;i<DATA.teams.length;i++) if(DATA.teams[i].id===id) return DATA.teams[i]; return null; }
function tName(id) { var t=findTeam(id); return t?sn(t.name):null; }
function isAdmin() { return CURRENT_USER && CURRENT_USER.username.toLowerCase() === 'admin'; }

function getPlayerName(playerId) {
  if (!playerId) return null;
  var p = DATA.players.find(p => p.id === playerId);
  return p ? p.full_name : null;
}

function isOwnerOfTournament(t) {
  if (!t) return false;
  if (isAdmin()) return true;
  if (!CURRENT_USER) return false;
  return t.admin_id === CURRENT_USER.id;
}

/* === AUTH === */
function openLogin() { el("login-modal").classList.add("show"); el("lmsg").textContent=""; }
function closeLogin() { el("login-modal").classList.remove("show"); }
async function doLogin() {
  var u = el("lu").value.trim().toLowerCase();
  var p = el("lp").value;
  if (!u || !p) { el("lmsg").textContent="Vui lòng nhập đầy đủ."; return; }

/* === 🌟 REALTIME POLLING === */
function startRealtime() {
  stopRealtime();
  realtimeInterval = setInterval(async () => {
    if (!DATA.eid) return;
    try {
      var m = await sb.from("matches").select("*").eq("event_id", DATA.eid).order("match_seq");
      if (m.data && m.data.length) {
        var changed = false;
        for (var i = 0; i < m.data.length; i++) {
          var old = DATA.matches.find(x => x.id === m.data[i].id);
          if (!old || old.home_score !== m.data[i].home_score || old.away_score !== m.data[i].away_score || 
              old.match_status !== m.data[i].match_status || old.serving_team !== m.data[i].serving_team || 
              old.serving_turn !== m.data[i].serving_turn || old.serving_player_id !== m.data[i].serving_player_id ||
              old.rally_count !== m.data[i].rally_count) {
            changed = true; break;
          }
        }
        if (changed) {
          DATA.matches = m.data;
          updateMatchRowsDOM();
          if (currentTimelineMatchId) {
            await loadRallies(currentTimelineMatchId);
          }
        }
      }
    } catch(e) { console.warn("Realtime poll error:", e); }
  }, 3000);
}

function stopRealtime() {
  if (realtimeInterval) { clearInterval(realtimeInterval); realtimeInterval = null; }
}

// 🌟 CẬP NHẬT DOM REALTIME (GIỮ NGUYÊN CẤU TRÚC, CHỈ ĐỔI CLASS/MÀU)
function updateMatchRowsDOM() {
  DATA.matches.forEach(function(m) {
    var row = document.querySelector('.match-item[data-match-id="' + m.id + '"]');
    if (!row) return;
    
    var status = m.match_status || ((Number(m.home_score)>0 || Number(m.away_score)>0) ? "completed" : "scheduled");
    var h = Number(m.home_score)||0, a = Number(m.away_score)||0;
    
    // 1. Cập nhật tỷ số và màu sắc dẫn điểm
    var scoreEl = row.querySelector('.m-score');
    if (scoreEl) {
      if (status === "completed" || status === "finished") {
        var hClass = h > a ? "score-leading" : "score-normal";
        var aClass = a > h ? "score-leading" : "score-normal";
        scoreEl.innerHTML = `<span class="${hClass}">${h}</span><span class="score-sep-small">-</span><span class="${aClass}">${a}</span>`;
      } else {
        scoreEl.textContent = "vs";
      }
    }

    // 2. Cập nhật màu tên đội dẫn điểm
    var homeTeamEl = row.querySelector('.m-team.home');
    var awayTeamEl = row.querySelector('.m-team.away');
    if (homeTeamEl) homeTeamEl.classList.toggle('leading', h > a);
    if (awayTeamEl) awayTeamEl.classList.toggle('leading', a > h);

    // 3. Cập nhật trạng thái
    var statusEl = row.querySelector('.status-tag');
    if (statusEl) {
      var statusText = status === 'live' ? '🔴 LIVE' : ((status === 'finished' || status === 'completed') ? '✅ FIN' : '⏳');
      statusEl.className = 'status-tag ' + status;
      statusEl.textContent = statusText;
    }

    row.classList.remove('live', 'finished');
    if (status === 'live') row.classList.add('live');
    else if (status === 'finished' || status === 'completed') row.classList.add('finished');

    // 4. Cập nhật thông tin giao banh
    var serveInfoEl = row.querySelector('.match-serve-info');
    if (status === 'live' && m.serving_player_id) {
      var pName = getPlayerName(m.serving_player_id) || 'VĐV';
      var turn = m.serving_turn || 1;
      var newText = '🏓 ' + pName + ' đang giao (L' + turn + ')';
      if (!serveInfoEl) {
        var newDiv = document.createElement('div');
        newDiv.className = 'match-serve-info';
        newDiv.textContent = newText;
        row.appendChild(newDiv);
      } else {
        serveInfoEl.textContent = newText;
      }
    } else {
      if (serveInfoEl) serveInfoEl.remove();
    }
  });
}

/* === DATA LOADING === */
async function loadTournaments() {
  try {
    var tr = await sb.from("tournaments").select("*").order("created_at", {ascending:false});
    DATA.tournaments = tr.data || [];
    
    var er = await sb.from("events").select("id, tournament_id");
    var allEvents = er.data || [];
    
    var mr = await sb.from("matches").select("*");
    var allMatches = mr.data || [];
    
    DATA.tournaments.forEach(function(t) {
      var tEvents = allEvents.filter(function(e){ return e.tournament_id === t.id; });
      var eids = tEvents.map(function(e){ return e.id; });
      var tMatches = allMatches.filter(function(m){ return eids.indexOf(m.event_id) >= 0; });
      
      var hasLive = tMatches.some(function(m){ return m.match_status === 'live'; });
      var hasAnyScore = tMatches.some(function(m){ return (Number(m.home_score) > 0 || Number(m.away_score) > 0); });
      var ckMatch = tMatches.find(function(m){ return Number(m.round) === 4; });
      var ckFinished = ckMatch && (ckMatch.match_status === 'finished' || ckMatch.match_status === 'completed');
      
      if (!hasAnyScore) {
        t.display_status = "not_started";
      } else if (hasLive || !ckFinished) {
        t.display_status = "in_progress";
      } else {
        t.display_status = "completed";
      }
    });
  } catch(e) { console.error("Load tournaments error:", e); DATA.tournaments = []; }
}

async function loadTournamentDetail(tid) {
  try {
    DATA.tournament = DATA.tournaments.find(function(t){ return t.id===tid; });
    if (!DATA.tournament) return;
    var e = await sb.from("events").select("*").eq("tournament_id", tid);
    DATA.events = e.data || [];
    var sp = await sb.from('sponsors').select('*').eq('tournament_id', tid).order('display_order');
    DATA.sponsors = sp.data || [];
    if (DATA.events.length) await loadEventDetail(DATA.events[0].id);
    else { DATA.eid = null; DATA.teams = []; DATA.players = []; DATA.matches = []; render(); }
  } catch(e) { console.error("Load tournament detail error:", e); }
}

async function loadEventDetail(eid) {
  DATA.eid = eid || null;
  if (!DATA.eid) { render(); return; }
  try {
    var t = await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name))").eq("event_id", eid);
    DATA.teams = (t.data || []).map(function(x) {
      var m = x.team_members || [];
      return Object.assign({}, x, { members: m });
    });
    
    DATA.players = [];
    DATA.teams.forEach(function(tm) {
      tm.members.forEach(function(m) {
        if (m.players && !DATA.players.find(p => p.id === m.players.id)) {
          DATA.players.push(m.players);
        }
      });
    });

    var st = await sb.from("stages").select("*").eq("event_id", eid);
    DATA.stages = st.data || [];
    DATA.gStage = null; DATA.kStage = null;
    DATA.stages.forEach(function(s) { if(s.stage_type==="group_stage") DATA.gStage=s; if(s.stage_type==="knockout") DATA.kStage=s; });
    
    var ids = DATA.stages.map(function(s){ return s.id; });
    if (ids.length) {
      var g = await sb.from("groups").select("*").in("stage_id", ids); DATA.groups = g.data || [];
      var gt = await sb.from("group_teams").select("*").in("stage_id", ids); DATA.groupTeams = gt.data || [];
    } else { DATA.groups = []; DATA.groupTeams = []; }
    
    var m = await sb.from("matches").select("*").eq("event_id", eid).order("match_seq");
    DATA.matches = m.data || [];
    
    render();
    startRealtime();
  } catch(e) { console.error("Load event detail error:", e); }
}

/* === LOGIC === */
function teamsInG(gid) {
  var tids = DATA.groupTeams.filter(function(x){ return x.group_id===gid; }).map(function(x){ return x.team_id; });
  return DATA.teams.filter(function(t){ return tids.indexOf(t.id)>=0; });
}
function expectedMatchesInGroup(gid) {
  var t = teamsInG(gid);
  return t.length * (t.length - 1) / 2;
}
function isGroupComplete(gid) {
  var t = teamsInG(gid);
  var exp = t.length * (t.length - 1) / 2;
  return t.length >= 2 && DATA.matches.filter(function(m){ 
    var st = m.match_status || ((Number(m.home_score)>0||Number(m.away_score)>0)?"completed":"scheduled");
    return m.group_id===gid && (st==="completed" || st==="finished"); 
  }).length >= exp;
}
function standings(g) {
  var t = teamsInG(g);
  var st = {};
  t.forEach(function(x){ st[x.id] = {id:x.id, w:0, pf:0, pa:0, played:0}; });
  DATA.matches.filter(function(m){ 
    var status = m.match_status || ((Number(m.home_score)>0||Number(m.away_score)>0)?"completed":"scheduled");
    return m.group_id===g && (status==="completed" || status==="finished"); 
  }).forEach(function(m){
    var h = st[m.home_team_id], a = st[m.away_team_id];
    if (!h || !a) return;
    h.pf += Number(m.home_score)||0; h.pa += Number(m.away_score)||0; h.played++;
    a.pf += Number(m.away_score)||0; a.pa += Number(m.home_score)||0; a.played++;
    if (Number(m.home_score) > Number(m.away_score)) h.w++;
    else if (Number(m.away_score) > Number(m.home_score)) a.w++;
  });
  var arr = []; for (var k in st) arr.push(st[k]);
  return arr.sort(function(x,y){
    if (y.w !== x.w) return y.w - x.w;
    var dx = x.pf - x.pa, dy = y.pf - y.pa;
    if (dy !== dx) return dy - dx;
    return y.pf - x.pf;
  });
}
function displayCode(m) {
  if (!m) return "?";
  if (m.group_id) {
    var grp = DATA.groups.find(function(g){ return g.id===m.group_id; });
    if (grp) {
      var gm = DATA.matches.filter(function(x){ return x.group_id===m.group_id; }).sort(function(a,b){ return Number(a.bracket_slot)-Number(b.bracket_slot); });
      var idx = gm.findIndex(function(x){ return x.id===m.id; });
      return grp.code + (idx + 1);
    }
  }
  if (m.round===2) return "TK" + ((Number(m.bracket_slot)%10)||1);
  if (m.round===3) return "BK" + ((Number(m.bracket_slot)%10)||1);
  if (m.round===4) return "CK";
  if (m.round===1.5) return "V16-" + ((Number(m.bracket_slot)%20)||1);
  return String(m.match_code||"?");
}

function getQualifyCountForGroup(groupIndex, groupCode, numGroups) {
  if (numGroups === 3) {
    if (groupCode === "A" || groupIndex === 0) return 3;
    if (groupCode === "B" || groupIndex === 1) return 2;
    if (groupCode === "C" || groupIndex === 2) return 3;
  }
  if (numGroups === 2) return 2;
  if (numGroups === 4) return 2;
  return 2; 
}

      .sort(function(a,b){ return Number(a.bracket_slot) - Number(b.bracket_slot); });
    
    H += '<div class="group-card" style="margin-bottom:10px">';
    H += '<h4>📋 Bảng ' + g.code + ' <span class="badge">' + groupMatches.length + ' trận</span></h4>';
    
    if (groupMatches.length) {
      H += '<div class="match-list">';
      groupMatches.forEach(function(m) {
        H += renderMatchItem(m, false);
      });
      H += '</div>';
    } else {
      H += '<div style="color:var(--mu);font-size:11px;text-align:center;padding:8px">Chưa có lịch đấu</div>';
    }
    H += '</div>';
  });
  
  var km = DATA.matches.filter(function(m){ return !m.group_id; }).sort(function(a,b){ return Number(a.bracket_slot)-Number(b.bracket_slot); });
  if (km.length) {
    H += '<div class="ko-section"><h3>🔥 VÒNG LOẠI TRỰC TIẾP</h3>';
    var r16 = km.filter(function(m){ return Number(m.round)===1.5; });
    var tk = km.filter(function(m){ return Number(m.round)===2; });
    var bk = km.filter(function(m){ return Number(m.round)===3; });
    var ck = km.filter(function(m){ return Number(m.round)===4; });
    
    if (r16.length) H += renderKOGroup("🎯 VÒNG 1/8", "r16", r16);
    if (tk.length) H += renderKOGroup("🎯 TỨ KẾT", "tk", tk);
    if (bk.length) H += renderKOGroup("🏅 BÁN KẾT", "bk", bk);
    if (ck.length) H += renderKOGroup("🏆 CHUNG KẾT", "ck", ck);
    H += '</div>';
  }
  
  return H;
}

// 🌟 RENDER MATCH ITEM VỚI LOGIC MÀU SẮC DẪN ĐIỂM
function renderMatchItem(m, isKO) {
  var hn = tName(m.home_team_id), an = tName(m.away_team_id);
  var status = m.match_status || ((Number(m.home_score)>0 || Number(m.away_score)>0) ? "completed" : "scheduled");
  
  var h = Number(m.home_score)||0, a = Number(m.away_score)||0;
  var statusText = "⏳ Chưa đấu";
  var statusClass = "scheduled";
  if (status === 'live') {
    statusText = "🔴 LIVE";
    statusClass = "live";
  } else if (status === 'finished' || status === 'completed') {
    statusText = "✅ FIN";
    statusClass = "finished";
  }
  
  // Logic màu sắc: Đội nào dẫn điểm thì tên và tỷ số đội đó chuyển sang màu đỏ
  var homeLeadingClass = h > a ? "leading" : "";
  var awayLeadingClass = a > h ? "leading" : "";
  
  var scoreHtml = "vs";
  if (status === "completed" || status === "finished") {
    var hScoreClass = h > a ? "score-leading" : "score-normal";
    var aScoreClass = a > h ? "score-leading" : "score-normal";
    scoreHtml = `<span class="${hScoreClass}">${h}</span><span class="score-sep-small">-</span><span class="${aScoreClass}">${a}</span>`;
  }
  
  var H = '<div class="match-item ' + (isKO ? (Number(m.round)===4?'ck':'ko') : '') + '" data-match-id="' + m.id + '" onclick="openTimelineModal(\'' + m.id + '\')">';
  
  H += '<div class="match-main-row">';
  H += '<div class="m-code">' + esc(displayCode(m)) + '</div>';
  H += '<div class="m-team home ' + homeLeadingClass + '">' + esc(hn || 'TBD') + '</div>';
  H += '<div class="m-score">' + scoreHtml + '</div>';
  H += '<div class="m-team away ' + awayLeadingClass + '">' + esc(an || 'TBD') + '</div>';
  H += '<span class="status-tag ' + statusClass + '">' + statusText + '</span>';
  H += '<button class="timeline-btn" onclick="event.stopPropagation();openTimelineModal(\'' + m.id + '\')">📈</button>';
  H += '</div>';
  
  if (status === 'live' && m.serving_player_id) {
    var pName = getPlayerName(m.serving_player_id) || 'VĐV';
    var turn = m.serving_turn || 1;
    H += '<div class="match-serve-info">🏓 ' + esc(pName) + ' đang giao (L' + turn + ')</div>';
  }
  
  H += '</div>';
  return H;
}

function renderKOGroup(title, cls, matches) {
  var H = '<div class="ko-group"><div class="ko-group-header ' + cls + '">' + title + ' (' + matches.length + ')</div>';
  H += '<div class="match-list">';
  matches.forEach(function(m) {
    H += renderMatchItem(m, true);
  });
  H += '</div></div>';
  return H;
}

function render() {
  var H = '';
  if (DATA.tournament) {
    H += renderTournamentDetail();
  } else {
    H += renderTournamentList();
  }
  el("content").innerHTML = H;
}

/* === 🌟 TIMELINE MODAL FUNCTIONS === */
function openTimelineModal(matchId) {
  currentTimelineMatchId = matchId;
  var m = DATA.matches.find(x => x.id === matchId);
  if (!m) return;
  
  var hn = tName(m.home_team_id) || 'Team A';
  var an = tName(m.away_team_id) || 'Team B';
  var code = displayCode(m);
  
  el("timeline-title").textContent = code + ': ' + hn + ' vs ' + an;
  el("timeline-modal").classList.add("show");
  
  loadRallies(matchId);
}

function closeTimelineModal() {
  el("timeline-modal").classList.remove("show");
  currentTimelineMatchId = null;
  DATA.rallies = [];
}

/* === NAVIGATION === */
window.viewTournament = async function(tid) {
  stopRealtime();
  await loadTournamentDetail(tid);
  window.scrollTo(0, 0);
};
window.viewEvent = async function(eid) {
  stopRealtime();
  await loadEventDetail(eid);
  window.scrollTo(0, 0);
};
window.backToList = function() {
  stopRealtime();
  DATA.tournament = null;
  DATA.events = [];
  DATA.eid = null;
  DATA.teams = [];
  DATA.players = [];
  DATA.matches = [];
  DATA.groups = [];
  DATA.groupTeams = [];
  DATA.sponsors = [];
  DATA.rallies = [];
  render();
  window.scrollTo(0, 0);
};

/* === INIT === */
(async function init() {
  try {
    var u = sessionStorage.getItem('pb_admin');
    if (u) {
      try { CURRENT_USER = JSON.parse(u); } catch(e) { sessionStorage.removeItem('pb_admin'); }
    }
    applyUI();
    await loadTournaments();
    render();
  } catch(e) {
    el("content").innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>Lỗi tải dữ liệu: ' + esc(e.message) + '</p></div>';
  }
})();
</script>
