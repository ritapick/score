<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Trọng Tài - Pickleball Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#1a1a2e;--sf:#16213e;--sf2:#0f3460;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171;--pk:#e94560}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px;min-height:100vh}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(26,26,46,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand-row{display:flex;gap:8px;align-items:center}
.logo{color:var(--pk);font-weight:800;font-size:18px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.chip{color:#fff;font-size:11px;font-weight:800;background:var(--pk);padding:4px 10px;border-radius:99px}
.btn{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--pk);color:#fff}
.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
main{max-width:800px;margin:0 auto;padding:16px}
.section-title{font-size:16px;font-weight:800;color:var(--cy);margin:16px 0 12px;letter-spacing:.5px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select{flex:1;min-width:150px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px;color:var(--tx);font-size:13px}

/* Card trận đấu */
.match-card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.2s;position:relative}
.match-card:active{transform:scale(.98)}
.match-card:hover{border-color:var(--pk)}
.match-card.live{border-left:4px solid var(--rd);animation:pulse 2s infinite}
.match-card.finished{border-left:4px solid var(--li);opacity:.8}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.3)}50%{box-shadow:0 0 0 4px rgba(248,113,113,0)}}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.match-code{font-family:monospace;font-weight:800;color:var(--pk);font-size:14px}
.match-status{font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px}
.match-status.live{background:var(--rd);color:#fff}
.match-status.finished{background:var(--li);color:#0b1220}
.match-status.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
.match-info{font-size:11px;color:var(--mu);margin-bottom:8px}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.team-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-name.home{color:var(--li);text-align:right}
.team-name.away{color:var(--cy);text-align:left}
.match-score{font-family:monospace;font-weight:800;font-size:20px;color:var(--tx);text-align:center;min-width:60px}
.match-score.done{color:var(--li)}

/* Modal ghi điểm */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:500px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.modal-header h3{margin:0;color:var(--pk);font-size:18px}
.modal-close{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:0 8px}

/* Score display lớn */
.score-display{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:20px 0;padding:20px;background:var(--bg);border-radius:12px}
.score-team{text-align:center}
.score-team-name{font-size:14px;font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-team-name.home{color:var(--li)}
.score-team-name.away{color:var(--cy)}
.score-value{font-size:48px;font-weight:900;font-family:monospace;color:var(--tx)}
.score-sep{font-size:36px;font-weight:800;color:var(--mu)}
.score-controls{display:flex;gap:8px;justify-content:center;margin-top:12px}
.score-btn{width:50px;height:50px;border-radius:12px;border:2px solid var(--ln);background:var(--sf2);color:var(--tx);font-size:24px;font-weight:800;cursor:pointer;transition:.15s}
.score-btn:active{transform:scale(.9);background:var(--pk);border-color:var(--pk)}

/* Serve selection */
.serve-section{margin:16px 0;padding:16px;background:var(--bg);border-radius:12px}
.serve-title{font-size:12px;font-weight:800;color:var(--or);margin-bottom:12px;text-transform:uppercase}
.serve-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.serve-btn{padding:12px;border-radius:8px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
.serve-btn:active{transform:scale(.97)}
.serve-btn.active{background:var(--or);border-color:var(--or);color:#0b1220}

/* Action buttons */
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.modal-actions .btn{padding:14px;font-size:14px;justify-content:center}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:480px){
  main{padding:12px}
  .score-value{font-size:40px}
  .score-btn{width:45px;height:45px;font-size:20px}
  .modal-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row">
  <span class="logo">⚖️ Trọng Tài</span>
</div>
<div>
  <span id="user-chip" class="chip hidden"></span>
  <button id="login-btn" class="btn btn-p" onclick="openLogin()">🔐 Đăng nhập</button>
  <button id="logout-btn" class="btn btn-l hidden" onclick="doLogout()">Thoát</button>
</div>
</nav>
<main>
  <div class="filter-bar">
    <select id="tournament-filter" onchange="filterMatches()">
      <option value="">-- Chọn giải --</option>
    </select>
    <select id="event-filter" onchange="filterMatches()">
      <option value="">-- Chọn nội dung --</option>
    </select>
  </div>
  <div class="section-title">📋 Danh sách trận đấu</div>
  <div id="match-list">Đang tải...</div>
</main>

<!-- Modal đăng nhập -->
<div id="login-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3>🔐 Đăng nhập</h3>
    <button class="modal-close" onclick="closeLogin()">×</button>
  </div>
  <input id="lu" placeholder="Tên đăng nhập" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx)"/>
  <input id="lp" type="password" placeholder="Mật khẩu" style="width:100%;padding:10px;margin-bottom:16px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx)"/>
  <button class="btn btn-p" onclick="doLogin()" style="width:100%;padding:12px">Đăng nhập</button>
  <div id="lmsg" style="color:var(--rd);font-size:12px;margin-top:8px;text-align:center"></div>
</div>
</div>

<!-- Modal ghi điểm -->
<div id="score-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3 id="modal-match-code">Trận: --</h3>
    <button class="modal-close" onclick="closeScoreModal()">×</button>
  </div>
  
  <div class="match-info" id="modal-match-info"></div>
  
  <div class="score-display">
    <div class="score-team">
      <div class="score-team-name home" id="modal-home-name">Team A</div>
      <div class="score-value" id="modal-home-score">0</div>
      <div class="score-controls">
        <button class="score-btn" onclick="changeScore('home', -1)">−</button>
        <button class="score-btn" onclick="changeScore('home', 1)">+</button>
      </div>
    </div>
    <div class="score-sep">:</div>
    <div class="score-team">
      <div class="score-team-name away" id="modal-away-name">Team B</div>
      <div class="score-value" id="modal-away-score">0</div>
      <div class="score-controls">
        <button class="score-btn" onclick="changeScore('away', -1)">−</button>
        <button class="score-btn" onclick="changeScore('away', 1)">+</button>
      </div>
    </div>
  </div>
  
  <div class="serve-section">
    <div class="serve-title">🏓 Lượt giao banh</div>
    <div class="serve-options">
      <button class="serve-btn" id="serve-l1" onclick="setServeTurn(1)">L1 - Ô 1</button>
      <button class="serve-btn" id="serve-l2" onclick="setServeTurn(2)">L2 - Ô 2</button>
    </div>
  </div>
  
  <div class="modal-actions">
    <button class="btn btn-l" onclick="closeScoreModal()">✕ Đóng</button>
    <button class="btn btn-p" onclick="finishMatch()"> Kết thúc</button>
  </div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var CURRENT_USER = null;
var DATA = {
  tournaments: [], events: [], matches: [], teams: [], players: [], groups: [], stages: []
};
var currentMatchId = null;

/* === HELPERS === */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2000);
}
function isAdmin() { return CURRENT_USER && CURRENT_USER.username.toLowerCase() === 'admin'; }

/* === AUTH === */
function openLogin() { el("login-modal").classList.add("show"); }
function closeLogin() { el("login-modal").classList.remove("show"); }
async function doLogin() {
  var u = el("lu").value.trim().toLowerCase();
  var p = el("lp").value;
  if (!u || !p) { el("lmsg").textContent="Vui lòng nhập đầy đủ."; return; }
  try {
    var { data, error } = await sb.from('admin_users').select('*').eq('username', u).eq('password', p).maybeSingle();
    if (error) throw error;
    if (!data) { el("lmsg").textContent="❌ Sai thông tin!"; return; }
    CURRENT_USER = data;
    sessionStorage.setItem('pb_admin', JSON.stringify(CURRENT_USER));
    closeLogin(); applyUI(); await loadData();
    toast("✅ Xin chào " + CURRENT_USER.username);
  } catch(e) { el("lmsg").textContent="❌ " + e.message; }
}
function doLogout() {
  CURRENT_USER = null;
  sessionStorage.removeItem('pb_admin');
  applyUI();
  el("match-list").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)">Vui lòng đăng nhập</div>';
  toast("👋 Đã đăng xuất");
}
function applyUI() {
  var logged = !!CURRENT_USER;
  el("login-btn").classList.toggle("hidden", logged);
  el("logout-btn").classList.toggle("hidden", !logged);
  el("user-chip").classList.toggle("hidden", !logged);
  if (logged) {
    el("user-chip").textContent = "👤 " + CURRENT_USER.username;
  }
}

/* === DATA LOADING === */
async function loadData() {
  if (!CURRENT_USER) return;
  try {
    // Load tournaments (chỉ của admin hiện tại)
    var tr = await sb.from("tournaments").select("*").eq('admin_id', CURRENT_USER.id).order("created_at", {ascending:false});
    DATA.tournaments = tr.data || [];
    
    // Populate tournament filter
    var tSelect = el("tournament-filter");
    tSelect.innerHTML = '<option value="">-- Chọn giải --</option>';
    DATA.tournaments.forEach(t => {
      tSelect.innerHTML += `<option value="${t.id}">${esc(t.name)}</option>`;
    });
    
    await loadMatches();
  } catch(e) { console.error(e); }
}

async function loadMatches() {
  var tid = el("tournament-filter").value;
  var eid = el("event-filter").value;
  
  if (!tid) {
    el("match-list").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)">Chọn giải để xem trận</div>';
    return;
  }
  
  try {
    // Load events
    var ev = await sb.from("events").select("*").eq("tournament_id", tid);
    DATA.events = ev.data || [];
    
    var eSelect = el("event-filter");
    eSelect.innerHTML = '<option value="">-- Tất cả nội dung --</option>';
    DATA.events.forEach(e => {
      eSelect.innerHTML += `<option value="${e.id}" ${eid===e.id?'selected':''}>${esc(e.name)}</option>`;
    });
    
    // Load matches
    var query = sb.from("matches").select("*").eq("tournament_id", tid);
    if (eid) query = query.eq("event_id", eid);
    var m = await query.order("match_seq");
    DATA.matches = m.data || [];
    
    // Load teams & players
    var t = await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name))").in("event_id", DATA.events.map(e=>e.id));
    DATA.teams = t.data || [];
    DATA.players = [];
    DATA.teams.forEach(tm => {
      tm.members.forEach(m => {
        if (m.players && !DATA.players.find(p => p.id === m.players.id)) {
          DATA.players.push(m.players);
        }
      });
    });
    
    // Load groups for display
    var st = await sb.from("stages").select("*").in("event_id", DATA.events.map(e=>e.id));
    DATA.stages = st.data || [];
    var g = await sb.from("groups").select("*").in("stage_id", DATA.stages.map(s=>s.id));
    DATA.groups = g.data || [];
    
    renderMatchList();
  } catch(e) { console.error(e); }
}

function filterMatches() {
  el("event-filter").value = "";
  loadMatches();
}

function getTeamName(teamId) {
  var t = DATA.teams.find(x => x.id === teamId);
  return t ? t.name : 'TBD';
}

function getGroupName(match) {
  if (!match.group_id) {
    if (match.round === 2) return "Tứ kết";
    if (match.round === 3) return "Bán kết";
    if (match.round === 4) return "Chung kết";
    if (match.round === 1.5) return "Vòng 1/8";
    return "KO";
  }
  var g = DATA.groups.find(x => x.id === match.group_id);
  return g ? "Bảng " + g.code : "";
}

function renderMatchList() {
  if (!DATA.matches.length) {
    el("match-list").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)">Chưa có trận đấu</div>';
    return;
  }
  
  var H = '';
  DATA.matches.forEach(m => {
    var status = m.match_status || 'scheduled';
    var hn = getTeamName(m.home_team_id);
    var an = getTeamName(m.away_team_id);
    var h = Number(m.home_score)||0, a = Number(m.away_score)||0;
    var scoreText = (status === 'finished') ? (h + " - " + a) : "vs";
    var scoreClass = status === 'finished' ? 'done' : '';
    var group = getGroupName(m);
    
    H += `<div class="match-card ${status}" onclick="openScoreModal('${m.id}')">`;
    H += `<div class="match-header">`;
    H += `<div class="match-code">${esc(m.match_code||'')}</div>`;
    H += `<span class="match-status ${status}">${status==='live'?'🔴 LIVE':(status==='finished'?'✅ FIN':'')}</span>`;
    H += `</div>`;
    H += `<div class="match-info">📅 ${esc(group)}</div>`;
    H += `<div class="match-teams">`;
    H += `<div class="team-name home">${esc(hn)}</div>`;
    H += `<div class="match-score ${scoreClass}">${scoreText}</div>`;
    H += `<div class="team-name away">${esc(an)}</div>`;
    H += `</div>`;
    H += `</div>`;
  });
  
  el("match-list").innerHTML = H;
}

/* === SCORE MODAL === */
function openScoreModal(matchId) {
  currentMatchId = matchId;
  var m = DATA.matches.find(x => x.id === matchId);
  if (!m) return;
  
  var hn = getTeamName(m.home_team_id);
  var an = getTeamName(m.away_team_id);
  var group = getGroupName(m);
  
  el("modal-match-code").textContent = "🎯 " + (m.match_code||'');
  el("modal-match-info").textContent = group;
  el("modal-home-name").textContent = hn;
  el("modal-away-name").textContent = an;
  el("modal-home-score").textContent = m.home_score || 0;
  el("modal-away-score").textContent = m.away_score || 0;
  
  updateServeButtons(m.serving_turn || 1);
  
  el("score-modal").classList.add("show");
}

function closeScoreModal() {
  el("score-modal").classList.remove("show");
  currentMatchId = null;
}

function updateServeButtons(turn) {
  el("serve-l1").classList.toggle('active', turn === 1);
  el("serve-l2").classList.toggle('active', turn === 2);
}

async function changeScore(team, delta) {
  if (!currentMatchId) return;
  
  var m = DATA.matches.find(x => x.id === currentMatchId);
  if (!m) return;
  
  var h = parseInt(m.home_score) || 0;
  var a = parseInt(m.away_score) || 0;
  
  if (team === 'home') h = Math.max(0, h + delta);
  else a = Math.max(0, a + delta);
  
  el("modal-home-score").textContent = h;
  el("modal-away-score").textContent = a;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    m.home_score = h;
    m.away_score = a;
    m.match_status = 'live';
    
    // Auto create rally
    await createRally(h, a, m.serving_turn || 1, team === 'home' ? 'HOME_SCORE' : 'AWAY_SCORE');
    
    toast("✅ Đã lưu: " + h + " - " + a);
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

async function setServeTurn(turn) {
  if (!currentMatchId) return;
  
  var m = DATA.matches.find(x => x.id === currentMatchId);
  if (!m) return;
  
  updateServeButtons(turn);
  
  try {
    await sb.from("matches").update({
      serving_turn: turn,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    m.serving_turn = turn;
    m.match_status = 'live';
    
    await createRally(m.home_score || 0, m.away_score || 0, turn, 'SECOND_SERVER');
    
    toast("✅ Đã chuyển L" + turn);
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

async function createRally(homeScore, awayScore, serveTurn, eventType) {
  if (!currentMatchId || !CURRENT_USER) return;
  
  var m = DATA.matches.find(x => x.id === currentMatchId);
  if (!m) return;
  
  try {
    await sb.rpc('auto_create_rally', {
      p_match_id: currentMatchId,
      p_home_score: homeScore,
      p_away_score: awayScore,
      p_serve_turn: serveTurn,
      p_event_type: eventType,
      p_server_player_id: null,
      p_server_team: m.serving_team || null,
      p_server_slot: serveTurn,
      p_receiver_player_id: null,
      p_receiver_team: null,
      p_receiver_slot: null,
      p_home_position: m.home_position || '1-2',
      p_away_position: m.away_position || '1-2',
      p_created_by: CURRENT_USER.id
    });
  } catch(e) {
    console.error("Create rally error:", e);
  }
}

async function finishMatch() {
  if (!currentMatchId) return;
  
  var m = DATA.matches.find(x => x.id === currentMatchId);
  var h = parseInt(m.home_score) || 0;
  var a = parseInt(m.away_score) || 0;
  
  if (!confirm("🏁 Kết thúc trận?\n\nTỷ số: " + h + " - " + a)) return;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'finished'
    }).eq("id", currentMatchId);
    
    m.match_status = 'finished';
    
    closeScoreModal();
    toast("🏁 Đã kết thúc");
    renderMatchList();
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

/* === INIT === */
(async function init() {
  try {
    var u = sessionStorage.getItem('pb_admin');
    if (u) {
      try { CURRENT_USER = JSON.parse(u); } catch(e) { sessionStorage.removeItem('pb_admin'); }
    }
    applyUI();
    if (CURRENT_USER) await loadData();
    else el("match-list").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)">Vui lòng đăng nhập</div>';
  } catch(e) {
    el("match-list").innerHTML = '<div style="text-align:center;padding:40px;color:var(--rd)">❌ Lỗi: ' + esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
