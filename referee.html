<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Trọng Tài - Pickleball Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#1a1a2e;--sf:#16213e;--sf2:#0f3460;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171;--pk:#e94560}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(26,26,46,.98);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.brand-row{display:flex;gap:6px;align-items:center}
.logo{color:var(--pk);font-weight:800;font-size:14px;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.chip{color:#fff;font-size:10px;font-weight:800;background:var(--pk);padding:3px 8px;border-radius:99px}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:3px;transition:.15s}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--pk);color:#fff}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
main{max-width:600px;margin:0 auto;padding:8px}
.filter-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.filter-bar select{flex:1;min-width:0;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px;color:var(--tx);font-size:11px}
.filter-bar label{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mu);cursor:pointer;padding:4px 6px;background:var(--sf);border-radius:6px;border:1px solid var(--ln);white-space:nowrap}
.filter-bar input[type="checkbox"]{width:12px;height:12px;accent-color:var(--pk);margin:0}

.debug-box{background:rgba(248,113,113,.1);border:1px solid var(--rd);border-radius:6px;padding:6px;margin-bottom:8px;font-size:10px;color:var(--rd);font-family:monospace;max-height:100px;overflow-y:auto;white-space:pre-wrap}
.debug-box.ok{background:rgba(163,230,53,.1);border-color:var(--li);color:var(--li)}

.round-section{margin-bottom:10px}
.round-header{background:var(--sf2);padding:6px 10px;border-radius:6px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:11px}
.round-header.group{background:rgba(163,230,53,.1);color:var(--li)}
.round-header.r16,.round-header.tk{background:rgba(34,211,238,.1);color:var(--cy)}
.round-header.bk{background:rgba(251,146,60,.1);color:var(--or)}
.round-header.ck{background:rgba(163,230,53,.15);color:var(--li)}
.round-header .count{font-size:9px;opacity:.8}

.match-card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer;transition:.2s}
.match-card:active{transform:scale(.98)}
.match-card.live{border-left:3px solid var(--rd);animation:pulse 2s infinite}
.match-card.finished{border-left:3px solid var(--li);opacity:.85}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.3)}50%{box-shadow:0 0 0 3px rgba(248,113,113,0)}}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.match-code{font-family:monospace;font-weight:800;color:var(--pk);font-size:11px}
.match-status{font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px}
.match-status.live{background:var(--rd);color:#fff}
.match-status.finished{background:var(--li);color:#0b1220}
.match-status.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}
.team-name{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-name.home{color:var(--li);text-align:right}
.team-name.away{color:var(--cy);text-align:left}
.match-score{font-family:monospace;font-weight:800;font-size:16px;color:var(--tx);text-align:center;min-width:50px}
.match-score.done{color:var(--li)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:600px;background:var(--sf);border-top-left-radius:16px;border-top-right-radius:16px;padding:12px;max-height:92vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.modal-header h3{margin:0;color:var(--pk);font-size:15px}
.modal-close{background:none;border:none;color:var(--mu);font-size:22px;cursor:pointer;padding:0 6px}

/* Score */
.score-section{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:10px}
.score-display{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:8px}
.score-team{text-align:center}
.score-team-name{font-size:11px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-team-name.home{color:var(--li)}
.score-team-name.away{color:var(--cy)}
.score-value{font-size:36px;font-weight:900;font-family:monospace;color:var(--tx)}
.score-sep{font-size:28px;font-weight:800;color:var(--mu)}
.score-controls{display:flex;gap:6px;justify-content:center;margin-top:6px}
.score-btn{width:40px;height:40px;border-radius:10px;border:2px solid var(--ln);background:var(--sf2);color:var(--tx);font-size:20px;font-weight:800;cursor:pointer}
.score-btn:active{transform:scale(.9);background:var(--pk);border-color:var(--pk)}

/* 🌟 TEAM ROW - NGANG HÀNG */
.team-row{background:var(--bg);border-radius:10px;padding:8px;margin-bottom:8px}
.team-row-header{font-size:10px;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.team-row-header.home{color:var(--li)}
.team-row-header.away{color:var(--cy)}

.team-row-content{display:flex;gap:4px;align-items:center}
.player-select{flex:1;min-width:0;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:5px 4px;color:var(--tx);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-select:focus{outline:none;border-color:var(--pk)}
.player-select option{font-size:11px}

/*  TICK BUTTONS - 1 TICK / 2 TICKS */
.tick-btn{width:36px;height:36px;border-radius:8px;border:2px solid var(--ln);background:var(--sf);color:var(--mu);font-size:14px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:1px;flex-shrink:0;transition:.15s}
.tick-btn:active{transform:scale(.92)}
.tick-btn .tick{color:var(--rd);font-weight:900;line-height:1}
.tick-btn.active{background:var(--rd);border-color:var(--rd)}
.tick-btn.active .tick{color:#fff}

/* Rally info */
.rally-info{background:var(--bg);border-radius:8px;padding:8px;margin-bottom:10px;font-size:10px;color:var(--mu);line-height:1.4;border-left:3px solid var(--pk);white-space:pre-wrap}

.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.modal-actions .btn{padding:10px;font-size:12px;justify-content:center}

.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:8px 14px;border-radius:99px;font-weight:800;font-size:11px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

@media(max-width:380px){
  .score-value{font-size:30px}
  .score-btn{width:36px;height:36px;font-size:18px}
  .tick-btn{width:32px;height:32px;font-size:12px}
  .team-name{font-size:10px}
  .player-select{font-size:9px;padding:4px 3px}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row">
  <span class="logo">⚖️ Trọng Tài</span>
</div>
<div>
  <span id="user-chip" class="chip hidden"></span>
  <button id="login-btn" class="btn btn-p" onclick="openLogin()">🔐</button>
  <button id="logout-btn" class="btn btn-l hidden" onclick="doLogout()">Thoát</button>
</div>
</nav>
<main>
  <div id="debug-box" class="debug-box hidden"></div>
  
  <div class="filter-bar">
    <select id="tournament-filter" onchange="onTournamentChange()">
      <option value="">-- Chọn giải --</option>
    </select>
    <select id="event-filter" onchange="onEventChange()">
      <option value="">-- Chọn nội dung --</option>
    </select>
    <label>
      <input type="checkbox" id="my-tournaments-only" onchange="onFilterChange()" checked/>
      Của tôi
    </label>
  </div>
  
  <div id="matches-container">
    <div style="text-align:center;padding:30px;color:var(--mu)">
      <div style="font-size:36px;margin-bottom:6px">📋</div>
      <p style="font-size:12px">Đang tải...</p>
    </div>
  </div>
</main>

<!-- Modal đăng nhập -->
<div id="login-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3>🔐 Đăng nhập</h3>
    <button class="modal-close" onclick="closeLogin()">×</button>
  </div>
  <input id="lu" placeholder="Tên đăng nhập" style="width:100%;padding:8px;margin-bottom:8px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;color:var(--tx);font-size:12px"/>
  <input id="lp" type="password" placeholder="Mật khẩu" style="width:100%;padding:8px;margin-bottom:12px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;color:var(--tx);font-size:12px"/>
  <button class="btn btn-p" onclick="doLogin()" style="width:100%;padding:10px">Đăng nhập</button>
  <div id="lmsg" style="color:var(--rd);font-size:11px;margin-top:8px;text-align:center"></div>
</div>
</div>

<!-- Modal ghi điểm -->
<div id="score-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3 id="modal-match-code">Trận: --</h3>
    <button class="modal-close" onclick="closeScoreModal()">×</button>
  </div>
  
  <div class="score-section">
    <div class="score-display">
      <div class="score-team">
        <div class="score-team-name home" id="modal-home-name">Team A</div>
        <div class="score-value" id="modal-home-score">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="changeScore('home', -1)">−</button>
          <button class="score-btn" onclick="changeScore('home', 1)">+</button>
        </div>
      </div>
      <div class="score-sep">:</div>
      <div class="score-team">
        <div class="score-team-name away" id="modal-away-name">Team B</div>
        <div class="score-value" id="modal-away-score">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="changeScore('away', -1)">−</button>
          <button class="score-btn" onclick="changeScore('away', 1)">+</button>
        </div>
      </div>
    </div>
  </div>
  
  <!--  TEAM ROWS - NGANG HÀNG -->
  <div class="team-row">
    <div class="team-row-header home"> ĐỘI A</div>
    <div class="team-row-content">
      <select id="slot-home-1" class="player-select" onchange="onSlotChange('home',1)">
        <option value="">-- VĐV Ô 1 --</option>
      </select>
      <select id="slot-home-2" class="player-select" onchange="onSlotChange('home',2)">
        <option value="">-- VĐV Ô 2 --</option>
      </select>
      <button class="tick-btn" id="serve-home-l1" onclick="setServe('home',1)" title="Lượt 1">
        <span class="tick">✓</span>
      </button>
      <button class="tick-btn" id="serve-home-l2" onclick="setServe('home',2)" title="Lượt 2">
        <span class="tick">✓</span><span class="tick">✓</span>
      </button>
    </div>
  </div>
  
  <div class="team-row">
    <div class="team-row-header away">🔵 ĐỘI B</div>
    <div class="team-row-content">
      <select id="slot-away-1" class="player-select" onchange="onSlotChange('away',1)">
        <option value="">-- VĐV Ô 1 --</option>
      </select>
      <select id="slot-away-2" class="player-select" onchange="onSlotChange('away',2)">
        <option value="">-- VĐV Ô 2 --</option>
      </select>
      <button class="tick-btn" id="serve-away-l1" onclick="setServe('away',1)" title="Lượt 1">
        <span class="tick">✓</span>
      </button>
      <button class="tick-btn" id="serve-away-l2" onclick="setServe('away',2)" title="Lượt 2">
        <span class="tick">✓</span><span class="tick">✓</span>
      </button>
    </div>
  </div>
  
  <div id="rally-info" class="rally-info">Chưa có thông tin</div>
  
  <div class="modal-actions">
    <button class="btn btn-l" onclick="closeScoreModal()">✕ Đóng</button>
    <button class="btn btn-p" onclick="finishMatch()"> Kết thúc</button>
  </div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var CURRENT_USER = null;
var DATA = {
  tournaments: [], events: [], matches: [], teams: [], players: [], groups: [], stages: []
};
var currentMatchId = null;
var currentMatchData = null;
var realtimeInterval = null;

/* === HELPERS === */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2000);
}
function debug(msg, isOk) {
  var box = el("debug-box");
  box.textContent = msg;
  box.classList.toggle("hidden", !msg);
  box.classList.toggle("ok", isOk);
  console.log("[DEBUG]", msg);
}

/* === AUTH === */
function openLogin() { el("login-modal").classList.add("show"); el("lmsg").textContent=""; }
function closeLogin() { el("login-modal").classList.remove("show"); }
async function doLogin() {
  var u = el("lu").value.trim().toLowerCase();
  var p = el("lp").value;
  if (!u || !p) { el("lmsg").textContent="Vui lòng nhập đầy đủ."; return; }
  try {
    var { data, error } = await sb.from('admin_users').select('*').eq('username', u).eq('password', p).maybeSingle();
    if (error) throw error;
    if (!data) { el("lmsg").textContent="❌ Sai thông tin!"; return; }
    CURRENT_USER = data;
    sessionStorage.setItem('pb_admin', JSON.stringify(CURRENT_USER));
    closeLogin(); applyUI(); await loadData();
    toast("✅ Xin chào " + CURRENT_USER.username);
  } catch(e) { el("lmsg").textContent="❌ " + e.message; }
}
function doLogout() {
  CURRENT_USER = null;
  sessionStorage.removeItem('pb_admin');
  stopRealtime();
  applyUI();
  el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Vui lòng đăng nhập</p></div>';
  toast("👋 Đã đăng xuất");
}
function applyUI() {
  var logged = !!CURRENT_USER;
  el("login-btn").classList.toggle("hidden", logged);
  el("logout-btn").classList.toggle("hidden", !logged);
  el("user-chip").classList.toggle("hidden", !logged);
  if (logged) {
    el("user-chip").textContent = "👤 " + CURRENT_USER.username;
  }
}

/* === DATA LOADING === */
async function loadData() {
  if (!CURRENT_USER) return;
  
  debug("🔄 Đang tải... User: " + CURRENT_USER.username);
  
  try {
    var tr = await sb.from("tournaments").select("*").order("created_at", {ascending:false});
    if (tr.error) { debug("❌ Lỗi tournaments: " + tr.error.message); return; }
    
    DATA.tournaments = (tr.data || []).slice();
    var myTournaments = DATA.tournaments.filter(t => t && t.admin_id === CURRENT_USER.id);
    
    debug("✅ " + DATA.tournaments.length + " giải (" + myTournaments.length + " của bạn)", true);
    
    var tSelect = el("tournament-filter");
    tSelect.innerHTML = '<option value="">-- Chọn giải --</option>';
    
    if (DATA.tournaments.length > 0) {
      DATA.tournaments.forEach(function(t) {
        if (!t || !t.id) return;
        var isMine = t.admin_id === CURRENT_USER.id;
        var marker = isMine ? " ⭐" : "";
        tSelect.innerHTML += '<option value="' + t.id + '">' + esc(t.name || 'Unknown') + marker + '</option>';
      });
    }
    
    if (myTournaments.length === 1) {
      tSelect.value = myTournaments[0].id;
      await onTournamentChange();
    } else if (DATA.tournaments.length === 1) {
      tSelect.value = DATA.tournaments[0].id;
      await onTournamentChange();
    } else if (DATA.tournaments.length === 0) {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Chưa có giải nào</p></div>';
    }
    
    startRealtime();
  } catch(e) { 
    debug("❌ Lỗi: " + e.message);
    console.error(e); 
  }
}

async function onTournamentChange() {
  var tid = el("tournament-filter").value;
  if (!tid) {
    el("event-filter").innerHTML = '<option value="">-- Chọn nội dung --</option>';
    el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Chọn giải</p></div>';
    return;
  }
  
  try {
    var ev = await sb.from("events").select("*").eq("tournament_id", tid);
    if (ev.error) { debug("❌ Lỗi events: " + ev.error.message); return; }
    
    DATA.events = (ev.data || []).slice();
    
    var eSelect = el("event-filter");
    eSelect.innerHTML = '<option value="">-- Chọn nội dung --</option>';
    
    if (DATA.events.length > 0) {
      DATA.events.forEach(function(e) {
        if (!e || !e.id) return;
        eSelect.innerHTML += '<option value="' + e.id + '">' + esc(e.name || 'Unknown') + '</option>';
      });
    }
    
    if (DATA.events.length === 1) {
      eSelect.value = DATA.events[0].id;
      await loadMatches();
    } else if (DATA.events.length > 1) {
      await loadMatches();
    } else {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Chưa có nội dung</p></div>';
    }
  } catch(e) {
    debug("❌ Lỗi: " + e.message);
  }
}

async function onEventChange() { await loadMatches(); }

function onFilterChange() {
  var showOnlyMine = el("my-tournaments-only").checked;
  var tSelect = el("tournament-filter");
  var currentValue = tSelect.value;
  
  tSelect.innerHTML = '<option value="">-- Chọn giải --</option>';
  
  if (DATA.tournaments.length > 0) {
    DATA.tournaments.forEach(function(t) {
      if (!t || !t.id) return;
      var isMine = t.admin_id === CURRENT_USER.id;
      if (showOnlyMine && !isMine) return;
      var marker = isMine ? " ⭐" : "";
      tSelect.innerHTML += '<option value="' + t.id + '">' + esc(t.name || 'Unknown') + marker + '</option>';
    });
  }
  
  tSelect.value = currentValue;
  if (currentValue) onTournamentChange();
}

async function loadMatches() {
  var tid = el("tournament-filter").value;
  var eid = el("event-filter").value;
  
  if (!tid) {
    el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Chọn giải</p></div>';
    return;
  }
  
  try {
    var query = sb.from("matches").select("*").eq("tournament_id", tid);
    if (eid) query = query.eq("event_id", eid);
    var m = await query.order("match_seq");
    
    if (m.error) { debug("❌ Lỗi matches: " + m.error.message); return; }
    
    DATA.matches = (m.data || []).slice();
    debug("✅ " + DATA.matches.length + " trận", true);
    
    if (DATA.matches.length === 0) {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Chưa có trận</p></div>';
      return;
    }
    
    var allEventIds = DATA.events.map(function(e) { return e ? e.id : null; }).filter(function(id) { return id !== null; });
    
    if (allEventIds.length > 0) {
      var t = await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name))").in("event_id", allEventIds);
      DATA.teams = t.error ? [] : (t.data || []).slice();
      
      DATA.players = [];
      if (DATA.teams.length > 0) {
        DATA.teams.forEach(function(tm) {
          if (!tm || !tm.members) return;
          tm.members.forEach(function(m) {
            if (m && m.players && m.players.id) {
              var exists = DATA.players.some(function(p) { return p && p.id === m.players.id; });
              if (!exists) DATA.players.push(m.players);
            }
          });
        });
      }
      
      var st = await sb.from("stages").select("*").in("event_id", allEventIds);
      DATA.stages = st.error ? [] : (st.data || []).slice();
      
      if (DATA.stages.length > 0) {
        var stageIds = DATA.stages.map(function(s) { return s ? s.id : null; }).filter(function(id) { return id !== null; });
        if (stageIds.length > 0) {
          var g = await sb.from("groups").select("*").in("stage_id", stageIds);
          DATA.groups = g.error ? [] : (g.data || []).slice();
        } else { DATA.groups = []; }
      } else { DATA.groups = []; }
    } else {
      DATA.teams = []; DATA.players = []; DATA.stages = []; DATA.groups = [];
    }
    
    renderMatchesByRound();
  } catch(e) {
    debug("❌ Lỗi: " + e.message);
  }
}

function getTeamName(teamId) {
  if (!teamId) return 'TBD';
  var t = DATA.teams.find(function(x) { return x && x.id === teamId; });
  return t ? (t.name || 'TBD') : 'TBD';
}

function getTeamPlayers(teamId) {
  if (!teamId) return [];
  var team = DATA.teams.find(function(x) { return x && x.id === teamId; });
  if (!team || !team.members) return [];
  
  return team.members
    .filter(function(m) { return m && m.player_id; })
    .map(function(m) {
      return {
        id: m.player_id,
        name: (m.players && m.players.full_name) ? m.players.full_name : 'VĐV',
        position: m.position || 1
      };
    });
}

function getRoundInfo(match) {
  if (!match) return { type: 'other', name: 'Khác', class: '' };
  if (match.group_id) {
    var g = DATA.groups.find(function(x) { return x && x.id === match.group_id; });
    return { type: 'group', name: 'Bảng ' + (g ? (g.code || '?') : '?'), class: 'group' };
  }
  if (match.round === 1.5) return { type: 'r16', name: 'Vòng 1/8', class: 'r16' };
  if (match.round === 2) return { type: 'tk', name: 'Tứ kết', class: 'tk' };
  if (match.round === 3) return { type: 'bk', name: 'Bán kết', class: 'bk' };
  if (match.round === 4) return { type: 'ck', name: 'Chung kết', class: 'ck' };
  return { type: 'other', name: 'Khác', class: '' };
}

function renderMatchesByRound() {
  if (!DATA.matches || DATA.matches.length === 0) {
    el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Chưa có trận</p></div>';
    return;
  }
  
  var rounds = { 'group': [], 'r16': [], 'tk': [], 'bk': [], 'ck': [], 'other': [] };
  
  DATA.matches.forEach(function(m) {
    if (!m) return;
    var round = getRoundInfo(m);
    if (rounds[round.type]) rounds[round.type].push(m);
    else rounds['other'].push(m);
  });
  
  var H = '';
  var roundOrder = ['group', 'r16', 'tk', 'bk', 'ck', 'other'];
  var roundTitles = {
    'group': '📋 Vòng bảng', 'r16': '🎯 Vòng 1/8', 'tk': ' Tứ kết',
    'bk': ' Bán kết', 'ck': '🏆 Chung kết', 'other': 'Khác'
  };
  
  var hasAny = false;
  roundOrder.forEach(function(roundType) {
    if (rounds[roundType] && rounds[roundType].length > 0) {
      hasAny = true;
      var roundInfo = getRoundInfo(rounds[roundType][0]);
      H += '<div class="round-section">';
      H += '<div class="round-header ' + roundInfo.class + '"><span>' + roundTitles[roundType] + '</span><span class="count">' + rounds[roundType].length + ' trận</span></div>';
      
      rounds[roundType].forEach(function(m) { H += renderMatchCard(m); });
      H += '</div>';
    }
  });
  
  if (!hasAny) H = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Không có trận</p></div>';
  el("matches-container").innerHTML = H;
}

function renderMatchCard(m) {
  if (!m) return '';
  var status = m.match_status || 'scheduled';
  var hn = getTeamName(m.home_team_id);
  var an = getTeamName(m.away_team_id);
  var h = Number(m.home_score)||0, a = Number(m.away_score)||0;
  var scoreText = (status === 'finished' || status === 'completed') ? (h + " - " + a) : "vs";
  var scoreClass = (status === 'finished' || status === 'completed') ? 'done' : '';
  
  var H = '<div class="match-card ' + status + '" onclick="openScoreModal(\'' + m.id + '\')">';
  H += '<div class="match-header">';
  H += '<div class="match-code">' + esc(m.match_code||'') + '</div>';
  H += '<span class="match-status ' + status + '">' + (status==='live'?' LIVE':(status==='finished'?'✅ FIN':'')) + '</span>';
  H += '</div>';
  H += '<div class="match-teams">';
  H += '<div class="team-name home">' + esc(hn) + '</div>';
  H += '<div class="match-score ' + scoreClass + '">' + scoreText + '</div>';
  H += '<div class="team-name away">' + esc(an) + '</div>';
  H += '</div></div>';
  return H;
}

/* === SCORE MODAL === */
async function openScoreModal(matchId) {
  currentMatchId = matchId;
  currentMatchData = DATA.matches.find(function(x) { return x && x.id === matchId; });
  if (!currentMatchData) { toast("❌ Không tìm thấy trận"); return; }
  
  var hn = getTeamName(currentMatchData.home_team_id);
  var an = getTeamName(currentMatchData.away_team_id);
  
  el("modal-match-code").textContent = "🎯 " + (currentMatchData.match_code||'');
  el("modal-home-name").textContent = hn;
  el("modal-away-name").textContent = an;
  el("modal-home-score").textContent = currentMatchData.home_score || 0;
  el("modal-away-score").textContent = currentMatchData.away_score || 0;
  
  // Populate player slots với chú thích ô
  var homePlayers = getTeamPlayers(currentMatchData.home_team_id);
  var awayPlayers = getTeamPlayers(currentMatchData.away_team_id);
  
  populateSlotSelect('slot-home-1', homePlayers, 1);
  populateSlotSelect('slot-home-2', homePlayers, 2);
  populateSlotSelect('slot-away-1', awayPlayers, 1);
  populateSlotSelect('slot-away-2', awayPlayers, 2);
  
  // Restore current slots
  if (currentMatchData.home_player_slot1) el("slot-home-1").value = currentMatchData.home_player_slot1;
  if (currentMatchData.home_player_slot2) el("slot-home-2").value = currentMatchData.home_player_slot2;
  if (currentMatchData.away_player_slot1) el("slot-away-1").value = currentMatchData.away_player_slot1;
  if (currentMatchData.away_player_slot2) el("slot-away-2").value = currentMatchData.away_player_slot2;
  
  // 🌟 Update serve buttons - KHÔNG tự nhảy, chỉ hiển thị trạng thái hiện tại
  updateServeButtons();
  updateRallyInfo();
  
  el("score-modal").classList.add("show");
}

function populateSlotSelect(selectId, players, position) {
  var sel = el(selectId);
  sel.innerHTML = '<option value="">-- VĐV Ô ' + position + ' --</option>';
  
  if (players && players.length > 0) {
    players.forEach(function(p) {
      if (!p || !p.id) return;
      // 🌟 Hiển thị tên + chú thích ô
      var label = p.name + ' (Ô ' + (p.position || position) + ')';
      sel.innerHTML += '<option value="' + p.id + '">' + esc(label) + '</option>';
    });
  }
}

// 🌟 Update serve buttons - chỉ highlight, KHÔNG thay đổi giá trị
function updateServeButtons() {
  if (!currentMatchData) return;
  var serveTeam = currentMatchData.serving_team || 'home';
  var serveTurn = currentMatchData.serving_turn || 1;
  
  // Chỉ highlight button đang active, không thay đổi giá trị
  el("serve-home-l1").classList.toggle('active', serveTeam === 'home' && serveTurn === 1);
  el("serve-home-l2").classList.toggle('active', serveTeam === 'home' && serveTurn === 2);
  el("serve-away-l1").classList.toggle('active', serveTeam === 'away' && serveTurn === 1);
  el("serve-away-l2").classList.toggle('active', serveTeam === 'away' && serveTurn === 2);
}

function updateRallyInfo() {
  if (!currentMatchData) return;
  var h = currentMatchData.home_score || 0;
  var a = currentMatchData.away_score || 0;
  var serveTeam = currentMatchData.serving_team || 'home';
  var serveTurn = currentMatchData.serving_turn || 1;
  
  var serveTeamName = serveTeam === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
  var receiveTeamName = serveTeam === 'home' ? el("modal-away-name").textContent : el("modal-home-name").textContent;
  
  var info = '📊 Tỷ số: ' + h + ' - ' + a + '\n';
  info += '🏓 ' + serveTeamName + ' đang giao (L' + serveTurn + ')\n';
  info += '👈 ' + receiveTeamName + ' đang nhận giao banh';
  
  el("rally-info").textContent = info;
}

function closeScoreModal() {
  el("score-modal").classList.remove("show");
  currentMatchId = null;
  currentMatchData = null;
}

async function onSlotChange(team, slotNum) {
  if (!currentMatchId) return;
  
  var slot1 = el("slot-" + team + "-1").value;
  var slot2 = el("slot-" + team + "-2").value;
  
  if (slot1 && slot2 && slot1 === slot2) {
    toast("⚠️ 2 VĐV phải khác nhau!");
    el("slot-" + team + "-" + slotNum).value = "";
    return;
  }
  
  var update = {};
  update[team + '_player_slot1'] = el("slot-" + team + "-1").value || null;
  update[team + '_player_slot2'] = el("slot-" + team + "-2").value || null;
  
  try {
    await sb.from("matches").update(update).eq("id", currentMatchId);
    Object.assign(currentMatchData, update);
    toast("✅ Đã cập nhật VĐV");
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

// 🌟 Khi bấm tick: CỐ ĐỊNH nút được bấm, không tự nhảy
async function setServe(team, turn) {
  if (!currentMatchId) return;
  
  try {
    await sb.from("matches").update({
      serving_team: team,
      serving_turn: turn,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    currentMatchData.serving_team = team;
    currentMatchData.serving_turn = turn;
    currentMatchData.match_status = 'live';
    
    // 🌟 Chỉ update UI, không tự reset
    updateServeButtons();
    updateRallyInfo();
    
    // 🌟 Tạo rally entry
    await createRally('SERVE_CHANGE');
    
    var teamName = team === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
    toast("✅ " + teamName + " giao L" + turn);
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

async function changeScore(team, delta) {
  if (!currentMatchId) return;
  
  var h = parseInt(currentMatchData.home_score) || 0;
  var a = parseInt(currentMatchData.away_score) || 0;
  
  if (team === 'home') h = Math.max(0, h + delta);
  else a = Math.max(0, a + delta);
  
  el("modal-home-score").textContent = h;
  el("modal-away-score").textContent = a;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    currentMatchData.home_score = h;
    currentMatchData.away_score = a;
    currentMatchData.match_status = 'live';
    
    // 🌟 Tạo rally entry
    var eventType = team === 'home' ? 'HOME_SCORE' : 'AWAY_SCORE';
    await createRally(eventType);
    
    updateRallyInfo();
    toast("✅ " + h + " - " + a);
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

// 🌟 TẠO RALLY - FALLBACK INSERT TRỰC TIẾP NẾU RPC LỖI
async function createRally(eventType) {
  if (!currentMatchId || !CURRENT_USER) return;
  
  var m = currentMatchData;
  var serveTeam = m.serving_team || 'home';
  var serveTurn = m.serving_turn || 1;
  
  // Get server/receiver info
  var serverPlayerId = serveTeam === 'home' ? 
    (serveTurn === 1 ? m.home_player_slot1 : m.home_player_slot2) :
    (serveTurn === 1 ? m.away_player_slot1 : m.away_player_slot2);
  
  var receiverPlayerId = serveTeam === 'home' ?
    (serveTurn === 1 ? m.away_player_slot1 : m.away_player_slot2) :
    (serveTurn === 1 ? m.home_player_slot1 : m.home_player_slot2);
  
  // Generate description đơn giản
  var serverName = serverPlayerId ? (DATA.players.find(p => p.id === serverPlayerId)?.full_name || 'VĐV') : 'VĐV';
  var receiverName = receiverPlayerId ? (DATA.players.find(p => p.id === receiverPlayerId)?.full_name || 'VĐV') : 'VĐV';
  var serverTeamName = serveTeam === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
  var receiverTeamName = serveTeam === 'home' ? el("modal-away-name").textContent : el("modal-home-name").textContent;
  
  var description = serverTeamName + ' đang giao banh (L' + serveTurn + ': ' + serverName + '), ' + 
                    receiverTeamName + ' đang nhận giao banh (' + receiverName + ')';
  
  var rallyData = {
    match_id: currentMatchId,
    event_type: eventType,
    home_score: m.home_score || 0,
    away_score: m.away_score || 0,
    serve_turn: serveTurn,
    server_player_id: serverPlayerId || null,
    server_team: serveTeam,
    server_slot: serveTurn,
    receiver_player_id: receiverPlayerId || null,
    receiver_team: serveTeam === 'home' ? 'away' : 'home',
    receiver_slot: serveTurn,
    home_position: m.home_position || '1-2',
    away_position: m.away_position || '1-2',
    description: description,
    created_by: CURRENT_USER.id
  };
  
  try {
    // 🌟 Thử RPC trước
    var { error: rpcError } = await sb.rpc('auto_create_rally', {
      p_match_id: currentMatchId,
      p_home_score: rallyData.home_score,
      p_away_score: rallyData.away_score,
      p_serve_turn: rallyData.serve_turn,
      p_event_type: rallyData.event_type,
      p_server_player_id: rallyData.server_player_id,
      p_server_team: rallyData.server_team,
      p_server_slot: rallyData.server_slot,
      p_receiver_player_id: rallyData.receiver_player_id,
      p_receiver_team: rallyData.receiver_team,
      p_receiver_slot: rallyData.receiver_slot,
      p_home_position: rallyData.home_position,
      p_away_position: rallyData.away_position,
      p_created_by: CURRENT_USER.id
    });
    
    if (rpcError) {
      console.warn("RPC failed, fallback to INSERT:", rpcError.message);
      // 🌟 Fallback: INSERT trực tiếp
      var { error: insertError } = await sb.from("match_rallies").insert(rallyData);
      if (insertError) {
        console.error("Insert rally failed:", insertError.message);
        debug("️ Không lưu được rally: " + insertError.message);
      }
    }
  } catch(e) {
    console.error("Create rally error:", e);
    //  Fallback cuối cùng
    try {
      await sb.from("match_rallies").insert(rallyData);
    } catch(e2) {
      console.error("Fallback insert failed:", e2);
    }
  }
}

async function finishMatch() {
  if (!currentMatchId) return;
  
  var h = parseInt(currentMatchData.home_score) || 0;
  var a = parseInt(currentMatchData.away_score) || 0;
  
  if (!confirm("🏁 Kết thúc trận?\n\nTỷ số: " + h + " - " + a)) return;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'finished'
    }).eq("id", currentMatchId);
    
    currentMatchData.match_status = 'finished';
    closeScoreModal();
    toast("🏁 Đã kết thúc");
    await loadMatches();
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

/* === REALTIME === */
function startRealtime() {
  stopRealtime();
  realtimeInterval = setInterval(async function() {
    var tid = el("tournament-filter").value;
    if (!tid) return;
    
    try {
      var query = sb.from("matches").select("*").eq("tournament_id", tid);
      var eid = el("event-filter").value;
      if (eid) query = query.eq("event_id", eid);
      var m = await query.order("match_seq");
      
      if (m.data) {
        var changed = false;
        for (var i = 0; i < m.data.length; i++) {
          var old = DATA.matches.find(function(x) { return x && x.id === m.data[i].id; });
          if (!old || old.home_score !== m.data[i].home_score || 
              old.away_score !== m.data[i].away_score ||
              old.match_status !== m.data[i].match_status) {
            changed = true; break;
          }
        }
        if (changed) {
          DATA.matches = (m.data || []).slice();
          renderMatchesByRound();
          
          if (currentMatchId) {
            var cm = DATA.matches.find(function(x) { return x && x.id === currentMatchId; });
            if (cm) {
              currentMatchData = cm;
              el("modal-home-score").textContent = cm.home_score || 0;
              el("modal-away-score").textContent = cm.away_score || 0;
              updateServeButtons();
              updateRallyInfo();
            }
          }
        }
      }
    } catch(e) { console.warn("Realtime error:", e); }
  }, 3000);
}

function stopRealtime() {
  if (realtimeInterval) { clearInterval(realtimeInterval); realtimeInterval = null; }
}

/* === INIT === */
(async function init() {
  try {
    var u = sessionStorage.getItem('pb_admin');
    if (u) {
      try { CURRENT_USER = JSON.parse(u); } catch(e) { sessionStorage.removeItem('pb_admin'); }
    }
    applyUI();
    if (CURRENT_USER) {
      await loadData();
    } else {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px;color:var(--mu)"><p>Vui lòng đăng nhập</p></div>';
    }
  } catch(e) {
    debug("❌ Init: " + e.message);
  }
})();
</script>
</body>
