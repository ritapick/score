<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Trọng Tài - Pickleball Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#1a1a2e;--sf:#16213e;--sf2:#0f3460;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171;--pk:#e94560}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit}
.hidden{display:none!important}

.topnav{position:sticky;top:0;z-index:50;background:rgba(26,26,46,.98);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.brand-row{display:flex;gap:6px;align-items:center}
.logo{color:var(--pk);font-weight:800;font-size:14px;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.chip{color:#fff;font-size:10px;font-weight:800;background:var(--pk);padding:3px 8px;border-radius:99px}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:3px;transition:.15s}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--pk);color:#fff}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
.btn-w{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
main{max-width:100%;margin:0 auto;padding:8px;padding-bottom:40px}

.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-bar select{flex:1;min-width:0;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;color:var(--tx);font-size:12px}

.debug-box{background:rgba(248,113,113,.1);border:1px solid var(--rd);border-radius:6px;padding:8px;margin-bottom:10px;font-size:10px;color:var(--rd);font-family:monospace;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.debug-box.ok{background:rgba(163,230,53,.1);border-color:var(--li);color:var(--li)}

.group-section{margin-bottom:14px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.group-header{padding:8px 10px;font-weight:800;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.group-header.group-a{background:rgba(163,230,53,.15);color:var(--li)}
.group-header.group-b{background:rgba(34,211,238,.15);color:var(--cy)}
.group-header.group-c{background:rgba(251,146,60,.15);color:var(--or)}
.group-header.group-d{background:rgba(248,113,113,.15);color:var(--rd)}
.group-header.ko-header{background:rgba(148,163,184,.15);color:var(--mu)}
.group-header .count{font-size:10px;opacity:.8}

.match-card{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px;margin:6px 8px;cursor:pointer;transition:.2s}
.match-card:active{transform:scale(.98)}
.match-card.live{border-left:3px solid var(--rd)}
.match-card.finished{border-left:3px solid var(--li);opacity:.85}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.match-code{font-family:monospace;font-weight:800;color:var(--pk);font-size:11px}
.match-status{font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px}
.match-status.live{background:var(--rd);color:#fff}
.match-status.finished{background:var(--li);color:#0b1220}
.match-status.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.team-name{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-name.home{color:var(--li);text-align:right}
.team-name.away{color:var(--cy);text-align:left}
.match-score{font-family:monospace;font-weight:800;font-size:16px;color:var(--tx);text-align:center;min-width:50px}
.match-score.done{color:var(--li)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:8px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:480px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;max-height:95vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.modal-header h3{margin:0;color:var(--pk);font-size:14px}
.modal-close{background:none;border:none;color:var(--mu);font-size:22px;cursor:pointer;padding:0 6px}

.score-top-bar{background:var(--sf2);border-radius:8px;padding:12px;margin-bottom:10px;text-align:center}
.score-top-display{display:flex;justify-content:center;align-items:center;gap:8px;font-size:28px;font-weight:900;font-family:monospace}
.score-top-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.score-top-label{font-size:9px;color:var(--mu);text-transform:uppercase}
.score-top-value{color:var(--tx)}
.score-top-value.server{color:var(--rd)}
.score-top-sep{color:var(--mu);font-weight:800}

.score-section{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:10px}
.score-display{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.score-team{text-align:center}
.score-team-name{font-size:11px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-team-name.home{color:var(--li)}
.score-team-name.away{color:var(--cy)}
.score-value{font-size:36px;font-weight:900;font-family:monospace;color:var(--tx);line-height:1}
.score-sep{font-size:28px;font-weight:800;color:var(--mu)}
.score-controls{display:flex;gap:6px;justify-content:center;margin-top:6px}
.score-btn{width:40px;height:40px;border-radius:8px;border:2px solid var(--ln);background:var(--sf2);color:var(--tx);font-size:20px;font-weight:800;cursor:pointer;transition:.15s}
.score-btn:active{transform:scale(.9);background:var(--pk);border-color:var(--pk)}

.slots-section{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:10px}
.slots-title{font-size:11px;font-weight:800;color:var(--mu);margin-bottom:8px;text-transform:uppercase;text-align:center}
.slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot-group{background:var(--sf2);border-radius:6px;padding:8px}
.slot-group-title{font-size:10px;font-weight:800;margin-bottom:6px;text-align:center}
.slot-group.home .slot-group-title{color:var(--li)}
.slot-group.away .slot-group-title{color:var(--cy)}

.player-select-wrap{margin-bottom:6px}
.player-select-wrap label{display:block;font-size:9px;color:var(--mu);margin-bottom:2px;font-weight:700;text-transform:uppercase}
.slot-select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:5px;padding:5px 6px;color:var(--tx);font-size:11px;font-weight:600}
.slot-select option.opt-slot1{color:var(--li)}
.slot-select option.opt-slot2{color:var(--cy)}

.serve-buttons{display:flex;gap:4px;margin-top:6px}
.serve-btn{flex:1;padding:6px 4px;border-radius:5px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);font-size:16px;font-weight:800;cursor:pointer;transition:.15s;text-align:center;line-height:1}
.serve-btn:active{transform:scale(.95)}
.serve-btn.active{background:var(--rd);border-color:var(--rd);color:#fff;box-shadow:0 0 8px rgba(248,113,113,.4)}
.serve-btn .tick{display:inline-block;color:var(--rd);font-weight:900}
.serve-btn.active .tick{color:#fff}

.modal-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.modal-actions .btn{padding:10px;font-size:12px;justify-content:center}

.timeout-display{font-size:56px;font-weight:900;font-family:monospace;color:var(--or);text-align:center;margin:20px 0;letter-spacing:2px}
.timeout-display.running{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.timeout-controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px}

.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:8px 14px;border-radius:99px;font-weight:800;font-size:11px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

.login-input{width:100%;padding:8px;margin-bottom:8px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;color:var(--tx);font-size:13px}

@media(max-width:380px){
  .logo{font-size:12px}
  .btn{padding:5px 8px;font-size:10px}
  .filter-bar select{padding:5px 6px;font-size:11px}
  .match-card{padding:6px;margin:4px 6px}
  .match-code{font-size:10px}
  .team-name{font-size:10px}
  .match-score{font-size:14px;min-width:44px}
  .match-status{font-size:8px;padding:2px 4px}
  .score-value{font-size:30px}
  .score-btn{width:36px;height:36px;font-size:18px}
  .slots-grid{gap:6px}
  .slot-group{padding:6px}
  .serve-btn{font-size:14px;padding:5px 3px}
  .modal{padding:10px}
  .modal-header h3{font-size:13px}
  .score-top-display{font-size:24px}
  .timeout-display{font-size:48px}
}

@media(min-width:381px) and (max-width:480px){
  .modal{max-width:420px}
}

@media(min-width:481px){
  main{max-width:600px;padding:12px}
  .modal{max-width:500px;padding:14px}
  .score-value{font-size:40px}
  .score-btn{width:44px;height:44px;font-size:22px}
  .score-top-display{font-size:32px}
  .timeout-display{font-size:64px}
}

@media(max-height:500px) and (orientation:landscape){
  .modal{max-height:95vh}
  .score-value{font-size:28px}
  .score-btn{width:34px;height:34px;font-size:16px}
  .slots-section{padding:8px}
  .modal-actions{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .score-top-display{font-size:24px}
  .timeout-display{font-size:48px}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row">
  <span class="logo">⚖️ Trọng Tài</span>
</div>
<div>
  <span id="user-chip" class="chip hidden"></span>
  <button id="login-btn" class="btn btn-p" onclick="openLogin()">🔐 Đăng nhập</button>
  <button id="logout-btn" class="btn btn-l hidden" onclick="doLogout()">Thoát</button>
</div>
</nav>
<main>
  <div id="debug-box" class="debug-box hidden"></div>
  
  <div class="filter-bar">
    <select id="tournament-filter" onchange="onTournamentChange()">
      <option value="">-- Chọn giải --</option>
    </select>
    <select id="event-filter" onchange="onEventChange()">
      <option value="">-- Chọn nội dung --</option>
    </select>
  </div>
  
  <div id="matches-container">
    <div style="text-align:center;padding:30px 10px;color:var(--mu)">
      <div style="font-size:36px;margin-bottom:6px">📋</div>
      <p style="font-size:12px;margin:0">Đang tải...</p>
    </div>
  </div>
</main>

<div id="login-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3>🔐 Đăng nhập</h3>
    <button class="modal-close" onclick="closeLogin()">×</button>
  </div>
  <input id="lu" class="login-input" placeholder="Tên đăng nhập"/>
  <input id="lp" class="login-input" type="password" placeholder="Mật khẩu"/>
  <button class="btn btn-p" onclick="doLogin()" style="width:100%;padding:10px;margin-top:4px">Đăng nhập</button>
  <div id="lmsg" style="color:var(--rd);font-size:11px;margin-top:8px;text-align:center"></div>
</div>
</div>

<div id="score-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3 id="modal-match-code">Trận: --</h3>
    <button class="modal-close" onclick="closeScoreModal()">×</button>
  </div>
  
  <div class="score-top-bar">
    <div class="score-top-display">
      <div class="score-top-item">
        <div class="score-top-label" id="top-server-name">Đội A</div>
        <div class="score-top-value server" id="top-server-score">0</div>
      </div>
      <span class="score-top-sep">-</span>
      <div class="score-top-item">
        <div class="score-top-label" id="top-receiver-name">Đội B</div>
        <div class="score-top-value" id="top-receiver-score">0</div>
      </div>
      <span class="score-top-sep">-</span>
      <div class="score-top-item">
        <div class="score-top-label">Lượt</div>
        <div class="score-top-value" id="top-serve-turn">1</div>
      </div>
    </div>
  </div>
  
  <div class="score-section">
    <div class="score-display">
      <div class="score-team">
        <div class="score-team-name home" id="modal-home-name">Team A</div>
        <div class="score-value" id="modal-home-score">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="changeScore('home', -1)">−</button>
          <button class="score-btn" onclick="changeScore('home', 1)">+</button>
        </div>
      </div>
      <div class="score-sep">:</div>
      <div class="score-team">
        <div class="score-team-name away" id="modal-away-name">Team B</div>
        <div class="score-value" id="modal-away-score">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="changeScore('away', -1)">−</button>
          <button class="score-btn" onclick="changeScore('away', 1)">+</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="slots-section">
    <div class="slots-title">👥 Chọn VĐV & Lượt giao</div>
    <div class="slots-grid">
      <div class="slot-group home">
        <div class="slot-group-title">ĐỘI A</div>
        <div class="player-select-wrap">
          <label>🎯 Ô 1</label>
          <select id="slot-home-1" class="slot-select" onchange="onSlotChange('home',1)">
            <option value="">-- Chọn --</option>
          </select>
        </div>
        <div class="player-select-wrap">
          <label>🎯 Ô 2</label>
          <select id="slot-home-2" class="slot-select" onchange="onSlotChange('home',2)">
            <option value="">-- Chọn --</option>
          </select>
        </div>
        <div class="serve-buttons">
          <button class="serve-btn" id="serve-home-l1" onclick="setServe('home',1)" title="Lượt 1">
            <span class="tick">✓</span>
          </button>
          <button class="serve-btn" id="serve-home-l2" onclick="setServe('home',2)" title="Lượt 2">
            <span class="tick">✓✓</span>
          </button>
        </div>
      </div>
      
      <div class="slot-group away">
        <div class="slot-group-title">ĐỘI B</div>
        <div class="player-select-wrap">
          <label>🎯 Ô 1</label>
          <select id="slot-away-1" class="slot-select" onchange="onSlotChange('away',1)">
            <option value="">-- Chọn --</option>
          </select>
        </div>
        <div class="player-select-wrap">
          <label>🎯 Ô 2</label>
          <select id="slot-away-2" class="slot-select" onchange="onSlotChange('away',2)">
            <option value="">-- Chọn --</option>
          </select>
        </div>
        <div class="serve-buttons">
          <button class="serve-btn" id="serve-away-l1" onclick="setServe('away',1)" title="Lượt 1">
            <span class="tick">✓</span>
          </button>
          <button class="serve-btn" id="serve-away-l2" onclick="setServe('away',2)" title="Lượt 2">
            <span class="tick">✓✓</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-actions">
    <button class="btn btn-l" onclick="closeScoreModal()">✕ Đóng</button>
    <button class="btn btn-w" onclick="openTimeoutModal()">⏱ Timeout</button>
    <button class="btn btn-p" onclick="finishMatch()">🏁 Kết thúc</button>
  </div>
</div>
</div>

<div id="timeout-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3>⏱ TIMEOUT</h3>
    <button class="modal-close" onclick="closeTimeoutModal()">×</button>
  </div>
  <div class="timeout-display" id="timeout-display">00:00</div>
  <div class="timeout-controls">
    <button class="btn btn-p" id="timeout-toggle-btn" onclick="toggleTimeout()" style="min-width:120px">▶ Bắt đầu</button>
  </div>
  <div class="modal-actions" style="margin-top:0">
    <button class="btn btn-l" onclick="closeTimeoutModal()">✕ Đóng</button>
    <button class="btn btn-l" onclick="resetTimeout()">↺ Reset</button>
  </div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var CURRENT_USER = null;
var DATA = {
  tournaments: [], events: [], matches: [], teams: [], players: [], groups: [], stages: []
};
var currentMatchId = null;
var currentMatchData = null;
var realtimeInterval = null;
var lastRallyKey = null;
var localServeState = { team: 'home', turn: 1 };

var timeoutElapsed = 0;
var timeoutInterval = null;
var timeoutRunning = false;

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2500);
}
function debug(msg, isOk) {
  var box = el("debug-box");
  box.textContent = msg;
  box.classList.toggle("hidden", !msg);
  box.classList.toggle("ok", isOk);
  console.log("[DEBUG]", msg);
}
function logRally(msg) {
  console.log("[RALLY]", msg);
  debug("🏓 " + msg, true);
}

function openLogin() { el("login-modal").classList.add("show"); el("lmsg").textContent=""; }
function closeLogin() { el("login-modal").classList.remove("show"); }
async function doLogin() {
  var u = el("lu").value.trim().toLowerCase();
  var p = el("lp").value;
  if (!u || !p) { el("lmsg").textContent="Vui lòng nhập đầy đủ."; return; }
  try {
    var { data, error } = await sb.from('admin_users').select('*').eq('username', u).eq('password', p).maybeSingle();
    if (error) throw error;
    if (!data) { el("lmsg").textContent="❌ Sai thông tin!"; return; }
    CURRENT_USER = data;
    sessionStorage.setItem('pb_admin', JSON.stringify(CURRENT_USER));
    closeLogin(); applyUI(); await loadData();
    toast("✅ Xin chào " + CURRENT_USER.username);
  } catch(e) { el("lmsg").textContent="❌ " + e.message; }
}
function doLogout() {
  CURRENT_USER = null;
  sessionStorage.removeItem('pb_admin');
  stopRealtime();
  applyUI();
  el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><p>Vui lòng đăng nhập</p></div>';
  toast("👋 Đã đăng xuất");
}
function applyUI() {
  var logged = !!CURRENT_USER;
  el("login-btn").classList.toggle("hidden", logged);
  el("logout-btn").classList.toggle("hidden", !logged);
  el("user-chip").classList.toggle("hidden", !logged);
  if (logged) el("user-chip").textContent = "👤 " + CURRENT_USER.username;
}

async function loadData() {
  if (!CURRENT_USER) return;
  debug("🔄 Đang tải...\nUser: " + CURRENT_USER.username + "\nID: " + CURRENT_USER.id);
  
  try {
    var tr = await sb.from("tournaments").select("*").eq('admin_id', CURRENT_USER.id).order("created_at", {ascending:false});
    if (tr.error) { debug("❌ Lỗi tournaments: " + tr.error.message); return; }
    
    DATA.tournaments = (tr.data || []).slice();
    debug("✅ " + DATA.tournaments.length + " giải của bạn", true);
    
    var tSelect = el("tournament-filter");
    tSelect.innerHTML = '<option value="">-- Chọn giải --</option>';
    
    if (DATA.tournaments && DATA.tournaments.length > 0) {
      DATA.tournaments.forEach(function(t) {
        if (!t || !t.id) return;
        tSelect.innerHTML += '<option value="' + t.id + '">' + esc(t.name || 'Unknown') + '</option>';
      });
    }
    
    if (DATA.tournaments.length === 1) {
      tSelect.value = DATA.tournaments[0].id;
      await onTournamentChange();
    } else if (DATA.tournaments.length === 0) {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><div style="font-size:36px;margin-bottom:6px">📭</div><p style="font-size:12px;margin:0">Bạn chưa tạo giải đấu nào</p></div>';
    }
    
    startRealtime();
  } catch(e) { debug("❌ Lỗi: " + e.message); console.error(e); }
}

async function onTournamentChange() {
  var tid = el("tournament-filter").value;
  if (!tid) {
    el("event-filter").innerHTML = '<option value="">-- Chọn nội dung --</option>';
    el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><p style="font-size:12px;margin:0">Chọn giải</p></div>';
    return;
  }
  try {
    debug("🔄 Loading events: " + tid);
    var ev = await sb.from("events").select("*").eq("tournament_id", tid);
    if (ev.error) { debug("❌ Lỗi events: " + ev.error.message); return; }
    
    DATA.events = (ev.data || []).slice();
    debug("✅ " + DATA.events.length + " events", true);
    
    var eSelect = el("event-filter");
    eSelect.innerHTML = '<option value="">-- Chọn nội dung --</option>';
    
    if (DATA.events && DATA.events.length > 0) {
      DATA.events.forEach(function(e) {
        if (!e || !e.id) return;
        eSelect.innerHTML += '<option value="' + e.id + '">' + esc(e.name || 'Unknown') + '</option>';
      });
    }
    
    if (DATA.events.length === 1) {
      eSelect.value = DATA.events[0].id;
      await loadMatches();
    } else if (DATA.events.length > 1) {
      await loadMatches();
    } else {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><p style="font-size:12px;margin:0">Chưa có nội dung</p></div>';
    }
  } catch(e) { debug("❌ Lỗi: " + e.message); }
}

async function onEventChange() { await loadMatches(); }

async function loadMatches() {
  var tid = el("tournament-filter").value;
  var eid = el("event-filter").value;
  
  if (!tid) {
    el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><p style="font-size:12px;margin:0">Chọn giải</p></div>';
    return;
  }
  
  try {
    debug("🔄 Loading matches: " + tid + (eid ? ", event: " + eid : ""));
    
    var query = sb.from("matches").select("*").eq("tournament_id", tid);
    if (eid) query = query.eq("event_id", eid);
    var m = await query.order("match_seq");
    
    if (m.error) { debug("❌ Lỗi matches: " + m.error.message); return; }
    
    DATA.matches = (m.data || []).slice();
    debug("✅ " + DATA.matches.length + " matches", true);
    
    if (DATA.matches.length === 0) {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><div style="font-size:36px;margin-bottom:6px">📭</div><p style="font-size:12px;margin:0">Chưa có trận</p></div>';
      return;
    }
    
    var allEventIds = DATA.events.map(function(e) { return e ? e.id : null; }).filter(function(id) { return id !== null; });
    
    if (allEventIds.length > 0) {
      var t = await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name))").in("event_id", allEventIds);
      
      if (t.error) {
        debug("⚠️ Lỗi teams: " + t.error.message);
        DATA.teams = [];
      } else {
        DATA.teams = (t.data || []).slice();
        debug("✅ Loaded " + DATA.teams.length + " teams", true);
      }
      
      DATA.players = [];
      if (DATA.teams && DATA.teams.length > 0) {
        DATA.teams.forEach(function(tm) {
          if (!tm) return;
          var members = tm.team_members || [];
          members.forEach(function(m) {
            if (m && m.players && m.players.id) {
              var exists = DATA.players.some(function(p) { return p && p.id === m.players.id; });
              if (!exists) DATA.players.push(m.players);
            }
          });
        });
      }
      debug("✅ " + DATA.players.length + " players", true);
      
      var st = await sb.from("stages").select("*").in("event_id", allEventIds);
      DATA.stages = (st.data || []).slice();
      
      if (DATA.stages.length > 0) {
        var stageIds = DATA.stages.map(function(s) { return s ? s.id : null; }).filter(function(id) { return id !== null; });
        if (stageIds.length > 0) {
          var g = await sb.from("groups").select("*").in("stage_id", stageIds);
          DATA.groups = (g.data || []).slice();
        } else { DATA.groups = []; }
      } else { DATA.groups = []; }
      
      debug("✅ " + DATA.stages.length + " stages, " + DATA.groups.length + " groups", true);
    } else {
      DATA.teams = [];
      DATA.players = [];
      DATA.stages = [];
      DATA.groups = [];
    }
    
    renderMatchesByRound();
  } catch(e) { debug("❌ Lỗi: " + e.message); console.error(e); }
}

function getTeamName(teamId) {
  if (!teamId) return 'TBD';
  var t = DATA.teams.find(function(x) { return x && x.id === teamId; });
  return t ? (t.name || 'TBD') : 'TBD';
}

function getTeamPlayers(teamId) {
  if (!teamId) return [];
  var team = DATA.teams.find(function(x) { return x && x.id === teamId; });
  if (!team) return [];
  
  var members = team.team_members || [];
  var result = [];
  
  members.forEach(function(m) {
    if (!m || !m.player_id) return;
    
    var playerName = 'VĐV';
    if (m.players && m.players.full_name) {
      playerName = m.players.full_name;
    } else {
      var p = DATA.players.find(function(x) { return x && x.id === m.player_id; });
      if (p && p.full_name) playerName = p.full_name;
    }
    
    result.push({
      id: m.player_id,
      name: playerName,
      position: m.position || 0
    });
  });
  
  return result;
}

function getRoundInfo(match) {
  if (!match) return { type: 'other', name: 'Khác', class: '' };
  if (match.group_id) {
    var g = DATA.groups.find(function(x) { return x && x.id === match.group_id; });
    return { type: 'group', name: 'Bảng ' + (g ? (g.code || '?') : '?'), class: 'group', groupCode: g ? g.code : '?' };
  }
  if (match.round === 1.5) return { type: 'r16', name: '🎯 Vòng 1/8', class: 'ko-header' };
  if (match.round === 2) return { type: 'tk', name: '🎯 Tứ kết', class: 'ko-header' };
  if (match.round === 3) return { type: 'bk', name: '🏅 Bán kết', class: 'ko-header' };
  if (match.round === 4) return { type: 'ck', name: '🏆 Chung kết', class: 'ko-header' };
  return { type: 'other', name: 'Khác', class: 'ko-header' };
}

// 🌟 HÀM HIỂN THỊ MÃ TRẬN ĐẤU GIỐNG INDEX.HTML
function displayCode(m) {
  if (!m) return "?";
  if (m.group_id) {
    var grp = DATA.groups.find(function(g){ return g && g.id===m.group_id; });
    if (grp) {
      var gm = DATA.matches.filter(function(x){ return x.group_id===m.group_id; }).sort(function(a,b){ return Number(a.bracket_slot)-Number(b.bracket_slot); });
      var idx = gm.findIndex(function(x){ return x.id===m.id; });
      return grp.code + (idx + 1);
    }
  }
  if (m.round===2) return "TK" + ((Number(m.bracket_slot)%10)||1);
  if (m.round===3) return "BK" + ((Number(m.bracket_slot)%10)||1);
  if (m.round===4) return "CK";
  if (m.round===1.5) return "V16-" + ((Number(m.bracket_slot)%20)||1);
  return String(m.match_code||"?");
}

function renderMatchesByRound() {
  if (!DATA.matches || DATA.matches.length === 0) {
    el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><div style="font-size:36px;margin-bottom:6px">📭</div><p style="font-size:12px;margin:0">Chưa có trận</p></div>';
    return;
  }
  
  var groupMatches = {};
  var koMatches = { 'r16': [], 'tk': [], 'bk': [], 'ck': [], 'other': [] };
  
  DATA.matches.forEach(function(m) {
    if (!m) return;
    var round = getRoundInfo(m);
    
    if (round.type === 'group' && round.groupCode) {
      if (!groupMatches[round.groupCode]) groupMatches[round.groupCode] = [];
      groupMatches[round.groupCode].push(m);
    } else {
      if (koMatches[round.type]) koMatches[round.type].push(m);
      else koMatches['other'].push(m);
    }
  });
  
  var H = '';
  
  var groupCodes = Object.keys(groupMatches).sort();
  var groupColors = { 'A': 'group-a', 'B': 'group-b', 'C': 'group-c', 'D': 'group-d' };
  
  groupCodes.forEach(function(code) {
    var matches = groupMatches[code];
    if (!matches || matches.length === 0) return;
    
    var colorClass = groupColors[code] || 'group-a';
    
    H += '<div class="group-section">';
    H += '<div class="group-header ' + colorClass + '"><span>📋 Bảng ' + code + '</span><span class="count">' + matches.length + ' trận</span></div>';
    
    matches.forEach(function(m) {
      H += renderMatchCard(m);
    });
    
    H += '</div>';
  });
  
  var koOrder = ['r16', 'tk', 'bk', 'ck', 'other'];
  var koTitles = {
    'r16': '🎯 Vòng 1/8',
    'tk': '🎯 Tứ kết',
    'bk': '🏅 Bán kết',
    'ck': '🏆 Chung kết',
    'other': 'Khác'
  };
  
  koOrder.forEach(function(type) {
    if (koMatches[type] && koMatches[type].length > 0) {
      H += '<div class="group-section">';
      H += '<div class="group-header ko-header"><span>' + koTitles[type] + '</span><span class="count">' + koMatches[type].length + ' trận</span></div>';
      koMatches[type].forEach(function(m) {
        H += renderMatchCard(m);
      });
      H += '</div>';
    }
  });
  
  el("matches-container").innerHTML = H;
}

function renderMatchCard(m) {
  if (!m) return '';
  var status = m.match_status || 'scheduled';
  var hn = getTeamName(m.home_team_id);
  var an = getTeamName(m.away_team_id);
  var h = Number(m.home_score)||0, a = Number(m.away_score)||0;
  var scoreText = (status === 'finished' || status === 'completed') ? (h + " - " + a) : "vs";
  var scoreClass = (status === 'finished' || status === 'completed') ? 'done' : '';
  
  // 🌟 Sử dụng displayCode để hiển thị mã trận đấu đẹp (A1, TK1, CK...)
  var matchCode = displayCode(m);
  
  var H = '<div class="match-card ' + status + '" onclick="openScoreModal(\'' + m.id + '\')">';
  H += '<div class="match-header">';
  H += '<div class="match-code">' + esc(matchCode) + '</div>';
  H += '<span class="match-status ' + status + '">' + (status==='live'?'🔴 LIVE':(status==='finished'?'✅ FIN':'⏳')) + '</span>';
  H += '</div>';
  H += '<div class="match-teams">';
  H += '<div class="team-name home">' + esc(hn) + '</div>';
  H += '<div class="match-score ' + scoreClass + '">' + scoreText + '</div>';
  H += '<div class="team-name away">' + esc(an) + '</div>';
  H += '</div>';
  H += '</div>';
  return H;
}

async function openScoreModal(matchId) {
  currentMatchId = matchId;
  currentMatchData = DATA.matches.find(function(x) { return x && x.id === matchId; });
  if (!currentMatchData) { toast("❌ Không tìm thấy trận"); return; }
  
  var hn = getTeamName(currentMatchData.home_team_id);
  var an = getTeamName(currentMatchData.away_team_id);
  
  // 🌟 Hiển thị mã trận đấu đẹp trong modal
  el("modal-match-code").textContent = "🎯 " + displayCode(currentMatchData);
  el("modal-home-name").textContent = hn;
  el("modal-away-name").textContent = an;
  el("modal-home-score").textContent = currentMatchData.home_score || 0;
  el("modal-away-score").textContent = currentMatchData.away_score || 0;
  
  var homePlayers = getTeamPlayers(currentMatchData.home_team_id);
  var awayPlayers = getTeamPlayers(currentMatchData.away_team_id);
  
  populateSlotSelect('slot-home-1', homePlayers, 1);
  populateSlotSelect('slot-home-2', homePlayers, 2);
  populateSlotSelect('slot-away-1', awayPlayers, 1);
  populateSlotSelect('slot-away-2', awayPlayers, 2);
  
  if (currentMatchData.home_player_slot1) el("slot-home-1").value = currentMatchData.home_player_slot1;
  if (currentMatchData.home_player_slot2) el("slot-home-2").value = currentMatchData.home_player_slot2;
  if (currentMatchData.away_player_slot1) el("slot-away-1").value = currentMatchData.away_player_slot1;
  if (currentMatchData.away_player_slot2) el("slot-away-2").value = currentMatchData.away_player_slot2;
  
  localServeState.team = currentMatchData.serving_team || 'home';
  localServeState.turn = currentMatchData.serving_turn || 1;
  
  updateServeButtons();
  updateTopScoreDisplay();
  
  el("score-modal").classList.add("show");
}

function populateSlotSelect(selectId, players, position) {
  var sel = el(selectId);
  sel.innerHTML = '<option value="">-- Chọn --</option>';
  
  if (players && players.length > 0) {
    players.forEach(function(p) {
      if (!p || !p.id) return;
      var slotLabel = position === 1 ? '(Ô 1)' : '(Ô 2)';
      var optClass = position === 1 ? 'opt-slot1' : 'opt-slot2';
      sel.innerHTML += '<option class="' + optClass + '" value="' + p.id + '">' + esc(p.name || 'VĐV') + ' ' + slotLabel + '</option>';
    });
  }
}

function updateServeButtons() {
  var serveTeam = localServeState.team;
  var serveTurn = localServeState.turn;
  
  el("serve-home-l1").classList.toggle('active', serveTeam === 'home' && serveTurn === 1);
  el("serve-home-l2").classList.toggle('active', serveTeam === 'home' && serveTurn === 2);
  el("serve-away-l1").classList.toggle('active', serveTeam === 'away' && serveTurn === 1);
  el("serve-away-l2").classList.toggle('active', serveTeam === 'away' && serveTurn === 2);
}

function updateTopScoreDisplay() {
  if (!currentMatchData) return;
  var h = currentMatchData.home_score || 0;
  var a = currentMatchData.away_score || 0;
  
  var serveTeam = localServeState.team;
  var serveTurn = localServeState.turn;
  
  var hn = el("modal-home-name").textContent;
  var an = el("modal-away-name").textContent;
  
  var serverName, receiverName, serverScore, receiverScore;
  
  if (serveTeam === 'home') {
    serverName = hn;
    receiverName = an;
    serverScore = h;
    receiverScore = a;
  } else {
    serverName = an;
    receiverName = hn;
    serverScore = a;
    receiverScore = h;
  }
  
  el("top-server-name").textContent = serverName;
  el("top-receiver-name").textContent = receiverName;
  el("top-server-score").textContent = serverScore;
  el("top-receiver-score").textContent = receiverScore;
  el("top-serve-turn").textContent = serveTurn;
}

function closeScoreModal() {
  el("score-modal").classList.remove("show");
  currentMatchId = null;
  currentMatchData = null;
  lastRallyKey = null;
}

async function onSlotChange(team, slotNum) {
  if (!currentMatchId) return;
  
  var slot1 = el("slot-" + team + "-1").value;
  var slot2 = el("slot-" + team + "-2").value;
  
  if (slot1 && slot2 && slot1 === slot2) {
    alert("⚠️ 2 VĐV phải khác nhau!");
    el("slot-" + team + "-" + slotNum).value = "";
    return;
  }
  
  var update = {};
  update[team + '_player_slot1'] = el("slot-" + team + "-1").value || null;
  update[team + '_player_slot2'] = el("slot-" + team + "-2").value || null;
  
  try {
    await sb.from("matches").update(update).eq("id", currentMatchId);
    Object.assign(currentMatchData, update);
    toast("✅ Đã cập nhật VĐV");
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

async function setServe(team, turn) {
  if (!currentMatchId) return;
  
  if (localServeState.team === team && localServeState.turn === turn) {
    return;
  }
  
  localServeState.team = team;
  localServeState.turn = turn;
  
  try {
    await sb.from("matches").update({
      serving_team: team,
      serving_turn: turn,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    currentMatchData.serving_team = team;
    currentMatchData.serving_turn = turn;
    currentMatchData.match_status = 'live';
    
    updateServeButtons();
    updateTopScoreDisplay();
    
    await createRally('SERVE_CHANGE');
    
    var teamName = team === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
    toast("✅ " + teamName + " giao L" + turn);
  } catch(e) { 
    toast("❌ Lỗi: " + e.message);
    localServeState.team = currentMatchData.serving_team || 'home';
    localServeState.turn = currentMatchData.serving_turn || 1;
    updateServeButtons();
  }
}

async function changeScore(team, delta) {
  if (!currentMatchId) return;
  
  var h = parseInt(currentMatchData.home_score) || 0;
  var a = parseInt(currentMatchData.away_score) || 0;
  
  if (team === 'home') h = Math.max(0, h + delta);
  else a = Math.max(0, a + delta);
  
  el("modal-home-score").textContent = h;
  el("modal-away-score").textContent = a;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    currentMatchData.home_score = h;
    currentMatchData.away_score = a;
    currentMatchData.match_status = 'live';
    
    var eventType = team === 'home' ? 'HOME_SCORE' : 'AWAY_SCORE';
    await createRally(eventType);
    
    updateTopScoreDisplay();
    toast("✅ " + h + " - " + a);
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

async function createRally(eventType) {
  if (!currentMatchId || !CURRENT_USER || !currentMatchData) {
    console.warn("Cannot create rally: missing data");
    return;
  }
  
  var m = currentMatchData;
  var serveTeam = localServeState.team;
  var serveTurn = localServeState.turn;
  
  var rallyKey = m.id + '|' + (m.home_score||0) + '|' + (m.away_score||0) + '|' + serveTurn + '|' + eventType;
  if (lastRallyKey === rallyKey) {
    console.log("Skip duplicate rally:", rallyKey);
    return;
  }
  lastRallyKey = rallyKey;
  
  var serverSlot = serveTurn;
  var receiverSlot = serveTurn;
  
  var serverPlayerId = serveTeam === 'home' ? 
    (serveTurn === 1 ? m.home_player_slot1 : m.home_player_slot2) :
    (serveTurn === 1 ? m.away_player_slot1 : m.away_player_slot2);
  
  var receiverPlayerId = serveTeam === 'home' ?
    (serveTurn === 1 ? m.away_player_slot1 : m.away_player_slot2) :
    (serveTurn === 1 ? m.home_player_slot1 : m.home_player_slot2);
  
  var serverName = serverPlayerId ? (DATA.players.find(p => p.id === serverPlayerId)?.full_name || 'VĐV') : 'VĐV';
  var receiverName = receiverPlayerId ? (DATA.players.find(p => p.id === receiverPlayerId)?.full_name || 'VĐV') : 'VĐV';
  var serverTeamName = serveTeam === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
  var receiverTeamName = serveTeam === 'home' ? el("modal-away-name").textContent : el("modal-home-name").textContent;
  
  var description = serverName + ' (đội: ' + serverTeamName + ') giao từ Ô ' + serverSlot + ' → ' + receiverName + ' (đội: ' + receiverTeamName + ') đỡ ở Ô ' + receiverSlot + ' - Lượt Giao ' + serveTurn;
  
  logRally("Creating: " + eventType + " - " + description);
  
  await insertRallyDirect({
    match_id: currentMatchId,
    home_score: m.home_score || 0,
    away_score: m.away_score || 0,
    serve_turn: serveTurn,
    event_type: eventType,
    server_player_id: serverPlayerId || null,
    server_team: serveTeam,
    server_slot: serverSlot,
    receiver_player_id: receiverPlayerId || null,
    receiver_team: serveTeam === 'home' ? 'away' : 'home',
    receiver_slot: receiverSlot,
    home_position: m.home_position || '1-2',
    away_position: m.away_position || '1-2',
    description: description,
    created_by: CURRENT_USER.id
  });
}

async function insertRallyDirect(rallyData) {
  try {
    console.log("[RALLY] Inserting:", rallyData);
    debug("🔄 Đang ghi rally: " + rallyData.event_type);
    
    var { data: lastRally, error: countError } = await sb
      .from("match_rallies")
      .select("rally_number")
      .eq("match_id", rallyData.match_id)
      .order("rally_number", {ascending: false})
      .limit(1)
      .maybeSingle();
    
    if (countError) {
      console.error("[RALLY] Count error:", countError);
      debug("❌ Lỗi đếm rally: " + countError.message);
    }
    
    var nextRallyNumber = (lastRally && lastRally.rally_number ? lastRally.rally_number : 0) + 1;
    
    var insertData = {
      match_id: rallyData.match_id,
      rally_number: nextRallyNumber,
      home_score: rallyData.home_score,
      away_score: rallyData.away_score,
      serve_turn: rallyData.serve_turn,
      event_type: rallyData.event_type,
      server_player_id: rallyData.server_player_id,
      server_team: rallyData.server_team,
      server_slot: rallyData.server_slot,
      receiver_player_id: rallyData.receiver_player_id,
      receiver_team: rallyData.receiver_team,
      receiver_slot: rallyData.receiver_slot,
      home_position: rallyData.home_position,
      away_position: rallyData.away_position,
      description: rallyData.description,
      created_by: rallyData.created_by
    };
    
    var { data: inserted, error: insertError } = await sb
      .from("match_rallies")
      .insert(insertData)
      .select();
    
    if (insertError) {
      console.error("[RALLY] Insert error:", insertError);
      debug("❌ Lỗi ghi rally: " + insertError.message + "\nCode: " + insertError.code);
      toast("❌ Lỗi ghi rally: " + insertError.message);
      return false;
    }
    
    console.log("[RALLY] ✅ Success:", inserted);
    logRally("✅ Rally #" + nextRallyNumber + " đã ghi: " + rallyData.event_type);
    toast("🏓 Rally #" + nextRallyNumber);
    return true;
    
  } catch(e) {
    console.error("[RALLY] Exception:", e);
    debug("❌ Exception: " + e.message);
    return false;
  }
}

async function finishMatch() {
  if (!currentMatchId) return;
  
  var h = parseInt(currentMatchData.home_score) || 0;
  var a = parseInt(currentMatchData.away_score) || 0;
  
  if (!confirm("🏁 Kết thúc trận?\n\nTỷ số: " + h + " - " + a)) return;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'finished'
    }).eq("id", currentMatchId);
    
    currentMatchData.match_status = 'finished';
    closeScoreModal();
    toast("🏁 Đã kết thúc");
    await loadMatches();
  } catch(e) { toast("❌ Lỗi: " + e.message); }
}

function openTimeoutModal() {
  el("timeout-modal").classList.add("show");
  updateTimeoutDisplay();
}

function closeTimeoutModal() {
  el("timeout-modal").classList.remove("show");
  stopTimeout();
}

function toggleTimeout() {
  if (timeoutRunning) {
    stopTimeout();
  } else {
    startTimeout();
  }
}

function startTimeout() {
  timeoutRunning = true;
  el("timeout-toggle-btn").textContent = '⏸ Tạm dừng';
  el("timeout-toggle-btn").className = 'btn btn-w';
  el("timeout-display").classList.add('running');
  
  timeoutInterval = setInterval(function() {
    timeoutElapsed++;
    updateTimeoutDisplay();
  }, 1000);
}

function stopTimeout() {
  timeoutRunning = false;
  if (timeoutInterval) {
    clearInterval(timeoutInterval);
    timeoutInterval = null;
  }
  el("timeout-toggle-btn").textContent = timeoutElapsed > 0 ? '▶ Tiếp tục' : '▶ Bắt đầu';
  el("timeout-toggle-btn").className = 'btn btn-p';
  el("timeout-display").classList.remove('running');
}

function resetTimeout() {
  stopTimeout();
  timeoutElapsed = 0;
  updateTimeoutDisplay();
  el("timeout-toggle-btn").textContent = '▶ Bắt đầu';
}

function updateTimeoutDisplay() {
  var minutes = Math.floor(timeoutElapsed / 60);
  var seconds = timeoutElapsed % 60;
  el("timeout-display").textContent = 
    (minutes < 10 ? '0' : '') + minutes + ':' + 
    (seconds < 10 ? '0' : '') + seconds;
}

function startRealtime() {
  stopRealtime();
  realtimeInterval = setInterval(async function() {
    var tid = el("tournament-filter").value;
    if (!tid) return;
    
    try {
      var query = sb.from("matches").select("*").eq("tournament_id", tid);
      var eid = el("event-filter").value;
      if (eid) query = query.eq("event_id", eid);
      var m = await query.order("match_seq");
      
      if (m.data) {
        var changed = false;
        for (var i = 0; i < m.data.length; i++) {
          var old = DATA.matches.find(function(x) { return x && x.id === m.data[i].id; });
          if (!old || old.home_score !== m.data[i].home_score || 
              old.away_score !== m.data[i].away_score ||
              old.match_status !== m.data[i].match_status) {
            changed = true; break;
          }
        }
        if (changed) {
          DATA.matches = (m.data || []).slice();
          renderMatchesByRound();
          
          if (currentMatchId && currentMatchData) {
            var cm = DATA.matches.find(function(x) { return x && x.id === currentMatchId; });
            if (cm) {
              currentMatchData.home_score = cm.home_score;
              currentMatchData.away_score = cm.away_score;
              currentMatchData.match_status = cm.match_status;
              
              el("modal-home-score").textContent = cm.home_score || 0;
              el("modal-away-score").textContent = cm.away_score || 0;
              
              updateTopScoreDisplay();
            }
          }
        }
      }
    } catch(e) { console.warn("Realtime error:", e); }
  }, 3000);
}

function stopRealtime() {
  if (realtimeInterval) { clearInterval(realtimeInterval); realtimeInterval = null; }
}

(async function init() {
  try {
    var u = sessionStorage.getItem('pb_admin');
    if (u) {
      try { CURRENT_USER = JSON.parse(u); } catch(e) { sessionStorage.removeItem('pb_admin'); }
    }
    applyUI();
    if (CURRENT_USER) {
      await loadData();
    } else {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:30px 10px;color:var(--mu)"><div style="font-size:36px;margin-bottom:6px">🔐</div><p style="font-size:12px;margin:0">Vui lòng đăng nhập</p></div>';
    }
  } catch(e) { debug("❌ Init error: " + e.message); }
})();
</script>
</body>
</html>
