<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Trọng Tài - Pickleball Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#1a1a2e;--sf:#16213e;--sf2:#0f3460;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171;--pk:#e94560}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px;min-height:100vh}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(26,26,46,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand-row{display:flex;gap:8px;align-items:center}
.logo{color:var(--pk);font-weight:800;font-size:18px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.chip{color:#fff;font-size:11px;font-weight:800;background:var(--pk);padding:4px 10px;border-radius:99px}
.btn{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--pk);color:#fff}
.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
main{max-width:900px;margin:0 auto;padding:16px}
.section-title{font-size:16px;font-weight:800;color:var(--cy);margin:16px 0 12px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.section-title .badge{background:var(--pk);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select{flex:1;min-width:150px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px;color:var(--tx);font-size:13px}

/* Group sections */
.round-section{margin-bottom:20px}
.round-header{background:var(--sf2);padding:10px 14px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--cy)}
.round-header.group{background:rgba(163,230,53,.1);color:var(--li)}
.round-header.tk{background:rgba(34,211,238,.1);color:var(--cy)}
.round-header.bk{background:rgba(251,146,60,.1);color:var(--or)}
.round-header.ck{background:rgba(163,230,53,.15);color:var(--li)}

/* Match card */
.match-card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.2s;position:relative}
.match-card:active{transform:scale(.98)}
.match-card:hover{border-color:var(--pk)}
.match-card.live{border-left:4px solid var(--rd);animation:pulse 2s infinite}
.match-card.finished{border-left:4px solid var(--li);opacity:.8}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.3)}50%{box-shadow:0 0 0 4px rgba(248,113,113,0)}}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.match-code{font-family:monospace;font-weight:800;color:var(--pk);font-size:14px}
.match-status{font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px}
.match-status.live{background:var(--rd);color:#fff}
.match-status.finished{background:var(--li);color:#0b1220}
.match-status.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.team-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-name.home{color:var(--li);text-align:right}
.team-name.away{color:var(--cy);text-align:left}
.match-score{font-family:monospace;font-weight:800;font-size:20px;color:var(--tx);text-align:center;min-width:60px}
.match-score.done{color:var(--li)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:600px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;max-height:95vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.modal-header h3{margin:0;color:var(--pk);font-size:18px}
.modal-close{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:0 8px}

/* Score display */
.score-section{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:16px}
.score-display{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:12px}
.score-team{text-align:center}
.score-team-name{font-size:14px;font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-team-name.home{color:var(--li)}
.score-team-name.away{color:var(--cy)}
.score-value{font-size:48px;font-weight:900;font-family:monospace;color:var(--tx)}
.score-sep{font-size:36px;font-weight:800;color:var(--mu)}
.score-controls{display:flex;gap:8px;justify-content:center}
.score-btn{width:50px;height:50px;border-radius:12px;border:2px solid var(--ln);background:var(--sf2);color:var(--tx);font-size:24px;font-weight:800;cursor:pointer;transition:.15s}
.score-btn:active{transform:scale(.9);background:var(--pk);border-color:var(--pk)}

/* Player slots */
.slots-section{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:16px}
.slots-title{font-size:12px;font-weight:800;color:var(--mu);margin-bottom:12px;text-transform:uppercase}
.slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot-group{background:var(--sf2);border-radius:8px;padding:12px}
.slot-group-title{font-size:11px;font-weight:700;margin-bottom:8px;color:var(--cy)}
.slot-group.home .slot-group-title{color:var(--li)}
.slot-group.away .slot-group-title{color:var(--cy)}
.slot-select{width:100%;margin-bottom:8px;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px;color:var(--tx);font-size:12px}
.serve-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.serve-btn{padding:8px;border-radius:6px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);font-size:11px;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
.serve-btn:active{transform:scale(.97)}
.serve-btn.active{background:var(--or);border-color:var(--or);color:#0b1220}

/* Action buttons */
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.modal-actions .btn{padding:14px;font-size:14px;justify-content:center}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:480px){
  main{padding:12px}
  .score-value{font-size:40px}
  .score-btn{width:45px;height:45px;font-size:20px}
  .modal-actions{grid-template-columns:1fr}
  .slots-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row">
  <span class="logo">️ Trọng Tài</span>
</div>
<div>
  <span id="user-chip" class="chip hidden"></span>
  <button id="login-btn" class="btn btn-p" onclick="openLogin()">🔐 Đăng nhập</button>
  <button id="logout-btn" class="btn btn-l hidden" onclick="doLogout()">Thoát</button>
</div>
</nav>
<main>
  <div class="filter-bar">
    <select id="tournament-filter" onchange="onTournamentChange()">
      <option value="">-- Chọn giải --</option>
    </select>
    <select id="event-filter" onchange="onEventChange()">
      <option value="">-- Chọn nội dung --</option>
    </select>
  </div>
  
  <div id="matches-container">
    <div style="text-align:center;padding:40px;color:var(--mu)">
      <div style="font-size:48px;margin-bottom:10px">📋</div>
      <p>Chọn giải và nội dung để xem lịch thi đấu</p>
    </div>
  </div>
</main>

<!-- Modal đăng nhập -->
<div id="login-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3>🔐 Đăng nhập</h3>
    <button class="modal-close" onclick="closeLogin()">×</button>
  </div>
  <input id="lu" placeholder="Tên đăng nhập" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx)"/>
  <input id="lp" type="password" placeholder="Mật khẩu" style="width:100%;padding:10px;margin-bottom:16px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx)"/>
  <button class="btn btn-p" onclick="doLogin()" style="width:100%;padding:12px">Đăng nhập</button>
  <div id="lmsg" style="color:var(--rd);font-size:12px;margin-top:8px;text-align:center"></div>
</div>
</div>

<!-- Modal ghi điểm -->
<div id="score-modal" class="modal-bg">
<div class="modal">
  <div class="modal-header">
    <h3 id="modal-match-code">Trận: --</h3>
    <button class="modal-close" onclick="closeScoreModal()">×</button>
  </div>
  
  <div class="score-section">
    <div class="score-display">
      <div class="score-team">
        <div class="score-team-name home" id="modal-home-name">Team A</div>
        <div class="score-value" id="modal-home-score">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="changeScore('home', -1)">−</button>
          <button class="score-btn" onclick="changeScore('home', 1)">+</button>
        </div>
      </div>
      <div class="score-sep">:</div>
      <div class="score-team">
        <div class="score-team-name away" id="modal-away-name">Team B</div>
        <div class="score-value" id="modal-away-score">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="changeScore('away', -1)">−</button>
          <button class="score-btn" onclick="changeScore('away', 1)">+</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="slots-section">
    <div class="slots-title">👥 Chọn VĐV và Lượt giao banh</div>
    <div class="slots-grid">
      <div class="slot-group home">
        <div class="slot-group-title">ĐỘI A</div>
        <select id="slot-home-1" class="slot-select" onchange="onSlotChange('home',1)">
          <option value="">-- Ô 1 --</option>
        </select>
        <select id="slot-home-2" class="slot-select" onchange="onSlotChange('home',2)">
          <option value="">-- Ô 2 --</option>
        </select>
        <div class="serve-buttons">
          <button class="serve-btn" id="serve-home-l1" onclick="setServe('home',1)">L1</button>
          <button class="serve-btn" id="serve-home-l2" onclick="setServe('home',2)">L2</button>
        </div>
      </div>
      <div class="slot-group away">
        <div class="slot-group-title">ĐỘI B</div>
        <select id="slot-away-1" class="slot-select" onchange="onSlotChange('away',1)">
          <option value="">-- Ô 1 --</option>
        </select>
        <select id="slot-away-2" class="slot-select" onchange="onSlotChange('away',2)">
          <option value="">-- Ô 2 --</option>
        </select>
        <div class="serve-buttons">
          <button class="serve-btn" id="serve-away-l1" onclick="setServe('away',1)">L1</button>
          <button class="serve-btn" id="serve-away-l2" onclick="setServe('away',2)">L2</button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="rally-info" style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:16px;font-size:12px;color:var(--mu);min-height:40px"></div>
  
  <div class="modal-actions">
    <button class="btn btn-l" onclick="closeScoreModal()">✕ Đóng</button>
    <button class="btn btn-p" onclick="finishMatch()">🏁 Kết thúc</button>
  </div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var CURRENT_USER = null;
var DATA = {
  tournaments: [], events: [], matches: [], teams: [], players: [], groups: [], stages: []
};
var currentMatchId = null;
var currentMatchData = null;
var realtimeInterval = null;

/* === HELPERS === */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2000);
}

/* === AUTH === */
function openLogin() { el("login-modal").classList.add("show"); el("lmsg").textContent=""; }
function closeLogin() { el("login-modal").classList.remove("show"); }
async function doLogin() {
  var u = el("lu").value.trim().toLowerCase();
  var p = el("lp").value;
  if (!u || !p) { el("lmsg").textContent="Vui lòng nhập đầy đủ."; return; }
  try {
    var { data, error } = await sb.from('admin_users').select('*').eq('username', u).eq('password', p).maybeSingle();
    if (error) throw error;
    if (!data) { el("lmsg").textContent="❌ Sai thông tin!"; return; }
    CURRENT_USER = data;
    sessionStorage.setItem('pb_admin', JSON.stringify(CURRENT_USER));
    closeLogin(); applyUI(); await loadData();
    toast("✅ Xin chào " + CURRENT_USER.username);
  } catch(e) { el("lmsg").textContent="❌ " + e.message; }
}
function doLogout() {
  CURRENT_USER = null;
  sessionStorage.removeItem('pb_admin');
  stopRealtime();
  applyUI();
  el("matches-container").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)">Vui lòng đăng nhập</div>';
  toast("👋 Đã đăng xuất");
}
function applyUI() {
  var logged = !!CURRENT_USER;
  el("login-btn").classList.toggle("hidden", logged);
  el("logout-btn").classList.toggle("hidden", !logged);
  el("user-chip").classList.toggle("hidden", !logged);
  if (logged) {
    el("user-chip").textContent = "👤 " + CURRENT_USER.username;
  }
}

/* === DATA LOADING === */
async function loadData() {
  if (!CURRENT_USER) return;
  try {
    // Load tournaments - CHỈ CỦA ADMIN HIỆN TẠI
    var tr = await sb.from("tournaments").select("*").eq('admin_id', CURRENT_USER.id).order("created_at", {ascending:false});
    DATA.tournaments = tr.data || [];
    
    var tSelect = el("tournament-filter");
    tSelect.innerHTML = '<option value="">-- Chọn giải --</option>';
    DATA.tournaments.forEach(t => {
      tSelect.innerHTML += `<option value="${t.id}">${esc(t.name)}</option>`;
    });
    
    if (DATA.tournaments.length === 1) {
      tSelect.value = DATA.tournaments[0].id;
      await onTournamentChange();
    }
  } catch(e) { console.error(e); }
}

async function onTournamentChange() {
  var tid = el("tournament-filter").value;
  if (!tid) {
    el("event-filter").innerHTML = '<option value="">-- Chọn nội dung --</option>';
    el("matches-container").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)"><p>Chọn giải để xem nội dung</p></div>';
    return;
  }
  
  try {
    // Load events
    var ev = await sb.from("events").select("*").eq("tournament_id", tid);
    DATA.events = ev.data || [];
    
    var eSelect = el("event-filter");
    eSelect.innerHTML = '<option value="">-- Chọn nội dung --</option>';
    DATA.events.forEach(e => {
      eSelect.innerHTML += `<option value="${e.id}">${esc(e.name)}</option>`;
    });
    
    if (DATA.events.length === 1) {
      eSelect.value = DATA.events[0].id;
      await loadMatches();
    }
  } catch(e) { console.error(e); }
}

async function onEventChange() {
  await loadMatches();
}

async function loadMatches() {
  var tid = el("tournament-filter").value;
  var eid = el("event-filter").value;
  
  if (!tid || !eid) {
    el("matches-container").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)"><p>Chọn giải và nội dung</p></div>';
    return;
  }
  
  try {
    // Load matches
    var m = await sb.from("matches").select("*").eq("tournament_id", tid).eq("event_id", eid).order("match_seq");
    DATA.matches = m.data || [];
    
    // Load teams & players
    var t = await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name))").eq("event_id", eid);
    DATA.teams = t.data || [];
    DATA.players = [];
    DATA.teams.forEach(tm => {
      tm.members.forEach(m => {
        if (m.players && !DATA.players.find(p => p.id === m.players.id)) {
          DATA.players.push(m.players);
        }
      });
    });
    
    // Load groups & stages
    var st = await sb.from("stages").select("*").eq("event_id", eid);
    DATA.stages = st.data || [];
    var g = await sb.from("groups").select("*").in("stage_id", DATA.stages.map(s=>s.id));
    DATA.groups = g.data || [];
    
    renderMatchesByRound();
    startRealtime();
  } catch(e) { console.error(e); }
}

function getTeamName(teamId) {
  var t = DATA.teams.find(x => x.id === teamId);
  return t ? t.name : 'TBD';
}

function getTeamPlayers(teamId) {
  var team = DATA.teams.find(x => x.id === teamId);
  if (!team || !team.members) return [];
  return team.members.map(m => ({
    id: m.player_id,
    name: m.players ? m.players.full_name : 'VĐV',
    position: m.position
  }));
}

function getRoundInfo(match) {
  if (match.group_id) {
    var g = DATA.groups.find(x => x.id === match.group_id);
    return { type: 'group', name: 'Bảng ' + (g ? g.code : '?'), class: 'group' };
  }
  if (match.round === 1.5) return { type: 'r16', name: 'Vòng 1/8', class: 'tk' };
  if (match.round === 2) return { type: 'tk', name: 'Tứ kết', class: 'tk' };
  if (match.round === 3) return { type: 'bk', name: 'Bán kết', class: 'bk' };
  if (match.round === 4) return { type: 'ck', name: 'Chung kết', class: 'ck' };
  return { type: 'other', name: 'Khác', class: '' };
}

function renderMatchesByRound() {
  if (!DATA.matches.length) {
    el("matches-container").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)"><p>Chưa có trận đấu</p></div>';
    return;
  }
  
  // Group matches by round
  var rounds = {
    'group': [],
    'r16': [],
    'tk': [],
    'bk': [],
    'ck': []
  };
  
  DATA.matches.forEach(m => {
    var round = getRoundInfo(m);
    if (rounds[round.type]) rounds[round.type].push(m);
  });
  
  var H = '';
  
  // Render each round
  var roundOrder = ['group', 'r16', 'tk', 'bk', 'ck'];
  var roundTitles = {
    'group': '📋 Vòng bảng',
    'r16': ' Vòng 1/8',
    'tk': '🎯 Tứ kết',
    'bk': '🏅 Bán kết',
    'ck': '🏆 Chung kết'
  };
  
  roundOrder.forEach(roundType => {
    if (rounds[roundType].length) {
      var roundInfo = getRoundInfo(rounds[roundType][0]);
      H += `<div class="round-section">`;
      H += `<div class="round-header ${roundInfo.class}">${roundTitles[roundType]} (${rounds[roundType].length} trận)</div>`;
      
      rounds[roundType].forEach(m => {
        H += renderMatchCard(m);
      });
      
      H += `</div>`;
    }
  });
  
  el("matches-container").innerHTML = H;
}

function renderMatchCard(m) {
  var status = m.match_status || 'scheduled';
  var hn = getTeamName(m.home_team_id);
  var an = getTeamName(m.away_team_id);
  var h = Number(m.home_score)||0, a = Number(m.away_score)||0;
  var scoreText = (status === 'finished' || status === 'completed') ? (h + " - " + a) : "vs";
  var scoreClass = (status === 'finished' || status === 'completed') ? 'done' : '';
  
  var H = `<div class="match-card ${status}" onclick="openScoreModal('${m.id}')">`;
  H += `<div class="match-header">`;
  H += `<div class="match-code">${esc(m.match_code||'')}</div>`;
  H += `<span class="match-status ${status}">${status==='live'?'🔴 LIVE':(status==='finished'?'✅ FIN':'')}</span>`;
  H += `</div>`;
  H += `<div class="match-teams">`;
  H += `<div class="team-name home">${esc(hn)}</div>`;
  H += `<div class="match-score ${scoreClass}">${scoreText}</div>`;
  H += `<div class="team-name away">${esc(an)}</div>`;
  H += `</div>`;
  H += `</div>`;
  
  return H;
}

/* === SCORE MODAL === */
async function openScoreModal(matchId) {
  currentMatchId = matchId;
  currentMatchData = DATA.matches.find(x => x.id === matchId);
  if (!currentMatchData) return;
  
  var hn = getTeamName(currentMatchData.home_team_id);
  var an = getTeamName(currentMatchData.away_team_id);
  
  el("modal-match-code").textContent = "🎯 " + (currentMatchData.match_code||'');
  el("modal-home-name").textContent = hn;
  el("modal-away-name").textContent = an;
  el("modal-home-score").textContent = currentMatchData.home_score || 0;
  el("modal-away-score").textContent = currentMatchData.away_score || 0;
  
  // Populate player slots
  var homePlayers = getTeamPlayers(currentMatchData.home_team_id);
  var awayPlayers = getTeamPlayers(currentMatchData.away_team_id);
  
  populateSlotSelect('slot-home-1', homePlayers, 1);
  populateSlotSelect('slot-home-2', homePlayers, 2);
  populateSlotSelect('slot-away-1', awayPlayers, 1);
  populateSlotSelect('slot-away-2', awayPlayers, 2);
  
  // Set current slots
  if (currentMatchData.home_player_slot1) el("slot-home-1").value = currentMatchData.home_player_slot1;
  if (currentMatchData.home_player_slot2) el("slot-home-2").value = currentMatchData.home_player_slot2;
  if (currentMatchData.away_player_slot1) el("slot-away-1").value = currentMatchData.away_player_slot1;
  if (currentMatchData.away_player_slot2) el("slot-away-2").value = currentMatchData.away_player_slot2;
  
  // Set serve buttons
  updateServeButtons();
  
  // Show rally info
  updateRallyInfo();
  
  el("score-modal").classList.add("show");
}

function populateSlotSelect(selectId, players, position) {
  var sel = el(selectId);
  sel.innerHTML = '<option value="">-- Ô ' + position + ' --</option>';
  players.forEach(p => {
    if (p.position === position) {
      sel.innerHTML += `<option value="${p.id}">${esc(p.name)}</option>`;
    }
  });
}

function updateServeButtons() {
  var serveTeam = currentMatchData.serving_team || 'home';
  var serveTurn = currentMatchData.serving_turn || 1;
  
  el("serve-home-l1").classList.toggle('active', serveTeam === 'home' && serveTurn === 1);
  el("serve-home-l2").classList.toggle('active', serveTeam === 'home' && serveTurn === 2);
  el("serve-away-l1").classList.toggle('active', serveTeam === 'away' && serveTurn === 1);
  el("serve-away-l2").classList.toggle('active', serveTeam === 'away' && serveTurn === 2);
}

function updateRallyInfo() {
  var h = currentMatchData.home_score || 0;
  var a = currentMatchData.away_score || 0;
  var serveTeam = currentMatchData.serving_team || 'home';
  var serveTurn = currentMatchData.serving_turn || 1;
  
  var serveTeamName = serveTeam === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
  var receiveTeamName = serveTeam === 'home' ? el("modal-away-name").textContent : el("modal-home-name").textContent;
  
  var info = `📊 Tỷ số: ${h} - ${a} | `;
  info += `🏓 ${serveTeamName} đang giao (L${serveTurn}) | `;
  info += `👈 ${receiveTeamName} đang nhận`;
  
  el("rally-info").textContent = info;
}

function closeScoreModal() {
  el("score-modal").classList.remove("show");
  currentMatchId = null;
  currentMatchData = null;
}

async function onSlotChange(team, slotNum) {
  if (!currentMatchId) return;
  
  var slot1 = el("slot-" + team + "-1").value;
  var slot2 = el("slot-" + team + "-2").value;
  
  if (slot1 && slot2 && slot1 === slot2) {
    alert("⚠️ 2 VĐV phải khác nhau!");
    el("slot-" + team + "-" + slotNum).value = "";
    return;
  }
  
  var update = {};
  update[team + '_player_slot1'] = el("slot-" + team + "-1").value || null;
  update[team + '_player_slot2'] = el("slot-" + team + "-2").value || null;
  
  try {
    await sb.from("matches").update(update).eq("id", currentMatchId);
    Object.assign(currentMatchData, update);
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

async function setServe(team, turn) {
  if (!currentMatchId) return;
  
  try {
    await sb.from("matches").update({
      serving_team: team,
      serving_turn: turn,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    currentMatchData.serving_team = team;
    currentMatchData.serving_turn = turn;
    currentMatchData.match_status = 'live';
    
    updateServeButtons();
    updateRallyInfo();
    
    // Create rally entry
    await createRally('SERVE_CHANGE');
    
    var teamName = team === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
    toast("✅ " + teamName + " giao L" + turn);
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

async function changeScore(team, delta) {
  if (!currentMatchId) return;
  
  var h = parseInt(currentMatchData.home_score) || 0;
  var a = parseInt(currentMatchData.away_score) || 0;
  
  if (team === 'home') h = Math.max(0, h + delta);
  else a = Math.max(0, a + delta);
  
  el("modal-home-score").textContent = h;
  el("modal-away-score").textContent = a;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'live'
    }).eq("id", currentMatchId);
    
    var oldH = currentMatchData.home_score;
    var oldA = currentMatchData.away_score;
    
    currentMatchData.home_score = h;
    currentMatchData.away_score = a;
    currentMatchData.match_status = 'live';
    
    // Determine event type
    var eventType;
    if (team === 'home') {
      eventType = 'HOME_SCORE';
    } else {
      eventType = 'AWAY_SCORE';
    }
    
    // Create rally
    await createRally(eventType);
    
    updateRallyInfo();
    toast("✅ Đã lưu: " + h + " - " + a);
    
    // Refresh list
    await loadMatches();
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

async function createRally(eventType) {
  if (!currentMatchId || !CURRENT_USER) return;
  
  var m = currentMatchData;
  var serveTeam = m.serving_team || 'home';
  var serveTurn = m.serving_turn || 1;
  
  // Get server and receiver info
  var serverSlot = serveTurn;
  var receiverSlot = serveTurn;
  
  var serverPlayerId = serveTeam === 'home' ? 
    (serveTurn === 1 ? m.home_player_slot1 : m.home_player_slot2) :
    (serveTurn === 1 ? m.away_player_slot1 : m.away_player_slot2);
  
  var receiverPlayerId = serveTeam === 'home' ?
    (serveTurn === 1 ? m.away_player_slot1 : m.away_player_slot2) :
    (serveTurn === 1 ? m.home_player_slot1 : m.home_player_slot2);
  
  // Generate description
  var serverName = serverPlayerId ? (DATA.players.find(p => p.id === serverPlayerId)?.full_name || 'VĐV') : 'VĐV';
  var receiverName = receiverPlayerId ? (DATA.players.find(p => p.id === receiverPlayerId)?.full_name || 'VĐV') : 'VĐV';
  var serverTeamName = serveTeam === 'home' ? el("modal-home-name").textContent : el("modal-away-name").textContent;
  var receiverTeamName = serveTeam === 'home' ? el("modal-away-name").textContent : el("modal-home-name").textContent;
  
  var description = `${serverName} (đội: ${serverTeamName}) giao từ Ô ${serverSlot} → ${receiverName} (đội: ${receiverTeamName}) đỡ ở Ô ${receiverSlot} - Lượt Giao ${serveTurn}`;
  
  try {
    await sb.rpc('auto_create_rally', {
      p_match_id: currentMatchId,
      p_home_score: m.home_score || 0,
      p_away_score: m.away_score || 0,
      p_serve_turn: serveTurn,
      p_event_type: eventType,
      p_server_player_id: serverPlayerId,
      p_server_team: serveTeam,
      p_server_slot: serverSlot,
      p_receiver_player_id: receiverPlayerId,
      p_receiver_team: serveTeam === 'home' ? 'away' : 'home',
      p_receiver_slot: receiverSlot,
      p_home_position: m.home_position || '1-2',
      p_away_position: m.away_position || '1-2',
      p_created_by: CURRENT_USER.id
    });
  } catch(e) {
    console.error("Create rally error:", e);
  }
}

async function finishMatch() {
  if (!currentMatchId) return;
  
  var h = parseInt(currentMatchData.home_score) || 0;
  var a = parseInt(currentMatchData.away_score) || 0;
  
  if (!confirm("🏁 Kết thúc trận?\n\nTỷ số: " + h + " - " + a)) return;
  
  try {
    await sb.from("matches").update({
      home_score: h,
      away_score: a,
      match_status: 'finished'
    }).eq("id", currentMatchId);
    
    currentMatchData.match_status = 'finished';
    
    closeScoreModal();
    toast("🏁 Đã kết thúc");
    await loadMatches();
  } catch(e) {
    toast("❌ Lỗi: " + e.message);
  }
}

/* === REALTIME === */
function startRealtime() {
  stopRealtime();
  realtimeInterval = setInterval(async () => {
    var tid = el("tournament-filter").value;
    var eid = el("event-filter").value;
    if (!tid || !eid) return;
    
    try {
      var m = await sb.from("matches").select("*").eq("tournament_id", tid).eq("event_id", eid).order("match_seq");
      if (m.data) {
        var changed = false;
        for (var i = 0; i < m.data.length; i++) {
          var old = DATA.matches.find(x => x.id === m.data[i].id);
          if (!old || old.home_score !== m.data[i].home_score || 
              old.away_score !== m.data[i].away_score ||
              old.match_status !== m.data[i].match_status) {
            changed = true; break;
          }
        }
        if (changed) {
          DATA.matches = m.data;
          renderMatchesByRound();
          
          // Update modal if open
          if (currentMatchId) {
            var cm = DATA.matches.find(x => x.id === currentMatchId);
            if (cm) {
              currentMatchData = cm;
              el("modal-home-score").textContent = cm.home_score || 0;
              el("modal-away-score").textContent = cm.away_score || 0;
              updateServeButtons();
              updateRallyInfo();
            }
          }
        }
      }
    } catch(e) { console.warn("Realtime error:", e); }
  }, 3000);
}

function stopRealtime() {
  if (realtimeInterval) { clearInterval(realtimeInterval); realtimeInterval = null; }
}

/* === INIT === */
(async function init() {
  try {
    var u = sessionStorage.getItem('pb_admin');
    if (u) {
      try { CURRENT_USER = JSON.parse(u); } catch(e) { sessionStorage.removeItem('pb_admin'); }
    }
    applyUI();
    if (CURRENT_USER) {
      await loadData();
    } else {
      el("matches-container").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)"><div style="font-size:48px;margin-bottom:10px"></div><p>Vui lòng đăng nhập</p></div>';
    }
  } catch(e) {
    console.error("Init error:", e);
  }
})();
</script>
