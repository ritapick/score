.schedule-preview{font-size:11px;color:var(--mu);padding:8px 10px;background:rgba(34,211,238,.05);border-radius:6px;margin-top:8px;font-family:monospace;line-height:1.6}
.schedule-preview b{color:var(--li)}
.schedule-preview .break{color:var(--or)}

.team-group-select{padding:5px 8px;font-size:11px;min-width:130px;background:#0d1626;border:1px solid var(--ln);border-radius:6px;color:var(--tx)}

</style>

"use strict";
var CFG={

  SPONSOR_MAX_SIZE:2*1024*1024,
  SPONSOR_TYPES:["image/png","image/jpeg","image/jpg","image/svg+xml","image/webp","image/gif"]
};
var KO_DEFS=[
  {slot:25,code:"TK1",round:2,group:"tk",ph:{h:"Nhất A",a:"Nhì B"}},
  {slot:26,code:"TK2",round:2,group:"tk",ph:{h:"Nhất B",a:"Nhì A"}},

  {slot:31,code:"CK", round:4,group:"ck",ph:{h:"Thắng BK1",a:"Thắng BK2"}}
];
var sb;
try{sb=window.supabase.createClient(CFG.URL,CFG.KEY);}catch(e){console.error("Supabase init error:",e);}
var S={user:null,userId:null,role:null,username:null,tournaments:[],tournament:null,events:[],eid:null,courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],gStage:null,kStage:null,users:[],refs:[],refAssign:{},sponsors:[],draft:[],acc:{s1:false,s2:false,s3:true,s4:false,s5:false}};

/* === HELPERS === */
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pad(n,l){return String(n).padStart(l,"0");}
function r2(n){return Math.round(n*100)/100;}
function sn(n){return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function findTeam(id){if(!id)return null;for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null;}
function tName(id){var t=findTeam(id);return t?sn(t.name):null;}
function toast(msg,isErr){var t=el("toast");t.textContent=msg;t.className="toast show";t.style.background=isErr?"var(--rd)":"var(--li)";t.style.color=isErr?"#fff":"#0b1220";if(window._toastT)clearTimeout(window._toastT);window._toastT=setTimeout(function(){t.className="toast";},isErr?4000:2000);}

/* === V35: PHÂN QUYỀN === */
function isAdmin(){return S.role==="admin";}
function isOrganizer(){return S.role==="organizer";}
function canAccessAdmin(){return isAdmin()||isOrganizer();}
function isOwnerOfTournament(tid){
  if(isAdmin())return true;
  if(!tid)return false;
  var t=null;
  for(var i=0;i<S.tournaments.length;i++){if(S.tournaments[i].id===tid){t=S.tournaments[i];break;}}
  return t && t.created_by===S.userId;
}
function isOwnerOfCurrent(){return isOwnerOfTournament(S.tournament?S.tournament.id:null);}
function isOwnerOfUser(uid){
  if(isAdmin())return true;
  var u=null;
  for(var i=0;i<S.users.length;i++){if(S.users[i].user_id===uid){u=S.users[i];break;}}
  return u && u.created_by===S.userId;
}
/* V37.1: Kiểm tra user có phải referee (không phải organizer/admin) */
function isRefereeUser(uid){
  var u=null;
  for(var i=0;i<S.users.length;i++){if(S.users[i].user_id===uid){u=S.users[i];break;}}
  return u && u.role==="referee";
}

function sortedT(){
  var list=S.tournaments.filter(function(t){return isOwnerOfTournament(t.id);});
  return list.sort(function(a,b){
    var aClosed=a.status==="completed"?1:0;var bClosed=b.status==="completed"?1:0;
    if(aClosed!==bClosed)return aClosed-bClosed;
    return String(a.created_at||"").localeCompare(b.created_at||"");
  });

function tSeq(){var s=sortedT();for(var i=0;i<s.length;i++)if(s[i].id===S.tournament.id)return i+1;return 1;}

async function addSponsor(){
  if(!S.tournament){alert("Chọn giải trước");return;}
  if(!isOwnerOfCurrent()){alert("❌ Không có quyền");return;}
  var name=el('sp-name').value.trim();
  var url=el('sp-url').value.trim();
  var fi=el('sp-file');
  var file=fi&&fi.files&&fi.files[0];
  if(!name){alert("Nhập tên nhà tài trợ");return;}
  if(!url){alert("Nhập link website");return;}
  if(!file){alert("Chọn file logo");return;}
  if(CFG.SPONSOR_TYPES.indexOf(file.type)<0){
    alert("❌ File phải là ảnh (PNG, JPG, SVG, WEBP, GIF)");return;
  }

  }
  try{
    var safeName=file.name.replace(/[^\w.\-]/g,'_');
    var path='t-'+S.tournament.id+'/'+Date.now()+'-'+safeName;
    var up=await sb.storage.from('sponsor-logos').upload(path,file,{
      cacheControl:'3600',

    });

      var o=s.display_order||0;
      if(o>maxOrder)maxOrder=o;
    });
    var r=await sb.from('sponsors').insert({

      website_url:url,

function standings(g){
  var t=teamsInG(g);var st={};
  t.forEach(function(x){st[x.id]={id:x.id,w:0,pf:0,pa:0,played:0};});
  S.matches.filter(function(m){return m.group_id===g&&autoStatus(m)==="completed";}).forEach(function(m){
    var h=st[m.home_team_id],a=st[m.away_team_id];if(!h||!a)return;
    h.pf+=Number(m.home_score)||0;h.pa+=Number(m.away_score)||0;h.played++;
    a.pf+=Number(m.away_score)||0;a.pa+=Number(m.home_score)||0;a.played++;
    if(Number(m.home_score)>Number(m.away_score))h.w++;else a.w++;
  });
  var arr=[];for(var k in st)arr.push(st[k]);
  return arr.sort(function(x,y){if(y.w!==x.w)return y.w-x.w;var dx=x.pf-x.pa,dy=y.pf-y.pa;if(dy!==dx)return dy-dx;return y.pf-x.pf;});
}

/* ===== V37.1: AUTO THỜI GIAN VỚI BREAK ===== */
function getSchedConfig(){
  var h=el('sched-start-h');
  var m=el('sched-start-m');
  var st=el('sched-step');
  var br=el('sched-break');
  return {
    startH: h?parseInt(h.value):CFG.SCHED_START_H,
    startM: m?parseInt(m.value):CFG.SCHED_START_M,
    step: st?parseInt(st.value):CFG.SCHED_STEP_MIN,
    breakAfterGroup: br?parseInt(br.value):CFG.SCHED_BREAK_MIN
  };
}
/* V37.1: Tính phút từ khi bắt đầu cho một slot index */
function minutesFromStart(slotIdx,cfg){
  /* 6 round vòng bảng (slot 0..5) */
  if(slotIdx < CFG.MATCHES_PER_GROUP){
    return (cfg.startH||8)*60 + (cfg.startM||0) + slotIdx*(cfg.step||20);
  }
  /* KO: bắt đầu sau vòng bảng + break */
  var groupEndTime = (cfg.startH||8)*60 + (cfg.startM||0) + (CFG.MATCHES_PER_GROUP-1)*(cfg.step||20) + (cfg.step||20);
  var breakEnd = groupEndTime + (cfg.breakAfterGroup||0);
  var koIndex = slotIdx - CFG.MATCHES_PER_GROUP; /* 0,1,2,3,4,5,6 */
  return breakEnd + koIndex*(cfg.step||20);
}
function slotToHM(slotIdx,cfg){
  var totalMin=minutesFromStart(slotIdx,cfg);
  var h=Math.floor(totalMin/60)%24;
  var m=totalMin%60;
  return pad(h,2)+":"+pad(m,2);
}
function updateSchedPreview(){
  var cfg=getSchedConfig();
  var box=el('sched-preview');
  if(!box)return;
  
  var groupStart = slotToHM(0,cfg);
  var groupEnd = slotToHM(CFG.MATCHES_PER_GROUP-1,cfg); /* slot 5 */
  var koStart = slotToHM(CFG.MATCHES_PER_GROUP,cfg); /* slot 6 = TK1 */
  var koEnd = slotToHM(CFG.MATCHES_PER_GROUP+6,cfg); /* slot 12 = CK */
  
  var groupEndMin = minutesFromStart(CFG.MATCHES_PER_GROUP-1,cfg) + (cfg.step||20);
  var koStartMin = minutesFromStart(CFG.MATCHES_PER_GROUP,cfg);
  var actualBreak = koStartMin - groupEndMin;
  
  var html='';
  html+='<b>🎾 Vòng bảng (6 rounds đồng loạt):</b> '+groupStart+' → '+groupEnd+'<br>';
  if(actualBreak>0){
    html+='<span class="break">☕ Nghỉ: '+actualBreak+' phút</span><br>';
  }
  html+='<b>🔥 KO (7 trận nối tiếp):</b> '+koStart+' → '+koEnd+'<br>';
  html+='<span style="color:var(--mu)">• TK: '+slotToHM(6,cfg)+' → '+slotToHM(9,cfg)+' · BK: '+slotToHM(10,cfg)+' → '+slotToHM(11,cfg)+' · CK: '+slotToHM(12,cfg)+'</span>';
  box.innerHTML=html;
}
async function batchFillSchedule(){
  if(!S.eid){toast("Chọn nội dung trước",true);return;}
  if(!isOwnerOfCurrent()){alert("❌ Không có quyền");return;}
  var cfg=getSchedConfig();
  var defaultCourt=S.courts.length?S.courts[0].id:null;
  var count=0;
  try{
    /* Vòng bảng: 6 slot, mỗi slot 4 trận cùng giờ */
    var gm=S.matches.filter(function(m){return m.group_id;});
    for(var i=0;i<gm.length;i++){
      var m=gm[i];
      var inGroup=(Number(m.bracket_slot)-1)%6; /* 0..5 */
      var hm=slotToHM(inGroup,cfg);
      var u={};
      u.scheduled_at=isoFromTime(hm);
      if(!m.court_id&&defaultCourt)u.court_id=defaultCourt;
      await sb.from("matches").update(u).eq("id",m.id);
      m.scheduled_at=u.scheduled_at;
      if(u.court_id)m.court_id=u.court_id;
      count++;
    }
    /* KO: slot index 6..12 (tổng 7 trận) */
    var km=S.matches.filter(function(m){return!m.group_id;}).sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});
    for(var j=0;j<km.length;j++){
      var k=km[j];
      var koIdx=CFG.MATCHES_PER_GROUP+j; /* 6,7,8,9,10,11,12 */
      var hm2=slotToHM(koIdx,cfg);
      var u2={};
      u2.scheduled_at=isoFromTime(hm2);
      if(!k.court_id&&defaultCourt)u2.court_id=defaultCourt;
      await sb.from("matches").update(u2).eq("id",k.id);
      k.scheduled_at=u2.scheduled_at;
      if(u2.court_id)k.court_id=u2.court_id;
      count++;
    }
    var groupStart = slotToHM(0,cfg);
    var koStart = slotToHM(CFG.MATCHES_PER_GROUP,cfg);
    toast("✅ Đã điền giờ "+count+" trận · Bảng: "+groupStart+" · KO: "+koStart);
    await selE(S.eid);
  }catch(e){toast("❌ "+e.message,true);}
}

/* ===== V37.1: REFEREE - CHẶN ORG LÀM TT SAI GIẢI ===== */
function refOptsHtml(mid){
  var cur=S.refAssign[mid]||null;
  var html='<select onchange="assignRef(\''+mid+"',this.value)\">";
  html+='<option value="">-- TT --</option>';
  
  /* S.refs đã được filter theo owner trong loadRefs() */
  S.refs.forEach(function(r){
    var isSelected = cur===r.user_id;
    html+='<option value="'+r.user_id+'"'+(isSelected?" selected":"")+'>'+esc(r.username)+'</option>';
  });
  
  /* V37.1: Nếu mình là organizer và là chủ giải, cho phép tự làm TT */
  if(isOrganizer() && isOwnerOfCurrent()){
    var amIInRefs = S.refs.some(function(r){return r.user_id===S.userId;});
    if(!amIInRefs){
      var isSelected = cur===S.userId;
      var label = esc(S.username || (S.user&&S.user.email) || "Tôi");
      html+='<option value="'+S.userId+'"'+(isSelected?" selected":"")+' class="ref-you">⭐ '+label+' (Bạn)</option>';
    }
  }
  
  html+='</select>';return html;
}
async function assignRef(mid,uid){
  if(!uid){
    /* Bỏ phân */
    try{
      await sb.from("referee_matches").delete().eq("match_id",mid);
      toast("✅ Bỏ trọng tài");
      await loadRefAssign();render();
    }catch(e){alert("❌ "+e.message);}
    return;
  }
  
  /* Check 1: Owner check (chỉ phân referee do mình tạo - đã filter ở dropdown) */
  var isMe = (uid===S.userId);
  if(!isMe && !isOwnerOfUser(uid)){
    alert("❌ Bạn chỉ phân được trọng tài do mình tạo");
    render();
    return;
  }
  
  /* V37.1 Check 2: Nếu user được phân là ORGANIZER, chỉ cho phép nếu là chủ giải */
  if(!isRefereeUser(uid)){
    /* uid không phải referee → phải là organizer/admin */
    if(!isOwnerOfCurrent()){
      alert("❌ Organizer chỉ được làm trọng tài cho giải do mình tạo");
      render();
      return;
    }
    /* Check thêm: chỉ organizer mới được tự làm TT, admin có thể phân bất kỳ ai */
    if(!isAdmin() && !isMe){
      alert("❌ Bạn chỉ có thể phân chính mình (organizer) làm trọng tài cho giải của mình");
      render();
      return;
    }
  }
  
  try{
    await sb.from("referee_matches").delete().eq("match_id",mid);
    await sb.from("referee_matches").insert({user_id:uid,match_id:mid});
    toast("✅ Đã phân trọng tài");
    await loadRefAssign();render();
  }catch(e){alert("❌ "+e.message);}
}

/* === USER CRUD === */
async function createUser(){
  var em=el("nu-email").value.trim();var ps=el("nu-pass").value||CFG.PASS;var ro=el("nu-role").value;
  if(!em){alert("Nhập tên user");return;}
  if(isOrganizer()&&ro!=="referee"){alert("❌ Organizer chỉ tạo được trọng tài (referee)");return;}
  if(em.indexOf("@")<0)em=em+CFG.DOMAIN;
  try{var tmp=window.supabase.createClient(CFG.URL,CFG.KEY,{auth:{storageKey:"tmp_"+Date.now(),persistSession:false,detectSessionInUrl:false}});
    var r=await tmp.auth.signUp({email:em,password:ps});if(r.error){alert(r.error.message);return;}
    var uid=r.data.user&&r.data.user.id;if(!uid){alert("User đã tồn tại");return;}
    await sb.from("app_users").upsert({user_id:uid,username:em,display_name:em,created_by:S.userId});
    await sb.from("user_roles").insert({user_id:uid,role:ro});
    toast("✅ Tạo user "+em);await loadUsers();await loadRefs();el("nu-email").value="";render();
  }catch(e){alert("❌ "+e.message);}
}
async function chRole(uid,ro){
  if(!isOwnerOfUser(uid)){alert("❌ Bạn chỉ đổi được role user do mình tạo");return;}
  if(isOrganizer()&&ro!=="referee"){alert("❌ Organizer chỉ gán được role referee");return;}
  try{await sb.from("user_roles").delete().eq("user_id",uid);await sb.from("user_roles").insert({user_id:uid,role:ro});await loadUsers();await loadRefs();render();}catch(e){alert("❌ "+e.message);}
}

function renderKOSection(km){

  km.forEach(function(m){if(m.scheduled_at)countTime++;if(m.court_id)countCourt++;if(S.refAssign[m.id])countRef++;if(m.home_team_id||m.away_team_id)countTeams++;});

  H+='<div class="ko-actions"><button class="btn btn-b btn-s" onclick="forceSyncKO()">🔄 Đồng bộ</button></div>';
  var tk=km.filter(function(m){return Number(m.round)===2;}).sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});
  var bk=km.filter(function(m){return Number(m.round)===3;}).sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});
  var ck=km.filter(function(m){return Number(m.round)===4;}).sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});
  if(tk.length){H+='<div class="ko-group"><div class="ko-group-header tk">🎯 TỨ KẾT ('+tk.length+') <span class="sub">Nhất A vs Nhì B · Nhất B vs Nhì A · Nhất C vs Nhì D · Nhất D vs Nhì C</span></div>'+renderMatchTable(tk,true)+'</div>';}

  H+=renderKOSection(km);

    var isMe=S.userId&&u.user_id===S.userId;
    var dispName=u.display_name||u.username||"—";
    var roleTag=u.role==="organizer"?'<span class="role-tag org">ORG</span>':u.role==="referee"?'<span class="role-tag ref">TT</span>':'';
    H+='<tr>';
    H+='<td>'+esc(dispName)+(isMe?'<span class="me-badge">BẠN</span>':'')+roleTag+'</td>';
    H+='<td><select onchange="chRole(\''+u.user_id+"',this.value)\">";
    if(isAdmin()){
      ["referee","organizer","admin"].forEach(function(rr){H+='<option value="'+rr+'"'+(u.role===rr?" selected":"")+'>'+rr+'</option>';});
    }else{
      H+='<option value="referee"'+(u.role==="referee"?" selected":"")+'>referee</option>';
    }
    H+='</select></td>';
    H+='<td><div class="user-actions">';
    H+='<button class="btn btn-b btn-xs" onclick="editUserName(\''+u.user_id+'\')" title="Sửa tên">✏️</button>';
    if(isMe){H+='<button class="btn btn-w btn-xs" onclick="changeMyPassword()" title="Đổi mật khẩu của bạn">🔑</button>';}
    H+='<button class="btn btn-d btn-xs" onclick="deleteUser(\''+u.user_id+'\')" title="Xóa user">🗑</button>';
    H+='</div></td>';
    H+='</tr>';
  });
  H+='</tbody></table></div>';
  return H;
}

function renderTeamsSection(){
  var H='<div class="section-divider"><div class="section-title">👥 TẠO ĐỘI</div>';
  if(!S.eid){
    H+=S.events.length===0?'<div class="alert">⚠ Chưa có nội dung. Bấm ➕ Tạo nội dung.</div>':'<div class="alert">⚠ Chọn nội dung để tạo đội</div>';
    H+='</div>';
    return H;
  }
  
  var ev=S.events.find(function(e){return e.id===S.eid;});
  if(ev){var ruleText=ev.rating_rule==="max_total"?'Tổng trình ≤ '+ev.rating_limit:'Mở (không giới hạn trình)';H+='<div class="ev-info">📋 Đang chọn: <b>'+esc(ev.code)+'. '+esc(ev.name)+'</b><span class="ev-rule">'+esc(ruleText)+'</span></div>';}
  
  var available=getAvailablePlayers();
  var usedCount=S.players.length-available.length;
  H+='<div class="player-usage"><span>👥 VĐV khả dụng: <b class="'+(available.length>0?"ok":"warn")+'">'+available.length+' / '+S.players.length+'</b></span><span style="font-size:11px;color:var(--mu)">Đã ghép cặp: <b>'+usedCount+'</b></span></div>';
  
  if(available.length===0&&S.players.length>0){H+='<div class="alert">⚠ Tất cả VĐV đã ghép cặp.</div>';}
  else if(S.players.length===0){H+='<div class="alert">⚠ Chưa có VĐV. '+ (isAdmin()?"Thêm VĐV ở Bước 1.":"Yêu cầu admin thêm VĐV.")+'</div>';}
  else{
    H+='<div class="fg"><select id="tp1" onchange="syncPlayerOptions(\'tp1\',\'tp2\');updateTotalPreview()"><option value="">-- VĐV1 --</option>';
    available.forEach(function(p){H+='<option value="'+p.id+'" data-available="1">'+esc(p.full_name)+' ('+(p.skill_rating||"-")+')</option>';});
    H+='</select><select id="tp2" onchange="syncPlayerOptions(\'tp2\',\'tp1\');updateTotalPreview()"><option value="">-- VĐV2 --</option>';
    available.forEach(function(p){H+='<option value="'+p.id+'" data-available="1">'+esc(p.full_name)+' ('+(p.skill_rating||"-")+')</option>';});
    H+='</select><button class="btn btn-p" onclick="saveTeam()">➕ Tạo đội</button></div>';
    H+='<div id="total-preview" class="total-preview"></div>';
    H+='<div class="hint">💡 VĐV đã ghép cặp tự ẩn. Tổng trình phải ≤ giới hạn nội dung.</div>';
  }
  
  if(S.teams.length){
    H+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><button class="btn btn-b btn-s" onclick="exportTeamsCSV()">📥 CSV ('+S.teams.length+' đội)</button></div>';
    
    var groupOptions='';
    if(S.gStage && S.groups.length){
      S.groups.filter(function(g){return g.stage_id===S.gStage.id;}).sort(function(a,b){return a.code.localeCompare(b.code);}).forEach(function(g){
        var count=teamsInG(g.id).length;
        groupOptions+='<option value="'+g.id+'">Bảng '+g.code+' ('+count+'/4)</option>';
      });
    }
    
    H+='<div class="tw"><table><thead><tr><th>STT</th><th>Tên đội</th><th>VĐV 1</th><th>VĐV 2</th><th>Tổng</th><th>Bảng ▼</th><th></th></tr></thead><tbody>';
    S.teams.forEach(function(tm,i){
      var p1=null,p2=null;(tm.members||[]).forEach(function(m){if(m.position===1)p1=m.players;else if(m.position===2)p2=m.players;});
      var n1=p1&&p1.full_name?esc(p1.full_name):"—",n2=p2&&p2.full_name?esc(p2.full_name):"—";
      var overLimit=ev&&ev.rating_rule==="max_total"&&ev.rating_limit&&tm.total_rating>ev.rating_limit;
      var ratingHtml=overLimit?'<b style="color:var(--rd)">'+tm.total_rating.toFixed(2)+' ⚠</b>':'<b style="color:var(--li)">'+tm.total_rating.toFixed(2)+'</b>';
      
      var currentGid=teamCurrentGroup(tm.id);
      
      var selHtml='<option value="">-- Chưa xếp --</option>';
      if(S.gStage && S.groups.length){
        S.groups.filter(function(g){return g.stage_id===S.gStage.id;}).sort(function(a,b){return a.code.localeCompare(b.code);}).forEach(function(g){
          var count=teamsInG(g.id).length;
          var isSelected=g.id===currentGid;
          var isFull=count>=4 && !isSelected;
          var label='Bảng '+g.code+' ('+count+'/4)'+(isFull?' — đầy':'');
          selHtml+='<option value="'+g.id+'"'+(isSelected?' selected':'')+(isFull?' disabled':'')+'>'+label+'</option>';
        });
      }
      
      H+='<tr>';
      H+='<td>'+(i+1)+'</td>';
      H+='<td><b>'+esc(sn(tm.name))+'</b></td>';
      H+='<td>'+n1+'</td>';
      H+='<td>'+n2+'</td>';
      H+='<td>'+ratingHtml+'</td>';
      H+='<td>';
      if(S.gStage && S.groups.length){
        H+='<select class="team-group-select" onchange="assignTeamGroup(\''+tm.id+'\',this.value)">'+selHtml+'</select>';
      }else{
        H+='<span style="color:var(--mu);font-size:11px;font-style:italic">Chưa tạo bảng</span>';
      }
      H+='</td>';
      H+='<td><button class="btn btn-d btn-s" onclick="delTeam(\''+tm.id+'\')">🗑</button></td>';
      H+='</tr>';
    });
    H+='</tbody></table></div>';
    H+='<div class="hint">💡 Chọn bảng từ dropdown → đội tự động chuyển sang Bước 4 (Lịch thi đấu). Bảng đầy 4 đội sẽ bị disable.</div>';
  }else if(S.eid){H+='<div class="info">Chưa có đội. Chọn 2 VĐV và bấm <b>➕ Tạo đội</b>.</div>';}
  
  H+='</div>';
  return H;
}

/* === MAIN RENDER === */
function render(){
  if(!canAccessAdmin())return;
  try{
    var t=S.tournament;
    var gm=S.matches.filter(function(m){return m.group_id;});
    var km=S.matches.filter(function(m){return!m.group_id;});
    var H="";
    H+='<div class="acc">'+accH("1","VĐV","s1",S.players.length?"done":"empty",S.players.length+" VĐV");
    H+='<div class="acc-b'+(S.acc.s1?" open":"")+'">';
    if(isAdmin()){
      H+='<div class="fg"><input id="p-name" placeholder="Họ tên"/><select id="p-gender"><option value="male">Nam</option><option value="female">Nữ</option></select><input id="p-rating" type="number" step="0.05" placeholder="Rating"/><input id="p-club" placeholder="Club"/><button class="btn btn-p" onclick="saveP()">➕ Thêm</button></div>';
    }else{
      H+='<div class="info">👁️ Danh sách VĐV do admin quản lý. Bạn chỉ dùng để tạo đội cho giải của mình.</div>';
    }
    if(S.players.length){
      H+='<div class="tw"><table><thead><tr><th>Họ tên</th><th>GT</th><th>Rating</th><th>Club</th>'+(isAdmin()?"<th></th>":"")+'</tr></thead><tbody>';
      S.players.forEach(function(p){
        H+='<tr><td>'+esc(p.full_name)+'</td><td>'+(p.gender==="male"?"Nam":"Nữ")+'</td><td>'+(p.skill_rating||"-")+'</td><td>'+esc(p.club_name||"-")+'</td>';
        if(isAdmin())H+='<td><button class="btn btn-d btn-s" onclick="delP(\''+p.id+'\')">🗑</button></td>';
        H+='</tr>';
      });
      H+='</tbody></table></div>';
    }
    H+='</div></div>';
    H+='<div class="acc">'+accH("2","Tạo giải","s2",S.tournaments.length?"done":"empty",S.tournaments.length+" giải");
    H+='<div class="acc-b'+(S.acc.s2?" open":"")+'"><div class="fg"><input id="t-name" placeholder="Tên giải"/><input id="t-location" placeholder="📍 Địa điểm"/><input id="t-start" type="date"/><input id="t-end" type="date"/><button class="btn btn-p" onclick="createT()">➕ Tạo</button></div>';
    if(isOrganizer())H+='<div class="hint">💡 Bạn là Organizer: chỉ quản lý được giải do chính bạn tạo.</div>';
    H+='</div></div>';
    var t3st="empty";if(S.teams.length>=16)t3st="done";else if(S.teams.length>0)t3st="part";else if(S.eid)t3st="part";
    H+='<div class="acc">'+accH("3","Giải đấu · Nội dung · Tạo đội","s3",t3st,S.teams.length+(S.eid?"/16":""));
    H+='<div class="acc-b'+(S.acc.s3?" open":"")+'">';
    if(!S.tournament){H+='<div class="alert">⚠ Chưa có giải. Tạo giải ở Bước 2.</div>';
    }else{
      H+='<div class="fg"><select onchange="selT(this.value)">';
      sortedT().forEach(function(x){var s=(t&&t.id===x.id)?" selected":"";var icon=x.status==="completed"?"🔒 ":"";var loc=x.location_name?' · 📍 '+esc(x.location_name):'';H+='<option value="'+x.id+'"'+s+'>'+icon+esc(x.name)+loc+'</option>';});
      H+='</select></div>';
      var isOpen=t.status!=="completed";
      H+='<div class="t-actions">';
      if(isOpen){H+='<span class="t-status open">🟢 ĐANG MỞ</span><button class="btn btn-w" onclick="toggleTournament()">🔒 Đóng giải</button>';}
      else{H+='<span class="t-status closed">🔴 ĐÃ ĐÓNG</span><button class="btn btn-b" onclick="toggleTournament()">🔓 Mở giải</button>';}
      H+='<button class="btn btn-d" onclick="delT(\''+t.id+'\')">🗑 Xóa giải</button></div>';
      if(!isOpen)H+='<div class="alert" style="margin-top:8px">⚠ Giải đã ĐÓNG — Trọng tài không thể đăng nhập.</div>';
      H+='<div class="fg" style="margin-top:8px"><input id="t-name-edit" placeholder="✏️ Sửa tên giải" value="'+esc(t.name||'')+'"/><button class="btn btn-b" onclick="updateTName()">💾 Tên</button><input id="t-location-edit" placeholder="📍 Sửa địa điểm" value="'+esc(t.location_name||'')+'"/><button class="btn btn-b" onclick="updateTLocation()">💾 Địa điểm</button></div>';
      H+='<div class="info" style="margin-top:6px">📅 '+esc(t.start_date||"—")+' → '+esc(t.end_date||"—")+' · 📍 '+esc(t.location_name||"Chưa có")+'</div>';
      H+='<div class="section-divider"><div class="section-title">📋 NỘI DUNG THI ĐẤU</div>';
      H+='<div class="fg"><select onchange="selE(this.value)" id="event-selector"><option value="">-- Chọn nội dung --</option>';
      S.events.forEach(function(e){var sel=(S.eid===e.id)?" selected":"";var rule=e.rating_rule==="max_total"?" · Tổng ≤"+e.rating_limit:" · Mở";H+='<option value="'+e.id+'"'+sel+'>'+esc(e.code)+'. '+esc(e.name)+rule+'</option>';});
      H+='</select><button class="btn btn-b btn-s" onclick="quickCreateEvent()">➕ Tạo nội dung</button></div>';
      if(S.events.length){H+='<div class="tw"><table><thead><tr><th>Mã</th><th>Tên</th><th>Giới hạn</th><th>Luật</th><th colspan="2">Thao tác</th></tr></thead><tbody>';S.events.forEach(function(e){var rule=e.rating_rule==="max_total"?"Tổng ≤"+e.rating_limit:"Mở";H+='<tr><td>'+esc(e.code)+'</td><td>'+esc(e.name)+'</td><td>'+(e.rating_limit||"—")+'</td><td>'+esc(rule)+'</td><td><button class="btn btn-b btn-s" onclick="editEventName(\''+e.id+'\')">✏️</button></td><td><button class="btn btn-d btn-s" onclick="delE(\''+e.id+'\')">🗑</button></td></tr>';});H+='</tbody></table></div>';}
      H+='</div>';
      H+=renderSponsorSection();
      H+=renderTeamsSection();
    }
    H+='</div></div>';
    var s4st=(gm.length===24&&km.length===7)?"done":(gm.length||km.length?"part":"empty");
    H+='<div class="acc">'+accH("4","Lịch + Trọng tài","s4",s4st,gm.length+"/24 · KO "+km.length+"/7");
    H+='<div class="acc-b'+(S.acc.s4?" open":"")+'">'+renderSchedule()+'</div></div>';
    H+='<div class="acc">'+accH("5","Người dùng & Trọng tài","s5",S.users.length?"done":"empty",S.users.length+" user");
    H+='<div class="acc-b'+(S.acc.s5?" open":"")+'">';
    if(isOrganizer()){
      H+='<div class="info">👨‍⚖️ Bạn chỉ tạo được <b>trọng tài (referee)</b> cho riêng mình. Trọng tài do bạn tạo chỉ dùng được cho giải của bạn.</div>';
    }
    H+='<div class="fg"><input id="nu-email" placeholder="Tên user (VD: trongtai1)"/><input id="nu-pass" value="'+esc(CFG.PASS)+'"/>';
    if(isAdmin()){
      H+='<select id="nu-role"><option value="referee">referee</option><option value="organizer">organizer</option><option value="admin">admin</option></select>';
    }else{
      H+='<select id="nu-role"><option value="referee">referee</option></select>';
    }
    H+='<button class="btn btn-p" onclick="createUser()">➕ Tạo</button></div>';
    H+='<div class="hint">💡 Nhập tên → tự thêm <b>@gmail.com</b>. MK mặc định: 123@321</div>';
    if(S.user){H+='<div style="margin-bottom:8px"><button class="btn btn-w btn-s" onclick="changeMyPassword()">🔑 Đổi mật khẩu của tôi</button></div>';}
    H+=renderUserTable();
    H+='</div></div>';
    el("admin").innerHTML=H;
    setTimeout(function(){
      S.draft.forEach(function(m,i){var rows=document.querySelectorAll(".mrow");if(rows[i]){var s=rows[i].querySelectorAll("select");if(s[0])s[0].value=m.h||"";if(s[1])s[1].value=m.a||"";}});
      updateTotalPreview();
      updateSchedPreview();
    },50);
  }catch(e){console.error("render error:",e);el("admin").innerHTML='<div class="alert">❌ Lỗi render: '+esc(e.message)+'</div>';}
}

(async function init(){try{var d=await sb.auth.getSession();if(d.data&&d.data.session){await loadProfile(d.data.session);applyUI();if(canAccessAdmin())await loadAll();else el("admin").innerHTML='<div class="alert">⚠ Chỉ admin/organizer mới truy cập được.</div>';}else{applyUI();el("admin").innerHTML='<div class="info">Vui lòng đăng nhập.</div>';}}catch(e){el("admin").innerHTML='<div class="alert">❌ Lỗi: '+esc(e.message)+'</div>';}})();
</script>
</body>
</html>
