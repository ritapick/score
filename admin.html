<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Quản trị - Pickleball Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit}.hidden{display:none!important}
h1,h3,h4,.logo{font-family:'Oswald',sans-serif;letter-spacing:.03em}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.94);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back-btn{background:rgba(148,163,184,.15);color:var(--mu);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700}
.logo{color:var(--li);font-weight:700;font-size:18px;text-transform:uppercase;font-style:italic}.logo span{color:var(--tx)}
.nav-right{display:flex;gap:6px;flex-wrap:wrap}
.user-chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:5px 10px;border-radius:999px}
.btn{border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:800;text-transform:uppercase;transition:.15s}
.btn-primary{background:var(--li);color:#0b1220}.btn-primary:hover{background:#bef264}
.btn-blue{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}.btn-dark{background:#1e293b;color:var(--tx);border:1px solid var(--ln)}.btn-light{background:rgba(148,163,184,.15);color:var(--mu)}.btn-danger{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}.btn-warn{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}.btn-sm{padding:4px 9px;font-size:11px}
.hero{padding:22px;margin:12px;border-radius:16px;background:linear-gradient(120deg,#14532d,#3f6212 60%,#166534);border:1px solid rgba(163,230,53,.35)}
.hero h1{margin:0 0 6px;font-size:24px;text-transform:uppercase}.hero p{margin:0;opacity:.9;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:0 12px 20px}
.card{padding:8px 2px;margin-bottom:14px}
.card h3{margin:0 0 12px;color:var(--li);text-transform:uppercase;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card.disabled{opacity:.45;pointer-events:none}
.step-num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:8px;background:var(--li);color:#0b1220;font-size:14px;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;color:var(--tx);width:100%}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.b-green{background:rgba(163,230,53,.15);color:var(--li)}.b-blue{background:rgba(34,211,238,.15);color:var(--cy)}.b-red{background:rgba(248,113,113,.15);color:var(--rd)}.b-gray{background:rgba(148,163,184,.15);color:var(--mu)}.b-warn{background:rgba(251,146,60,.15);color:var(--or)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:400px}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--mu);font-size:10px;text-transform:uppercase;position:sticky;top:0;background:var(--bg)}
.edit-row{background:rgba(251,146,60,.12)!important}.new-row{background:rgba(163,230,53,.12)!important}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.group-card{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px;min-height:140px}
.group-card h4{margin:0 0 8px;color:var(--li);text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.group-card.unassigned{border-color:var(--or);border-style:dashed}
.group-card.unassigned h4{color:var(--or)}
.group-team{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);font-size:13px}
.group-team:last-child{border-bottom:none}
.group-team .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-team select{min-width:100px}
.group-team button{background:rgba(248,113,113,.15);color:var(--rd);border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px}
.muted{color:var(--mu);font-size:13px}
.preview{margin:6px 0 10px;font-size:13px;color:var(--mu)}.preview b{color:var(--li)}
.alert-box{padding:12px;border-radius:12px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.35);color:var(--or);font-size:13px;margin-bottom:12px}
.stat-box{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.stat-item{flex:1;min-width:120px;text-align:center}
.stat-item .label{font-size:10px;color:var(--mu);text-transform:uppercase;font-weight:700}
.stat-item .value{font-size:22px;font-weight:700;color:var(--li);font-family:'Oswald'}
.stat-item .value.warn{color:var(--or)}
.stat-item .value.done{color:var(--li)}
.progress-bar{height:8px;background:#0d1626;border-radius:4px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;background:var(--li);transition:width .3s}
td select.ref-sel{background:#0d1626;border:1px solid var(--ln);border-radius:6px;padding:4px 6px;color:var(--tx);font-size:11px;min-width:110px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 18px;border-radius:999px;font-weight:800;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s}.toast.show{opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}.modal-backdrop.show{display:flex}
.modal{width:min(460px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px}
.modal h3{margin:0 0 4px;text-transform:uppercase;color:var(--li)}.modal .sub{color:var(--mu);font-size:13px;margin-bottom:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--mu);text-transform:uppercase}
.field input{width:100%;background:#0d1626;border:1px solid var(--ln);border-radius:10px;padding:11px;color:var(--tx)}
.msg{padding:10px;border-radius:10px;font-size:13px;margin-top:12px;display:none;white-space:pre-wrap}.msg.show{display:block}.msg-error{background:rgba(248,113,113,.15);color:var(--rd)}.msg-info{background:rgba(34,211,238,.15);color:var(--cy)}
@media(max-width:760px){main{padding:0 8px 20px}.sel-row{grid-template-columns:1fr}.hero h1{font-size:20px}table{min-width:320px}th,td{padding:8px 6px;font-size:12px}}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row"><button class="back-btn" onclick="location.href='index.html'">← Trang chủ</button><span class="logo">⚙ Quản <span>trị</span></span></div>
<div class="nav-right">
<span id="user-chip" class="user-chip hidden"></span>
<button id="login-btn" class="btn btn-primary" onclick="openLogin()">Đăng nhập</button>
<button id="logout-btn" class="btn btn-light hidden" onclick="logout()">Đăng xuất</button>
</div></nav>
<div class="hero"><h1>⚙ Bảng điều khiển quản trị</h1><p>Tạo giải → Nội dung → VĐV → Đội → <b>Phân bảng</b> → <b>Lịch + Trọng tài</b></p></div>
<main><div id="admin-content"></div></main>
<div id="toast" class="toast"></div>
<div id="login-modal" class="modal-backdrop"><div class="modal">
<h3>🔐 Đăng nhập</h3><div class="sub">Mặc định 123@321</div>
<div class="field"><label>Email</label><input id="login-username" placeholder="admin@gmail.com"/></div>
<div class="field"><label>Mật khẩu</label><input id="login-password" type="password"/></div>
<div class="actions" style="justify-content:flex-end"><button class="btn btn-light" onclick="closeLogin()">Đóng</button><button class="btn btn-primary" onclick="doLogin()">Đăng nhập</button></div>
<div id="login-message" class="msg"></div>
</div></div>
<script>
/* ============================================================
   ADMIN.HTML v7 — Pickleball Pro
   Luồng: Giải → Nội dung → VĐV → Đội(+thống kê) → Phân bảng
         → Tạo 31 trận + Xóa lịch + Phân TT
============================================================ */
var SUPABASE_URL="https://mvefkcaqvjflrgmaybev.supabase.co",
    SUPABASE_ANON_KEY="sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc",
    DEFAULT_PASS="123@321",EMAIL_DOMAIN="@pb-local.app",
    GROUP_CODES=["A","B","C","D"],
    TARGET_TEAMS_PER_GROUP=4,
    TOTAL_TARGET_TEAMS=16,
    TEAM_SELECT="id,name,seed,status,event_id,team_members(player_id,position,players(id,full_name,skill_rating))";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var state={session:null,user:null,role:null,username:null,
  tournaments:[],tournament:null,events:[],currentEventId:null,
  courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],
  groupStage:null,knockoutStage:null,users:[],referees:[],refAssign:{},openTournaments:[],
  editingEventId:null,editingPlayerId:null,editingTeamId:null,editingTeamOriginal:null,lastCreatedEventId:null,
  t5:{tid:null,eid:null,events:[],teams:[]},
  t6:{tid:null,eid:null,events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null,matches:[],scheduleReady:false}};
function el(i){return document.getElementById(i);}
function isLocked(){return state.tournament?.status==="completed";}
function isAdmin(){return state.role==="admin"||state.role==="organizer";}
function shortName(n){return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function findTeam(id){var i;for(i=0;i<state.teams.length;i++)if(state.teams[i].id===id)return state.teams[i];for(i=0;i<state.t6.teams.length;i++)if(state.t6.teams[i].id===id)return state.t6.teams[i];for(i=0;i<state.t5.teams.length;i++)if(state.t5.teams[i].id===id)return state.t5.teams[i];return null;}
function teamName(id){if(!id)return '<span class="muted">TBD</span>';var t=findTeam(id);return t?shortName(t.name):"TBD";}
function mapTeams(a){var o=[],i,k;a=a||[];for(i=0;i<a.length;i++){var t=a[i],m=t.team_members||[],tot=0;for(k=0;k<m.length;k++)tot+=(m[k].players&&m[k].players.skill_rating)||0;o.push(Object.assign({},t,{members:m,total_rating:Number(tot.toFixed(2))}));}return o;}
function ratingCheck(t,ev){if(!ev||ev.rating_limit==null)return{ok:true,msg:""};var r=ev.rating_rule||"max_total";if(r==="open")return{ok:true,msg:""};if(r==="exact_total"){var ok=Math.abs(t-ev.rating_limit)<=0.005;return{ok:ok,msg:ok?"✅ Đúng "+ev.rating_limit:"❌ Phải đúng "+ev.rating_limit+" (hiện "+t.toFixed(2)+")"};}var ok2=t<=ev.rating_limit;return{ok:ok2,msg:ok2?"✅ Hợp lệ (≤ "+ev.rating_limit+")":"❌ Vượt "+ev.rating_limit+" (hiện "+t.toFixed(2)+")"};}
function autoTeamName(a,b){return a&&b?a.full_name+" – "+b.full_name:"";}
function playerLabel(p){return p.full_name+" ("+(p.skill_rating!=null?Number(p.skill_rating).toFixed(2):"")+")";}
function pad(n,l){return String(n).padStart(l,"0");}
function roundRobinPairs(){return[{round:1,slot:1,a:0,b:3},{round:1,slot:2,a:1,b:2},{round:2,slot:1,a:0,b:2},{round:2,slot:2,a:3,b:1},{round:3,slot:1,a:0,b:1},{round:3,slot:2,a:2,b:3}];}
function sortedTournaments(){return state.tournaments.slice().sort(function(a,b){var ao=a.status==="completed"?1:0,bo=b.status==="completed"?1:0;if(ao!==bo)return ao-bo;return String(a.created_at||"").localeCompare(String(b.created_at||""));});}
function nextTournamentCode(){var used={},i;for(i=0;i<state.tournaments.length;i++)used[state.tournaments[i].code]=1;var n=1;while(used[pad(n,3)])n++;return pad(n,3);}
function nextEventCode(){var used={},i;for(i=0;i<state.events.length;i++)used[state.events[i].code]=1;var n=1;while(used[pad(n,2)])n++;return pad(n,2);}
function showToast(msg,type){var t=el("toast");t.textContent=msg;t.className="toast show";t.style.background=type==="err"?"var(--rd)":"var(--li)";t.style.color=type==="err"?"#fff":"#0b1220";clearTimeout(window._tTO);window._tTO=setTimeout(()=>t.classList.remove("show"),type==="err"?5000:2000);}

/* ===== AUTH ===== */
function openLogin(){el("login-modal").classList.add("show");el("login-message").className="msg";el("login-username").value="";el("login-password").value="";setTimeout(()=>el("login-username").focus(),100);}
function closeLogin(){el("login-modal").classList.remove("show");}
function loginMsg(t,m){var b=el("login-message");b.className="msg show msg-"+t;b.textContent=m;}
async function doLogin(){
  var raw=el("login-username").value.trim(),p=el("login-password").value;
  if(!raw||!p){loginMsg("error","Nhập đủ email và mật khẩu.");return;}
  loginMsg("info","Đang đăng nhập...");
  var cands=raw.includes("@")?[raw]:[raw,raw+EMAIL_DOMAIN],last=null;
  for(var i=0;i<cands.length;i++){
    var r=await sb.auth.signInWithPassword({email:cands[i],password:p});
    if(!r.error&&r.data.session){closeLogin();await loadMyProfile(r.data.session);applyAuthUI();await loadUsers();await loadReferees();renderAdmin();showToast("✅ Xin chào "+state.username);return;}
    if(r.error)last=r.error;
  }
  var msg="❌ "+(last?.message||"Lỗi");
  if(last&&/confirmed/i.test(last.message))msg+="\n⚠️ Tắt Confirm email trong Supabase.";
  loginMsg("error",msg);
}
async function logout(){await sb.auth.signOut();state.session=null;state.user=null;state.role=null;applyAuthUI();renderAdmin();}
async function loadMyProfile(s){
  state.session=s;state.user=s.user;
  var r=await sb.from("user_roles").select("role").eq("user_id",s.user.id);
  var roles=(r.data||[]).map(x=>x.role);
  state.role=roles.includes("admin")?"admin":roles.includes("organizer")?"organizer":roles.includes("referee")?"referee":null;
  if(state.role==="admin"||state.role==="organizer")await sb.from("app_users").upsert({user_id:s.user.id,username:s.user.email,display_name:s.user.email});
  var au=await sb.from("app_users").select("username").eq("user_id",s.user.id).maybeSingle();
  state.username=au?.username||s.user.email;
}
function applyAuthUI(){
  var logged=!!state.user;
  el("login-btn").classList.toggle("hidden",logged);
  el("logout-btn").classList.toggle("hidden",!logged);
  el("user-chip").classList.toggle("hidden",!logged);
  if(logged)el("user-chip").textContent=(state.username||"")+(state.role?" • "+state.role:"");
  if(!isAdmin()&&logged){document.querySelector("main").innerHTML='<div style="padding:40px;text-align:center"><h2 style="color:var(--rd)">⚠ Không có quyền</h2><p>Chỉ admin/organizer mới truy cập.</p><a href="index.html">← Về trang chủ</a></div>';}
}

/* ===== LOAD DATA ===== */
async function loadTournaments(){var d=await sb.from("tournaments").select("*").order("status",{ascending:true}).order("start_date",{ascending:false});state.tournaments=d.data||[];}
async function selectTournament(id){
  state.tournament=null;for(var i=0;i<state.tournaments.length;i++)if(state.tournaments[i].id===id)state.tournament=state.tournaments[i];
  state.editingEventId=null;state.editingPlayerId=null;state.editingTeamId=null;
  if(!state.tournament){renderAdmin();return;}
  var e=await sb.from("events").select("*").eq("tournament_id",id);state.events=e.data||[];
  var c=await sb.from("courts").select("*").eq("tournament_id",id).order("display_order");state.courts=c.data||[];
  var p=await sb.from("players").select("*").order("full_name");state.players=p.data||[];
  if(state.events.length)await selectEvent(state.events[0].id);else{state.currentEventId=null;state.teams=[];state.matches=[];renderAdmin();}
}
async function selectEvent(id){
  state.currentEventId=id||null;state.editingTeamId=null;
  if(!state.currentEventId){renderAdmin();return;}
  var t=await sb.from("teams").select(TEAM_SELECT).eq("event_id",id);state.teams=mapTeams(t.data);
  var st=await sb.from("stages").select("*").eq("event_id",id).order("stage_order");state.stages=st.data||[];
  state.groupStage=state.stages.find(s=>s.stage_type==="group_stage")||null;
  state.knockoutStage=state.stages.find(s=>s.stage_type==="knockout")||null;
  var sids=state.stages.map(s=>s.id);
  if(sids.length){
    var g=await sb.from("groups").select("*").in("stage_id",sids).order("code");state.groups=g.data||[];
    var gt=await sb.from("group_teams").select("*").in("stage_id",sids);state.groupTeams=gt.data||[];
  }else{state.groups=[];state.groupTeams=[];}
  var m=await sb.from("matches").select("*").eq("event_id",id).order("match_seq");state.matches=m.data||[];
  await loadRefAssign();
  renderAdmin();
}
async function loadScope(tId,eId,wg){
  var out={events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null,matches:[]};
  if(!tId)return out;
  var e=await sb.from("events").select("*").eq("tournament_id",tId);out.events=e.data||[];
  if(eId){
    var tm=await sb.from("teams").select(TEAM_SELECT).eq("event_id",eId);out.teams=mapTeams(tm.data);
    var m=await sb.from("matches").select("*").eq("event_id",eId).order("match_seq");out.matches=m.data||[];
    if(wg){
      var st=await sb.from("stages").select("*").eq("event_id",eId).order("stage_order");
      var ss=st.data||[],i;
      for(i=0;i<ss.length;i++){if(ss[i].stage_type==="group_stage")out.groupStage=ss[i];if(ss[i].stage_type==="knockout")out.knockoutStage=ss[i];}
      var ids=ss.map(s=>s.id);
      if(ids.length){
        var g=await sb.from("groups").select("*").in("stage_id",ids).order("code");out.groups=g.data||[];
        var gt=await sb.from("group_teams").select("*").in("stage_id",ids);out.groupTeams=gt.data||[];
      }
    }
  }
  return out;
}
async function setT5Tournament(id){state.t5.tid=id||null;state.t5.eid=null;state.t5.teams=[];var s=await loadScope(id,null,false);state.t5.events=s.events;if(s.events.length){state.t5.eid=s.events[0].id;var s2=await loadScope(id,state.t5.eid,false);state.t5.teams=s2.teams;}renderAdmin();}
async function setT5Event(id){state.t5.eid=id||null;var s=await loadScope(state.t5.tid,id,false);state.t5.teams=s.teams;renderAdmin();}
async function setT6Tournament(id){state.t6.tid=id||null;state.t6.eid=null;var s=await loadScope(id,null,true);state.t6.events=s.events;if(s.events.length){state.t6.eid=s.events[0].id;var s2=await loadScope(id,state.t6.eid,true);Object.assign(state.t6,s2);}else Object.assign(state.t6,{teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null,matches:[]});renderAdmin();}
async function setT6Event(id){state.t6.eid=id||null;var s=await loadScope(state.t6.tid,id,true);Object.assign(state.t6,s);await loadRefAssign();renderAdmin();}
async function refreshOpenTournaments(){var d=await sb.from("tournaments").select("*").neq("status","completed").order("start_date",{ascending:false});state.openTournaments=d.data||[];}
async function loadUsers(){
  var au=await sb.from("app_users").select("*"),ur=await sb.from("user_roles").select("*"),map={},i;
  for(i=0;i<(au.data||[]).length;i++){var u=au.data[i];map[u.user_id]=Object.assign({},u,{role:null});}
  for(i=0;i<(ur.data||[]).length;i++){var r=ur.data[i];if(!map[r.user_id])map[r.user_id]={user_id:r.user_id,username:"(chưa có)"};map[r.user_id].role=r.role;}
  var arr=[];for(var k in map)arr.push(map[k]);state.users=arr;
}
async function loadReferees(){
  var ur=await sb.from("user_roles").select("user_id").eq("role","referee");
  var uids=(ur.data||[]).map(r=>r.user_id);

async function ensureEventMatches(tId,eId){
  if(!tId||!eId)return 0;
  var stRes=await sb.from("stages").select("*").eq("event_id",eId).order("stage_order");
  var stArr=stRes.data||[];
  var groupStage=stArr.find(s=>s.stage_type==="group_stage");
  var knockoutStage=stArr.find(s=>s.stage_type==="knockout");
  if(!groupStage){var r1=await sb.from("stages").insert({event_id:eId,code:"GRP",name:"Vòng bảng",stage_type:"group_stage",stage_order:1}).select().single();if(r1.data)groupStage=r1.data;}
  if(!knockoutStage){var r2=await sb.from("stages").insert({event_id:eId,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2}).select().single();if(r2.data)knockoutStage=r2.data;}
  if(!groupStage||!knockoutStage)return 0;
  for(var gi=0;gi<4;gi++){
    var code=GROUP_CODES[gi];
    var gRes=await sb.from("groups").select("*").eq("stage_id",groupStage.id).eq("code",code);
    if(!gRes.data||gRes.data.length===0)await sb.from("groups").insert({stage_id:groupStage.id,code:code,name:"Bảng "+code,max_teams:4});
  }
  var gAllRes=await sb.from("groups").select("*").eq("stage_id",groupStage.id).order("code");
  var gAll=gAllRes.data||[];
  var allT=await sb.from("tournaments").select("*");
  var allTArr=allT.data||[];
  allTArr.sort(function(a,b){var ao=a.status==="completed"?1:0,bo=b.status==="completed"?1:0;if(ao!==bo)return ao-bo;return String(a.created_at||"").localeCompare(String(b.created_at||""));});
  var tSeq=allTArr.findIndex(t=>t.id===tId)+1||1;
  var evRes=await sb.from("events").select("*").eq("tournament_id",tId).order("created_at");
  var evArr=evRes.data||[];
  var eSeq=evArr.findIndex(e=>e.id===eId)+1||1;
  function bc(cc){return pad(tSeq,3)+pad(eSeq,1)+pad(cc,2);}
  var exRes=await sb.from("matches").select("match_code").eq("event_id",eId);
  var exCodes={};(exRes.data||[]).forEach(m=>exCodes[m.match_code]=1);
  var ins=[];
  for(gi=0;gi<4;gi++){
    var g=gAll.find(x=>x.code===GROUP_CODES[gi]);if(!g)continue;
    var gTeams=state.t6.teams.filter(t=>state.t6.groupTeams.some(gt=>gt.team_id===t.id&&gt.group_id===g.id)).sort((a,b)=>(a.seed||0)-(b.seed||0));
    if(gTeams.length<4)continue; // chỉ tạo trận khi bảng đủ 4 đội
    roundRobinPairs().forEach(function(pr,mi){
      var cc=gi*6+mi+1;
      if(!exCodes[bc(cc)]){
        ins.push({event_id:eId,tournament_id:tId,stage_id:groupStage.id,group_id:g.id,round:pr.round,bracket_slot:pr.slot,match_code:bc(cc),match_seq:cc,home_team_id:gTeams[pr.a].id,away_team_id:gTeams[pr.b].id,status:"scheduled"});
      }else{
        // Cập nhật tên đội nếu match đã có (đồng bộ khi sửa đội)
        sb.from("matches").update({home_team_id:gTeams[pr.a].id,away_team_id:gTeams[pr.b].id}).eq("event_id",eId).eq("match_code",bc(cc)).then(()=>{});
      }
    });
  }
  for(var s=1;s<=4;s++){var c1=24+s;if(!exCodes[bc(c1)])ins.push({event_id:eId,tournament_id:tId,stage_id:knockoutStage.id,round:1,bracket_slot:s,match_code:bc(c1),match_seq:c1,status:"scheduled"});}
  for(s=1;s<=2;s++){var c2=28+s;if(!exCodes[bc(c2)])ins.push({event_id:eId,tournament_id:tId,stage_id:knockoutStage.id,round:2,bracket_slot:s,match_code:bc(c2),match_seq:c2,status:"scheduled"});}
  var c3=31;if(!exCodes[bc(c3)])ins.push({event_id:eId,tournament_id:tId,stage_id:knockoutStage.id,round:3,bracket_slot:1,match_code:bc(c3),match_seq:c3,status:"scheduled"});
  var insertedCount=0;
  if(ins.length){
    for(var b=0;b<ins.length;b+=10){
      var batch=ins.slice(b,b+10);
      var ir=await sb.from("matches").insert(batch);
      if(!ir.error)insertedCount+=batch.length;
    }
  }
  return insertedCount;
}

async function deleteAllSchedule(){
  if(!state.t6.eid){alert("Chưa có lịch để xóa.");return;}
  if(!confirm("⚠️ XÓA TOÀN BỘ LỊCH THI ĐẤU?\n• Xóa 31 trận + phân công TT\n• Giữ nguyên phân bảng\n• Bấm 'Tạo lại' để sinh lịch mới"))return;
  try{
    var mRes=await sb.from("matches").select("id").eq("event_id",state.t6.eid);
    var mids=(mRes.data||[]).map(m=>m.id);
    if(mids.length)await sb.from("referee_matches").delete().in("match_id",mids);
    await sb.from("matches").delete().eq("event_id",state.t6.eid);
    // Xóa stages để lần sau tạo lại sạch
    var stRes=await sb.from("stages").select("id").eq("event_id",state.t6.eid);
    var sids=(stRes.data||[]).map(s=>s.id);
    if(sids.length){await sb.from("groups").delete().in("stage_id",sids);await sb.from("stages").delete().in("id",sids);}
    showToast("✅ Đã xóa toàn bộ lịch");
    await setT6Event(state.t6.eid);
  }catch(e){alert("❌ "+e.message);}
}
async function assignMatchRef(matchId,userId){
  await sb.from("referee_matches").delete().eq("match_id",matchId);
  if(userId){var r=await sb.from("referee_matches").insert({user_id:userId,match_id:matchId});if(r.error){alert(r.error.message);return;}}
  showToast(userId?"✅ Phân công TT":"✅ Bỏ phân công");
  await loadRefAssign();renderAdmin();
}
async function assignGroupRef(groupId,userId){
  var ms=state.t6.matches.filter(m=>m.group_id===groupId);
  for(var i=0;i<ms.length;i++){
    await sb.from("referee_matches").delete().eq("match_id",ms[i].id);
    if(userId)await sb.from("referee_matches").insert({user_id:userId,match_id:ms[i].id});
  }
  showToast(userId?"✅ Phân công TT cho bảng":"✅ Bỏ TT bảng");
  await loadRefAssign();renderAdmin();
}
async function assignKORef(round,slot,userId){
  var m=state.t6.matches.find(x=>x.stage_id===state.t6.knockoutStage?.id&&x.round===round&&x.bracket_slot===slot);
  if(!m){alert("Không tìm thấy trận");return;}
  await assignMatchRef(m.id,userId);
}
function goTournament(){
  var id=state.t6.tid||state.tournament?.id;
  if(!id){alert("⚠️ Chọn giải ở Bước 2.");return;}
  location.href='tournament.html?id='+id;
}

async function adminCreateUser(){
  var email=el("nu-email").value.trim(),pass=el("nu-pass").value||DEFAULT_PASS,role=el("nu-role").value;
  if(email.indexOf("@")<0){alert("Email không hợp lệ");return;}
  var tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:"pb-temp",persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var r=await tmp.auth.signUp({email:email,password:pass});
  if(r.error){alert("❌ "+r.error.message+"\n(Tắt Confirm email trong Supabase.)");return;}
  var uid=r.data.user&&r.data.user.id;if(!uid){alert("User tồn tại hoặc cần xác nhận");return;}
  await sb.from("app_users").upsert({user_id:uid,username:email,display_name:email});
  var ir=await sb.from("user_roles").insert({user_id:uid,role:role});
  if(ir.error)await sb.from("user_roles").update({role:role}).eq("user_id",uid);
  showToast("✅ Đã tạo "+email+" / "+role);await loadUsers();await loadReferees();renderAdmin();
}
async function changeRole(uid,role){await sb.from("user_roles").delete().eq("user_id",uid);var r=await sb.from("user_roles").insert({user_id:uid,role:role});if(r.error)alert(r.error.message);await loadUsers();await loadReferees();renderAdmin();}

  // BƯỚC 6: Lịch + TT
  H+='<div class="card"><h3><span class="step-num">6</span> Lịch thi đấu (31 trận) + Phân trọng tài</h3>'+(state.t6.eid&&ev6?'<div class="alert-box">📌 <b>Điều kiện tạo lịch:</b> Đã phân bảng đủ 16 đội (4 bảng × 4 đội). <br>💡 <b>Khi sửa đội:</b> Tên trận đấu tự cập nhật, không cần xóa lịch. <br>🔄 <b>Xóa lịch:</b> Xóa toàn bộ 31 trận + phân công TT, giữ nguyên phân bảng.</div><div class="stat-box"><div class="stat-item"><div class="label">Tổng trận</div><div class="value">'+state.t6.matches.length+'</div></div><div class="stat-item"><div class="label">Trận có TT</div><div class="value">'+state.t6.matches.filter(m=>state.refAssign[m.id]).length+'</div></div><div class="stat-item"><div class="label">TT khả dụng</div><div class="value '+(state.referees.length===0?"warn":"")+'">'+state.referees.length+'</div></div></div><div class="actions"><button class="btn btn-primary" onclick="setupSchedule6()">🏆 Tạo/cập nhật 31 trận</button><button class="btn btn-danger" onclick="deleteAllSchedule()">🗑 Xóa toàn bộ lịch</button><button class="btn btn-blue" onclick="goTournament()">→ Qua trang giải đấu</button></div>'+(state.referees.length===0?'<div class="alert-box">⚠ Chưa có user trọng tài. Tạo ở Bước 7 với quyền <b>referee</b>.</div>':"")+scheduleHTML:'<div class="alert-box">Chọn giải + nội dung ở Bước 5.5.</div>')+"</div>";
  H+='<div class="card"><h3><span class="step-num">7</span> Người dùng '+((state.role==="admin")?'<span class="badge b-blue">admin</span>':"")+"</h3><div class='form-grid'><input id='nu-email' placeholder='Email'/><input id='nu-pass' type='text' value='"+DEFAULT_PASS+"'/><select id='nu-role'><option value='referee'>referee (trọng tài)</option><option value='organizer'>organizer</option><option value='admin'>admin</option></select><button class='btn btn-primary' onclick='adminCreateUser()'>➕ Tạo user</button></div><div class='table-wrap'><table><thead><tr><th>Email</th><th>Quyền</th><th>Đổi quyền</th></tr></thead><tbody>"+(state.users.map(u=>"<tr><td>"+u.username+"</td><td><span class='badge b-blue'>"+(u.role||"-")+"</span></td><td><select onchange='changeRole(\""+u.user_id+'",this.value)\'><option value="referee"'+(u.role==="referee"?" selected":"")+">referee</option><option value='organizer'"+(u.role==="organizer"?" selected":"")+">organizer</option><option value='admin'"+(u.role==="admin"?" selected":"")+">admin</option></select></td></tr>").join("")||'<tr><td colspan="3" class="muted">Chưa có</td></tr>')+"</tbody></table></div></div>";
  el("admin-content").innerHTML=H;
  if(editingT&&editingT.members){
    var p1=editingT.members.find(m=>m.position===1),p2=editingT.members.find(m=>m.position===2);
    if(p1)el("team-p1").value=p1.player_id;if(p2)el("team-p2").value=p2.player_id;
  }
  refreshTeamPlayerSelects();updateTeamEditButtons();
}

(async()=>{
  var d=await sb.auth.getSession();if(d.data.session)await loadMyProfile(d.data.session);
  applyAuthUI();if(!isAdmin()&&state.user)return;
  await refreshOpenTournaments();await loadTournaments();await loadUsers();await loadReferees();
  if(state.tournaments.length)await selectTournament(sortedTournaments()[0].id);else renderAdmin();
})();
</script>
</body>
</html>
