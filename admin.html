<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Quản trị - Pickleball Pro v9</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
button,input,select{font:inherit}.hidden{display:none!important}
h1,h2,h3,h4,.logo{font-family:'Oswald',sans-serif}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back-btn{background:rgba(148,163,184,.15);color:var(--mu);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700}
.logo{color:var(--li);font-weight:700;font-size:18px;text-transform:uppercase;font-style:italic}.logo span{color:var(--tx)}
.nav-right{display:flex;gap:6px;flex-wrap:wrap}
.user-chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:5px 10px;border-radius:999px}
.btn{border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:800;text-transform:uppercase;transition:.15s}
.btn-primary{background:var(--li);color:#0b1220}.btn-primary:hover{background:#bef264}
.btn-blue{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-dark{background:#1e293b;color:var(--tx);border:1px solid var(--ln)}
.btn-light{background:rgba(148,163,184,.15);color:var(--mu)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}
.btn-warn{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
.btn-sm{padding:5px 10px;font-size:11px}
.hero{padding:18px;margin:12px;border-radius:16px;background:linear-gradient(120deg,#14532d,#3f6212 60%,#166534);border:1px solid rgba(163,230,53,.35)}
.hero h1{margin:0 0 6px;font-size:22px;text-transform:uppercase}.hero p{margin:0;opacity:.9;font-size:12px}
main{max-width:1000px;margin:0 auto;padding:0 10px 20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:12px;overflow:hidden}
.accordion-header{padding:14px 16px;background:var(--sf2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none}
.accordion-header.open{border-bottom:1px solid var(--ln)}
.accordion-header h3{margin:0;color:var(--li);text-transform:uppercase;font-size:14px;display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.accordion-header .step-num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:var(--li);color:#0b1220;font-size:13px;font-weight:700;flex-shrink:0}
.accordion-header .status{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:800;flex-shrink:0}
.status-done{background:rgba(163,230,53,.2);color:var(--li)}.status-partial{background:rgba(251,146,60,.2);color:var(--or)}.status-empty{background:rgba(148,163,184,.2);color:var(--mu)}
.chevron{color:var(--mu);transition:transform .2s;flex-shrink:0;font-size:14px}
.accordion-header.open .chevron{transform:rotate(180deg)}
.accordion-body{display:none;padding:16px}
.accordion-body.open{display:block}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;color:var(--tx);width:100%;font-size:13px}
select{cursor:pointer}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.b-green{background:rgba(163,230,53,.15);color:var(--li)}.b-blue{background:rgba(34,211,238,.15);color:var(--cy)}.b-red{background:rgba(248,113,113,.15);color:var(--rd)}.b-gray{background:rgba(148,163,184,.15);color:var(--mu)}.b-warn{background:rgba(251,146,60,.15);color:var(--or)}
.table-wrap{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;min-width:400px}
th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left;font-size:12px;vertical-align:middle}
th{color:var(--mu);font-size:10px;text-transform:uppercase;position:sticky;top:0;background:var(--sf)}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.group-card{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px}
.group-card h4{margin:0 0 10px;color:var(--li);text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.group-team{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-size:12px;gap:6px}
.group-team:last-child{border-bottom:none}
.group-team .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-team button{background:rgba(248,113,113,.15);color:var(--rd);border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px;flex-shrink:0}
.match-row{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:6px;align-items:center;padding:8px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:6px;font-size:12px}
.match-row .num{background:var(--li);color:#0b1220;padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px;min-width:30px;text-align:center;font-family:'Oswald'}
.match-row .vs{color:var(--mu);font-weight:700;padding:0 4px}
.match-row select{padding:6px 8px;font-size:12px}
.match-row .remove{background:rgba(248,113,113,.15);color:var(--rd);border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px}
.ko-row{display:grid;grid-template-columns:80px 1fr auto 1fr auto;gap:6px;align-items:center;padding:10px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:8px;font-size:12px}
.ko-row .label{font-weight:700;color:var(--cy);font-family:'Oswald';font-size:12px;white-space:nowrap}
.alert-box{padding:10px 12px;border-radius:10px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.35);color:var(--or);font-size:12px;margin-bottom:10px}
.info-box{padding:10px 12px;border-radius:10px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cy);font-size:12px;margin-bottom:10px}
.success-box{padding:10px 12px;border-radius:10px;background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.3);color:var(--li);font-size:12px;margin-bottom:10px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat-chip{flex:1;min-width:100px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;text-align:center}
.stat-chip .label{font-size:10px;color:var(--mu);text-transform:uppercase;font-weight:700}
.stat-chip .value{font-size:18px;font-weight:700;color:var(--li);font-family:'Oswald'}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 18px;border-radius:999px;font-weight:800;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}.modal-backdrop.show{display:flex}
.modal{width:min(420px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px}
.modal h3{margin:0 0 10px;text-transform:uppercase;color:var(--li);font-size:16px}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:4px;color:var(--mu);text-transform:uppercase}
.msg{padding:8px;border-radius:8px;font-size:12px;margin-top:8px;display:none;white-space:pre-wrap}.msg.show{display:block}.msg-error{background:rgba(248,113,113,.15);color:var(--rd)}.msg-info{background:rgba(34,211,238,.15);color:var(--cy)}
.ref-sel{background:#0d1626;border:1px solid var(--ln);border-radius:6px;padding:5px 8px;color:var(--tx);font-size:11px;min-width:100px}
.section-title{color:var(--cy);font-size:13px;font-weight:700;text-transform:uppercase;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--ln)}
.unassigned-pool{background:rgba(251,146,60,.08);border:1px dashed var(--or);border-radius:10px;padding:10px;margin:10px 0}
.unassigned-pool h5{margin:0 0 8px;color:var(--or);text-transform:uppercase;font-size:12px}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:4px 10px;font-size:11px;display:inline-flex;gap:6px;align-items:center}
.pill select{width:auto;display:inline;padding:2px 4px;font-size:10px}
.code-display{font-family:'Oswald';color:var(--cy);font-weight:700}
@media(max-width:640px){
  .hero{padding:14px;margin:8px}.hero h1{font-size:18px}
  main{padding:0 6px 20px}.accordion-body{padding:12px}
  .form-grid{grid-template-columns:1fr}
  .match-row{grid-template-columns:1fr;gap:4px}.match-row .num{margin-bottom:4px}.match-row .vs{text-align:center}
  .ko-row{grid-template-columns:1fr;gap:4px}.ko-row .label{margin-bottom:4px}
  table{min-width:320px}th,td{padding:6px 4px;font-size:11px}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row"><button class="back-btn" onclick="location.href='index.html'">← Trang chủ</button><span class="logo">⚡ Pickle<span>ball Pro</span> <span style="font-size:10px;background:var(--cy);color:#0b1220;padding:2px 8px;border-radius:4px;font-weight:800">v9</span></span></div>
<div class="nav-right"><span id="user-chip" class="user-chip hidden"></span><button id="login-btn" class="btn btn-primary" onclick="openLogin()">Đăng nhập</button><button id="logout-btn" class="btn btn-light hidden" onclick="logout()">Đăng xuất</button></div>
</nav>
<div class="hero"><h1>⚙ Quản trị giải đấu</h1><p>Thiết lập giải → Nội dung → VĐV → Đội → <b>Lịch đấu + Trọng tài</b> → Người dùng</p></div>
<main><div id="admin-content"></div></main>
<div id="toast" class="toast"></div>
<div id="login-modal" class="modal-backdrop"><div class="modal">
<h3>🔐 Đăng nhập</h3>
<div class="field"><label>Email</label><input id="login-username" placeholder="admin@gmail.com"/></div>
<div class="field"><label>Mật khẩu</label><input id="login-password" type="password" value="123@321"/></div>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn btn-light" onclick="closeLogin()">Đóng</button><button class="btn btn-primary" onclick="doLogin()">Đăng nhập</button></div>
<div id="login-message" class="msg"></div>
</div></div>
<script>
/* PICKLEBALL PRO v9 — Mã AAAB+shortCode, round>=1 fix */
var SUPABASE_URL="https://mvefkcaqvjflrgmaybev.supabase.co",SUPABASE_ANON_KEY="sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc",DEFAULT_PASS="123@321",EMAIL_DOMAIN="@pb-local.app",GROUP_CODES=["A","B","C","D"];
var TEAM_SELECT="id,name,seed,status,event_id,team_members(player_id,position,players(id,full_name,skill_rating))";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var state={session:null,user:null,role:null,username:null,tournaments:[],tournament:null,events:[],currentEventId:null,courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],groupStage:null,knockoutStage:null,users:[],referees:[],refAssign:{},openTournaments:[],editingEventId:null,editingPlayerId:null,editingTeamId:null,editingTeamOriginal:null,draftMatches:[],accordion:{s1:true,s2:false,s3:false,s4:false,s5:false,s6:false,s7:false}};
function el(i){return document.getElementById(i);}
function isLocked(){return state.tournament&&state.tournament.status==="completed";}
function isAdmin(){return state.role==="admin"||state.role==="organizer";}
function shortName(n){return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function findTeam(id){var i;for(i=0;i<state.teams.length;i++)if(state.teams[i].id===id)return state.teams[i];return null;}
function teamName(id){if(!id)return '<span class="muted" style="color:var(--mu)">TBD</span>';var t=findTeam(id);return t?shortName(t.name):"TBD";}
function mapTeams(a){var o=[],i,k;a=a||[];for(i=0;i<a.length;i++){var t=a[i],m=t.team_members||[],tot=0;for(k=0;k<m.length;k++)tot+=(m[k].players&&m[k].players.skill_rating)||0;o.push(Object.assign({},t,{members:m,total_rating:Number(tot.toFixed(2))}));}return o;}
function ratingCheck(t,ev){if(!ev||ev.rating_limit==null)return{ok:true,msg:""};var r=ev.rating_rule||"max_total";if(r==="open")return{ok:true,msg:""};if(r==="exact_total"){var ok=Math.abs(t-ev.rating_limit)<=0.005;return{ok:ok,msg:ok?"✅ "+ev.rating_limit:"❌ Phải đúng "+ev.rating_limit+" (hiện "+t.toFixed(2)+")"};}var ok2=t<=ev.rating_limit;return{ok:ok2,msg:ok2?"✅ ≤ "+ev.rating_limit:"❌ Vượt "+ev.rating_limit+" (hiện "+t.toFixed(2)+")"};}
function autoTeamName(a,b){return a&&b?a.full_name+" – "+b.full_name:"";}
function playerLabel(p){return p.full_name+" ("+(p.skill_rating!=null?Number(p.skill_rating).toFixed(2):"-")+")";}
function pad(n,l){return String(n).padStart(l,"0");}
function sortedTournaments(){return state.tournaments.slice().sort(function(a,b){var ao=a.status==="completed"?1:0,bo=b.status==="completed"?1:0;if(ao!==bo)return ao-bo;return String(a.created_at||"").localeCompare(String(b.created_at||""));});}
function nextTournamentCode(){var used={},i;for(i=0;i<state.tournaments.length;i++)used[state.tournaments[i].code]=1;var n=1;while(used[pad(n,3)])n++;return pad(n,3);}
function nextEventCode(){var used={},i;for(i=0;i<state.events.length;i++)used[state.events[i].code]=1;var n=1;while(used[pad(n,2)])n++;return pad(n,2);}
function tournamentSeq(){var s=sortedTournaments(),i;for(i=0;i<s.length;i++)if(s[i].id===state.tournament.id)return i+1;return 1;}
function eventSeq(){var s=state.events.slice().sort(function(a,b){return String(a.created_at||"").localeCompare(String(b.created_at||""));});var i;for(i=0;i<s.length;i++)if(s[i].id===state.currentEventId)return i+1;return 1;}
function buildMatchCode(sc){return pad(tournamentSeq(),3)+pad(eventSeq(),1)+sc;}
function displayCode(mc){return (mc||"").slice(4);}
function showToast(msg,type){var t=el("toast");t.textContent=msg;t.className="toast show";t.style.background=type==="err"?"var(--rd)":"var(--li)";t.style.color=type==="err"?"#fff":"#0b1220";clearTimeout(window._tTO);window._tTO=setTimeout(function(){t.classList.remove("show");},type==="err"?4000:2000);}

function openLogin(){el("login-modal").classList.add("show");el("login-message").className="msg";el("login-username").value="";}
function closeLogin(){el("login-modal").classList.remove("show");}
function loginMsg(t,m){var b=el("login-message");b.className="msg show msg-"+t;b.textContent=m;}
async function doLogin(){
  var raw=el("login-username").value.trim(),p=el("login-password").value;
  if(!raw||!p){loginMsg("error","Nhập đủ email và mật khẩu.");return;}
  loginMsg("info","Đang đăng nhập...");
  var cands=raw.indexOf("@")>=0?[raw]:[raw,raw+EMAIL_DOMAIN],last=null,i,r;
  for(i=0;i<cands.length;i++){
    r=await sb.auth.signInWithPassword({email:cands[i],password:p});
    if(!r.error&&r.data.session){closeLogin();await loadMyProfile(r.data.session);applyAuthUI();await loadAll();showToast("✅ "+state.username);return;}
    if(r.error)last=r.error;
  }
  loginMsg("error","❌ "+(last?last.message:"Lỗi"));
}
async function logout(){await sb.auth.signOut();state.session=null;state.user=null;state.role=null;applyAuthUI();renderAdmin();}
async function loadMyProfile(s){
  state.session=s;state.user=s.user;
  var r=await sb.from("user_roles").select("role").eq("user_id",s.user.id);
  var roles=(r.data||[]).map(function(x){return x.role;});
  state.role=roles.indexOf("admin")>=0?"admin":roles.indexOf("organizer")>=0?"organizer":roles.indexOf("referee")>=0?"referee":null;
  if(state.role==="admin"||state.role==="organizer")await sb.from("app_users").upsert({user_id:s.user.id,username:s.user.email,display_name:s.user.email});
  var au=await sb.from("app_users").select("username").eq("user_id",s.user.id).maybeSingle();
  state.username=(au.data&&au.data.username)||s.user.email;
}
function applyAuthUI(){
  var logged=!!state.user;
  el("login-btn").classList.toggle("hidden",logged);
  el("logout-btn").classList.toggle("hidden",!logged);
  el("user-chip").classList.toggle("hidden",!logged);
  if(logged)el("user-chip").textContent=(state.username||"")+(state.role?" • "+state.role:"");
  if(!isAdmin()&&logged){document.querySelector("main").innerHTML='<div style="padding:40px;text-align:center"><h2 style="color:var(--rd)">⚠ Không có quyền</h2><p>Chỉ admin/organizer.</p><a href="index.html">← Trang chủ</a></div>';}
}

async function loadTournaments(){var d=await sb.from("tournaments").select("*").order("status",{ascending:true}).order("start_date",{ascending:false});state.tournaments=d.data||[];}
async function selectTournament(id){
  state.tournament=null;for(var i=0;i<state.tournaments.length;i++)if(state.tournaments[i].id===id)state.tournament=state.tournaments[i];
  state.editingEventId=null;state.editingPlayerId=null;state.editingTeamId=null;
  if(!state.tournament){renderAdmin();return;}
  var e=await sb.from("events").select("*").eq("tournament_id",id);state.events=e.data||[];
  var c=await sb.from("courts").select("*").eq("tournament_id",id).order("display_order");state.courts=c.data||[];
  var p=await sb.from("players").select("*").order("full_name");state.players=p.data||[];
  if(state.events.length)await selectEvent(state.events[0].id);else{state.currentEventId=null;state.teams=[];state.matches=[];renderAdmin();}
}
async function selectEvent(id){
  state.currentEventId=id||null;state.editingTeamId=null;state.draftMatches=[];
  if(!state.currentEventId){renderAdmin();return;}
  var t=await sb.from("teams").select(TEAM_SELECT).eq("event_id",id);state.teams=mapTeams(t.data);
  var st=await sb.from("stages").select("*").eq("event_id",id).order("stage_order");state.stages=st.data||[];
  state.groupStage=state.stages.find(function(s){return s.stage_type==="group_stage";})||null;
  state.knockoutStage=state.stages.find(function(s){return s.stage_type==="knockout";})||null;
  var sids=state.stages.map(function(s){return s.id;});
  if(sids.length){var g=await sb.from("groups").select("*").in("stage_id",sids).order("code");state.groups=g.data||[];var gt=await sb.from("group_teams").select("*").in("stage_id",sids);state.groupTeams=gt.data||[];}else{state.groups=[];state.groupTeams=[];}
  var m=await sb.from("matches").select("*").eq("event_id",id).order("match_seq");state.matches=m.data||[];
  await loadRefAssign();renderAdmin();
}
async function refreshOpenTournaments(){var d=await sb.from("tournaments").select("*").neq("status","completed").order("start_date",{ascending:false});state.openTournaments=d.data||[];}
async function loadUsers(){
  var au=await sb.from("app_users").select("*"),ur=await sb.from("user_roles").select("*"),map={},i;
  for(i=0;i<(au.data||[]).length;i++){var u=au.data[i];map[u.user_id]=Object.assign({},u,{role:null});}
  for(i=0;i<(ur.data||[]).length;i++){var r=ur.data[i];if(!map[r.user_id])map[r.user_id]={user_id:r.user_id,username:"(chưa có)"};map[r.user_id].role=r.role;}
  var arr=[];for(var k in map)arr.push(map[k]);state.users=arr;
}
async function loadReferees(){
  var ur=await sb.from("user_roles").select("user_id").eq("role","referee");
  var uids=(ur.data||[]).map(function(r){return r.user_id;});
  if(uids.length){var au=await sb.from("app_users").select("user_id,username").in("user_id",uids);state.referees=au.data||[];}else state.referees=[];
}
async function loadRefAssign(){
  state.refAssign={};if(!state.matches.length)return;

function validateDraftForGroup(groupId){
  var teams=getTeamsInGroup(groupId);
  if(teams.length!==4)return{ok:false,msg:"Bảng cần 4 đội"};
  var draft=getDraftForGroup(groupId);
  if(draft.length!==6)return{ok:false,msg:"Cần đúng 6 trận (hiện "+draft.length+")"};
  var countMap={};teams.forEach(function(t){countMap[t.id]=0;});
  var seen={};
  for(var i=0;i<draft.length;i++){
    var m=draft[i];
    if(!m.homeTeamId||!m.awayTeamId)return{ok:false,msg:"Trận "+(i+1)+": chưa chọn đủ đội"};
    if(m.homeTeamId===m.awayTeamId)return{ok:false,msg:"Trận "+(i+1)+": 2 đội phải khác nhau"};
    countMap[m.homeTeamId]=(countMap[m.homeTeamId]||0)+1;
    countMap[m.awayTeamId]=(countMap[m.awayTeam_id!==undefined?m.awayTeamId:m.awayTeamId]||0)+1;
    var key=[m.homeTeamId,m.awayTeamId].sort().join("-");
    if(seen[key])return{ok:false,msg:"Trận "+(i+1)+": trùng cặp"};
    seen[key]=1;
  }
  for(var tid in countMap){if(countMap[tid]!==3)return{ok:false,msg:"Mỗi đội phải đấu 3 trận"};}
  return{ok:true,msg:""};
}

function calculateGroupStandings(groupId){
  var teams=getTeamsInGroup(groupId);
  var stats={};teams.forEach(function(t){stats[t.id]={team_id:t.id,wins:0,losses:0,pf:0,pa:0,played:0};});
  var groupMatches=state.matches.filter(function(m){return m.group_id===groupId&&m.status==="completed";});
  groupMatches.forEach(function(m){
    var h=stats[m.home_team_id],a=stats[m.away_team_id];
    if(!h||!a)return;
    h.played++;a.played++;
    h.pf+=m.home_score;h.pa+=m.away_score;
    a.pf+=m.away_score;a.pa+=m.home_score;
    if(m.home_score>m.away_score){h.wins++;a.losses++;}
    else if(m.away_score>m.home_score){a.wins++;h.losses++;}
  });
  var arr=[];for(var k in stats)arr.push(stats[k]);
  arr.sort(function(x,y){
    if(y.wins!==x.wins)return y.wins-x.wins;
    var dX=x.pf-x.pa,dY=y.pf-y.pa;
    if(dY!==dX)return dY-dX;
    return y.pf-x.pf;
  });
  return arr;
}

async function updateKOMatch(matchId,field,val){
  var update={};update[field]=val||null;
  var r=await sb.from("matches").update(update).eq("id",matchId);
  if(r.error){alert(r.error.message);return;}
  var m=state.matches.find(function(x){return x.id===matchId;});
  if(m)m[field]=val||null;
  showToast("✅ Cập nhật");renderAdmin();
}

async function assignMatchRef(matchId,userId){
  await sb.from("referee_matches").delete().eq("match_id",matchId);
  if(userId){var r=await sb.from("referee_matches").insert({user_id:userId,match_id:matchId});if(r.error){alert(r.error.message);return;}}
  showToast(userId?"✅ Phân công TT":"✅ Bỏ TT");
  await loadRefAssign();renderAdmin();
}
async function assignGroupRef(groupId,userId){
  var ms=state.matches.filter(function(m){return m.group_id===groupId;});
  for(var i=0;i<ms.length;i++){
    await sb.from("referee_matches").delete().eq("match_id",ms[i].id);
    if(userId)await sb.from("referee_matches").insert({user_id:userId,match_id:ms[i].id});
  }
  showToast(userId?"✅ TT cho bảng":"✅ Bỏ TT");await loadRefAssign();renderAdmin();
}

async function adminCreateUser(){
  var email=el("nu-email").value.trim(),pass=el("nu-pass").value||DEFAULT_PASS,role=el("nu-role").value;
  if(email.indexOf("@")<0){alert("Email không hợp lệ");return;}
  var tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storageKey:"pb-temp",persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var r=await tmp.auth.signUp({email:email,password:pass});
  if(r.error){alert("❌ "+r.error.message+"\n(Tắt Confirm email trong Supabase)");return;}
  var uid=r.data.user&&r.data.user.id;if(!uid){alert("User tồn tại");return;}
  await sb.from("app_users").upsert({user_id:uid,username:email,display_name:email});
  var ir=await sb.from("user_roles").insert({user_id:uid,role:role});
  if(ir.error)await sb.from("user_roles").update({role:role}).eq("user_id",uid);
  showToast("✅ Tạo "+email);await loadUsers();await loadReferees();renderAdmin();
}

        tkMatches.forEach(function(m,i){
          var mRef=state.refAssign[m.id]||null;
          H+='<div class="ko-row"><span class="label">'+tkLabels[i]+'</span><select class="ref-sel" onchange="updateKOMatch(\''+m.id+"','home_team_id',this.value)\" style='padding:6px'><option value=''>-- Đội nhà --</option>"+state.teams.map(function(t){return '<option value="'+t.id+'"'+(m.home_team_id===t.id?" selected":"")+">"+shortName(t.name)+"</option>";}).join("")+"</select><span class='vs' style='color:var(--mu);font-weight:700'>vs</span><select class='ref-sel' onchange=\"updateKOMatch('"+m.id+"','away_team_id',this.value)\" style='padding:6px'><option value=''>-- Đội khách --</option>"+state.teams.map(function(t){return '<option value="'+t.id+'"'+(m.away_team_id===t.id?" selected":"")+">"+shortName(t.name)+"</option>";}).join("")+"</select><select class='ref-sel' onchange='assignMatchRef(\""+m.id+"\",this.value)'><option value=''>-- TT --</option>"+state.referees.map(function(r){return '<option value="'+r.user_id+'"'+(mRef===r.user_id?" selected":"")+">"+r.username+"</option>";}).join("")+"</select></div>";
        });
        H+='<h4 style="color:var(--cy);margin:12px 0 6px">Bán kết (BK1-BK2)</h4>';
        var bkMatches=koMatches.filter(function(m){return m.round===2;}).sort(function(a,b){return a.bracket_slot-b.bracket_slot;});
        var bkLabels=["BK1: Thắng TK1 vs Thắng TK2","BK2: Thắng TK3 vs Thắng TK4"];
        bkMatches.forEach(function(m,i){
          var mRef=state.refAssign[m.id]||null;
          H+='<div class="ko-row"><span class="label">'+bkLabels[i]+'</span><select class="ref-sel" onchange="updateKOMatch(\''+m.id+"','home_team_id',this.value)\" style='padding:6px'><option value=''>-- Đội nhà --</option>"+state.teams.map(function(t){return '<option value="'+t.id+'"'+(m.home_team_id===t.id?" selected":"")+">"+shortName(t.name)+"</option>";}).join("")+"</select><span class='vs' style='color:var(--mu);font-weight:700'>vs</span><select class='ref-sel' onchange=\"updateKOMatch('"+m.id+"','away_team_id',this.value)\" style='padding:6px'><option value=''>-- Đội khách --</option>"+state.teams.map(function(t){return '<option value="'+t.id+'"'+(m.away_team_id===t.id?" selected":"")+">"+shortName(t.name)+"</option>";}).join("")+"</select><select class='ref-sel' onchange='assignMatchRef(\""+m.id+"\",this.value)'><option value=''>-- TT --</option>"+state.referees.map(function(r){return '<option value="'+r.user_id+'"'+(mRef===r.user_id?" selected":"")+">"+r.username+"</option>";}).join("")+"</select></div>";
        });
        H+='<h4 style="color:var(--cy);margin:12px 0 6px">🏆 Chung kết (CK)</h4>';
        var ckMatch=koMatches.find(function(m){return m.round===3;});
        if(ckMatch){
          var mRef=state.refAssign[ckMatch.id]||null;
          H+='<div class="ko-row" style="border:2px solid var(--li)"><span class="label" style="color:var(--li)">CK: Thắng BK1 vs Thắng BK2</span><select class="ref-sel" onchange="updateKOMatch(\''+ckMatch.id+"','home_team_id',this.value)\" style='padding:6px'><option value=''>-- Đội nhà --</option>"+state.teams.map(function(t){return '<option value="'+t.id+'"'+(ckMatch.home_team_id===t.id?" selected":"")+">"+shortName(t.name)+"</option>";}).join("")+"</select><span class='vs' style='color:var(--mu);font-weight:700'>vs</span><select class='ref-sel' onchange=\"updateKOMatch('"+ckMatch.id+"','away_team_id',this.value)\" style='padding:6px'><option value=''>-- Đội khách --</option>"+state.teams.map(function(t){return '<option value="'+t.id+'"'+(ckMatch.away_team_id===t.id?" selected":"")+">"+shortName(t.name)+"</option>";}).join("")+"</select><select class='ref-sel' onchange='assignMatchRef(\""+ckMatch.id+"\",this.value)'><option value=''>-- TT --</option>"+state.referees.map(function(r){return '<option value="'+r.user_id+'"'+(mRef===r.user_id?" selected":"")+">"+r.username+"</option>";}).join("")+"</select></div>";
        }
        H+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn btn-warn" onclick="deleteAllSchedule()">🗑 Xóa toàn bộ lịch</button><button class="btn btn-blue" onclick="location.href=\'tournament.html?id='+state.tournament.id+'\'">→ Xem trang giải đấu</button></div>';
      }
      if(groupMatches.length&&state.referees.length){
        H+='<div class="section-title">👨⚖️ Phân công TT nhanh theo bảng
          </div>';
        GROUP_CODES.forEach(function(c){
          var g=state.groups.find(function(x){return x.code===c&&x.stage_id===state.groupStage.id;});
          if(!g)return;
          var gm=state.matches.filter(function(m){return m.group_id===g.id;});
          if(!gm.length)return;
          var firstM=gm[0],curRef=state.refAssign[firstM.id]||null;
          H+='<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)"><b style="min-width:80px">Bảng '+c+'</b> <span class="muted" style="color:var(--mu)">'+gm.length+' trận</span> <select class="ref-sel" onchange="assignGroupRef(\''+g.id+"',this.value)\" style='flex:1;max-width:200px'><option value=''>-- Chọn TT --</option>"+state.referees.map(function(r){return '<option value="'+r.user_id+'"'+(curRef===r.user_id?" selected":"")+">"+r.username+"</option>";}).join("")+"</select></div>";
        });
      }
    }
  }
  H+='</div></div>';

  /* BƯỚC 7: QUẢN LÝ NGƯỜI DÙNG */
  H+='<div class="card">'+accordionHeader("7","Quản lý người dùng","s7",s7Status.type,s7Status.text);
  H+='<div class="accordion-body'+(state.accordion.s7?" open":"")+'">';
  H+='<div class="form-grid"><input id="nu-email" placeholder="Email"/><input id="nu-pass" type="text" value="'+DEFAULT_PASS+'" placeholder="Mật khẩu"/><select id="nu-role"><option value="referee">referee (TT)</option><option value="organizer">organizer</option><option value="admin">admin</option></select><button class="btn btn-primary" onclick="adminCreateUser()">➕ Tạo user</button></div>';
  H+='<div class="table-wrap"><table><thead><tr><th>Email</th><th>Quyền</th><th>Đổi</th></tr></thead><tbody>';
  H+=state.users.map(function(u){return '<tr><td>'+u.username+'</td><td><span class="badge b-blue">'+(u.role||"-")+'</span></td><td><select onchange="changeRole(\''+u.user_id+"',this.value)\" style='font-size:11px;padding:4px'><option value='referee'"+(u.role==="referee"?" selected":"")+">referee</option><option value='organizer'"+(u.role==="organizer"?" selected":"")+">organizer</option><option value='admin'"+(u.role==="admin"?" selected":"")+">admin</option></select></td></tr>";}).join("")||'<tr><td colspan="3" class="muted" style="color:var(--mu)">Chưa có</td></tr>';
  H+='</tbody></table></div>';
  H+='</div></div>';

  el("admin-content").innerHTML=H;

  setTimeout(function(){
    state.draftMatches.forEach(function(m,idx){
      var rows=document.querySelectorAll(".match-row");
      if(rows[idx]){
        var sels=rows[idx].querySelectorAll("select");
        if(sels[0])sels[0].value=m.homeTeamId||"";
        if(sels[1])sels[1].value=m.awayTeamId||"";
      }
    });
    if(state.editingTeamId&&editingT&&editingT.members){
      var p1=editingT.members.find(function(m){return m.position===1;}),p2=editingT.members.find(function(m){return m.position===2;});
      if(p1&&el("team-p1"))el("team-p1").value=p1.player_id;
      if(p2&&el("team-p2"))el("team-p2").value=p2.player_id;
    }
    refreshTeamPlayerSelects();updateTeamEditButtons();
  },50);
}

function loadExistingToDraft(groupId){
  var existing=state.matches.filter(function(m){return m.group_id===groupId;}).sort(function(a,b){return a.match_seq-b.match_seq;});
  state.draftMatches=state.draftMatches.filter(function(m){return m.groupId!==groupId;});
  existing.forEach(function(m){state.draftMatches.push({groupId:groupId,homeTeamId:m.home_team_id,awayTeamId:m.away_team_id});});
  renderAdmin();
  showToast("📥 Đã load "+existing.length+" trận");
}

(async()=>{
  var d=await sb.auth.getSession();if(d.data.session)await loadMyProfile(d.data.session);
  applyAuthUI();if(!isAdmin()&&state.user)return;
  await loadAll();
})();
</script>
</body>
</html>
