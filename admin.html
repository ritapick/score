<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Quản trị - Pickleball Pro v34</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.95);border-bottom:1px solid var(--ln);padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.home-btn{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
.home-btn:hover{background:rgba(148,163,184,.25);color:var(--tx);border-color:var(--cy)}
.logo{color:var(--li);font-weight:800;font-size:16px;text-transform:uppercase}
.chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:4px 10px;border-radius:99px}
.btn{border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:700}
.btn-p{background:var(--li);color:#0b1220}
.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu)}
.btn-d{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}
.btn-w{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
.btn-s{padding:4px 8px;font-size:11px}
.btn-xs{padding:3px 6px;font-size:10px}
main{max-width:1200px;margin:0 auto;padding:10px}
.acc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc-h{padding:12px;background:var(--sf2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13px}
.acc-h .st{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:800}
.st-done{background:rgba(163,230,53,.2);color:var(--li)}
.st-part{background:rgba(251,146,60,.2);color:var(--or)}
.st-empty{background:rgba(148,163,184,.2);color:var(--mu)}
.acc-b{display:none;padding:12px}
.acc-b.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:8px;padding:8px;color:var(--tx);width:100%;font-size:13px}
input[type="time"],input[type="number"]{color-scheme:dark}
.hint{font-size:10px;color:var(--mu);margin-top:-4px;margin-bottom:6px;font-style:italic}
.ev-info{padding:10px 12px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);border-radius:8px;margin-bottom:10px;font-size:12px;color:var(--cy)}
.ev-info b{color:var(--li)}
.ev-info .ev-rule{display:inline-block;background:rgba(163,230,53,.15);color:var(--li);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;margin-left:6px}
.player-usage{padding:8px 12px;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.25);border-radius:8px;margin-bottom:10px;font-size:12px;color:var(--or);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.player-usage b{color:var(--li);font-family:monospace;font-size:14px}
.player-usage .ok{color:var(--li)}
.player-usage .warn{color:var(--or)}
.total-preview{padding:4px 0;margin-top:-4px;margin-bottom:8px;font-size:12px;min-height:20px}
.total-preview .ok{display:inline-block;color:var(--li);background:rgba(163,230,53,.1);padding:4px 10px;border-radius:6px;font-weight:700}
.total-preview .warn{display:inline-block;color:var(--rd);background:rgba(248,113,113,.12);padding:4px 10px;border-radius:6px;font-weight:700}
.total-preview .neutral{display:inline-block;color:var(--mu);font-size:11px;font-style:italic}
.section-divider{margin-top:12px;padding-top:10px;border-top:1px dashed var(--ln)}
.section-title{font-size:12px;font-weight:800;color:var(--cy);margin-bottom:8px;letter-spacing:.5px}
.t-status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;margin-left:6px}
.t-status.open{background:rgba(163,230,53,.15);color:var(--li)}
.t-status.closed{background:rgba(248,113,113,.15);color:var(--rd)}
.t-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tw{overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;min-width:380px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:12px}
th{color:var(--mu);font-size:10px;text-transform:uppercase}
.gcard{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.gcard h4{margin:0 0 8px;color:var(--li);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ko-section{background:rgba(251,146,60,.05);border:2px solid var(--or);border-radius:12px;padding:12px;margin-bottom:10px}
.ko-section>h4{margin:0 0 10px;color:var(--or);font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ko-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:11px}
.ko-stats .k{background:var(--sf2);padding:5px 10px;border-radius:6px;display:flex;gap:4px;align-items:center;flex:1;min-width:90px;justify-content:center}
.ko-stats .k b{color:var(--li);font-family:monospace;font-size:13px}
.ko-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:5px;align-items:center;padding:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;font-size:12px}
.mrow .n{background:var(--li);color:#0b1220;padding:2px 7px;border-radius:4px;font-weight:800;font-size:11px}
.alert{padding:8px;border-radius:8px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);color:var(--or);font-size:12px;margin-bottom:8px}
.info{padding:8px;border-radius:8px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cy);font-size:12px;margin-bottom:8px}
.ok{padding:8px;border-radius:8px;background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.3);color:var(--li);font-size:12px;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bg.show{display:flex}
.modal{width:min(400px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
table.match-table{width:100%;border-collapse:collapse;min-width:950px;background:var(--sf2);border-radius:10px;overflow:hidden}
table.match-table thead{background:#1a2540}
table.match-table th{padding:8px 6px;color:var(--li);font-size:10px;text-transform:uppercase;font-weight:800;text-align:center;border-bottom:2px solid var(--ln);letter-spacing:.5px;white-space:nowrap}
table.match-table td{padding:6px;border-bottom:1px solid var(--ln);text-align:center;font-size:12px;vertical-align:middle}
table.match-table tbody tr:hover{background:rgba(34,211,238,.04)}
table.match-table tr.ko-row{background:rgba(251,146,60,.05)}
table.match-table tr.ko-row:hover{background:rgba(251,146,60,.1)}
table.match-table tr.ck-row{background:rgba(163,230,53,.1);font-weight:700}
table.match-table tr.ck-row:hover{background:rgba(163,230,53,.15)}
table.match-table td.m-code{font-family:monospace;font-weight:800;font-size:13px;color:var(--li);letter-spacing:.5px;min-width:50px}
table.match-table tr.ko-row td.m-code{color:var(--or)}
table.match-table tr.ck-row td.m-code{color:var(--li);font-size:14px}
table.match-table td.m-time{white-space:nowrap}
table.match-table td.m-time .time-wrap{display:inline-flex;align-items:center;gap:2px}
table.match-table td.m-time select{padding:3px 4px;font-size:11px;width:auto;min-width:52px;background:#0d1626;border:1px solid var(--ln);border-radius:4px;color:var(--cy);font-weight:700;font-family:monospace;text-align:center}
table.match-table td.m-time .colon{color:var(--mu);font-weight:700}
table.match-table td.m-court select{padding:4px 6px;font-size:11px;background:#0d1626;border:1px solid var(--ln);border-radius:4px;color:var(--tx);min-width:90px;width:auto}
table.match-table td.m-team{padding:6px 8px;font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
table.match-table td.m-team.home{color:var(--li);text-align:right}
table.match-table td.m-team.away{color:var(--cy);text-align:left}
table.match-table td.m-team.tbd{color:var(--or);font-style:italic;font-weight:500;font-size:11px}
table.match-table td.m-score{white-space:nowrap}
table.match-table td.m-score input{width:40px;padding:3px;text-align:center;background:#0d1626;border:1px solid var(--ln);border-radius:4px;color:var(--tx);font-weight:700;font-family:monospace}
table.match-table td.m-score .sep{color:var(--mu);padding:0 4px;font-weight:700}
table.match-table td.m-ref select{padding:4px 6px;font-size:11px;background:#0d1626;border:1px solid var(--ln);border-radius:4px;color:var(--tx);min-width:110px;width:auto}
table.match-table td.m-status{min-width:80px}
table.match-table td.m-actions{min-width:50px}
.status-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;white-space:nowrap;display:inline-block}
.status-tag.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
.status-tag.completed{background:rgba(163,230,53,.2);color:var(--li)}
.ko-group{margin-bottom:14px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.ko-group-header{padding:8px 12px;font-weight:800;font-size:12px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.ko-group-header.tk{background:rgba(251,146,60,.15);color:var(--or)}
.ko-group-header.bk{background:rgba(34,211,238,.1);color:var(--cy)}
.ko-group-header.ck{background:rgba(163,230,53,.15);color:var(--li)}
.ko-group-header .sub{font-weight:400;font-size:10px;color:var(--mu);text-transform:none;font-style:italic}
.ko-group table.match-table{border-radius:0}
table.bxh-table{width:100%;border-collapse:collapse;background:#0a1020;border-radius:8px;overflow:hidden;margin-bottom:8px;font-size:12px}
table.bxh-table thead{background:#1a2540}
table.bxh-table th{padding:6px 8px;color:var(--cy);font-size:10px;text-transform:uppercase;font-weight:800;text-align:center;border-bottom:1px solid var(--ln);letter-spacing:.5px}
table.bxh-table td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:center}
table.bxh-table tr.top-2{background:rgba(163,230,53,.1);font-weight:700}
table.bxh-table tr.top-2 td:first-child{color:var(--li);font-weight:800}
table.bxh-table tr.top-2 td:first-child::before{content:"✓ ";color:var(--li)}
table.bxh-table td.rank{font-weight:800;font-size:13px;color:var(--li)}
table.bxh-table tr:not(.top-2) td.rank{color:var(--mu)}
table.bxh-table td.team-name{text-align:left;font-weight:700;color:var(--tx);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.bxh-table td.played{font-family:monospace;font-weight:700}
table.bxh-table td.played.full{color:var(--li)}
table.bxh-table td.played.partial{color:var(--or)}
table.bxh-table td.played .warn{color:var(--or);font-weight:800;margin-left:2px}
table.bxh-table td.wins{color:var(--li);font-weight:800;font-family:monospace}
table.bxh-table td.diff{font-family:monospace;font-weight:700}
table.bxh-table td.diff.positive{color:var(--li)}
table.bxh-table td.diff.negative{color:var(--rd)}
table.bxh-table td.pf{font-family:monospace;color:var(--cy)}
.bxh-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:6px 10px;background:rgba(34,211,238,.08);border-radius:6px;font-size:11px;color:var(--cy);font-weight:700;flex-wrap:wrap;gap:6px}
.bxh-header .legend{font-size:10px;color:var(--mu);font-weight:500;font-style:italic}
.bxh-status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;margin-left:6px}
.bxh-status.complete{background:rgba(163,230,53,.2);color:var(--li)}
.bxh-status.partial{background:rgba(251,146,60,.2);color:var(--or)}
/* V34: ô thao tác user */
.user-actions{display:flex;gap:4px;flex-wrap:wrap}
.me-badge{background:rgba(34,211,238,.2);color:var(--cy);font-size:9px;padding:1px 6px;border-radius:99px;font-weight:800;margin-left:4px}
@media(max-width:950px){table.match-table{min-width:820px}}
@media(max-width:640px){
  .mrow{grid-template-columns:1fr;gap:4px}
  .mrow .n{justify-self:start}
  .fg{grid-template-columns:1fr}
  table.match-table{min-width:720px}
  table.bxh-table{font-size:11px}
}
</style>
</head>

<script>
"use strict";
var CFG={
  URL:"https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY:"sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc",
  PASS:"123@321",
  DOMAIN:"@gmail.com",
  FALLBACK_DOMAIN:"@pb-local.app",
  GROUPS:["A","B","C","D"],
  MATCHES_PER_GROUP:6,
  MATCHES_PER_TEAM:3,
  SCHED_START_H:8,
  SCHED_STEP_MIN:20
};
var KO_DEFS=[
  {slot:25,code:"TK1",round:2,group:"tk",ph:{h:"Nhất A",a:"Nhì B"}},
  {slot:26,code:"TK2",round:2,group:"tk",ph:{h:"Nhất B",a:"Nhì A"}},
  {slot:27,code:"TK3",round:2,group:"tk",ph:{h:"Nhất C",a:"Nhì D"}},
  {slot:28,code:"TK4",round:2,group:"tk",ph:{h:"Nhất D",a:"Nhì C"}},
  {slot:29,code:"BK1",round:3,group:"bk",ph:{h:"Thắng TK1",a:"Thắng TK2"}},
  {slot:30,code:"BK2",round:3,group:"bk",ph:{h:"Thắng TK3",a:"Thắng TK4"}},
  {slot:31,code:"CK", round:4,group:"ck",ph:{h:"Thắng BK1",a:"Thắng BK2"}}
];
var sb;
try{sb=window.supabase.createClient(CFG.URL,CFG.KEY);}catch(e){console.error("Supabase init error:",e);}
var S={user:null,role:null,username:null,tournaments:[],tournament:null,events:[],eid:null,courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],gStage:null,kStage:null,users:[],refs:[],refAssign:{},draft:[],acc:{s1:false,s2:false,s3:true,s4:false,s5:false}};

/* === HELPERS === */
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function isAdmin(){return S.role==="admin"||S.role==="organizer";}
function pad(n,l){return String(n).padStart(l,"0");}
function r2(n){return Math.round(n*100)/100;}
function sn(n){return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function findTeam(id){if(!id)return null;for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null;}
function tName(id){var t=findTeam(id);return t?sn(t.name):null;}
function toast(msg,isErr){var t=el("toast");t.textContent=msg;t.className="toast show";t.style.background=isErr?"var(--rd)":"var(--li)";t.style.color=isErr?"#fff":"#0b1220";if(window._toastT)clearTimeout(window._toastT);window._toastT=setTimeout(function(){t.className="toast";},isErr?4000:2000);}
function sortedT(){
  return S.tournaments.slice().sort(function(a,b){
    var aClosed=a.status==="completed"?1:0;var bClosed=b.status==="completed"?1:0;
    if(aClosed!==bClosed)return aClosed-bClosed;
    return String(a.created_at||"").localeCompare(b.created_at||"");
  });
}
function tSeq(){var s=sortedT();for(var i=0;i<s.length;i++)if(s[i].id===S.tournament.id)return i+1;return 1;}
function eSeq(){var s=S.events.slice().sort(function(a,b){return String(a.created_at||"").localeCompare(b.created_at||"");});for(var i=0;i<s.length;i++)if(s[i].id===S.eid)return i+1;return 1;}
function bCode(sc){return pad(tSeq(),3)+pad(eSeq(),1)+sc;}
function displayCode(m){
  if(!m)return "?";
  var slot=Number(m.bracket_slot)||0;var koDef=null;
  for(var i=0;i<KO_DEFS.length;i++){if(KO_DEFS[i].slot===slot){koDef=KO_DEFS[i];break;}}
  if(koDef)return koDef.code;
  if(m.group_id&&slot>=1&&slot<=24){var grp=S.groups.find(function(g){return g.id===m.group_id;});if(grp){return grp.code+(((slot-1)%6)+1);}}
  if(m.round===2)return "TK?";if(m.round===3)return "BK?";if(m.round===4)return "CK";
  return String(m.match_code||"?");
}
function placeholderBySlot(slot){for(var i=0;i<KO_DEFS.length;i++){if(KO_DEFS[i].slot===Number(slot))return KO_DEFS[i].ph;}return {h:"TBD",a:"TBD"};}
function koBySlot(slot){slot=Number(slot);return S.matches.find(function(m){return Number(m.bracket_slot)===slot;});}
function winnerOfSlot(slot){var m=koBySlot(slot);if(!m||autoStatus(m)!=="completed")return null;if(m.winner_team_id)return m.winner_team_id;if(Number(m.home_score)>Number(m.away_score))return m.home_team_id;if(Number(m.away_score)>Number(m.home_score))return m.away_team_id;return null;}
function getMatchDate(){if(S.tournament&&S.tournament.start_date)return S.tournament.start_date;return new Date().toISOString().slice(0,10);}
function timeFromISO(iso){if(!iso)return"";try{var d=new Date(iso);if(isNaN(d.getTime()))return"";return d.toLocaleTimeString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",hour12:false});}catch(e){return"";}}
function isoFromTime(hhmm){if(!hhmm)return null;return getMatchDate()+"T"+hhmm+":00+07:00";}
function splitTimeVN(iso){var t=timeFromISO(iso);if(!t)return{h:"08",m:"00"};var p=t.split(":");return{h:p[0]||"08",m:p[1]||"00"};}
function autoStatus(m){var h=Number(m.home_score)||0,a=Number(m.away_score)||0;return(h>0||a>0)?"completed":"scheduled";}
function statusTag(m){var st=autoStatus(m);return '<span class="status-tag '+st+'">'+(st==="completed"?"✅ Xong":"⏳ Chưa đấu")+'</span>';}

function openLogin(){el("login-modal").classList.add("show");el("lmsg").textContent="";}

/* V34: Đăng nhập chỉ cần tên user */
async function doLogin(){
  var u=el("lu").value.trim(),p=el("lp").value;
  if(!u||!p){el("lmsg").textContent="Nhập đủ thông tin";return;}
  el("lmsg").textContent="Đang đăng nhập...";
  var cands;
  if(u.indexOf("@")>=0){cands=[u];}
  else{cands=[u+CFG.DOMAIN,u+CFG.FALLBACK_DOMAIN,u];}
  var lastErr=null;
  for(var i=0;i<cands.length;i++){
    try{
      var r=await sb.auth.signInWithPassword({email:cands[i],password:p});
      if(r.error){lastErr=r.error;continue;}
      closeLogin();await loadProfile(r.data.session);applyUI();await loadAll();
      toast("✅ "+S.username);return;
    }catch(e){lastErr=e;}
  }
  el("lmsg").textContent="❌ "+(lastErr&&lastErr.message?lastErr.message:"Sai user/mật khẩu");
}
async function logout(){try{await sb.auth.signOut();}catch(e){}S.user=null;S.role=null;S.username=null;applyUI();render();}
async function loadProfile(session){S.user=session.user;var r=await sb.from("user_roles").select("role").eq("user_id",session.user.id);var roles=(r.data||[]).map(function(x){return x.role;});S.role=roles.indexOf("admin")>=0?"admin":roles.indexOf("organizer")>=0?"organizer":roles.indexOf("referee")>=0?"referee":null;S.username=session.user.email;}
function applyUI(){var logged=!!S.user;el("login-btn").classList.toggle("hidden",logged);el("logout-btn").classList.toggle("hidden",!logged);el("user-chip").classList.toggle("hidden",!logged);if(logged)el("user-chip").textContent=(S.username||"")+(S.role?" • "+S.role:"");if(!isAdmin()&&logged)el("admin").innerHTML='<div class="alert">⚠ Chỉ admin/organizer.</div>';}

}

async function createT(){
  var n=el("t-name").value.trim();var loc=el("t-location").value.trim();var d=el("t-start").value;
  if(!n||!d){alert("Nhập tên + ngày");return;}

  var nn=1;while(used[pad(nn,3)])nn++;var code=pad(nn,3);
  var base=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
  if(!base)base="tournament";
  var ts=new Date().toISOString().replace(/[^0-9]/g,"").slice(0,14);

  var payload={code:code,name:n,slug:slug,start_date:d,end_date:el("t-end").value||d,location_name:loc||null,status:"in_progress"};
  var r=await sb.from("tournaments").insert(payload).select().single();

async function saveTeam(){
  if(!S.eid){alert("Chọn nội dung trước");return;}
  var p1=el("tp1").value,p2=el("tp2").value;
  if(!p1||!p2){alert("Chọn đủ 2 VĐV");return;}
  if(p1===p2){alert("❌ 2 VĐV phải khác nhau");return;}
  var used=getUsedPlayerIds();
  if(used[p1]||used[p2]){var names=[];S.players.forEach(function(p){if((used[p1]&&p.id===p1)||(used[p2]&&p.id===p2))names.push(p.full_name);});alert("❌ VĐV đã ghép cặp:\n• "+names.join("\n• ")+"\n\nMỗi VĐV chỉ tham gia 1 đội / nội dung.");return;}
  var a=null,b=null;S.players.forEach(function(p){if(p.id===p1)a=p;if(p.id===p2)b=p;});
  if(!a||!b){alert("Không tìm thấy VĐV");return;}
  var ev=S.events.find(function(e){return e.id===S.eid;});
  var total=r2((a.skill_rating||0)+(b.skill_rating||0));

    if(total>ev.rating_limit){alert("❌ TỔNG TRÌNH VƯỢT GIỚI HẠN!\n\n• "+a.full_name+": "+(a.skill_rating||0)+"\n• "+b.full_name+": "+(b.skill_rating||0)+"\n• Tổng: "+total.toFixed(2)+"\n• Giới hạn \""+ev.name+"\": ≤ "+ev.rating_limit+"\n\nVượt: "+r2(total-ev.rating_limit).toFixed(2));return;}
  }
  var name=a.full_name+" – "+b.full_name;
  var r=await sb.from("teams").insert({event_id:S.eid,name:name}).select().single();
  if(r.error){alert(r.error.message);return;}

  toast("✅ Tạo đội (tổng "+total.toFixed(2)+")");await selE(S.eid);
}

/* === STANDINGS === */
function standings(g){
  var t=teamsInG(g);var st={};
  t.forEach(function(x){st[x.id]={id:x.id,w:0,pf:0,pa:0,played:0};});
  S.matches.filter(function(m){return m.group_id===g&&autoStatus(m)==="completed";}).forEach(function(m){
    var h=st[m.home_team_id],a=st[m.away_team_id];if(!h||!a)return;
    h.pf+=Number(m.home_score)||0;h.pa+=Number(m.away_score)||0;h.played++;
    a.pf+=Number(m.away_score)||0;a.pa+=Number(m.home_score)||0;a.played++;
    if(Number(m.home_score)>Number(m.away_score))h.w++;else a.w++;
  });
  var arr=[];for(var k in st)arr.push(st[k]);
  return arr.sort(function(x,y){if(y.w!==x.w)return y.w-x.w;var dx=x.pf-x.pa,dy=y.pf-y.pa;if(dy!==dx)return dy-dx;return y.pf-x.pf;});
}
function isGroupComplete(gid){return teamsInG(gid).length===4&&S.matches.filter(function(m){return m.group_id===gid&&autoStatus(m)==="completed";}).length>=CFG.MATCHES_PER_GROUP;}
function completedCountInGroup(gid){return S.matches.filter(function(m){return m.group_id===gid&&autoStatus(m)==="completed";}).length;}

/* === KO === */
function computeKOTeams(){
  var tops={};
  CFG.GROUPS.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&S.gStage&&x.stage_id===S.gStage.id;});if(!g||!isGroupComplete(g.id)){tops[c]={f:null,s:null};return;}var st=standings(g.id);tops[c]={f:st[0]?st[0].id:null,s:st[1]?st[1].id:null};});
  var w1=winnerOfSlot(25),w2=winnerOfSlot(26),w3=winnerOfSlot(27),w4=winnerOfSlot(28),bw1=winnerOfSlot(29),bw2=winnerOfSlot(30);
  var result={};
  result[25]={h:tops.A.f,a:tops.B.s};result[26]={h:tops.B.f,a:tops.A.s};
  result[27]={h:tops.C.f,a:tops.D.s};result[28]={h:tops.D.f,a:tops.C.s};
  result[29]={h:w1,a:w2};result[30]={h:w3,a:w4};result[31]={h:bw1,a:bw2};
  return result;
}
async function createKO(){
  if(!S.kStage){try{var r=await sb.from("stages").insert({event_id:S.eid,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2}).select().single();S.kStage=r.data;}catch(e){return;}}
  var teamsMap=computeKOTeams();
  var old=S.matches.filter(function(m){return m.stage_id===S.kStage.id;});
  if(old.length){var ids=old.map(function(m){return m.id;});await sb.from("referee_matches").delete().in("match_id",ids);await sb.from("matches").delete().in("id",ids);}
  var payload=KO_DEFS.map(function(def){var t=teamsMap[def.slot]||{h:null,a:null};return{event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.kStage.id,round:def.round,bracket_slot:def.slot,match_code:bCode(def.code),match_seq:def.slot,home_team_id:t.h,away_team_id:t.a,home_score:0,away_score:0,status:"scheduled"};});
  try{var r2=await sb.from("matches").insert(payload);if(r2.error){alert("❌ "+r2.error.message);return;}toast("✅ Đã tạo 7 trận KO");}catch(e){alert("❌ "+e.message);}
}
async function syncKO(){
  if(!S.kStage||!S.eid)return false;var teamsMap=computeKOTeams();var anyUpdated=false;
  var slots=[25,26,27,28,29,30,31];
  for(var i=0;i<slots.length;i++){var slot=slots[i];var t=teamsMap[slot];var m=koBySlot(slot);if(!m)continue;
    if(m.home_team_id!==t.h||m.away_team_id!==t.a){try{await sb.from("matches").update({home_team_id:t.h,away_team_id:t.a}).eq("id",m.id);m.home_team_id=t.h;m.away_team_id=t.a;anyUpdated=true;}catch(e){}}}
  return anyUpdated;
}

function schedSlotToHM(slotIdx){var totalMin=CFG.SCHED_START_H*60+slotIdx*CFG.SCHED_STEP_MIN;var h=Math.floor(totalMin/60)%24;var m=totalMin%60;return pad(h,2)+":"+pad(m,2);}
async function batchFillSchedule(){
  if(!S.eid){toast("Chọn nội dung trước",true);return;}
  var defaultCourt=S.courts.length?S.courts[0].id:null;
  var count=0;
  try{
    var gm=S.matches.filter(function(m){return m.group_id;});
    for(var i=0;i<gm.length;i++){
      var m=gm[i];var inGroup=(Number(m.bracket_slot)-1)%6;
      var hm=schedSlotToHM(inGroup);var u={};
      u.scheduled_at=isoFromTime(hm);
      if(!m.court_id&&defaultCourt)u.court_id=defaultCourt;
      await sb.from("matches").update(u).eq("id",m.id);
      m.scheduled_at=u.scheduled_at;if(u.court_id)m.court_id=u.court_id;count++;
    }
    var koBaseSlot=CFG.MATCHES_PER_GROUP;
    var km=S.matches.filter(function(m){return!m.group_id;}).sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});
    for(var j=0;j<km.length;j++){
      var k=km[j];var hm2=schedSlotToHM(koBaseSlot+j);var u2={};
      u2.scheduled_at=isoFromTime(hm2);
      if(!k.court_id&&defaultCourt)u2.court_id=defaultCourt;
      await sb.from("matches").update(u2).eq("id",k.id);
      k.scheduled_at=u2.scheduled_at;if(u2.court_id)k.court_id=u2.court_id;count++;
    }
    toast("✅ Đã điền giờ cho "+count+" trận (bắt đầu "+pad(CFG.SCHED_START_H,2)+":00, cách "+CFG.SCHED_STEP_MIN+" phút)");
    await selE(S.eid);
  }catch(e){toast("❌ "+e.message,true);}
}

  var un=unassigned();if(un.length)H+='<div class="alert">⚠ Chưa xếp: '+un.length+' đội</div>';
  H+='<div class="tw"><table><tr><th>Bảng</th><th>Đội</th><th>Chuyển</th></tr>';
  CFG.GROUPS.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var mb=teamsInG(g.id);mb.forEach(function(tm){var selHtml='<option value="">--</option>';CFG.GROUPS.forEach(function(cc){var gg=S.groups.find(function(x){return x.code===cc&&x.stage_id===S.gStage.id;});if(gg)selHtml+='<option value="'+gg.id+'"'+(cc===c?" selected":"")+'>'+cc+'</option>';});H+='<tr><td><b>'+c+'</b></td><td>'+esc(sn(tm.name))+'</td><td><select onchange="toGroup(\''+tm.id+"',this.value)\">"+selHtml+"</select></td></tr>";});});
  H+='</table></div>';
  CFG.GROUPS.forEach(function(c){
    var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;
    var mb=teamsInG(g.id),d=draftOf(g.id),ex=S.matches.filter(function(m){return m.group_id===g.id;});
    H+='<div class="gcard"><h4>📋 Bảng '+c+' <span>'+(ex.length?"✓ "+ex.length+"/6":"—")+'</span></h4>';
    if(mb.length!==4){H+='<div class="alert">Cần 4 đội (hiện '+mb.length+').</div>';
    }else{
      H+=renderBXH(g.id,c);
      var teamOpts=mb.map(function(t){return '<option value="'+t.id+'">'+esc(sn(t.name))+'</option>';}).join("");
      d.forEach(function(m,i){var ri=S.draft.indexOf(m);H+='<div class="mrow"><span class="n">'+c+(i+1)+'</span><select onchange="upDraft('+ri+",'h',this.value)\"><option value=\"\">--</option>"+teamOpts+'</select><span style="color:var(--mu);font-weight:700">vs</span><select onchange="upDraft('+ri+",'a',this.value)\"><option value=\"\">--</option>"+teamOpts+'</select><button class="btn btn-d btn-s" onclick="rmDraft('+ri+')">✕</button></div>';});
      H+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';
      if(d.length<6)H+='<button class="btn btn-l btn-s" onclick="addDraft(\''+g.id+'\')">➕ Trận</button>';
      H+='<button class="btn btn-b btn-s" onclick="autoRR(\''+g.id+'\')">⚡ Auto</button>';
      if(valDraft(g.id)==="")H+='<button class="btn btn-p btn-s" onclick="saveGroup(\''+g.id+'\')">💾 Lưu 6 trận + KO</button>';
      H+='</div>';
      if(ex.length){ex.sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});H+=renderMatchTable(ex,false);}
    }
    H+='</div>';
  });
  var km=S.matches.filter(function(m){return!m.group_id;}).sort(function(a,b){return Number(a.bracket_slot)-Number(b.bracket_slot);});
  H+=renderKOSection(km);return H;
}

/* V34: Render danh sách user với thao tác */
function renderUserTable(){
  if(!S.users.length)return '<div class="info">Chưa có user nào.</div>';
  var H='<div class="tw"><table><thead><tr><th>User</th><th>Role</th><th>Thao tác</th></tr></thead><tbody>';
  S.users.forEach(function(u){
    var isMe=S.user&&u.user_id===S.user.id;
    var dispName=u.display_name||u.username||"—";
    H+='<tr>';
    H+='<td>'+esc(dispName)+(isMe?'<span class="me-badge">BẠN</span>':'')+'</td>';
    H+='<td><select onchange="chRole(\''+u.user_id+"',this.value)\">";
    ["referee","organizer","admin"].forEach(function(rr){H+='<option value="'+rr+'"'+(u.role===rr?" selected":"")+'>'+rr+'</option>';});
    H+='</select></td>';
    H+='<td><div class="user-actions">';
    H+='<button class="btn btn-b btn-xs" onclick="editUserName(\''+u.user_id+'\')" title="Sửa tên">✏️</button>';
    if(isMe){H+='<button class="btn btn-w btn-xs" onclick="changeMyPassword()" title="Đổi mật khẩu của bạn">🔑</button>';}
    H+='<button class="btn btn-d btn-xs" onclick="deleteUser(\''+u.user_id+'\')" title="Xóa user">🗑</button>';
    H+='</div></td>';
    H+='</tr>';
  });
  H+='</tbody></table></div>';
  H+='<div class="hint">💡 🔑 Đổi mật khẩu chỉ áp dụng cho chính bạn. Xóa user chỉ xóa khỏi hệ thống nghiệp vụ (tài khoản vẫn còn trong Supabase Auth).</div>';
  return H;
}

/* === MAIN RENDER === */
function render(){
  if(!isAdmin())return;
  try{
    var t=S.tournament;
    var gm=S.matches.filter(function(m){return m.group_id;});
    var km=S.matches.filter(function(m){return!m.group_id;});
    var H="";
    H+='<div class="acc">'+accH("1","VĐV","s1",S.players.length?"done":"empty",S.players.length+" VĐV");
    H+='<div class="acc-b'+(S.acc.s1?" open":"")+'">';
    H+='<div class="fg"><input id="p-name" placeholder="Họ tên"/><select id="p-gender"><option value="male">Nam</option><option value="female">Nữ</option></select><input id="p-rating" type="number" step="0.05" placeholder="Rating"/><input id="p-club" placeholder="Club"/><button class="btn btn-p" onclick="saveP()">➕ Thêm</button></div>';
    if(S.players.length){H+='<div class="tw"><table><thead><tr><th>Họ tên</th><th>GT</th><th>Rating</th><th>Club</th><th></th></tr></thead><tbody>';S.players.forEach(function(p){H+='<tr><td>'+esc(p.full_name)+'</td><td>'+(p.gender==="male"?"Nam":"Nữ")+'</td><td>'+(p.skill_rating||"-")+'</td><td>'+esc(p.club_name||"-")+'</td><td><button class="btn btn-d btn-s" onclick="delP(\''+p.id+'\')">🗑</button></td></tr>';});H+='</tbody></table></div>';}
    H+='</div></div>';
    H+='<div class="acc">'+accH("2","Tạo giải","s2",S.tournaments.length?"done":"empty",S.tournaments.length+" giải");
    H+='<div class="acc-b'+(S.acc.s2?" open":"")+'"><div class="fg"><input id="t-name" placeholder="Tên giải"/><input id="t-location" placeholder="📍 Địa điểm"/><input id="t-start" type="date"/><input id="t-end" type="date"/><button class="btn btn-p" onclick="createT()">➕ Tạo</button></div></div></div>';
    var t3st="empty";if(S.teams.length>=16)t3st="done";else if(S.teams.length>0)t3st="part";else if(S.eid)t3st="part";
    H+='<div class="acc">'+accH("3","Giải đấu · Nội dung · Tạo đội","s3",t3st,S.teams.length+(S.eid?"/16":""));
    H+='<div class="acc-b'+(S.acc.s3?" open":"")+'">';
    if(!S.tournament){H+='<div class="alert">⚠ Chưa có giải. Tạo giải ở Bước 2.</div>';
    }else{
      H+='<div class="fg"><select onchange="selT(this.value)">';
      sortedT().forEach(function(x){var s=(t&&t.id===x.id)?" selected":"";var icon=x.status==="completed"?"🔒 ":"";var loc=x.location_name?' · 📍 '+esc(x.location_name):'';H+='<option value="'+x.id+'"'+s+'>'+icon+esc(x.name)+loc+'</option>';});
      H+='</select></div>';
      var isOpen=t.status!=="completed";
      H+='<div class="t-actions">';
      if(isOpen){H+='<span class="t-status open">🟢 ĐANG MỞ</span><button class="btn btn-w" onclick="toggleTournament()">🔒 Đóng giải</button>';}
      else{H+='<span class="t-status closed">🔴 ĐÃ ĐÓNG</span><button class="btn btn-b" onclick="toggleTournament()">🔓 Mở giải</button>';}
      H+='<button class="btn btn-d" onclick="delT(\''+t.id+'\')">🗑 Xóa giải</button></div>';
      if(!isOpen)H+='<div class="alert" style="margin-top:8px">⚠ Giải đã ĐÓNG — Trọng tài không thể đăng nhập.</div>';
      H+='<div class="fg" style="margin-top:8px"><input id="t-name-edit" placeholder="✏️ Sửa tên giải" value="'+esc(t.name||'')+'"/><button class="btn btn-b" onclick="updateTName()">💾 Tên</button><input id="t-location-edit" placeholder="📍 Sửa địa điểm" value="'+esc(t.location_name||'')+'"/><button class="btn btn-b" onclick="updateTLocation()">💾 Địa điểm</button></div>';
      H+='<div class="info" style="margin-top:6px">📅 '+esc(t.start_date||"—")+' → '+esc(t.end_date||"—")+' · 📍 '+esc(t.location_name||"Chưa có")+'</div>';
      H+='<div class="section-divider"><div class="section-title">📋 NỘI DUNG THI ĐẤU</div>';
      H+='<div class="fg"><select onchange="selE(this.value)" id="event-selector"><option value="">-- Chọn nội dung --</option>';
      S.events.forEach(function(e){var sel=(S.eid===e.id)?" selected":"";var rule=e.rating_rule==="max_total"?" · Tổng ≤"+e.rating_limit:" · Mở";H+='<option value="'+e.id+'"'+sel+'>'+esc(e.code)+'. '+esc(e.name)+rule+'</option>';});
      H+='</select><button class="btn btn-b btn-s" onclick="quickCreateEvent()">➕ Tạo nội dung</button></div>';
      if(S.events.length){H+='<div class="tw"><table><thead><tr><th>Mã</th><th>Tên</th><th>Giới hạn</th><th>Luật</th><th colspan="2">Thao tác</th></tr></thead><tbody>';S.events.forEach(function(e){var rule=e.rating_rule==="max_total"?"Tổng ≤"+e.rating_limit:"Mở";H+='<tr><td>'+esc(e.code)+'</td><td>'+esc(e.name)+'</td><td>'+(e.rating_limit||"—")+'</td><td>'+esc(rule)+'</td><td><button class="btn btn-b btn-s" onclick="editEventName(\''+e.id+'\')">✏️</button></td><td><button class="btn btn-d btn-s" onclick="delE(\''+e.id+'\')">🗑</button></td></tr>';});H+='</tbody></table></div>';}
      H+='</div>';
      H+='<div class="section-divider"><div class="section-title">👥 TẠO ĐỘI</div>';
      if(!S.eid){H+=S.events.length===0?'<div class="alert">⚠ Chưa có nội dung. Bấm ➕ Tạo nội dung.</div>':'<div class="alert">⚠ Chọn nội dung để tạo đội</div>';
      }else{
        var ev=S.events.find(function(e){return e.id===S.eid;});
        if(ev){var ruleText=ev.rating_rule==="max_total"?'Tổng trình ≤ '+ev.rating_limit:'Mở (không giới hạn trình)';H+='<div class="ev-info">📋 Đang chọn: <b>'+esc(ev.code)+'. '+esc(ev.name)+'</b><span class="ev-rule">'+esc(ruleText)+'</span></div>';}
        var available=getAvailablePlayers();var usedCount=S.players.length-available.length;
        H+='<div class="player-usage"><span>👥 VĐV khả dụng: <b class="'+(available.length>0?"ok":"warn")+'">'+available.length+' / '+S.players.length+'</b></span><span style="font-size:11px;color:var(--mu)">Đã ghép cặp: <b>'+usedCount+'</b></span></div>';
        if(available.length===0&&S.players.length>0){H+='<div class="alert">⚠ Tất cả VĐV đã ghép cặp.</div>';}
        else if(S.players.length===0){H+='<div class="alert">⚠ Chưa có VĐV. Thêm VĐV ở Bước 1.</div>';}
        else{
          H+='<div class="fg"><select id="tp1" onchange="syncPlayerOptions(\'tp1\',\'tp2\');updateTotalPreview()"><option value="">-- VĐV1 --</option>';
          available.forEach(function(p){H+='<option value="'+p.id+'" data-available="1">'+esc(p.full_name)+' ('+(p.skill_rating||"-")+')</option>';});
          H+='</select><select id="tp2" onchange="syncPlayerOptions(\'tp2\',\'tp1\');updateTotalPreview()"><option value="">-- VĐV2 --</option>';
          available.forEach(function(p){H+='<option value="'+p.id+'" data-available="1">'+esc(p.full_name)+' ('+(p.skill_rating||"-")+')</option>';});
          H+='</select><button class="btn btn-p" onclick="saveTeam()">➕ Tạo đội</button></div>';
          H+='<div id="total-preview" class="total-preview"></div>';
          H+='<div class="hint">💡 VĐV đã ghép cặp tự ẩn. Tổng trình phải ≤ giới hạn nội dung.</div>';
        }
        if(S.teams.length){
          H+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><button class="btn btn-b btn-s" onclick="exportTeamsCSV()">📥 CSV ('+S.teams.length+' đội)</button></div>';
          H+='<div class="tw"><table><thead><tr><th>STT</th><th>Tên đội</th><th>VĐV 1</th><th>VĐV 2</th><th>Tổng trình</th><th></th></tr></thead><tbody>';
          S.teams.forEach(function(tm,i){
            var p1=null,p2=null;(tm.members||[]).forEach(function(m){if(m.position===1)p1=m.players;else if(m.position===2)p2=m.players;});
            var n1=p1&&p1.full_name?esc(p1.full_name):"—",n2=p2&&p2.full_name?esc(p2.full_name):"—";
            var overLimit=ev&&ev.rating_rule==="max_total"&&ev.rating_limit&&tm.total_rating>ev.rating_limit;
            var ratingHtml=overLimit?'<b style="color:var(--rd)">'+tm.total_rating.toFixed(2)+' ⚠</b>':'<b style="color:var(--li)">'+tm.total_rating.toFixed(2)+'</b>';
            H+='<tr><td>'+(i+1)+'</td><td><b>'+esc(sn(tm.name))+'</b></td><td>'+n1+'</td><td>'+n2+'</td><td>'+ratingHtml+'</td><td><button class="btn btn-d btn-s" onclick="delTeam(\''+tm.id+'\')">🗑</button></td></tr>';
          });
          H+='</tbody></table></div>';
        }else if(S.eid){H+='<div class="info">Chưa có đội. Chọn 2 VĐV và bấm <b>➕ Tạo đội</b>.</div>';}
      }
      H+='</div>';
    }
    H+='</div></div>';
    var s4st=(gm.length===24&&km.length===7)?"done":(gm.length||km.length?"part":"empty");
    H+='<div class="acc">'+accH("4","Lịch + Trọng tài","s4",s4st,gm.length+"/24 · KO "+km.length+"/7");
    H+='<div class="acc-b'+(S.acc.s4?" open":"")+'">'+renderSchedule()+'</div></div>';
    /* V34: BƯỚC 5 - NGƯỜI DÙNG với thao tác đầy đủ */
    H+='<div class="acc">'+accH("5","Người dùng","s5",S.users.length?"done":"empty",S.users.length+" user");
    H+='<div class="acc-b'+(S.acc.s5?" open":"")+'">';
    H+='<div class="fg"><input id="nu-email" placeholder="Tên user (VD: trongtai1)"/><input id="nu-pass" value="'+esc(CFG.PASS)+'"/><select id="nu-role"><option value="referee">referee</option><option value="organizer">organizer</option><option value="admin">admin</option></select><button class="btn btn-p" onclick="createUser()">➕ Tạo</button></div>';
    H+='<div class="hint">💡 Nhập tên → tự thêm <b>@gmail.com</b>. MK mặc định: 123@321</div>';

    H+=renderUserTable();
    H+='</div></div>';
    el("admin").innerHTML=H;
    setTimeout(function(){
      S.draft.forEach(function(m,i){var rows=document.querySelectorAll(".mrow");if(rows[i]){var s=rows[i].querySelectorAll("select");if(s[0])s[0].value=m.h||"";if(s[1])s[1].value=m.a||"";}});
      updateTotalPreview();
    },50);
  }catch(e){console.error("render error:",e);el("admin").innerHTML='<div class="alert">❌ Lỗi render: '+esc(e.message)+'</div>';}
}

(async function init(){try{var d=await sb.auth.getSession();if(d.data&&d.data.session){await loadProfile(d.data.session);applyUI();if(isAdmin())await loadAll();}else{applyUI();el("admin").innerHTML='<div class="info">Vui lòng đăng nhập.</div>';}}catch(e){el("admin").innerHTML='<div class="alert">❌ Lỗi: '+esc(e.message)+'</div>';}})();
</script>
