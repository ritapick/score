<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Quản trị - Pickleball Pro v15</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.95);border-bottom:1px solid var(--ln);padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{color:var(--li);font-weight:800;font-size:16px;text-transform:uppercase}
.chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:4px 10px;border-radius:99px}
.btn{border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:700}
.btn-p{background:var(--li);color:#0b1220}
.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu)}
.btn-d{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}
.btn-w{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
.btn-s{padding:4px 8px;font-size:11px}
main{max-width:900px;margin:0 auto;padding:10px}
.acc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc-h{padding:12px;background:var(--sf2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13px}
.acc-h .st{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:800}
.st-done{background:rgba(163,230,53,.2);color:var(--li)}
.st-part{background:rgba(251,146,60,.2);color:var(--or)}
.st-empty{background:rgba(148,163,184,.2);color:var(--mu)}
.acc-b{display:none;padding:12px}
.acc-b.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:8px;padding:8px;color:var(--tx);width:100%;font-size:13px}
input[type="time"],input[type="number"]{color-scheme:dark}
.tw{overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;min-width:380px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:12px}
th{color:var(--mu);font-size:10px;text-transform:uppercase}
.gcard{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px}
.gcard h4{margin:0 0 8px;color:var(--li);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
/* KO card nổi bật */
.ko-section{background:rgba(251,146,60,.05);border:2px solid var(--or);border-radius:12px;padding:12px;margin-bottom:10px}
.ko-section>h4{margin:0 0 10px;color:var(--or);font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ko-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:11px}
.ko-stats .k{background:var(--sf2);padding:4px 10px;border-radius:6px;display:flex;gap:4px;align-items:center}
.ko-stats .k b{color:var(--li);font-family:monospace}
.ko-group-title{color:var(--or);font-weight:800;font-size:12px;text-transform:uppercase;margin:12px 0 6px;padding:6px 10px;background:rgba(251,146,60,.15);border-radius:6px;display:flex;justify-content:space-between;align-items:center}
/* Match card */
.mcard{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px}
.mcard.ko{border-color:var(--or);border-width:2px;background:rgba(251,146,60,.05)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.mcode{background:var(--li);color:#0b1220;padding:3px 10px;border-radius:6px;font-weight:800;font-size:12px;font-family:monospace;letter-spacing:.5px}
.mcard.ko .mcode{background:var(--or)}
.mvs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch;margin-bottom:8px}
.mvs .vs{color:var(--mu);font-weight:700;font-size:11px;display:flex;align-items:center}
.team-box{padding:8px;border-radius:6px;font-weight:700;font-size:12px;min-height:36px;display:flex;align-items:center;justify-content:center;text-align:center}
.team-home{background:rgba(163,230,53,.1);color:var(--li)}
.team-away{background:rgba(34,211,238,.1);color:var(--cy)}
.team-tbd{background:rgba(251,146,60,.12);color:var(--or);font-style:italic;font-weight:500;font-size:11px;border:1px dashed var(--or)}
.mmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px;border-top:1px dashed var(--ln)}
.mmeta-item{display:flex;align-items:center;gap:4px;font-size:11px}
.mmeta-item .lbl{color:var(--mu);font-size:10px;font-weight:700}
.mmeta-item input[type="time"]{padding:4px 6px;font-size:11px;width:85px;border-radius:5px;background:#0d1626;border:1px solid var(--ln);color:var(--tx)}
.mmeta-item input[type="number"]{padding:4px 6px;font-size:11px;width:50px;border-radius:5px;background:#0d1626;border:1px solid var(--ln);color:var(--tx);text-align:center}
.mmeta-item select{padding:4px 6px;font-size:11px;border-radius:5px;background:#0d1626;border:1px solid var(--ln);color:var(--tx);min-width:90px}
.score-sep{color:var(--mu);font-weight:700}
.status-badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;white-space:nowrap}
.status-scheduled{background:rgba(148,163,184,.15);color:var(--mu)}
.status-completed{background:rgba(163,230,53,.15);color:var(--li)}
.mrow{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:5px;align-items:center;padding:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;font-size:12px}
.mrow .n{background:var(--li);color:#0b1220;padding:2px 7px;border-radius:4px;font-weight:800;font-size:11px}
.alert{padding:8px;border-radius:8px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);color:var(--or);font-size:12px;margin-bottom:8px}
.info{padding:8px;border-radius:8px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cy);font-size:12px;margin-bottom:8px}
.ok{padding:8px;border-radius:8px;background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.3);color:var(--li);font-size:12px;margin-bottom:8px}
.section-title{color:var(--cy);font-weight:700;font-size:12px;margin:10px 0 4px;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bg.show{display:flex}
.modal{width:min(400px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
@media(max-width:640px){
  .mrow{grid-template-columns:1fr;gap:4px}
  .mrow .n{justify-self:start}
  .mvs{grid-template-columns:1fr;text-align:center}
  .mvs .vs{padding:4px;justify-content:center}
  .fg{grid-template-columns:1fr}
  .mmeta{gap:6px}
  .mmeta-item input[type="time"]{width:80px}
  .mmeta-item input[type="number"]{width:44px}
}
</style>
</head>
<body>
<nav class="topnav">
<span class="logo">⚙ Quản trị <span style="font-size:10px;background:var(--cy);color:#0b1220;padding:2px 6px;border-radius:4px">v15</span></span>
<div>
<span id="user-chip" class="chip hidden"></span>
<button id="login-btn" class="btn btn-p" onclick="openLogin()">Đăng nhập</button>
<button id="logout-btn" class="btn btn-l hidden" onclick="logout()">Thoát</button>
</div>
</nav>
<main><div id="admin">Đang tải...</div></main>
<div id="toast" class="toast"></div>
<div id="login-modal" class="modal-bg">
<div class="modal">
<h3 style="margin:0 0 10px;color:var(--li)">🔐 Đăng nhập</h3>
<input id="lu" placeholder="Email" style="margin-bottom:8px"/>
<input id="lp" type="password" placeholder="Mật khẩu (123@321)" style="margin-bottom:10px"/>
<div style="display:flex;gap:8px;justify-content:flex-end">
<button class="btn btn-l" onclick="closeLogin()">Đóng</button>
<button class="btn btn-p" onclick="doLogin()">Đăng nhập</button>
</div>
<div id="lmsg" style="font-size:12px;margin-top:8px;color:var(--rd)"></div>
</div>
</div>
<script>
"use strict";
var CFG={URL:"https://mvefkcaqvjflrgmaybev.supabase.co",KEY:"sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc",PASS:"123@321",DOMAIN:"@pb-local.app",GROUPS:["A","B","C","D"],KO_SLOTS:["TK1","TK2","TK3","TK4","BK1","BK2","CK"]};
var sb;
try{sb=window.supabase.createClient(CFG.URL,CFG.KEY);}catch(e){console.error("Supabase init error:",e);}
var S={user:null,role:null,username:null,tournaments:[],tournament:null,events:[],eid:null,courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],gStage:null,kStage:null,users:[],refs:[],refAssign:{},draft:[],acc:{s1:true,s2:false,s3:false,s4:false,s5:false,s6:false,s7:false}};
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function isAdmin(){return S.role==="admin"||S.role==="organizer";}
function pad(n,l){return String(n).padStart(l,"0");}
function sn(n){return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function findTeam(id){if(!id)return null;for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null;}
function tName(id){var t=findTeam(id);return t?sn(t.name):null;}
function toast(msg,isErr){var t=el("toast");t.textContent=msg;t.className="toast show";t.style.background=isErr?"var(--rd)":"var(--li)";t.style.color=isErr?"#fff":"#0b1220";if(window._toastT)clearTimeout(window._toastT);window._toastT=setTimeout(function(){t.className="toast";},isErr?4000:2000);}
function sortedT(){return S.tournaments.slice().sort(function(a,b){var ao=a.status==="completed"?1:0,bo=b.status==="completed"?1:0;if(ao!==bo)return ao-bo;return String(a.created_at||"").localeCompare(b.created_at||"");});}
function tSeq(){var s=sortedT();for(var i=0;i<s.length;i++)if(s[i].id===S.tournament.id)return i+1;return 1;}
function eSeq(){var s=S.events.slice().sort(function(a,b){return String(a.created_at||"").localeCompare(b.created_at||"");});for(var i=0;i<s.length;i++)if(s[i].id===S.eid)return i+1;return 1;}
function bCode(sc){return pad(tSeq(),3)+pad(eSeq(),1)+sc;}
function dCode(mc){return (mc||"").slice(4);}

function getMatchDate(){if(S.tournament&&S.tournament.start_date)return S.tournament.start_date;var d=new Date();return d.toISOString().slice(0,10);}
function timeFromISO(iso){if(!iso)return"";try{var t=iso.split("T")[1];if(!t)return"";return t.slice(0,5);}catch(e){return"";}}
function isoFromTime(hhmm){if(!hhmm)return null;return getMatchDate()+"T"+hhmm+":00+07:00";}

function autoStatus(m){var h=Number(m.home_score)||0,a=Number(m.away_score)||0;return(h>0||a>0)?"completed":"scheduled";}
function statusBadge(m){var st=autoStatus(m);if(st==="completed")return'<span class="status-badge status-completed">✅ Kết thúc</span>';return'<span class="status-badge status-scheduled">⏳ Chưa đấu</span>';}

function koPlaceholder(code){
  var c=dCode(code);
  var map={"TK1":{h:"🏆 Nhất bảng A",a:"🥈 Nhì bảng B"},"TK2":{h:"🏆 Nhất bảng B",a:"🥈 Nhì bảng A"},"TK3":{h:"🏆 Nhất bảng C",a:"🥈 Nhì bảng D"},"TK4":{h:"🏆 Nhất bảng D",a:"🥈 Nhì bảng C"},"BK1":{h:"⭐ Thắng TK1",a:"⭐ Thắng TK2"},"BK2":{h:"⭐ Thắng TK3",a:"⭐ Thắng TK4"},"CK":{h:"🥇 Thắng BK1",a:"🥇 Thắng BK2"}};
  return map[c]||{h:"TBD",a:"TBD"};
}

function openLogin(){el("login-modal").classList.add("show");el("lmsg").textContent="";}
function closeLogin(){el("login-modal").classList.remove("show");}
async function doLogin(){
  var u=el("lu").value.trim(),p=el("lp").value;
  if(!u||!p){el("lmsg").textContent="Nhập đủ thông tin";return;}
  el("lmsg").textContent="Đang đăng nhập...";
  var cands=u.indexOf("@")>=0?[u]:[u,u+CFG.DOMAIN],lastErr=null;
  for(var i=0;i<cands.length;i++){
    try{var r=await sb.auth.signInWithPassword({email:cands[i],password:p});if(r.error){lastErr=r.error;continue;}closeLogin();await loadProfile(r.data.session);applyUI();await loadAll();toast("✅ "+S.username);return;}catch(e){lastErr=e;}
  }
  el("lmsg").textContent="❌ "+(lastErr&&lastErr.message?lastErr.message:"Sai email/mật khẩu");
}
async function logout(){try{await sb.auth.signOut();}catch(e){}S.user=null;S.role=null;S.username=null;applyUI();render();}
async function loadProfile(session){S.user=session.user;var r=await sb.from("user_roles").select("role").eq("user_id",session.user.id);var roles=(r.data||[]).map(function(x){return x.role;});S.role=roles.indexOf("admin")>=0?"admin":roles.indexOf("organizer")>=0?"organizer":roles.indexOf("referee")>=0?"referee":null;S.username=session.user.email;}
function applyUI(){var logged=!!S.user;el("login-btn").classList.toggle("hidden",logged);el("logout-btn").classList.toggle("hidden",!logged);el("user-chip").classList.toggle("hidden",!logged);if(logged)el("user-chip").textContent=(S.username||"")+(S.role?" • "+S.role:"");if(!isAdmin()&&logged)el("admin").innerHTML='<div class="alert">⚠ Chỉ admin/organizer.</div>';}

async function loadAll(){try{var a=await sb.from("tournaments").select("*");S.tournaments=a.data||[];await loadUsers();await loadRefs();if(S.tournaments.length)await selT(sortedT()[0].id);else render();}catch(e){console.error("loadAll error:",e);el("admin").innerHTML='<div class="alert">❌ Lỗi tải: '+esc(e.message)+'</div>';}}
async function selT(id){S.tournament=null;for(var i=0;i<S.tournaments.length;i++)if(S.tournaments[i].id===id){S.tournament=S.tournaments[i];break;}if(!S.tournament){render();return;}try{var e=await sb.from("events").select("*").eq("tournament_id",id);S.events=e.data||[];var c=await sb.from("courts").select("*").eq("tournament_id",id);S.courts=c.data||[];var p=await sb.from("players").select("*");S.players=p.data||[];if(S.events.length)await selE(S.events[0].id);else{S.eid=null;S.teams=[];S.matches=[];render();}}catch(e){render();}}
async function selE(id){S.eid=id||null;S.draft=[];if(!S.eid){render();return;}try{var t=await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name,skill_rating))").eq("event_id",id);S.teams=(t.data||[]).map(function(x){var m=x.team_members||[],tot=0;m.forEach(function(k){tot+=(k.players&&k.players.skill_rating)||0;});return Object.assign({},x,{members:m,total_rating:Number(tot.toFixed(2))});});var st=await sb.from("stages").select("*").eq("event_id",id);S.stages=st.data||[];S.gStage=null;S.kStage=null;S.stages.forEach(function(s){if(s.stage_type==="group_stage")S.gStage=s;if(s.stage_type==="knockout")S.kStage=s;});var ids=S.stages.map(function(s){return s.id;});if(ids.length){var g=await sb.from("groups").select("*").in("stage_id",ids);S.groups=g.data||[];var gt=await sb.from("group_teams").select("*").in("stage_id",ids);S.groupTeams=gt.data||[];}else{S.groups=[];S.groupTeams=[];}var m=await sb.from("matches").select("*").eq("event_id",id).order("match_seq");S.matches=m.data||[];await syncKO();await loadRefAssign();render();}catch(e){render();}}
async function loadUsers(){var a=await sb.from("app_users").select("*");var u=await sb.from("user_roles").select("*");var mp={};(a.data||[]).forEach(function(x){mp[x.user_id]=Object.assign({},x,{role:null});});(u.data||[]).forEach(function(r){if(mp[r.user_id])mp[r.user_id].role=r.role;});var arr=[];for(var k in mp)arr.push(mp[k]);S.users=arr;}
async function loadRefs(){var u=await sb.from("user_roles").select("user_id").eq("role","referee");var ids=(u.data||[]).map(function(x){return x.user_id;});if(ids.length){var a=await sb.from("app_users").select("user_id,username").in("user_id",ids);S.refs=a.data||[];}else S.refs=[];}
async function loadRefAssign(){S.refAssign={};if(!S.matches.length)return;var ids=S.matches.map(function(m){return m.id;});try{var r=await sb.from("referee_matches").select("*").in("match_id",ids);(r.data||[]).forEach(function(x){S.refAssign[x.match_id]=x.user_id;});}catch(e){}}

async function createT(){var n=el("t-name").value.trim(),d=el("t-start").value;if(!n||!d){alert("Nhập tên + ngày");return;}var used={};S.tournaments.forEach(function(t){used[t.code]=1;});var nn=1;while(used[pad(nn,3)])nn++;var code=pad(nn,3);var r=await sb.from("tournaments").insert({code:code,name:n,start_date:d,end_date:el("t-end").value||d,status:"in_progress"}).select().single();if(r.error){alert(r.error.message);return;}for(var i=1;i<=8;i++){try{await sb.from("courts").insert({tournament_id:r.data.id,name:"Sân "+i,display_order:i});}catch(e){}}toast("✅ Tạo giải "+code);await loadAll();}
async function delT(id){if(!confirm("Xóa giải + toàn bộ dữ liệu?"))return;try{var ev=await sb.from("events").select("id").eq("tournament_id",id);var eids=(ev.data||[]).map(function(e){return e.id;});if(eids.length){var mr=await sb.from("matches").select("id").in("event_id",eids);var mids=(mr.data||[]).map(function(m){return m.id;});if(mids.length)await sb.from("referee_matches").delete().in("match_id",mids);await sb.from("matches").delete().in("event_id",eids);var st=await sb.from("stages").select("id").in("event_id",eids);var sids=(st.data||[]).map(function(s){return s.id;});if(sids.length){await sb.from("group_teams").delete().in("stage_id",sids);await sb.from("groups").delete().in("stage_id",sids);await sb.from("stages").delete().in("stage_id",sids);}await sb.from("team_members").delete().in("event_id",eids);await sb.from("teams").delete().in("event_id",eids);await sb.from("events").delete().in("id",eids);}await sb.from("courts").delete().eq("tournament_id",id);await sb.from("tournaments").delete().eq("id",id);toast("✅ Đã xóa");await loadAll();}catch(e){alert("❌ "+e.message);}}
async function saveE(){if(!S.tournament){alert("Chọn giải trước");return;}var n=el("e-name").value.trim();if(!n){alert("Nhập tên");return;}var lim=parseFloat(el("e-limit").value);var used={};S.events.forEach(function(e){used[e.code]=1;});var nn=1;while(used[pad(nn,2)])nn++;var r=await sb.from("events").insert({tournament_id:S.tournament.id,code:pad(nn,2),name:n,rating_limit:isNaN(lim)?null:lim,rating_rule:el("e-rule").value,status:"open"});if(r.error){alert(r.error.message);return;}toast("✅ Tạo nội dung");await selT(S.tournament.id);}
async function delE(id){if(!confirm("Xóa nội dung?"))return;await sb.from("events").delete().eq("id",id);await selT(S.tournament.id);}
async function saveP(){var n=el("p-name").value.trim().toUpperCase();if(!n){alert("Nhập họ tên");return;}var r=parseFloat(el("p-rating").value);var res=await sb.from("players").insert({full_name:n,gender:el("p-gender").value,skill_rating:isNaN(r)?null:r,club_name:(el("p-club").value||"").toUpperCase()});if(res.error){alert(res.error.message);return;}toast("✅ Thêm VĐV");var p=await sb.from("players").select("*");S.players=p.data||[];render();}
async function delP(id){if(!confirm("Xóa VĐV?"))return;await sb.from("players").delete().eq("id",id);var p=await sb.from("players").select("*");S.players=p.data||[];render();}

function autoRR(g){var t=teamsInG(g);if(t.length!==4){alert("Cần 4 đội");return;}S.draft=S.draft.filter(function(x){return x.g!==g;});[{a:0,b:1},{a:2,b:3},{a:0,b:2},{a:1,b:3},{a:0,b:3},{a:1,b:2}].forEach(function(p){S.draft.push({g:g,h:t[p.a].id,a:t[p.b].id});});render();}
function valDraft(g){var t=teamsInG(g);if(t.length!==4)return"Bảng cần 4 đội";var d=draftOf(g);if(d.length!==6)return"Cần 6 trận";var cm={};t.forEach(function(x){cm[x.id]=0;});var seen={};for(var i=0;i<d.length;i++){var m=d[i];if(!m.h||!m.a)return"Trận "+(i+1)+" thiếu đội";if(m.h===m.a)return"Trùng đội";cm[m.h]++;cm[m.a]++;var k=[m.h,m.a].sort().join("-");if(seen[k])return"Trùng cặp";seen[k]=1;}for(var k in cm)if(cm[k]!==3)return"Mỗi đội đấu 3 trận";return"";}

function standings(g){var t=teamsInG(g);var st={};t.forEach(function(x){st[x.id]={id:x.id,w:0,pf:0,pa:0};});S.matches.filter(function(m){return m.group_id===g&&autoStatus(m)==="completed";}).forEach(function(m){var h=st[m.home_team_id],a=st[m.away_team_id];if(!h||!a)return;h.pf+=m.home_score;h.pa+=m.away_score;a.pf+=m.away_score;a.pa+=m.home_score;if(m.home_score>m.away_score)h.w++;else a.w++;});var arr=[];for(var k in st)arr.push(st[k]);return arr.sort(function(x,y){if(y.w!==x.w)return y.w-x.w;var dx=x.pf-x.pa,dy=y.pf-y.pa;if(dy!==dx)return dy-dx;return y.pf-x.pf;});}
function koBy(code){return S.matches.find(function(m){return m.match_code===code;});}
function winnerOf(code){var m=koBy(code);if(!m||autoStatus(m)!=="completed")return null;if(m.winner_team_id)return m.winner_team_id;if(m.home_score>m.away_score)return m.home_team_id;if(m.away_score>m.home_score)return m.away_team_id;return null;}

async function createKO(){
  if(!S.kStage){try{var r=await sb.from("stages").insert({event_id:S.eid,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2}).select().single();S.kStage=r.data;}catch(e){return;}}
  var tops={};
  CFG.GROUPS.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g){tops[c]={f:null,s:null};return;}var st=standings(g.id);tops[c]={f:st[0]?st[0].id:null,s:st[1]?st[1].id:null};});
  var old=S.matches.filter(function(m){return m.stage_id===S.kStage.id;});
  if(old.length){var ids=old.map(function(m){return m.id;});await sb.from("referee_matches").delete().in("match_id",ids);await sb.from("matches").delete().in("id",ids);}
  var w1=winnerOf(bCode("TK1")),w2=winnerOf(bCode("TK2")),w3=winnerOf(bCode("TK3")),w4=winnerOf(bCode("TK4"));
  var bw1=winnerOf(bCode("BK1")),bw2=winnerOf(bCode("BK2"));
  var payload=[
    {s:25,c:"TK1",r:2,h:tops.A.f,a:tops.B.s},
    {s:26,c:"TK2",r:2,h:tops.B.f,a:tops.A.s},
    {s:27,c:"TK3",r:2,h:tops.C.f,a:tops.D.s},
    {s:28,c:"TK4",r:2,h:tops.D.f,a:tops.C.s},
    {s:29,c:"BK1",r:3,h:w1,a:w2},
    {s:30,c:"BK2",r:3,h:w3,a:w4},
    {s:31,c:"CK",r:4,h:bw1,a:bw2}
  ].map(function(m){return{event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.kStage.id,round:m.r,bracket_slot:m.s,match_code:bCode(m.c),match_seq:m.s,home_team_id:m.h,away_team_id:m.a,home_score:0,away_score:0,status:"scheduled"};});
  try{var r2=await sb.from("matches").insert(payload);if(r2.error){alert("❌ "+r2.error.message+"\n\nChạy SQL:\nALTER TABLE matches DROP CONSTRAINT matches_home_away_different;\nALTER TABLE matches ADD CONSTRAINT matches_home_away_different CHECK (home_team_id IS NULL OR away_team_id IS NULL OR home_team_id <> away_team_id);");return;}toast("✅ Đã tạo 7 trận KO");}catch(e){alert("❌ "+e.message);}
}

async function syncKO(){
  if(!S.kStage||!S.eid)return;
  var tops={};
  CFG.GROUPS.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var st=standings(g.id);tops[c]={f:st[0]?st[0].id:null,s:st[1]?st[1].id:null};});
  var w1=winnerOf(bCode("TK1")),w2=winnerOf(bCode("TK2")),w3=winnerOf(bCode("TK3")),w4=winnerOf(bCode("TK4"));
  var bw1=winnerOf(bCode("BK1")),bw2=winnerOf(bCode("BK2"));
  var updates=[
    {c:"TK1",h:tops.A.f,a:tops.B.s},
    {c:"TK2",h:tops.B.f,a:tops.A.s},
    {c:"TK3",h:tops.C.f,a:tops.D.s},
    {c:"TK4",h:tops.D.f,a:tops.C.s},
    {c:"BK1",h:w1,a:w2},
    {c:"BK2",h:w3,a:w4},
    {c:"CK",h:bw1,a:bw2}
  ];
  for(var i=0;i<updates.length;i++){
    var u=updates[i],m=koBy(bCode(u.c));
    if(!m)continue;
    if(m.home_team_id!==u.h||m.away_team_id!==u.a){
      try{await sb.from("matches").update({home_team_id:u.h,away_team_id:u.a}).eq("id",m.id);m.home_team_id=u.h;m.away_team_id=u.a;}catch(e){}
    }
  }
}

/* === BATCH: điền giờ & sân mặc định cho tất cả KO chưa có === */
async function batchFillKO(){
  var km=S.matches.filter(function(m){return!m.group_id;});
  if(!km.length){toast("Chưa có trận KO");return;}
  var defaultCourt=S.courts.length?S.courts[0].id:null;
  var defaultTime="18:00";
  var count=0;
  for(var i=0;i<km.length;i++){
    var m=km[i];
    var u={};
    if(!m.scheduled_at)u.scheduled_at=isoFromTime(defaultTime);
    if(!m.court_id&&defaultCourt)u.court_id=defaultCourt;
    if(Object.keys(u).length){
      try{await sb.from("matches").update(u).eq("id",m.id);count++;}catch(e){}
    }
  }
  toast("✅ Đã điền "+count+" trận KO");
  await selE(S.eid);
}

/* === RENDER MATCH CARD === */
function renderMatchCard(m,isKO){
  var hn=tName(m.home_team_id),an=tName(m.away_team_id);
  var ph=koPlaceholder(m.match_code);
  var homeHtml=hn?'<div class="team-box team-home">'+esc(hn)+'</div>':'<div class="team-box team-tbd">'+esc(ph.h)+'</div>';
  var awayHtml=an?'<div class="team-box team-away">'+esc(an)+'</div>':'<div class="team-box team-tbd">'+esc(ph.a)+'</div>';
  var mid=m.id;
  var timeVal=timeFromISO(m.scheduled_at);
  var h=Number(m.home_score)||0,a=Number(m.away_score)||0;
  var koClass=isKO?" ko":"";
  var html='<div class="mcard'+koClass+'">';
  html+='<div class="mhead"><span class="mcode">'+esc(dCode(m.match_code))+'</span>'+statusBadge(m)+'</div>';
  html+='<div class="mvs">'+homeHtml+'<span class="vs">VS</span>'+awayHtml+'</div>';
  html+='<div class="mmeta">';
  html+='<div class="mmeta-item"><span class="lbl">⏰</span><input type="time" value="'+esc(timeVal)+'" onchange="upMatchTime(\''+mid+"',this.value)\"/></div>";
  html+='<div class="mmeta-item"><span class="lbl">🏟️</span><select onchange="upMatchCourt(\''+mid+"',this.value)\">"+courtOptsHtml(m.court_id)+"</select></div>";
  html+='<div class="mmeta-item"><span class="lbl">🏓</span><input type="number" min="0" value="'+h+'" onchange="upMatchScore(\''+mid+"','home_score',this.value)\"/><span class=\"score-sep\">-</span><input type=\"number\" min=\"0\" value=\""+a+"\" onchange=\"upMatchScore('"+mid+"','away_score',this.value)\"/></div>";
  html+='<div class="mmeta-item"><span class="lbl">👨‍⚖️</span>'+refOptsHtml(mid)+'</div>';
  html+='</div></div>';

}

/* === RENDER KO SECTION (cải tiến v15) === */
function renderKOSection(km){
  var H='';
  // Tính thống kê
  var countTime=0,countCourt=0,countRef=0;
  km.forEach(function(m){
    if(m.scheduled_at)countTime++;
    if(m.court_id)countCourt++;
    if(S.refAssign[m.id])countRef++;
  });
  H+='<div class="ko-section">';
  H+='<h4>🔥 VÒNG KNOCKOUT <span class="status-badge '+(km.length===7?"status-completed":"status-scheduled")+'">'+km.length+'/7 trận</span></h4>';
  if(km.length===0){
    H+='<div class="info">Chưa có trận KO. Hãy <b>lưu 6 trận bảng</b> để tự động tạo 7 trận KO, hoặc bấm nút dưới.</div>';
    H+='<button class="btn btn-w" onclick="createKO()">🏆 Tạo 7 trận KO ngay</button>';
    H+='</div>';
    return H;
  }
  H+='<div class="ko-stats">';
  H+='<div class="k">⏰ Giờ: <b>'+countTime+'/7</b></div>';
  H+='<div class="k">🏟️ Sân: <b>'+countCourt+'/7</b></div>';
  H+='<div class="k">👨‍⚖️ TT: <b>'+countRef+'/7</b></div>';
  H+='<button class="btn btn-w btn-s" onclick="batchFillKO()">⚡ Điền giờ & sân mặc định</button>';
  H+='</div>';
  // Tứ kết
  var tk=km.filter(function(m){return dCode(m.match_code).indexOf("TK")===0;}).sort(function(a,b){return a.match_seq-b.match_seq;});
  if(tk.length){
    H+='<div class="ko-group-title">🎯 TỨ KẾT ('+tk.length+' trận) <span style="font-weight:400;font-size:11px;color:var(--mu)">1A-2B, 1B-2A, 1C-2D, 1D-2C</span></div>';
    tk.forEach(function(m){H+=renderMatchCard(m,true);});
  }
  // Bán kết
  var bk=km.filter(function(m){return dCode(m.match_code).indexOf("BK")===0;}).sort(function(a,b){return a.match_seq-b.match_seq;});
  if(bk.length){
    H+='<div class="ko-group-title">🏅 BÁN KẾT ('+bk.length+' trận) <span style="font-weight:400;font-size:11px;color:var(--mu)">Thắng TK1-TK2, Thắng TK3-TK4</span></div>';
    bk.forEach(function(m){H+=renderMatchCard(m,true);});
  }
  // Chung kết
  var ck=km.filter(function(m){return dCode(m.match_code)==="CK";});
  if(ck.length){
    H+='<div class="ko-group-title" style="background:rgba(163,230,53,.15);color:var(--li)">🏆 CHUNG KẾT ('+ck.length+' trận)</div>';
    ck.forEach(function(m){H+=renderMatchCard(m,true);});
  }
  H+='</div>';
  return H;
}

  CFG.GROUPS.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var mb=teamsInG(g.id);mb.forEach(function(tm){var selHtml='<option value="">--</option>';CFG.GROUPS.forEach(function(cc){var gg=S.groups.find(function(x){return x.code===cc&&x.stage_id===S.gStage.id;});if(gg)selHtml+='<option value="'+gg.id+'"'+(cc===c?" selected":"")+'>'+cc+'</option>';});H+='<tr><td><b>'+c+'</b></td><td>'+esc(sn(tm.name))+'</td><td><select onchange="toGroup(\''+tm.id+"',this.value)\">"+selHtml+"</select></td></tr>";});});
  H+='</table></div>';
  CFG.GROUPS.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var mb=teamsInG(g.id);var d=draftOf(g.id);var ex=S.matches.filter(function(m){return m.group_id===g.id;});H+='<div class="gcard"><h4>Bảng '+c+' <span>'+(ex.length?"✓ "+ex.length:"—")+'</span></h4>';if(mb.length!==4){H+='<div class="alert">Cần 4 đội (hiện '+mb.length+').</div>';}else{var teamOpts=mb.map(function(t){return '<option value="'+t.id+'">'+esc(sn(t.name))+'</option>';}).join("");d.forEach(function(m,i){var ri=S.draft.indexOf(m);H+='<div class="mrow"><span class="n">'+c+(i+1)+'</span><select onchange="upDraft('+ri+",'h',this.value)\"><option value=\"\">--</option>"+teamOpts+'</select><span style="color:var(--mu);font-weight:700">vs</span><select onchange="upDraft('+ri+",'a',this.value)\"><option value=\"\">--</option>"+teamOpts+'</select><button class="btn btn-d btn-s" onclick="rmDraft('+ri+')">✕</button></div>';});H+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';if(d.length<6)H+='<button class="btn btn-l btn-s" onclick="addDraft(\''+g.id+'\')">➕ Trận</button>';H+='<button class="btn btn-b btn-s" onclick="autoRR(\''+g.id+'\')">⚡ Auto</button>';if(valDraft(g.id)==="")H+='<button class="btn btn-p btn-s" onclick="saveGroup(\''+g.id+'\')">💾 Lưu 6 trận + tạo KO</button>';H+='</div>';if(ex.length){H+='<div class="ok" style="margin-top:8px">✓ Trận đã lưu:</div>';ex.forEach(function(m){H+=renderMatchCard(m,false);});}}H+='</div>';});
  /* === KO SECTION === */
  var km=S.matches.filter(function(m){return!m.group_id;}).sort(function(a,b){return a.match_seq-b.match_seq;});
  H+=renderKOSection(km);
  return H;
}

function render(){
  if(!isAdmin())return;
  try{
    var t=S.tournament;var gm=S.matches.filter(function(m){return m.group_id;});var km=S.matches.filter(function(m){return!m.group_id;});var H="";
    H+='<div class="acc">'+accH("1","Tạo giải","s1",S.tournaments.length?"done":"empty",S.tournaments.length+" giải");H+='<div class="acc-b'+(S.acc.s1?" open":"")+'"><div class="fg"><input id="t-name" placeholder="Tên giải"/><input id="t-start" type="date"/><input id="t-end" type="date"/><button class="btn btn-p" onclick="createT()">➕ Tạo</button></div></div></div>';
    H+='<div class="acc">'+accH("2","Chọn giải","s2",t?"done":"empty",t?t.code:"—");H+='<div class="acc-b'+(S.acc.s2?" open":"")+'"><div class="fg"><select onchange="selT(this.value)">';sortedT().forEach(function(x){var s=(t&&t.id===x.id)?" selected":"";H+='<option value="'+x.id+'"'+s+'>'+esc(x.name)+'</option>';});H+='</select>';if(t)H+='<button class="btn btn-d" onclick="delT(\''+t.id+'\')">🗑 Xóa</button>';H+='</div></div></div>';
    H+='<div class="acc">'+accH("3","Nội dung","s3",S.events.length?"done":"empty",S.events.length+" ND");H+='<div class="acc-b'+(S.acc.s3?" open":"")+'"><div class="fg"><input id="e-name" placeholder="Tên nội dung"/><input id="e-limit" type="number" step="0.05" placeholder="Trình"/><select id="e-rule"><option value="max_total">Tổng &lt;=</option><option value="open">Mở</option></select><button class="btn btn-p" onclick="saveE()">➕ Tạo</button></div>';if(S.events.length){H+='<div class="tw"><table>';S.events.forEach(function(e){H+='<tr><td>'+esc(e.code)+'</td><td>'+esc(e.name)+'</td><td>'+(e.rating_limit||"-")+'</td><td><button class="btn btn-d btn-s" onclick="delE(\''+e.id+'\')">🗑</button></td></tr>';});H+='</table></div>';}H+='</div></div>';
    H+='<div class="acc">'+accH("4","VĐV","s4",S.players.length?"done":"empty",S.players.length+" VĐV");H+='<div class="acc-b'+(S.acc.s4?" open":"")+'"><div class="fg"><input id="p-name" placeholder="Họ tên"/><select id="p-gender"><option value="male">Nam</option><option value="female">Nữ</option></select><input id="p-rating" type="number" step="0.05" placeholder="Rating"/><input id="p-club" placeholder="Club"/><button class="btn btn-p" onclick="saveP()">➕ Thêm</button></div>';if(S.players.length){H+='<div class="tw"><table>';S.players.forEach(function(p){H+='<tr><td>'+esc(p.full_name)+'</td><td>'+(p.gender==="male"?"Nam":"Nữ")+'</td><td>'+(p.skill_rating||"-")+'</td><td><button class="btn btn-d btn-s" onclick="delP(\''+p.id+'\')">🗑</button></td></tr>';});H+='</table></div>';}H+='</div></div>';
    var t5st=S.teams.length>=16?"done":S.teams.length>0?"part":"empty";
    H+='<div class="acc">'+accH("5","Tạo đội","s5",t5st,S.teams.length+"/16");H+='<div class="acc-b'+(S.acc.s5?" open":"")+'">';if(S.eid){H+='<div class="fg"><select id="tp1"><option value="">-- VĐV1 --</option>';S.players.forEach(function(p){H+='<option value="'+p.id+'">'+esc(p.full_name)+' ('+(p.skill_rating||"-")+')</option>';});H+='</select><select id="tp2"><option value="">-- VĐV2 --</option>';S.players.forEach(function(p){H+='<option value="'+p.id+'">'+esc(p.full_name)+' ('+(p.skill_rating||"-")+')</option>';});H+='</select><button class="btn btn-p" onclick="saveTeam()">➕ Tạo đội</button></div>';if(S.teams.length){H+='<div class="tw"><table>';S.teams.forEach(function(tm){H+='<tr><td>'+esc(sn(tm.name))+'</td><td>'+tm.total_rating.toFixed(2)+'</td><td><button class="btn btn-d btn-s" onclick="delTeam(\''+tm.id+'\')">🗑</button></td></tr>';});H+='</table></div>';}}else H+='<div class="alert">Chọn giải + nội dung.</div>';H+='</div></div>';
    var s6st=(gm.length===24&&km.length===7)?"done":(gm.length||km.length?"part":"empty");
    H+='<div class="acc">'+accH("6","Lịch + Trọng tài","s6",s6st,gm.length+"/24 + "+km.length+"/7");H+='<div class="acc-b'+(S.acc.s6?" open":"")+'">'+renderStep6()+'</div></div>';
    H+='<div class="acc">'+accH("7","Người dùng","s7",S.users.length?"done":"empty",S.users.length+" user");H+='<div class="acc-b'+(S.acc.s7?" open":"")+'"><div class="fg"><input id="nu-email" placeholder="Email"/><input id="nu-pass" value="'+esc(CFG.PASS)+'"/><select id="nu-role"><option value="referee">referee</option><option value="organizer">organizer</option><option value="admin">admin</option></select><button class="btn btn-p" onclick="createUser()">➕ Tạo</button></div><div class="tw"><table>';S.users.forEach(function(u){H+='<tr><td>'+esc(u.username)+'</td><td>'+(u.role||"-")+'</td><td><select onchange="chRole(\''+u.user_id+"',this.value)\"><option value=\"referee\">ref</option><option value=\"organizer\">org</option><option value=\"admin\">admin</option></select></td></tr>";});H+='</table></div></div></div>';
    el("admin").innerHTML=H;
    setTimeout(function(){S.draft.forEach(function(m,i){var rows=document.querySelectorAll(".mrow");if(rows[i]){var s=rows[i].querySelectorAll("select");if(s[0])s[0].value=m.h||"";if(s[1])s[1].value=m.a||"";}});},50);
  }catch(e){console.error("render error:",e);el("admin").innerHTML='<div class="alert">❌ Lỗi render: '+esc(e.message)+'</div>';}}

(async function init(){try{var d=await sb.auth.getSession();if(d.data&&d.data.session){await loadProfile(d.data.session);applyUI();if(isAdmin())await loadAll();}else{applyUI();el("admin").innerHTML='<div class="info">Vui lòng đăng nhập.</div>';}}catch(e){el("admin").innerHTML='<div class="alert">❌ Lỗi: '+esc(e.message)+'</div>';}})();
</script>
</body>
