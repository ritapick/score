<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Quản trị - Pickleball Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit}.hidden{display:none!important}
h1,h3,h4,.logo,.stat-value{font-family:'Oswald',sans-serif;letter-spacing:.03em}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back-btn{background:rgba(148,163,184,.15);color:var(--mu);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700}
.logo{color:var(--li);font-weight:700;font-size:18px;text-transform:uppercase;font-style:italic}.logo span{color:var(--tx)}
.nav-right{display:flex;gap:6px;flex-wrap:wrap}
.user-chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:5px 10px;border-radius:999px}
.btn{border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;font-weight:800;text-transform:uppercase;transition:.15s}
.btn-primary{background:var(--li);color:#0b1220}.btn-primary:hover{background:#bef264}
.btn-blue{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-dark{background:#1e293b;color:var(--tx);border:1px solid var(--ln)}
.btn-light{background:rgba(148,163,184,.15);color:var(--mu)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}
.btn-warn{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
.btn-sm{padding:4px 9px;font-size:11px}
.hero{padding:22px;margin:12px;border-radius:16px;background:linear-gradient(120deg,#14532d,#3f6212 60%,#166534);border:1px solid rgba(163,230,53,.35);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px)}
.hero h1{margin:0 0 6px;font-size:24px;text-transform:uppercase;position:relative;z-index:1}
.hero p{margin:0;opacity:.9;position:relative;z-index:1;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:0 12px 20px}
.card{background:transparent;padding:8px 2px;margin-bottom:14px;position:relative}
.card h3{margin:0 0 12px;display:flex;gap:8px;text-transform:uppercase;font-size:15px;flex-wrap:wrap;color:var(--li);align-items:center}
.card.disabled{opacity:.45;pointer-events:none}
.step-num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:8px;background:var(--li);color:#0b1220;font-size:14px;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;color:var(--tx);width:100%}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.b-green{background:rgba(163,230,53,.15);color:var(--li)}.b-blue{background:rgba(34,211,238,.15);color:var(--cy)}.b-red{background:rgba(248,113,113,.15);color:var(--rd)}.b-gray{background:rgba(148,163,184,.15);color:var(--mu)}.b-warn{background:rgba(251,146,60,.15);color:var(--or)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:400px}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--mu);font-size:10px;text-transform:uppercase;position:sticky;top:0;background:var(--bg)}
.edit-row{background:rgba(251,146,60,.12)!important}.new-row{background:rgba(163,230,53,.12)!important}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.group-card{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px}
.group-card h4{margin:0 0 8px;color:var(--li);text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between}
.group-team{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);font-size:13px}
.group-team:last-child{border-bottom:none}
.group-team select{min-width:100px}
.muted{color:var(--mu);font-size:13px}
.preview{margin:6px 0 10px;font-size:13px;color:var(--mu)}.preview b{color:var(--li)}
.alert-box{padding:12px;border-radius:12px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.35);color:var(--or);font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 18px;border-radius:999px;font-weight:800;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;text-transform:uppercase}
.toast.show{opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,8,16,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-backdrop.show{display:flex}
.modal{width:min(460px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px}
.modal h3{margin:0 0 4px;text-transform:uppercase;color:var(--li)}
.modal .sub{color:var(--mu);font-size:13px;margin-bottom:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--mu);text-transform:uppercase}
.field input{width:100%;background:#0d1626;border:1px solid var(--ln);border-radius:10px;padding:11px;color:var(--tx)}
.msg{padding:10px;border-radius:10px;font-size:13px;margin-top:12px;display:none;white-space:pre-wrap}
.msg.show{display:block}.msg-error{background:rgba(248,113,113,.15);color:var(--rd)}.msg-info{background:rgba(34,211,238,.15);color:var(--cy)}
@media(max-width:760px){main{padding:0 8px 20px}.sel-row{grid-template-columns:1fr}.hero h1{font-size:20px}table{min-width:320px}th,td{padding:8px 6px;font-size:12px}}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row"><button class="back-btn" onclick="goHome()">← Trang chủ</button><span class="logo">⚙ Quản <span>trị</span></span></div>
<div class="nav-right">
<span id="user-chip" class="user-chip hidden"></span>
<button id="login-btn" class="btn btn-primary" onclick="openLogin()">Đăng nhập</button>
<button id="logout-btn" class="btn btn-light hidden" onclick="logout()">Đăng xuất</button>
</div></nav>
<div class="hero"><h1>⚙ Bảng điều khiển quản trị</h1><p>Thiết lập giải đấu, nội dung, VĐV, đội, lịch thi đấu & trọng tài</p></div>
<main><div id="admin-content"></div></main>
<div id="toast" class="toast"></div>
<div id="login-modal" class="modal-backdrop"><div class="modal">
<h3>🔐 Đăng nhập</h3><div class="sub">Mặc định 123@321 (có thể nhập <b>admin</b> hoặc email)</div>
<div class="field"><label>Email</label><input id="login-username" placeholder="admin@gmail.com"/></div>
<div class="field"><label>Mật khẩu</label><input id="login-password" type="password"/></div>
<div class="actions" style="justify-content:flex-end"><button class="btn btn-light" onclick="closeLogin()">Đóng</button><button class="btn btn-primary" onclick="doLogin()">Đăng nhập</button></div>
<div id="login-message" class="msg"></div>
</div></div>
<script>
const SUPABASE_URL="https://mvefkcaqvjflrgmaybev.supabase.co",SUPABASE_ANON_KEY="sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc",DEFAULT_PASS="123@321",EMAIL_DOMAIN="@pb-local.app",GROUP_CODES=["A","B","C","D"],TEAM_SELECT="id,name,seed,status,event_id,team_members(player_id,position,players(id,full_name,skill_rating))";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const state={session:null,user:null,role:null,username:null,tournaments:[],tournament:null,events:[],currentEventId:null,courts:[],players:[],teams:[],stages:[],groups:[],groupTeams:[],matches:[],groupStage:null,knockoutStage:null,users:[],refAssign:{},openTournaments:[],editingEventId:null,editingPlayerId:null,editingTeamId:null,editingTeamOriginal:null,lastCreatedEventId:null,t5:{tid:null,eid:null,events:[],teams:[]},t6:{tid:null,eid:null,events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null}};
function el(i){return document.getElementById(i);}
function isLocked(){return state.tournament?.status==="completed";}
function isAdmin(){return state.role==="admin"||state.role==="organizer";}
function shortName(n){return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim();}
function findTeam(id){var i;for(i=0;i<state.teams.length;i++)if(state.teams[i].id===id)return state.teams[i];for(i=0;i<state.t6.teams.length;i++)if(state.t6.teams[i].id===id)return state.t6.teams[i];for(i=0;i<state.t5.teams.length;i++)if(state.t5.teams[i].id===id)return state.t5.teams[i];return null;}
function teamName(id){if(!id)return '<span class="muted">TBD</span>';var t=findTeam(id);return t?shortName(t.name):"TBD";}
function mapTeams(a){var o=[],i,k;a=a||[];for(i=0;i<a.length;i++){var t=a[i],m=t.team_members||[],tot=0;for(k=0;k<m.length;k++)tot+=(m[k].players&&m[k].players.skill_rating)||0;o.push(Object.assign({},t,{members:m,total_rating:Number(tot.toFixed(2))}));}return o;}
function ratingCheck(t,ev){if(!ev||ev.rating_limit==null)return{ok:true,msg:""};var r=ev.rating_rule||"max_total";if(r==="open")return{ok:true,msg:""};if(r==="exact_total"){var ok=Math.abs(t-ev.rating_limit)<=0.005;return{ok:ok,msg:ok?"✅ Đúng "+ev.rating_limit:"❌ Phải đúng "+ev.rating_limit+" (hiện "+t.toFixed(2)+")"};}var ok2=t<=ev.rating_limit;return{ok:ok2,msg:ok2?"✅ Hợp lệ (≤ "+ev.rating_limit+")":"❌ Vượt "+ev.rating_limit+" (hiện "+t.toFixed(2)+")"};}
function autoTeamName(a,b){return a&&b?a.full_name+" – "+b.full_name:"";}
function playerLabel(p){return p.full_name+" ("+(p.skill_rating!=null?Number(p.skill_rating).toFixed(2):"")+")";}
function pad(n,l){return String(n).padStart(l,"0");}
function roundRobinPairs(){return[{round:1,slot:1,a:0,b:3},{round:1,slot:2,a:1,b:2},{round:2,slot:1,a:0,b:2},{round:2,slot:2,a:3,b:1},{round:3,slot:1,a:0,b:1},{round:3,slot:2,a:2,b:3}];}
function sortedTournaments(){return state.tournaments.slice().sort(function(a,b){var ao=a.status==="completed"?1:0,bo=b.status==="completed"?1:0;if(ao!==bo)return ao-bo;return String(a.created_at||"").localeCompare(String(b.created_at||""));});}
function tournamentSeq(){var s=sortedTournaments(),i;for(i=0;i<s.length;i++)if(s[i].id===state.tournament?.id)return i+1;return 1;}
function eventSeq(){var s=state.events.slice().sort(function(a,b){return String(a.created_at||"").localeCompare(String(b.created_at||""));}),i;for(i=0;i<s.length;i++)if(s[i].id===state.currentEventId)return i+1;return 1;}
function nextTournamentCode(){var used={},i;for(i=0;i<state.tournaments.length;i++)used[state.tournaments[i].code]=1;var n=1;while(used[pad(n,3)])n++;return pad(n,3);}
function nextEventCode(){var used={},i;for(i=0;i<state.events.length;i++)used[state.events[i].code]=1;var n=1;while(used[pad(n,2)])n++;return pad(n,2);}
function buildMatchCode(cc){return pad(tournamentSeq(),3)+pad(eventSeq(),1)+pad(cc,2);}
function goHome(){location.href='index.html';}
function showToast(msg,type){var t=el("toast");t.textContent=msg;t.className="toast show";t.style.background=type==="err"?"var(--rd)":"var(--li)";t.style.color=type==="err"?"#fff":"#0b1220";clearTimeout(window._tTO);window._tTO=setTimeout(()=>t.classList.remove("show"),type==="err"?5000:2000);}

/* ===== AUTH ===== */
function openLogin(){el("login-modal").classList.add("show");el("login-message").className="msg";el("login-username").value="";el("login-password").value="";setTimeout(()=>el("login-username").focus(),100);}
function closeLogin(){el("login-modal").classList.remove("show");}
function loginMsg(t,m){var b=el("login-message");b.className="msg show msg-"+t;b.textContent=m;}
async function doLogin(){
  const raw=el("login-username").value.trim(),p=el("login-password").value;
  if(!raw||!p){loginMsg("error","Nhập đủ email và mật khẩu.");return;}
  loginMsg("info","Đang đăng nhập...");
  const cands=raw.includes("@")?[raw]:[raw,raw+EMAIL_DOMAIN];
  let last=null;
  for(const em of cands){
    const {data,error}=await sb.auth.signInWithPassword({email:em,password:p});
    if(!error&&data.session){closeLogin();await loadMyProfile(data.session);applyAuthUI();await loadUsers();renderAdmin();showToast("✅ Xin chào "+state.username);return;}
    if(error)last=error;
  }
  let msg="❌ "+(last?.message||"Lỗi");
  if(last&&/confirmed/i.test(last.message))msg+="\n⚠️ Chưa xác thực email.";
  else if(last&&/invalid login/i.test(last.message))msg+="\nKiểm tra email & mật khẩu (123@321).";
  loginMsg("error",msg);
}
async function logout(){await sb.auth.signOut();state.session=null;state.user=null;state.role=null;applyAuthUI();renderAdmin();}
async function loadMyProfile(s){
  state.session=s;state.user=s.user;
  const {data:r}=await sb.from("user_roles").select("role").eq("user_id",s.user.id);
  const roles=(r||[]).map(x=>x.role);
  state.role=roles.includes("admin")?"admin":roles.includes("organizer")?"organizer":roles.includes("referee")?"referee":null;
  if(state.role==="admin"||state.role==="organizer")await sb.from("app_users").upsert({user_id:s.user.id,username:s.user.email,display_name:s.user.email});
  const {data:au}=await sb.from("app_users").select("username").eq("user_id",s.user.id).maybeSingle();
  state.username=au?.username||s.user.email;
}
function applyAuthUI(){
  const logged=!!state.user;
  el("login-btn").classList.toggle("hidden",logged);
  el("logout-btn").classList.toggle("hidden",!logged);
  el("user-chip").classList.toggle("hidden",!logged);
  if(logged)el("user-chip").textContent=(state.username||"")+(state.role?" • "+state.role:"");
  if(!isAdmin()&&logged){document.querySelector("main").innerHTML='<div style="padding:40px;text-align:center"><h2 style="color:var(--rd)">⚠ Không có quyền quản trị</h2><p>Chỉ admin/organizer mới có thể truy cập trang này.</p><a href="index.html">← Về trang chủ</a></div>';}
}

/* ===== LOAD DATA ===== */
async function loadTournaments(){
  const {data}=await sb.from("tournaments").select("*").order("status",{ascending:true}).order("start_date",{ascending:false});
  state.tournaments=data||[];
}
async function selectTournament(id){
  state.tournament=null;
  for(var i=0;i<state.tournaments.length;i++)if(state.tournaments[i].id===id)state.tournament=state.tournaments[i];
  state.editingEventId=null;state.editingPlayerId=null;state.editingTeamId=null;
  if(!state.tournament){renderAdmin();return;}
  const {data:e}=await sb.from("events").select("*").eq("tournament_id",id);state.events=e||[];
  const {data:c}=await sb.from("courts").select("*").eq("tournament_id",id).order("display_order");state.courts=c||[];
  const {data:p}=await sb.from("players").select("*").order("full_name");state.players=p||[];
  if(state.events.length)await selectEvent(state.events[0].id);
  else{state.currentEventId=null;state.teams=[];state.matches=[];renderAdmin();}
}
async function selectEvent(id){
  state.currentEventId=id||null;state.editingTeamId=null;
  if(!state.currentEventId){renderAdmin();return;}
  const {data:t}=await sb.from("teams").select(TEAM_SELECT).eq("event_id",id);state.teams=mapTeams(t);
  const {data:st}=await sb.from("stages").select("*").eq("event_id",id).order("stage_order");state.stages=st||[];
  state.groupStage=state.stages.find(s=>s.stage_type==="group_stage")||null;
  state.knockoutStage=state.stages.find(s=>s.stage_type==="knockout")||null;
  const sids=state.stages.map(s=>s.id);
  if(sids.length){
    const {data:g}=await sb.from("groups").select("*").in("stage_id",sids).order("code");state.groups=g||[];
    const {data:gt}=await sb.from("group_teams").select("*").in("stage_id",sids);state.groupTeams=gt||[];
  }else{state.groups=[];state.groupTeams=[];}
  const {data:m}=await sb.from("matches").select("*").eq("event_id",id).order("match_seq");state.matches=m||[];
  renderAdmin();
}
async function loadScope(tId,eId,wg){
  var out={events:[],teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null};
  if(!tId)return out;
  var e=await sb.from("events").select("*").eq("tournament_id",tId);out.events=e.data||[];
  if(eId){
    var tm=await sb.from("teams").select(TEAM_SELECT).eq("event_id",eId);out.teams=mapTeams(tm.data);
    if(wg){
      var st=await sb.from("stages").select("*").eq("event_id",eId).order("stage_order");
      var ss=st.data||[],i;
      for(i=0;i<ss.length;i++){if(ss[i].stage_type==="group_stage")out.groupStage=ss[i];if(ss[i].stage_type==="knockout")out.knockoutStage=ss[i];}
      var ids=ss.map(s=>s.id);
      if(ids.length){
        var g=await sb.from("groups").select("*").in("stage_id",ids).order("code");out.groups=g.data||[];
        var gt=await sb.from("group_teams").select("*").in("stage_id",ids);out.groupTeams=gt.data||[];
      }
    }
  }
  return out;
}
async function setT5Tournament(id){state.t5.tid=id||null;state.t5.eid=null;state.t5.teams=[];var s=await loadScope(id,null,false);state.t5.events=s.events;if(s.events.length){state.t5.eid=s.events[0].id;var s2=await loadScope(id,state.t5.eid,false);state.t5.teams=s2.teams;}renderAdmin();}
async function setT5Event(id){state.t5.eid=id||null;var s=await loadScope(state.t5.tid,id,false);state.t5.teams=s.teams;renderAdmin();}
async function setT6Tournament(id){state.t6.tid=id||null;state.t6.eid=null;var s=await loadScope(id,null,true);state.t6.events=s.events;if(s.events.length){state.t6.eid=s.events[0].id;var s2=await loadScope(id,state.t6.eid,true);Object.assign(state.t6,s2);}else Object.assign(state.t6,{teams:[],groups:[],groupTeams:[],groupStage:null,knockoutStage:null});renderAdmin();}
async function setT6Event(id){state.t6.eid=id||null;var s=await loadScope(state.t6.tid,id,true);Object.assign(state.t6,s);renderAdmin();}
async function refreshOpenTournaments(){var d=await sb.from("tournaments").select("*").neq("status","completed").order("start_date",{ascending:false});state.openTournaments=d.data||[];}
async function loadUsers(){
  var au=await sb.from("app_users").select("*"),ur=await sb.from("user_roles").select("*"),map={},i;
  for(i=0;i<(au.data||[]).length;i++){var u=au.data[i];map[u.user_id]=Object.assign({},u,{role:null});}
  for(i=0;i<(ur.data||[]).length;i++){var r=ur.data[i];if(!map[r.user_id])map[r.user_id]={user_id:r.user_id,username:"(chưa có)"};map[r.user_id].role=r.role;}
  var arr=[];for(var k in map)arr.push(map[k]);state.users=arr;
}
async function loadRefAssign(){state.refAssign={};if(!state.matches.length)return;var ids=state.matches.map(m=>m.id);var d=await sb.from("referee_matches").select("*").in("match_id",ids);(d.data||[]).forEach(r=>{state.refAssign[r.match_id]=r.user_id;});}

/* ===== BƯỚC 1: TẠO GIẢI ===== */
async function createTournament(){
  var name=el("t-name").value.trim(),startDate=el("t-start").value;
  if(!name){alert("Nhập tên giải");return;}
  if(!startDate){alert("Chọn ngày bắt đầu");return;}
  var code=nextTournamentCode();
  var base=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  var endDate=el("t-end").value||startDate;

/* ===== BƯỚC 6: THIẾT LẬP 31 TRẬN ===== */
async function ensureEventMatches(){
  if(!state.t6.eid||!state.t6.tid)return false;
  var tId=state.t6.tid,eId=state.t6.eid;
  var st=await sb.from("stages").select("*").eq("event_id",eId).order("stage_order");
  var groupStage=(st.data||[]).find(s=>s.stage_type==="group_stage");
  var knockoutStage=(st.data||[]).find(s=>s.stage_type==="knockout");
  if(!groupStage){try{var r1=await sb.from("stages").insert({event_id:eId,code:"GRP",name:"Vòng bảng",stage_type:"group_stage",stage_order:1}).select().single();if(r1.data)groupStage=r1.data;}catch(e){}}
  if(!knockoutStage){try{var r2=await sb.from("stages").insert({event_id:eId,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2}).select().single();if(r2.data)knockoutStage=r2.data;}catch(e){}}
  if(!groupStage||!knockoutStage)return false;
  var gi,i;
  for(gi=0;gi<4;gi++){var code=GROUP_CODES[gi],found=false;
    var g=await sb.from("groups").select("*").eq("stage_id",groupStage.id).eq("code",code);
    if(g.data&&g.data.length>0)found=true;
    if(!found){try{await sb.from("groups").insert({stage_id:groupStage.id,code:code,name:"Bảng "+code,max_teams:4});}catch(e){}}}
  var existing=await sb.from("matches").select("match_code").eq("event_id",eId);
  var existingCodes={};(existing.data||[]).forEach(m=>existingCodes[m.match_code]=1);
  var ins=[];
  var tournamentSeq2=sortedTournaments().findIndex(t=>t.id===tId)+1||1;
  var eventsForT=state.tournaments.find(t=>t.id===tId)?state.events:[];
  var eventSeq2=eventsForT.findIndex(e=>e.id===eId)+1||1;
  function bc(cc){return pad(tournamentSeq2,3)+pad(eventSeq2,1)+pad(cc,2);}
  for(gi=0;gi<4;gi++){
    var g2=await sb.from("groups").select("*").eq("stage_id",groupStage.id).eq("code",GROUP_CODES[gi]);
    if(!g2.data||!g2.data.length)continue;var gId=g2.data[0].id;
    roundRobinPairs().forEach((pr,mi)=>{
      var cc=gi*6+mi+1;
      if(!existingCodes[bc(cc)])ins.push({event_id:eId,tournament_id:tId,stage_id:groupStage.id,group_id:gId,round:pr.round,bracket_slot:pr.slot,match_code:bc(cc),match_seq:cc,status:"scheduled"});
    });
  }
  for(var s=1;s<=4;s++){var c1=24+s;if(!existingCodes[bc(c1)])ins.push({event_id:eId,tournament_id:tId,stage_id:knockoutStage.id,round:1,bracket_slot:s,match_code:bc(c1),match_seq:c1,status:"scheduled"});}
  for(s=1;s<=2;s++){var c2=28+s;if(!existingCodes[bc(c2)])ins.push({event_id:eId,tournament_id:tId,stage_id:knockoutStage.id,round:2,bracket_slot:s,match_code:bc(c2),match_seq:c2,status:"scheduled"});}
  var c3=31;if(!existingCodes[bc(c3)])ins.push({event_id:eId,tournament_id:tId,stage_id:knockoutStage.id,round:3,bracket_slot:1,match_code:bc(c3),match_seq:c3,status:"scheduled"});
  if(ins.length){try{await sb.from("matches").insert(ins);}catch(e){}}
  return ins.length>0;
}

  var added=await ensureEventMatches();

  H+='<div class="card '+(noT?"disabled":"")+'"><h3><span class="step-num">3</span> Nội dung</h3>'+(noT?'<div class="alert-box">Chọn giải ở Bước 2.</div>':'<div class="form-grid"><input id="e-name" placeholder="Tên nội dung" value="'+(editingE?editingE.name:"")+'"/><input id="e-limit" type="number" step="0.05" placeholder="Trình" value="'+(editingE?.rating_limit??'')+'"/><select id="e-rule"><option value="max_total"'+(editingE?.rating_rule==="max_total"?" selected":"")+">Tổng &lt;=</option><option value='exact_total'"+(editingE?.rating_rule==="exact_total"?" selected":"")+">Tổng =</option><option value='open'"+(editingE?.rating_rule==="open"?" selected":"")+">Mở</option></select><button class='btn btn-primary' onclick='saveEvent()'>"+(editingE?"💾 Lưu":"➕ Tạo")+"</button>"+(editingE?'<button class="btn btn-light" onclick="cancelEditEvent()">✕</button>':"")+'</div><div class="muted">Mã nội dung tự sinh (01, 02...)</div><div class="table-wrap"><table><thead><tr><th>Tên</th><th>Trình</th><th>Luật</th><th></th></tr></thead><tbody>'+(eventsSorted.map(e=>'<tr class="'+(state.editingEventId===e.id?"edit-row":(state.lastCreatedEventId===e.id?"new-row":""))+'"><td>'+e.name+"</td><td>"+(e.rating_limit!=null?e.rating_limit:"-")+"</td><td>"+e.rating_rule+'</td><td><button class="btn btn-sm btn-warn" onclick="editEvent(\''+e.id+'\')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteEvent(\''+e.id+'\')">🗑</button></td></tr>').join("")||'<tr><td colspan="4" class="muted">Chưa có</td></tr>')+"</tbody></table></div>")+"</div>";
  H+='<div class="card '+(noT?"disabled":"")+'"><h3><span class="step-num">4</span> VĐV</h3>'+(noT?'<div class="alert-box">Chọn giải ở Bước 2.</div>':'<div class="form-grid"><input id="p-name" placeholder="Họ tên" value="'+(editingP?editingP.full_name:"")+'"/><select id="p-gender"><option value="male"'+(editingP?.gender==="male"?" selected":"")+">Nam</option><option value='female'"+(editingP?.gender==="female"?" selected":"")+">Nữ</option></select><input id='p-rating' type='number' step='0.05' placeholder='Rating' value='"+(editingP?.skill_rating??'')+"'/><input id='p-club' placeholder='Club' value='"+(editingP?.club_name||'')+"'/><button class='btn btn-primary' onclick='savePlayer()'>"+(editingP?"💾 Lưu":"➕ Thêm")+"</button>"+(editingP?'<button class="btn btn-light" onclick="cancelEditPlayer()">✕</button>':"")+'</div><div class="table-wrap"><table><thead><tr><th>Họ tên</th><th>GT</th><th>Rating</th><th>Club</th><th></th></tr></thead><tbody>'+(state.players.map(p=>'<tr class="'+(state.editingPlayerId===p.id?"edit-row":"")+'"><td>'+p.full_name+"</td><td>"+(p.gender==="male"?"Nam":"Nữ")+"</td><td>"+(p.skill_rating!=null?p.skill_rating:"")+"</td><td>"+(p.club_name||'')+'</td><td><button class="btn btn-sm btn-warn" onclick="editPlayer(\''+p.id+'\')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deletePlayer(\''+p.id+'\')">🗑</button></td></tr>').join("")||'<tr><td colspan="5" class="muted">Chưa có</td></tr>')+"</tbody></table></div>")+"</div>";
  H+='<div class="card"><h3><span class="step-num">5</span> Đội</h3><div class="sel-row"><select onchange="setT5Tournament(this.value)">'+openTournamentOptions(state.t5.tid)+'</select><select onchange="setT5Event(this.value)" '+(state.t5.tid?"":"disabled")+"><option value=''>— Nội dung —</option>"+state.t5.events.map(e=>'<option value="'+e.id+'"'+(state.t5.eid===e.id?" selected":"")+">"+e.name+" ("+(e.rating_limit!=null?e.rating_limit:"mở")+")</option>").join("")+"</select></div>"+(state.t5.eid&&ev5?'<div class="form-grid"><select id="team-p1" onchange="onTeamP1Change()"><option value="">-- VĐV 1 --</option></select><select id="team-p2" onchange="onTeamP2Change()"><option value="">-- VĐV 2 --</option></select><button id="team-create-btn" class="btn btn-primary '+(editingT?"hidden":"")+'" onclick="saveTeam()">➕ Tạo đội</button><div id="team-edit-actions" class="hidden" style="display:flex;gap:8px"><button class="btn btn-primary" onclick="saveTeam()">💾</button><button class="btn btn-light" onclick="cancelEditTeam()">✕</button></div></div><div id="team-preview" class="preview"></div><div class="table-wrap"><table><thead><tr><th>Đội</th><th>Tổng</th><th></th></tr></thead><tbody>'+(state.t5.teams.map(x=>'<tr class="'+(state.editingTeamId===x.id?"edit-row":"")+'"><td>'+shortName(x.name)+"</td><td>"+x.total_rating.toFixed(2)+'</td><td><button class="btn btn-sm btn-warn" onclick="editTeam(\''+x.id+'\')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteTeam(\''+x.id+'\')">🗑</button></td></tr>').join("")||'<tr><td colspan="3" class="muted">Chưa có</td></tr>')+"</tbody></table></div>":'<div class="alert-box">Chọn giải + nội dung.</div>')+"</div>";
  H+='<div class="card"><h3><span class="step-num">6</span> Thiết lập lịch thi đấu (31 trận)</h3><div class="sel-row"><select onchange="setT6Tournament(this.value)">'+openTournamentOptions(state.t6.tid)+'</select><select onchange="setT6Event(this.value)" '+(state.t6.tid?"":"disabled")+"><option value=''>— Nội dung —</option>"+state.t6.events.map(e=>'<option value="'+e.id+'"'+(state.t6.eid===e.id?" selected":"")+">"+e.name+" ("+(e.rating_limit!=null?e.rating_limit:"mở")+")</option>").join("")+"</select></div>"+(state.t6.eid&&ev6?'<div class="actions"><button class="btn btn-dark" onclick="setupGroupStage6()">🏆 Thiết lập 4 bảng + 31 trận</button></div>'+(state.t6.groupStage?"<div class='group-grid'>"+groupCards6+"</div>":'<div class="alert-box">Bấm "Thiết lập 4 bảng" để tạo sẵn 24 trận vòng bảng + 7 trận KO. Sau đó qua <a href="tournament.html?id='+state.t6.tid+'" style="color:var(--cy)">trang giải đấu</a> để đặt giờ/sân/trọng tài.</div>'):'<div class="alert-box">Chọn giải + nội dung để xếp bảng.</div>')+"</div>";
  H+='<div class="card"><h3><span class="step-num">7</span> Người dùng '+((state.role==="admin")?'<span class="badge b-blue">admin</span>':"")+"</h3><div class='form-grid'><input id='nu-email' placeholder='Email'/><input id='nu-pass' type='text' value='"+DEFAULT_PASS+"'/><select id='nu-role'><option value='referee'>referee</option><option value='organizer'>organizer</option><option value='admin'>admin</option></select><button class='btn btn-primary' onclick='adminCreateUser()'>➕ Tạo user</button></div><div class='table-wrap'><table><thead><tr><th>Email</th><th>Quyền</th><th>Đổi quyền</th>"+(state.role==="admin"?"<th>Reset</th>":"")+"</tr></thead><tbody>"+(state.users.map(u=>"<tr><td>"+u.username+"</td><td><span class='badge b-blue'>"+(u.role||"-")+"</span></td><td><select onchange='changeRole(\""+u.user_id+'",this.value)\'><option value="referee"'+(u.role==="referee"?" selected":"")+">referee</option><option value='organizer'"+(u.role==="organizer"?" selected":"")+">organizer</option><option value='admin'"+(u.role==="admin"?" selected":"")+">admin</option></select></td>"+(state.role==="admin"?'<td><button class="btn btn-sm btn-light" onclick="resetUserPassDefault(\''+u.user_id+'\',\''+u.username+'\')">↺ '+DEFAULT_PASS+"</button></td>":"")+"</tr>").join("")||'<tr><td colspan="4" class="muted">Chưa có</td></tr>')+"</tbody></table></div></div>";
  el("admin-content").innerHTML=H;
  if(editingT&&editingT.members){
    var p1=editingT.members.find(m=>m.position===1),p2=editingT.members.find(m=>m.position===2);
    if(p1)el("team-p1").value=p1.player_id;
    if(p2)el("team-p2").value=p2.player_id;
  }
  refreshTeamPlayerSelects();updateTeamEditButtons();
}

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session)await loadMyProfile(data.session);
  applyAuthUI();
  if(!isAdmin()&&state.user)return;
  await refreshOpenTournaments();
  await loadTournaments();
  await loadUsers();
  if(state.tournaments.length)await selectTournament(sortedTournaments()[0].id);
  else renderAdmin();
})();
</script>
</body>
</html>
