<!DOCTYPE html>

<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
button,input,select{font:inherit}.hidden{display:none!important}

.btn{border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:700}
.btn-p{background:var(--li);color:#0b1220}.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}

main{max-width:900px;margin:0 auto;padding:10px}
.acc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}

.acc-h .st{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:800}
.st-done{background:rgba(163,230,53,.2);color:var(--li)}.st-part{background:rgba(251,146,60,.2);color:var(--or)}.st-empty{background:rgba(148,163,184,.2);color:var(--mu)}
.acc-b{display:none;padding:12px}.acc-b.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:8px;padding:8px;color:var(--tx);width:100%;font-size:13px}
.tw{overflow-x:auto;margin:8px 0}table{width:100%;border-collapse:collapse;min-width:380px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:12px}
th{color:var(--mu);font-size:10px;text-transform:uppercase}
.gcard{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px}
.gcard h4{margin:0 0 8px;color:var(--li);font-size:13px;display:flex;justify-content:space-between}
.mrow{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:5px;align-items:center;padding:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:5px;font-size:12px}
.mrow .n{background:var(--li);color:#0b1220;padding:2px 7px;border-radius:4px;font-weight:800;font-size:11px}
.krow{display:grid;grid-template-columns:60px 1fr 1fr auto;gap:5px;align-items:center;padding:8px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:6px;font-size:12px}
.alert{padding:8px;border-radius:8px;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);color:var(--or);font-size:12px;margin-bottom:8px}
.info{padding:8px;border-radius:8px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cy);font-size:12px;margin-bottom:8px}
.ok{padding:8px;border-radius:8px;background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.3);color:var(--li);font-size:12px;margin-bottom:8px}
.sel{background:#0d1626;border:1px solid var(--ln);border-radius:6px;padding:4px;color:var(--tx);font-size:11px}
.cd{color:var(--cy);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}.modal-bg.show{display:flex}
.modal{width:min(400px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
@media(max-width:640px){.mrow{grid-template-columns:1fr;gap:4px}.krow{grid-template-columns:1fr}}
</style>
</head>

<script>
var SB_URL="https://mvefkcaqvjflrgmaybev.supabase.co",SB_KEY="sb_publishable_NDuJHKrY80lbh1fjHEezVw_H3s4t3Pc",DP="123@321",ED="@pb-local.app",GC=["A","B","C","D"];
var sb=window.supabase.createClient(SB_URL,SB_KEY);

/* AUTH */

var c=u.indexOf("@")>=0?[u]:[u,u+ED];for(var i=0;i<c.length;i++){var r=await sb.auth.signInWithPassword({email:c[i],password:p});if(!r.error){closeLogin();await prof(r.data.session);applyUI();await loadAll();toast("✅ "+S.username);return;}}
el("lmsg").textContent="❌ Sai email hoặc mật khẩu";}
async function logout(){await sb.auth.signOut();S.user=null;S.role=null;applyUI();render();}
async function prof(s){S.user=s.user;var r=await sb.from("user_roles").select("role").eq("user_id",s.user.id);var rs=(r.data||[]).map(function(x){return x.role;});S.role=rs.includes("admin")?"admin":rs.includes("organizer")?"organizer":rs.includes("referee")?"referee":null;S.username=s.user.email;}
function applyUI(){var l=!!S.user;el("login-btn").classList.toggle("hidden",l);el("logout-btn").classList.toggle("hidden",!l);el("user-chip").classList.toggle("hidden",!l);if(l)el("user-chip").textContent=S.username+(S.role?" • "+S.role:"");if(!isAdmin()&&l)el("admin").innerHTML='<div class="alert">⚠ Chỉ admin/organizer mới truy cập.</div>';}
/* LOAD */
async function loadAll(){var o=await sb.from("tournaments").select("*").neq("status","completed");S.openT=o.data||[];var a=await sb.from("tournaments").select("*");S.tournaments=a.data||[];await loadUsers();await loadRefs();if(S.tournaments.length)await selT(sT()[0].id);else render();}
async function selT(id){S.tournament=S.tournaments.find(function(x){return x.id===id;})||null;if(!S.tournament){render();return;}
var e=await sb.from("events").select("*").eq("tournament_id",id);S.events=e.data||[];
var c=await sb.from("courts").select("*").eq("tournament_id",id);S.courts=c.data||[];
var p=await sb.from("players").select("*");S.players=p.data||[];
if(S.events.length)await selE(S.events[0].id);else{S.eid=null;S.teams=[];S.matches=[];render();}}
async function selE(id){S.eid=id||null;S.draft=[];if(!S.eid){render();return;}
var t=await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name,skill_rating))").eq("event_id",id);
S.teams=(t.data||[]).map(function(x){var m=x.team_members||[],tot=0;m.forEach(function(k){tot+=(k.players&&k.players.skill_rating)||0;});return Object.assign({},x,{members:m,total_rating:Number(tot.toFixed(2))});});
var st=await sb.from("stages").select("*").eq("event_id",id);S.stages=st.data||[];
S.gStage=null;S.kStage=null;S.stages.forEach(function(s){if(s.stage_type==="group_stage")S.gStage=s;if(s.stage_type==="knockout")S.kStage=s;});
var ids=S.stages.map(function(s){return s.id;});
if(ids.length){var g=await sb.from("groups").select("*").in("stage_id",ids);S.groups=g.data||[];var gt=await sb.from("group_teams").select("*").in("stage_id",ids);S.groupTeams=gt.data||[];}else{S.groups=[];S.groupTeams=[];}
var m=await sb.from("matches").select("*").eq("event_id",id).order("match_seq");S.matches=m.data||[];
await syncKO();
await loadRefAssign();render();}
async function loadUsers(){var a=await sb.from("app_users").select("*");var u=await sb.from("user_roles").select("*");var mp={};(a.data||[]).forEach(function(x){mp[x.user_id]=Object.assign({},x,{role:null});});(u.data||[]).forEach(function(r){if(mp[r.user_id])mp[r.user_id].role=r.role;});var arr=[];for(var k in mp)arr.push(mp[k]);S.users=arr;}
async function loadRefs(){var u=await sb.from("user_roles").select("user_id").eq("role","referee");var ids=(u.data||[]).map(function(x){return x.user_id;});if(ids.length){var a=await sb.from("app_users").select("user_id,username").in("user_id",ids);S.refs=a.data||[];}else S.refs=[];}
async function loadRefAssign(){S.refAssign={};if(!S.matches.length)return;var ids=S.matches.map(function(m){return m.id;});var r=await sb.from("referee_matches").select("*").in("match_id",ids);(r.data||[]).forEach(function(x){S.refAssign[x.match_id]=x.user_id;});}
/* CRUD */
async function createT(){var n=el("t-name").value.trim(),d=el("t-start").value;if(!n||!d){alert("Nhập tên + ngày");return;}
var used={},i;for(i=0;i<S.tournaments.length;i++)used[S.tournaments[i].code]=1;var nn=1;while(used[pad(nn,3)])nn++;var code=pad(nn,3);
var r=await sb.from("tournaments").insert({code:code,name:n,start_date:d,end_date:el("t-end").value||d,status:"in_progress"}).select().single();
if(r.error){alert(r.error.message);return;}toast("✅ Tạo giải "+code);await loadAll();}
async function delT(id){if(!confirm("Xóa giải + toàn bộ dữ liệu?"))return;var ev=await sb.from("events").select("id").eq("tournament_id",id);var eids=(ev.data||[]).map(function(e){return e.id;});
if(eids.length){var mr=await sb.from("matches").select("id").in("event_id",eids);var mids=(mr.data||[]).map(function(m){return m.id;});if(mids.length)await sb.from("referee_matches").delete().in("match_id",mids);await sb.from("matches").delete().in("event_id",eids);var st=await sb.from("stages").select("id").in("event_id",eids);var sids=(st.data||[]).map(function(s){return s.id;});if(sids.length){await sb.from("group_teams").delete().in("stage_id",sids);await sb.from("groups").delete().in("stage_id",sids);await sb.from("stages").delete().in("stage_id",sids);}await sb.from("team_members").delete().in("event_id",eids);await sb.from("teams").delete().in("event_id",eids);await sb.from("events").delete().in("id",eids);}
await sb.from("tournaments").delete().eq("id",id);toast("✅ Đã xóa");await loadAll();}
async function saveE(){var n=el("e-name").value.trim();if(!n){alert("Nhập tên");return;}var lim=parseFloat(el("e-limit").value);
var used={},i;for(i=0;i<S.events.length;i++)used[S.events[i].code]=1;var nn=1;while(used[pad(nn,2)])nn++;
var r=await sb.from("events").insert({tournament_id:S.tournament.id,code:pad(nn,2),name:n,rating_limit:isNaN(lim)?null:lim,rating_rule:el("e-rule").value,status:"open"});
if(r.error){alert(r.error.message);return;}toast("✅ Tạo nội dung");await selT(S.tournament.id);}
async function saveP(){var n=el("p-name").value.trim().toUpperCase();if(!n){alert("Nhập họ tên");return;}var r=parseFloat(el("p-rating").value);
var res=await sb.from("players").insert({full_name:n,gender:el("p-gender").value,skill_rating:isNaN(r)?null:r});if(res.error){alert(res.error.message);return;}toast("✅ Thêm VĐV");var p=await sb.from("players").select("*");S.players=p.data||[];render();}
async function saveTeam(){var p1=el("tp1").value,p2=el("tp2").value;if(!p1||!p2||p1===p2){alert("Chọn 2 VĐV");return;}
var a=S.players.find(function(x){return x.id===p1;}),b=S.players.find(function(x){return x.id===p2;});var name=a.full_name+" – "+b.full_name;
var r=await sb.from("teams").insert({event_id:S.eid,name:name}).select().single();if(r.error){alert(r.error.message);return;}
await sb.from("team_members").insert([{team_id:r.data.id,event_id:S.eid,player_id:p1,position:1},{team_id:r.data.id,event_id:S.eid,player_id:p2,position:2}]);
toast("✅ Tạo đội");await selE(S.eid);}
/* GROUPS */
function teamsInG(gid){var tids=S.groupTeams.filter(function(x){return x.group_id===gid;}).map(function(x){return x.team_id;});return S.teams.filter(function(t){return tids.indexOf(t.id)>=0;});}
function unassigned(){var as=new Set(S.groupTeams.map(function(x){return x.team_id;}));return S.teams.filter(function(t){return !as.has(t.id);});}
async function initGroups(){if(!S.eid){alert("Chọn nội dung");return;}
var gs=await sb.from("stages").insert({event_id:S.eid,code:"GRP",name:"Vòng bảng",stage_type:"group_stage",stage_order:1}).select().single();
await sb.from("stages").insert({event_id:S.eid,code:"KO",name:"Knockout",stage_type:"knockout",stage_order:2});
for(var i=0;i<4;i++)await sb.from("groups").insert({stage_id:gs.data.id,code:GC[i],name:"Bảng "+GC[i],max_teams:4});
toast("✅ Tạo 4 bảng");await selE(S.eid);}
async function toGroup(tid,gid){await sb.from("group_teams").delete().eq("team_id",tid).eq("stage_id",S.gStage.id);if(gid)await sb.from("group_teams").insert({group_id:gid,stage_id:S.gStage.id,team_id:tid,event_id:S.eid});await selE(S.eid);}
async function autoAssign(){var un=unassigned();var gs=S.groups.filter(function(g){return g.stage_id===S.gStage.id;}).sort(function(a,b){return a.code.localeCompare(b.code);});var n=0;
for(var i=0;i<un.length;i++){var mg=null,mc=99;gs.forEach(function(g){var c=teamsInG(g.id).length;if(c<mc&&c<4){mc=c;mg=g;}});if(mg){await sb.from("group_teams").insert({group_id:mg.id,stage_id:S.gStage.id,team_id:un[i].id,event_id:S.eid});n++;}}
toast("✅ Xếp "+n+" đội");await selE(S.eid);}
/* DRAFT */
function draftOf(g){return S.draft.filter(function(x){return x.g===g;});}
function addDraft(g){S.draft.push({g:g,h:null,a:null});render();}
function rmDraft(i){S.draft.splice(i,1);render();}
function upDraft(i,f,v){S.draft[i][f]=v;render();}
function autoRR(g){var t=teamsInG(g);if(t.length!==4){alert("Cần 4 đội");return;}S.draft=S.draft.filter(function(x){return x.g!==g;});
[{a:0,b:1},{a:2,b:3},{a:0,b:2},{a:1,b:3},{a:0,b:3},{a:1,b:2}].forEach(function(p){S.draft.push({g:g,h:t[p.a].id,a:t[p.b].id});});render();}
function valDraft(g){var t=teamsInG(g);if(t.length!==4)return"Bảng cần 4 đội";var d=draftOf(g);if(d.length!==6)return"Cần 6 trận";
var cm={};t.forEach(function(x){cm[x.id]=0;});var seen={};for(var i=0;i<d.length;i++){var m=d[i];if(!m.h||!m.a)return"Trận "+(i+1)+" thiếu đội";if(m.h===m.a)return"Trùng đội";cm[m.h]++;cm[m.a]++;var k=[m.h,m.a].sort().join("-");if(seen[k])return"Trùng cặp";seen[k]=1;}
for(var k in cm)if(cm[k]!==3)return"Mỗi đội đấu 3 trận";return"";}
/* FIX LỖI 1: round=1, bracket_slot duy nhất 1..24 theo thứ tự bảng */
async function saveGroup(g){var err=valDraft(g);if(err){alert("❌ "+err);return;}var grp=S.groups.find(function(x){return x.id===g;});
var old=S.matches.filter(function(m){return m.group_id===g;});if(old.length){var ids=old.map(function(m){return m.id;});await sb.from("referee_matches").delete().in("match_id",ids);await sb.from("matches").delete().in("id",ids);}
var base=GC.indexOf(grp.code)*6;var ins=[];draftOf(g).forEach(function(m,i){ins.push({event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.gStage.id,group_id:g,round:1,bracket_slot:base+i+1,match_code:bCode(grp.code+(i+1)),match_seq:base+i+1,home_team_id:m.h,away_team_id:m.a,home_score:0,away_score:0,status:"scheduled"});});
var r=await sb.from("matches").insert(ins);if(r.error){alert("❌ "+r.error.message);return;}toast("✅ Lưu 6 trận "+grp.code);await selE(S.eid);}
async function delAll(){if(!confirm("Xóa toàn bộ trận + TT?"))return;var mr=await sb.from("matches").select("id").eq("event_id",S.eid);var ids=(mr.data||[]).map(function(m){return m.id;});if(ids.length)await sb.from("referee_matches").delete().in("match_id",ids);await sb.from("matches").delete().eq("event_id",S.eid);toast("✅ Đã xóa");await selE(S.eid);}
/* KO */
function standings(g){var t=teamsInG(g);var st={};t.forEach(function(x){st[x.id]={id:x.id,w:0,pf:0,pa:0};});
S.matches.filter(function(m){return m.group_id===g&&m.status==="completed";}).forEach(function(m){var h=st[m.home_team_id],a=st[m.away_team_id];if(!h||!a)return;h.pf+=m.home_score;h.pa+=m.away_score;a.pf+=m.away_score;a.pa+=m.home_score;if(m.home_score>m.away_score)h.w++;else a.w++;});
var arr=[];for(var k in st)arr.push(st[k]);return arr.sort(function(x,y){return y.w-x.w||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf;});}
function koBy(code){return S.matches.find(function(m){return m.match_code===code;});}
function winnerOf(code){var m=koBy(code);return m&&m.status==="completed"?m.winner_team_id:null;}
/* FIX: chỉ tạo TK (có đội). BK/CK tự sinh khi có đội thắng (đủ 2 đội → không vi phạm has_participant) */
async function createKO(){var tops={};GC.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var st=standings(g.id);tops[c]={f:st[0]?st[0].id:null,s:st[1]?st[1].id:null};});
var old=S.matches.filter(function(m){return m.stage_id===S.kStage.id;});if(old.length){var ids=old.map(function(m){return m.id;});await sb.from("referee_matches").delete().in("match_id",ids);await sb.from("matches").delete().in("id",ids);}
var ins=[];
[{s:25,c:"TK1",h:tops.A.f,a:tops.B.s},{s:26,c:"TK2",h:tops.B.f,a:tops.A.s},{s:27,c:"TK3",h:tops.C.f,a:tops.D.s},{s:28,c:"TK4",h:tops.D.f,a:tops.C.s}].forEach(function(m){if(m.h&&m.a)ins.push({event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.kStage.id,round:2,bracket_slot:m.s,match_code:bCode(m.c),match_seq:m.s,home_team_id:m.h,away_team_id:m.a,home_score:0,away_score:0,status:"scheduled"});});
if(ins.length){var r=await sb.from("matches").insert(ins);if(r.error){alert("❌ "+r.error.message);return;}}
await syncKO();toast("✅ Tạo trận KO");await selE(S.eid);}
async function syncKO(){if(!S.kStage||!S.eid)return;var ins=[];
var w1=winnerOf(bCode("TK1")),w2=winnerOf(bCode("TK2")),w3=winnerOf(bCode("TK3")),w4=winnerOf(bCode("TK4"));
if(w1&&w2&&!koBy(bCode("BK1")))ins.push({event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.kStage.id,round:2,bracket_slot:29,match_code:bCode("BK1"),match_seq:29,home_team_id:w1,away_team_id:w2,home_score:0,away_score:0,status:"scheduled"});
if(w3&&w4&&!koBy(bCode("BK2")))ins.push({event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.kStage.id,round:2,bracket_slot:30,match_code:bCode("BK2"),match_seq:30,home_team_id:w3,away_team_id:w4,home_score:0,away_score:0,status:"scheduled"});
var b1=winnerOf(bCode("BK1")),b2=winnerOf(bCode("BK2"));
if(b1&&b2&&!koBy(bCode("CK")))ins.push({event_id:S.eid,tournament_id:S.tournament.id,stage_id:S.kStage.id,round:3,bracket_slot:31,match_code:bCode("CK"),match_seq:31,home_team_id:b1,away_team_id:b2,home_score:0,away_score:0,status:"scheduled"});
if(ins.length)await sb.from("matches").insert(ins);}
async function upKO(id,f,v){var u={};u[f]=v||null;await sb.from("matches").update(u).eq("id",id);toast("✅ Cập nhật");await selE(S.eid);}
/* REF: dropdown cạnh từng trận */
function refOpts(mid){var cur=S.refAssign[mid]||null;return '<select class="sel" onchange="assignRef(\''+mid+"',this.value)\"><option value=''>-- TT --</option>"+S.refs.map(function(r){return '<option value="'+r.user_id+'"'+(cur===r.user_id?" selected":"")+">"+r.username+"</option>";}).join("")+"</select>";}
async function assignRef(mid,uid){await sb.from("referee_matches").delete().eq("match_id",mid);if(uid)await sb.from("referee_matches").insert({user_id:uid,match_id:mid});toast(uid?"✅ Phân TT":"✅ Bỏ TT");await loadRefAssign();render();}
async function assignGroupRef(gid,uid){var ms=S.matches.filter(function(m){return m.group_id===gid;});for(var i=0;i<ms.length;i++){await sb.from("referee_matches").delete().eq("match_id",ms[i].id);if(uid)await sb.from("referee_matches").insert({user_id:uid,match_id:ms[i].id});}toast("✅ TT bảng");await loadRefAssign();render();}
/* USER */
async function createUser(){var em=el("nu-email").value.trim(),ps=el("nu-pass").value||DP,ro=el("nu-role").value;if(em.indexOf("@")<0){alert("Email sai");return;}
var tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:"tmp",persistSession:false,detectSessionInUrl:false}});
var r=await tmp.auth.signUp({email:em,password:ps});if(r.error){alert(r.error.message);return;}var uid=r.data.user&&r.data.user.id;if(!uid){alert("User tồn tại");return;}
await sb.from("app_users").upsert({user_id:uid,username:em,display_name:em});await sb.from("user_roles").insert({user_id:uid,role:ro});toast("✅ Tạo user");await loadUsers();await loadRefs();render();}
async function chRole(uid,ro){await sb.from("user_roles").delete().eq("user_id",uid);await sb.from("user_roles").insert({user_id:uid,role:ro});await loadUsers();await loadRefs();render();}
/* RENDER */
function accH(n,t,k,st,txt){return '<div class="acc-h" onclick="S.acc['+k+']=!S.acc['+k+'];render()"><span>'+n+'. '+t+'</span><span style="display:flex;gap:6px;align-items:center"><span class="st '+(st==="done"?"st-done":st==="part"?"st-part":"st-empty")+'">'+txt+'</span><span>▼</span></span></div>';}
function render(){if(!isAdmin())return;var t=S.tournament;var gm=S.matches.filter(function(m){return m.group_id;}),km=S.matches.filter(function(m){return !m.group_id;});
var H='<div class="acc">'+accH("1","Tạo giải","1",S.tournaments.length?"done":"empty",S.tournaments.length+" giải")+'<div class="acc-b'+(S.acc[1]?" open":"")+'"><div class="fg"><input id="t-name" placeholder="Tên giải"/><input id="t-start" type="date"/><input id="t-end" type="date"/><button class="btn btn-p" onclick="createT()">➕ Tạo</button></div></div></div>';
H+='<div class="acc">'+accH("2","Chọn giải","2",t?"done":"empty",t?t.code:"—")+'<div class="acc-b'+(S.acc[2]?" open":"")+'"><div class="fg"><select onchange="selT(this.value)">'+sT().map(function(x){return '<option value="'+x.id+'"'+(t&&t.id===x.id?" selected":"")+">"+x.name+"</option>";}).join("")+'</select>'+(t?'<button class="btn btn-d" onclick="delT(\''+t.id+'\')">🗑 Xóa</button>':"")+'</div></div></div>';
H+='<div class="acc">'+accH("3","Nội dung","3",S.events.length?"done":"empty",S.events.length+" ND")+'<div class="acc-b'+(S.acc[3]?" open":"")+'"><div class="fg"><input id="e-name" placeholder="Tên nội dung"/><input id="e-limit" type="number" step="0.05" placeholder="Trình"/><select id="e-rule"><option value="max_total">Tổng &lt;=</option><option value="open">Mở</option></select><button class="btn btn-p" onclick="saveE()">➕ Tạo</button></div></div></div>';
H+='<div class="acc">'+accH("4","VĐV","4",S.players.length?"done":"empty",S.players.length+" VĐV")+'<div class="acc-b'+(S.acc[4]?" open":"")+'"><div class="fg"><input id="p-name" placeholder="Họ tên"/><select id="p-gender"><option value="male">Nam</option><option value="female">Nữ</option></select><input id="p-rating" type="number" step="0.05" placeholder="Rating"/><button class="btn btn-p" onclick="saveP()">➕ Thêm</button></div></div></div>';
H+='<div class="acc">'+accH("5","Tạo đội","5",S.teams.length?(S.teams.length>=16?"done":"part"):"empty",S.teams.length+"/16")+'<div class="acc-b'+(S.acc[5]?" open":"")+'"><div class="fg"><select id="tp1"><option value="">-- VĐV1 --</option>'+S.players.map(function(p){return '<option value="'+p.id+'">'+p.full_name+"</option>";}).join("")+'</select><select id="tp2"><option value="">-- VĐV2 --</option>'+S.players.map(function(p){return '<option value="'+p.id+'">'+p.full_name+"</option>";}).join("")+'</select><button class="btn btn-p" onclick="saveTeam()">➕ Tạo đội</button></div></div></div>';
H+='<div class="acc">'+accH("6","Lịch + Trọng tài","6",(gm.length===24&&km.length>=4)?"done":(gm.length||km.length?"part":"empty"),gm.length+"/24 + "+km.length+" KO")+'<div class="acc-b'+(S.acc[6]?" open":"")+'">'+renderStep6()+'</div></div>';
H+='<div class="acc">'+accH("7","Người dùng","7",S.users.length?"done":"empty",S.users.length+" user")+'<div class="acc-b'+(S.acc[7]?" open":"")+'"><div class="fg"><input id="nu-email" placeholder="Email"/><input id="nu-pass" value="'+DP+'"/><select id="nu-role"><option value="referee">referee</option><option value="organizer">organizer</option><option value="admin">admin</option></select><button class="btn btn-p" onclick="createUser()">➕ Tạo</button></div><div class="tw"><table>'+S.users.map(function(u){return "<tr><td>"+u.username+"</td><td>"+(u.role||"-")+"</td><td><select class='sel' onchange=\"chRole('"+u.user_id+"',this.value)\"><option value='referee'>ref</option><option value='organizer'>org</option><option value='admin'>admin</option></select></td></tr>";}).join("")+"</table></div></div></div>";
el("admin").innerHTML=H;
setTimeout(function(){S.draft.forEach(function(m,i){var rows=document.querySelectorAll(".mrow");if(rows[i]){var s=rows[i].querySelectorAll("select");if(s[0])s[0].value=m.h||"";if(s[1])s[1].value=m.a||"";}});},50);}
function renderStep6(){if(!S.eid||!S.tournament)return '<div class="alert">Chọn giải + nội dung.</div>';
if(!S.gStage)return '<div class="info">Chưa tạo bảng.</div><button class="btn btn-p" onclick="initGroups()">🏆 Tạo 4 bảng + KO</button>';
var H='<div class="info">Phân 16 đội → 6 trận/bảng (A1-A6...) → TK1-TK4 → BK/CK tự sinh → chọn TT cạnh từng trận.</div>';
H+='<div style="margin-bottom:8px"><button class="btn btn-b" onclick="autoAssign()">⚡ Xếp tự động</button></div>';
var un=unassigned();if(un.length){H+='<div class="alert">⚠ Chưa xếp: '+un.length+' đội — '+un.map(function(t){return sn(t.name);}).join(", ")+'</div>';}
H+='<div class="tw"><table><tr><th>Bảng</th><th>Đội</th><th>Xếp</th></tr>';
GC.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var mb=teamsInG(g.id);
mb.forEach(function(tm){H+='<tr><td><b>'+c+'</b></td><td>'+sn(tm.name)+'</td><td><select class="sel" onchange="toGroup(\''+tm.id+"',this.value)\"><option value=''>--</option>"+GC.map(function(cc){var gg=S.groups.find(function(x){return x.code===cc&&x.stage_id===S.gStage.id;});return gg?"<option value='"+gg.id+"'"+(cc===c?" selected":"")+">"+cc+"</option>":"";}).join("")+"</select></td></tr>";});});
H+='</table></div>';
GC.forEach(function(c){var g=S.groups.find(function(x){return x.code===c&&x.stage_id===S.gStage.id;});if(!g)return;var mb=teamsInG(g.id);var d=draftOf(g.id);var ex=S.matches.filter(function(m){return m.group_id===g.id;});
H+='<div class="gcard"><h4>Bảng '+c+' <span>'+(ex.length?"✓ "+ex.length+" trận":d.length+"/6 nháp")+'</span></h4>';
if(mb.length!==4)H+='<div class="alert">Cần 4 đội.</div>';
else{var to=mb.map(function(t){return '<option value="'+t.id+'">'+sn(t.name)+"</option>";}).join("");
d.forEach(function(m,i){var ri=S.draft.indexOf(m);H+='<div class="mrow"><span class="n">'+c+(i+1)+'</span><select onchange="upDraft('+ri+",'h',this.value)\"><option value=''>--</option>"+to+'</select><span>vs</span><select onchange="upDraft('+ri+",'a',this.value)\"><option value=''>--</option>"+to+'</select><button class="btn btn-d btn-s" onclick="rmDraft('+ri+')">✕</button></div>';});
H+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';
if(d.length<6)H+='<button class="btn btn-l btn-s" onclick="addDraft(\''+g.id+'\')">➕ Trận</button>';
H+='<button class="btn btn-b btn-s" onclick="autoRR(\''+g.id+'\')">⚡ Auto</button>';
if(valDraft(g.id)==="")H+='<button class="btn btn-p btn-s" onclick="saveGroup(\''+g.id+'\')">💾 Lưu 6 trận</button>';
H+='</div>';
if(ex.length){H+='<div class="ok">✓ TT từng trận:</div><div class="tw"><table>';
ex.forEach(function(m){H+='<tr><td><span class="cd">'+dCode(m.match_code)+'</span></td><td>'+tName(m.home_team_id)+' vs '+tName(m.away_team_id)+"</td><td>"+refOpts(m.id)+"</td></tr>";});
H+='</table></div>';}}
H+='</div>';});
H+='<div class="gcard"><h4>🔥 Knockout (TK → BK → CK)</h4>';
var km=S.matches.filter(function(m){return !m.group_id;}).sort(function(a,b){return a.match_seq-b.match_seq;});
if(km.length===0)H+='<button class="btn btn-p" onclick="createKO()">🏆 Tạo TK1-TK4 (BK/CK tự sinh)</button>';
else{km.forEach(function(m){H+='<div class="krow"><span class="cd">'+dCode(m.match_code)+'</span><select class="sel" onchange="upKO(\''+m.id+"','home_team_id',this.value)\"><option value=''>--</option>"+S.teams.map(function(t){return '<option value="'+t.id+'"'+(m.home_team_id===t.id?" selected":"")+">"+sn(t.name)+"</option>";}).join("")+"</select><select class='sel' onchange=\"upKO('"+m.id+"','away_team_id',this.value)\"><option value=''>--</option>"+S.teams.map(function(t){return '<option value="'+t.id+'"'+(m.away_team_id===t.id?" selected":"")+">"+sn(t.name)+"</option>";}).join("")+"</select>"+refOpts(m.id)+"</div>";});
H+='<div style="margin-top:6px"><button class="btn btn-d btn-s" onclick="delAll()">🗑 Xóa lịch</button></div>';}
H+='</div>';return H;}
(async()=>{var d=await sb.auth.getSession();if(d.data.session){await prof(d.data.session);applyUI();if(isAdmin())await loadAll();}else applyUI();})();
</script>
