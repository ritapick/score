<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Quản trị - Pickleball Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#0b1220;--sf:#111c31;--sf2:#0e1728;--ln:rgba(148,163,184,.16);--tx:#e6edf7;--mu:#8fa3bd;--li:#a3e635;--cy:#22d3ee;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px;min-height:100vh}
button,input,select{font:inherit}
.hidden{display:none!important}
.topnav{position:sticky;top:0;z-index:50;background:rgba(10,16,29,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{color:var(--li);font-weight:800;font-size:16px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.chip{color:#0b1220;font-size:11px;font-weight:800;background:var(--li);padding:4px 10px;border-radius:99px}
.btn{border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--li);color:#0b1220}
.btn-b{background:rgba(34,211,238,.15);color:var(--cy);border:1px solid rgba(34,211,238,.4)}
.btn-l{background:rgba(148,163,184,.15);color:var(--mu);border:1px solid var(--ln)}
.btn-d{background:rgba(248,113,113,.15);color:var(--rd);border:1px solid rgba(248,113,113,.4)}
.btn-w{background:rgba(251,146,60,.15);color:var(--or);border:1px solid rgba(251,146,60,.4)}
.btn-s{padding:4px 8px;font-size:11px}
.btn-xs{padding:3px 6px;font-size:10px}
main{max-width:1200px;margin:0 auto;padding:12px}
.acc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc-h{padding:12px;background:var(--sf2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13px}
.acc-h .st{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:800}
.st-done{background:rgba(163,230,53,.2);color:var(--li)}
.st-part{background:rgba(251,146,60,.2);color:var(--or)}
.st-empty{background:rgba(148,163,184,.2);color:var(--mu)}
.acc-b{display:none;padding:12px}
.acc-b.open{display:block}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
input,select{background:#0d1626;border:1px solid var(--ln);border-radius:8px;padding:8px;color:var(--tx);width:100%;font-size:13px}
input[type="number"]{color-scheme:dark}
.hint{font-size:10px;color:var(--mu);margin-top:-4px;margin-bottom:8px;font-style:italic}
.section-title{font-size:14px;font-weight:800;color:var(--cy);margin:16px 0 10px;letter-spacing:.5px}
.tw{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:400px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:center}
th{color:var(--mu);font-size:9px;text-transform:uppercase;font-weight:800;background:rgba(26,37,64,.5)}
td.team-name{text-align:left;font-weight:700;color:var(--tx);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.qualify{background:rgba(163,230,53,.08)}
tr.qualify td.rank{color:var(--li)}
tr.qualify td.rank::before{content:"✓ ";color:var(--li);font-weight:900}
td.rank{font-weight:800;font-size:12px;color:var(--mu);width:24px}
td.wins{color:var(--li);font-weight:800;font-family:monospace}
td.diff{font-family:monospace;font-weight:700}
td.diff.pos{color:var(--li)}
td.diff.neg{color:var(--rd)}
td.pf{font-family:monospace;color:var(--cy)}

.match-row{display:flex;align-items:center;gap:5px;padding:7px;background:var(--sf2);border-radius:8px;margin-bottom:5px;border:1px solid var(--ln);position:relative}
.match-row.live{border-left:3px solid var(--rd);background:rgba(248,113,113,.06);animation:pulseLive 2s infinite}
.match-row.finished{border-left:3px solid var(--li);opacity:.9}
.match-row.ko{border-left:3px solid var(--or)}
.match-row.ck{border-left:3px solid var(--li);background:rgba(163,230,53,.05)}
@keyframes pulseLive{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.3)}50%{box-shadow:0 0 0 4px rgba(248,113,113,0)}}
.m-code{font-family:monospace;font-weight:800;color:var(--li);font-size:11px;min-width:30px;text-align:center}
.match-row.ko .m-code{color:var(--or)}
.match-row.ck .m-code{color:var(--li);font-size:12px}
.m-team{flex:1;font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-team.home{color:var(--li);text-align:right}
.m-team.away{color:var(--cy);text-align:left}
.m-team.tbd{color:var(--or);font-style:italic;font-weight:500;font-size:10px}
.m-team.tbd-placeholder{color:var(--mu);font-style:italic;font-weight:600}

.m-score-box{display:flex;align-items:center;gap:2px;background:#0d1626;padding:3px 5px;border-radius:6px;border:1px solid var(--ln);flex-shrink:0}
.m-score-input{width:26px;text-align:center;background:transparent;border:none;color:var(--tx);font-weight:800;font-size:16px;font-family:monospace}
.m-score-input:focus{outline:none;border-bottom:1px solid var(--cy)}
.m-sep{color:var(--mu);font-weight:800;font-size:14px}
.m-ref-btn{background:var(--cy);color:#0b1220;border:none;border-radius:6px;padding:5px 7px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.m-ref-btn:active{transform:scale(.95)}
.m-status-badge{font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.m-status-badge.live{background:var(--rd);color:#fff;animation:blink 1s infinite}
.m-status-badge.finished{background:var(--li);color:#0b1220}
.m-status-badge.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.m-serving-info{font-size:9px;color:var(--or);white-space:nowrap;flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis}

.reset-bar{background:rgba(248,113,113,.08);border:1px dashed rgba(248,113,113,.4);border-radius:8px;padding:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.reset-bar .info-text{font-size:11px;color:var(--mu);flex:1}
.group-assign{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:10px 0}
.group-card{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:10px}
.group-card h5{margin:0 0 8px;color:var(--li);font-size:12px;display:flex;justify-content:space-between}
.group-card .count{background:var(--li);color:#0b1220;padding:2px 6px;border-radius:4px;font-size:10px}
.group-card .team-list{font-size:11px;color:var(--mu);max-height:120px;overflow-y:auto}
.group-card .team-item{padding:4px;background:rgba(148,163,184,.1);border-radius:4px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.mrow{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:4px;align-items:center;padding:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;margin-bottom:4px;font-size:11px}
.mrow .n{background:var(--li);color:#0b1220;padding:2px 6px;border-radius:4px;font-weight:800;font-size:10px}

.ko-section{background:rgba(251,146,60,.05);border:2px solid var(--or);border-radius:12px;padding:12px;margin-top:14px}
.ko-section>h3{margin:0 0 10px;color:var(--or);font-size:14px}
.ko-group{margin-bottom:10px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.ko-group-header{padding:7px 10px;font-weight:800;font-size:11px;text-transform:uppercase}
.ko-group-header.tk{background:rgba(251,146,60,.15);color:var(--or)}
.ko-group-header.bk{background:rgba(34,211,238,.1);color:var(--cy)}
.ko-group-header.ck{background:rgba(163,230,53,.15);color:var(--li)}
.ko-group-header.r16{background:rgba(34,211,238,.1);color:var(--cy)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--li);color:#0b1220;padding:10px 16px;border-radius:99px;font-weight:800;font-size:12px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-bg.show{display:flex}
.modal{width:min(460px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.modal h3{margin:0 0 4px;color:var(--li);font-size:16px}
.modal .hint{font-size:10px;color:var(--mu);margin-bottom:12px;font-style:italic}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.modal .msg{font-size:12px;margin-top:8px;min-height:16px;text-align:center}

.ref-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.ref-header .match-code{font-size:13px;font-weight:800;color:var(--cy)}
.ref-header .match-status{font-size:10px;font-weight:800;padding:2px 8px;border-radius:4px}
.ref-header .match-status.live{background:var(--rd);color:#fff}
.ref-header .match-status.finished{background:var(--li);color:#0b1220}
.ref-header .match-status.scheduled{background:rgba(148,163,184,.2);color:var(--mu)}

.ref-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.ref-grid-header{font-weight:800;font-size:12px;text-align:center;padding:6px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.ref-header-a{background:rgba(163,230,53,.15);color:var(--li)}
.ref-header-b{background:rgba(34,211,238,.15);color:var(--cy)}
.ref-header-score{background:rgba(148,163,184,.1);color:var(--mu);font-size:10px}
.ref-grid-label{font-size:11px;color:var(--mu);font-weight:700;text-align:center;padding:4px}
.ref-grid-slot{padding:2px}
.ref-slot-select{width:100%;background:#0d1626;border:1px solid var(--ln);border-radius:6px;padding:6px 4px;color:var(--tx);font-size:10px;font-weight:700;text-align:center}
.ref-slot-select:focus{outline:none;border-color:var(--or)}
.ref-score-center{grid-column:2;grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:8px 6px;min-width:110px}
.score-row{display:flex;align-items:center;gap:4px}
.score-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--ln);background:rgba(148,163,184,.15);color:var(--tx);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;user-select:none}
.score-btn:active{transform:scale(.9);background:var(--cy);color:#0b1220}
.score-val{font-size:22px;font-weight:800;font-family:monospace;min-width:32px;text-align:center;color:var(--tx)}
.score-val.home{color:var(--li)}
.score-val.away{color:var(--cy)}
.score-sep{font-size:20px;font-weight:800;color:var(--mu)}

.ref-serve-row{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln)}
.ref-serve-group{text-align:center}
.ref-serve-title{font-size:9px;color:var(--or);font-weight:800;text-transform:uppercase;margin-bottom:6px}
.ref-serve-options{display:flex;justify-content:center;gap:8px}
.serve-radio-label{display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 8px;border-radius:6px;background:rgba(13,22,38,.5);transition:.15s}
.serve-radio-label:hover{background:rgba(251,146,60,.1)}
.serve-radio{display:none}
.serve-radio-custom{font-size:11px;font-weight:800;color:var(--mu);padding:2px 8px;border-radius:4px;border:1px solid var(--ln);transition:.15s}
.serve-radio:checked + .serve-radio-custom{background:var(--or);color:#0b1220;border-color:var(--or)}

.ref-actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ref-actions .btn{flex:1;min-width:100px;justify-content:center}

.timeout-display{font-size:48px;font-weight:900;font-family:monospace;color:var(--or);text-align:center;margin:16px 0;letter-spacing:4px}
.timeout-display.running{animation:timeoutPulse 1s infinite}
@keyframes timeoutPulse{0%,100%{opacity:1}50%{opacity:.7}}
.timeout-controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.timeout-info{font-size:11px;color:var(--mu);text-align:center;margin-bottom:8px;font-style:italic}

@media(max-width:480px){
  main{padding:8px}
  .fg{grid-template-columns:1fr 1fr}
  .group-assign{grid-template-columns:1fr}
  .m-team{font-size:10px;max-width:70px}
  .m-score-input{width:24px;font-size:15px}
  .m-ref-btn{padding:5px 6px;font-size:9px}
  .m-serving-info{max-width:60px;font-size:8px}
  .ref-score-center{min-width:100px;padding:6px 4px}
  .score-btn{width:34px;height:34px;font-size:20px}
  .score-val{font-size:24px;min-width:36px}
  .ref-serve-row{grid-template-columns:1fr;gap:8px}
}
</style>
</head>
<body>
<nav class="topnav">
<div class="brand-row">
  <a href="index.html" class="btn btn-l" style="text-decoration:none">🏠 Trang chủ</a>
  <span class="logo">⚙ Quản trị</span>
</div>
<div>
  <span id="user-chip" class="chip hidden"></span>
  <button id="login-btn" class="btn btn-p" onclick="openLogin()">🔐 Đăng nhập</button>
  <button id="logout-btn" class="btn btn-l hidden" onclick="doLogout()">Thoát</button>
</div>
</nav>
<main id="app"><div id="content">Đang tải...</div></main>
<div id="toast" class="toast"></div>

<div id="login-modal" class="modal-bg">
<div class="modal">
<h3>🔐 Đăng nhập Quản trị</h3>
<input id="lu" placeholder="Tên đăng nhập"/>
<input id="lp" type="password" placeholder="Mật khẩu"/>
<div class="actions">
  <button class="btn btn-l" onclick="closeLogin()">Đóng</button>
  <button class="btn btn-p" onclick="doLogin()">Đăng nhập</button>
</div>
<div id="lmsg" class="msg"></div>
</div>
</div>

<div id="ref-modal" class="modal-bg">
<div class="modal">
  <div class="ref-header">
    <div class="match-code" id="ref-match-code">Trận: --</div>
    <span class="match-status scheduled" id="ref-match-status"></span>
  </div>
  
  <div class="ref-grid">
    <div class="ref-grid-header ref-header-a" id="ref-team-a-name">TEAM A</div>
    <div class="ref-grid-header ref-header-score">TỶ SỐ</div>
    <div class="ref-grid-header ref-header-b" id="ref-team-b-name">TEAM B</div>
    
    <div class="ref-grid-label">Ô 1</div>
    <div class="ref-score-center">
      <div class="score-row">
        <button class="score-btn" onclick="changeScore('home', -1)">−</button>
        <span id="ref-home-score-display" class="score-val home">0</span>
        <button class="score-btn" onclick="changeScore('home', 1)">+</button>
      </div>
      <div class="score-sep">:</div>
      <div class="score-row">
        <button class="score-btn" onclick="changeScore('away', -1)">−</button>
        <span id="ref-away-score-display" class="score-val away">0</span>
        <button class="score-btn" onclick="changeScore('away', 1)">+</button>
      </div>
    </div>
    <div class="ref-grid-slot">
      <select id="ref-away-slot1" class="ref-slot-select" onchange="onSlotChange('away',1)"></select>
    </div>
    
    <div class="ref-grid-label">Ô 2</div>
    <div class="ref-grid-slot">
      <select id="ref-home-slot2" class="ref-slot-select" onchange="onSlotChange('home',2)"></select>
    </div>
    <div class="ref-grid-slot">
      <select id="ref-away-slot2" class="ref-slot-select" onchange="onSlotChange('away',2)"></select>
    </div>
    
    <div class="ref-serve-row">
      <div class="ref-serve-group">
        <div class="ref-serve-title">🏓 Lượt giao (Team A)</div>
        <div class="ref-serve-options">
          <label class="serve-radio-label">
            <input type="radio" name="serve-home" value="1" class="serve-radio" onchange="onServeCheck('home',1)">
            <span class="serve-radio-custom">L1</span>
          </label>
          <label class="serve-radio-label">
            <input type="radio" name="serve-home" value="2" class="serve-radio" onchange="onServeCheck('home',2)">
            <span class="serve-radio-custom">L2</span>
          </label>
        </div>
      </div>
      <div class="ref-serve-group">
        <div class="ref-serve-title">🏓 Lượt giao (Team B)</div>
        <div class="ref-serve-options">
          <label class="serve-radio-label">
            <input type="radio" name="serve-away" value="1" class="serve-radio" onchange="onServeCheck('away',1)">
            <span class="serve-radio-custom">L1</span>
          </label>
          <label class="serve-radio-label">
            <input type="radio" name="serve-away" value="2" class="serve-radio" onchange="onServeCheck('away',2)">
            <span class="serve-radio-custom">L2</span>
          </label>
        </div>
      </div>
    </div>
  </div>
  
  <div class="ref-actions">
    <button class="btn btn-l" onclick="closeRefModal()">✕ Đóng</button>
    <button class="btn btn-w" onclick="openTimeoutModal()">⏱ Timeout</button>
    <button class="btn btn-d" onclick="finishMatch()">🏁 Kết thúc</button>
  </div>
  <div id="ref-msg" class="msg"></div>
</div>
</div>

<div id="timeout-modal" class="modal-bg">
<div class="modal">
  <h3>⏱ THỜI GIAN TIMEOUT</h3>
  <div class="timeout-info">Thời gian đã trôi qua kể từ khi bắt đầu timeout</div>
  <div class="timeout-display" id="timeout-display">00:00</div>
  <div class="timeout-controls">
    <button class="btn btn-p" id="timeout-start-btn" onclick="toggleTimeout()" style="min-width:120px">▶ Bắt đầu</button>
  </div>
  <div class="actions">
    <button class="btn btn-l" onclick="closeTimeoutModal()">✕ Đóng</button>
  </div>
</div>
</div>

<script>
"use strict";
var CFG = {
  URL: "https://mvefkcaqvjflrgmaybev.supabase.co",
  KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12ZWZrY2FxdmpmbHJnbWF5YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDAzOTksImV4cCI6MjEwMjE3NjM5OX0.vCY4_JlSBqi6QRh7DYWAe42Ot-pChKaVSHn7DY2C34Q"
};
var sb;
try { sb = window.supabase.createClient(CFG.URL, CFG.KEY); } catch(e) { console.error(e); }

var CURRENT_USER = null;
var DATA = {
  tournaments: [], tournament: null, events: [], eid: null,
  players: [], teams: [], stages: [], groups: [], groupTeams: [], matches: [],
  gStage: null, kStage: null, draft: [],
  acc: {s1:false, s2:true, s3:false, s4:false},
  _creatingKO: false
};
var currentRefMatchId = null;
var realtimeInterval = null;
var timeoutElapsed = 0;
var timeoutInterval = null;
var timeoutRunning = false;

/* === HELPERS === */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad(n,l) { return String(n).padStart(l,"0"); }
function r2(n) { return Math.round(n*100)/100; }
function sn(n) { return String(n||"").replace(/\s*\([\d.]+\)/g,"").trim(); }
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.className = "toast show";
  if (window._tt) clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = "toast"; }, 2000);
}
function findTeam(id) { for(var i=0;i<DATA.teams.length;i++) if(DATA.teams[i].id===id) return DATA.teams[i]; return null; }
function tName(id) { var t=findTeam(id); return t?sn(t.name):null; }
function isAdmin() { return CURRENT_USER && CURRENT_USER.username.toLowerCase() === 'admin'; }
function isOwnerOfTournament(t) { if (!t) return false; if (isAdmin()) return true; return t.admin_id === CURRENT_USER.id; }
function isOwnerOfPlayer(p) { if (isAdmin()) return true; return p.admin_id === CURRENT_USER.id; }

/* === AUTH === */
function openLogin() { el("login-modal").classList.add("show"); el("lmsg").textContent=""; }
function closeLogin() { el("login-modal").classList.remove("show"); }
async function doLogin() {
  var u = el("lu").value.trim().toLowerCase();
  var p = el("lp").value;
  if (!u || !p) { el("lmsg").textContent="Vui lòng nhập đầy đủ."; return; }
  el("lmsg").textContent="Đang đăng nhập...";
  try {
    var { data, error } = await sb.from('admin_users').select('*').eq('username', u).eq('password', p).maybeSingle();
    if (error) throw error;
    if (!data) { el("lmsg").textContent="❌ Sai thông tin!"; return; }
    CURRENT_USER = data;
    sessionStorage.setItem('pb_admin', JSON.stringify(CURRENT_USER));
    closeLogin(); applyUI(); await loadAll();
    toast("✅ Xin chào " + CURRENT_USER.username);
  } catch(e) { el("lmsg").textContent="❌ " + e.message; }
}
function doLogout() {
  CURRENT_USER = null;
  sessionStorage.removeItem('pb_admin');
  stopRealtime();
  applyUI();
  el("content").innerHTML = '<div style="text-align:center;padding:40px;color:var(--mu)">Vui lòng đăng nhập để quản trị.</div>';
  toast("👋 Đã đăng xuất");
}
function applyUI() {
  var logged = !!CURRENT_USER;
  el("login-btn").classList.toggle("hidden", logged);
  el("logout-btn").classList.toggle("hidden", !logged);
  el("user-chip").classList.toggle("hidden", !logged);
  if (logged) {
    var role = isAdmin() ? "ADMIN" : "ORG";
    el("user-chip").textContent = "👤 " + CURRENT_USER.username + " • " + role;
  }
}

/* === DATA LOADING === */
async function loadAll() {
  try {
    var tr = await sb.from("tournaments").select("*").order("created_at", {ascending:false});
    DATA.tournaments = (tr.data || []).filter(t => isOwnerOfTournament(t));
    var pl = await sb.from("players").select("*");
    DATA.players = (pl.data || []).filter(p => isOwnerOfPlayer(p));
    if (DATA.tournaments.length) await selT(DATA.tournaments[0].id);
    else { DATA.tournament = null; DATA.events = []; DATA.eid = null; DATA.teams = []; DATA.matches = []; DATA.groups = []; render(); }
  } catch(e) { console.error(e); el("content").innerHTML = '<div style="padding:20px;color:var(--rd)">❌ Lỗi tải: '+esc(e.message)+'</div>'; }
}

async function selT(tid) {
  DATA.tournament = DATA.tournaments.find(t => t.id === tid) || null;
  if (!DATA.tournament) return;
  var e = await sb.from("events").select("*").eq("tournament_id", tid);
  DATA.events = e.data || [];
  if (DATA.events.length) await selE(DATA.events[0].id);
  else { DATA.eid = null; DATA.teams = []; DATA.matches = []; render(); }
}

async function selE(eid) {
  DATA.eid = eid || null; DATA.draft = [];
  if (!DATA.eid) { render(); return; }
  try {
    var t = await sb.from("teams").select("id,name,team_members(player_id,position,players(id,full_name,skill_rating))").eq("event_id", eid);
    DATA.teams = (t.data || []).map(function(x) {
      var m = x.team_members || [], tot = 0;
      m.forEach(function(k) { tot += (k.players && k.players.skill_rating) || 0; });
      return Object.assign({}, x, { members: m, total_rating: r2(tot) });
    });
    var st = await sb.from("stages").select("*").eq("event_id", eid);
    DATA.stages = st.data || [];
    DATA.gStage = null; DATA.kStage = null;
    DATA.stages.forEach(function(s) { if(s.stage_type==="group_stage") DATA.gStage=s; if(s.stage_type==="knockout") DATA.kStage=s; });
    var ids = DATA.stages.map(s => s.id);
    if (ids.length) {
      var g = await sb.from("groups").select("*").in("stage_id", ids); DATA.groups = g.data || [];
      var gt = await sb.from("group_teams").select("*").in("stage_id", ids); DATA.groupTeams = gt.data || [];
    } else { DATA.groups = []; DATA.groupTeams = []; }
    var m = await sb.from("matches").select("*").eq("event_id", eid).order("match_seq");
    DATA.matches = m.data || [];
    render();
    startRealtime();
  } catch(e) { console.error(e); }
}

/* === REALTIME POLLING === */
function startRealtime() {
  stopRealtime();
  realtimeInterval = setInterval(async () => {
    if (!DATA.eid) return;
    try {
      var m = await sb.from("matches").select("*").eq("event_id", DATA.eid).order("match_seq");
      if (m.data && m.data.length) {
        var changed = false;
        for (var i = 0; i < m.data.length; i++) {
          var old = DATA.matches.find(x => x.id === m.data[i].id);
          if (!old || old.home_score !== m.data[i].home_score || old.away_score !== m.data[i].away_score || 
              old.match_status !== m.data[i].match_status || old.serving_team !== m.data[i].serving_team || 
              old.serving_turn !== m.data[i].serving_turn || old.serving_player_id !== m.data[i].serving_player_id) {
            changed = true; break;
          }
        }
        if (changed) {
          DATA.matches = m.data;
          updateMatchRowsDOM();
          if (currentRefMatchId) {
            var cm = DATA.matches.find(x => x.id === currentRefMatchId);
            if (cm) {
              el("ref-home-score-display").textContent = cm.home_score || 0;
              el("ref-away-score-display").textContent = cm.away_score || 0;
              var statusEl = el("ref-match-status");
              var st = cm.match_status || 'scheduled';
              statusEl.className = 'match-status ' + st;
              statusEl.textContent = st === 'live' ? '🔴 LIVE' : (st === 'finished' ? '✅ FIN' : '⏳');
              updateServeRadios(cm);
            }
          }
        }
      }
    } catch(e) { console.warn("Realtime poll error:", e); }
  }, 3000);
}
function stopRealtime() {
  if (realtimeInterval) { clearInterval(realtimeInterval); realtimeInterval = null; }
}

function updateMatchRowsDOM() {
  DATA.matches.forEach(function(m) {
    var row = document.querySelector('[data-match-id="' + m.id + '"]');
    if (!row) return;
    var statusBadge = row.querySelector('.m-status-badge');
    var servingInfo = row.querySelector('.m-serving-info');
    var scoreH = row.querySelector('.m-score-input[data-field="home_score"]');
    var scoreA = row.querySelector('.m-score-input[data-field="away_score"]');
    
    if (scoreH && document.activeElement !== scoreH) scoreH.value = m.home_score || 0;
    if (scoreA && document.activeElement !== scoreA) scoreA.value = m.away_score || 0;
    
    var status = m.match_status || 'scheduled';
    row.classList.remove('live', 'finished');
    if (status === 'live') row.classList.add('live');
    else if (status === 'finished') row.classList.add('finished');
    
    if (statusBadge) {
      statusBadge.className = 'm-status-badge ' + status;
      if (status === 'live') statusBadge.textContent = '🔴 LIVE';
      else if (status === 'finished') statusBadge.textContent = '✅ FIN';
      else statusBadge.textContent = '⏳';
    }
    
    if (servingInfo) {
      if (status === 'live' && m.serving_player_id) {
        var player = DATA.players.find(p => p.id === m.serving_player_id);
        var playerName = player ? player.full_name : '?';
        servingInfo.textContent = '🏓 ' + playerName.substring(0, 10);
      } else {
        servingInfo.textContent = '';
      }
    }
  });
}

/* === PLAYER MANAGEMENT === */
async function savePlayer(pid, name, rating) {
  if (!name) { alert("Nhập tên VĐV"); return; }
  var payload = { full_name: name.trim().toUpperCase(), skill_rating: parseFloat(rating) || 0, gender: 'male', admin_id: CURRENT_USER.id };
  try {
    if (pid) await sb.from("players").update(payload).eq("id", pid);
    else await sb.from("players").insert(payload);
    var pl = await sb.from("players").select("*");
    DATA.players = (pl.data || []).filter(p => isOwnerOfPlayer(p));
    toast("✅ Đã lưu VĐV"); render();
  } catch(e) { alert("❌ " + e.message); }
}
async function deletePlayer(pid) {
  if (!confirm("Xóa VĐV này?")) return;
  try {
    await sb.from("players").delete().eq("id", pid);
    var pl = await sb.from("players").select("*");
    DATA.players = (pl.data || []).filter(p => isOwnerOfPlayer(p));
    toast("✅ Đã xóa VĐV"); render();
  } catch(e) { alert("❌ " + e.message); }
}

/* === TOURNAMENT & EVENT === */
async function createT() {
  var n = el("t-name").value.trim(); var d = el("t-start").value;
  if (!n || !d) { alert("Nhập tên + ngày"); return; }
  var code = pad(DATA.tournaments.length + 1, 3);
  var payload = { code: code, name: n, start_date: d, end_date: el("t-end").value || d, location_name: el("t-loc").value || null, status: "in_progress", admin_id: CURRENT_USER.id };
  var r = await sb.from("tournaments").insert(payload).select().single();
  if (r.error) { alert(r.error.message); return; }
  for (var i=1; i<=4; i++) await sb.from("courts").insert({tournament_id: r.data.id, name: "Sân "+i, display_order: i});
  toast("✅ Đã tạo giải"); await loadAll();
}
async function delT(id) {
  if (!confirm("Xóa giải + toàn bộ dữ liệu?")) return;
  try {
    var ev = await sb.from("events").select("id").eq("tournament_id", id);
    var eids = ev.data.map(e => e.id);
    if (eids.length) {
      await sb.from("matches").delete().in("event_id", eids);
      await sb.from("stages").delete().in("event_id", eids);
      await sb.from("teams").delete().in("event_id", eids);
      await sb.from("events").delete().in("id", eids);
    }
    await sb.from("tournaments").delete().eq("id", id);
    toast("✅ Đã xóa"); await loadAll();
  } catch(e) { alert("❌ " + e.message); }
}
async function quickCreateEvent() {
  var n = prompt("Tên nội dung (VD: Đôi Nam):"); if (!n) return;
  var lim = prompt("Tổng trình tối đa (để trống = Mở):");
  var rule = "open", limit = null;
